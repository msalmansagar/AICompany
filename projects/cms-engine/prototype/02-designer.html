<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Designer — QDB CMS Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="shared/tokens.css" />
<link rel="stylesheet" href="shared/components.css" />

<!--
  The one screen in this prototype that is NOT self-contained.

  Every other file runs offline with no network calls. This one loads React and
  the real Puck editor from esm.sh, because the point of this screen is to feel
  the actual editor rather than a mock of it.

  In production Puck ships bundled into a single Dataverse web resource with no
  external requests — a hardened CRM blocks CDN loads by CSP. The import map
  below is a prototype convenience, not the deployment shape.
-->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "@puckeditor/core": "https://esm.sh/@puckeditor/core@0.22.4?external=react,react-dom"
  }
}
</script>
<link rel="stylesheet" href="https://esm.sh/@puckeditor/core@0.22.4/dist/index.css" />

<style>
  /* Puck manages its own scrolling; the host must not fight it. */
  .work > .puck-host { min-block-size: 0; overflow: hidden; }
  .puck-host { block-size: 100%; }

  /* Puck sets height:100vh on its root, which assumes it owns the whole page.
     Nested under the CMS topbar + command bar that is ~89px too tall, and the
     surplus was being clipped off the TOP — taking Puck's own header with it.
     Bind it to the container instead of the viewport. */
  .puck-host > .Puck,
  .puck-host > div > .Puck { block-size: 100% !important; }

  /* Brand tokens the rendered page consumes, scoped to the canvas. */
  .qdb-page {
    --g:#3d8a72; --gd:#2f7d68; --gs:#e6f2ee;
    --navy:#1b3a63; --navys:#e9f0fb; --purple:#6b4bb0;
    --canvas:#f4f6f8; --surface:#fff; --border:#e5e8eb;
    --ink:#1a2129; --muted:#5d6b7a;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: var(--ink);
    min-block-size: 100%;
  }

  .qdb-btn {
    display:inline-flex; align-items:center; gap:8px; border-radius:6px;
    padding:11px 20px; font-size:14px; font-weight:600; text-decoration:none;
    border:1px solid transparent; white-space:nowrap; cursor:pointer;
  }
  .qdb-btn[data-v="primary"] { background:var(--g); color:#fff; }
  .qdb-btn[data-v="navy"]    { background:var(--navy); color:#fff; }
  .qdb-btn[data-v="outline"] { background:#fff; color:var(--ink); border-color:var(--border); }
  .qdb-btn[data-full="true"] { inline-size:100%; justify-content:center; }

  .qdb-stat { background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:16px; min-inline-size:0; }
  .qdb-stat b { display:block; font-size:28px; font-weight:700; margin-block:4px; }

  .qdb-callout { display:flex; gap:12px; padding:16px; border-radius:10px;
    border-inline-start:3px solid; margin-block-end:14px; }

  /* Tabs and Accordion are CSS-driven, never React state: Puck re-renders a
     component whenever its props change, which would reset useState while an
     author is typing. Radios and <details> survive re-renders. */
  .qdb-tabs__radio { position:absolute; opacity:0; pointer-events:none; }
  .qdb-tabs__strip { display:flex; gap:4px; flex-wrap:wrap;
    border-block-end:1px solid var(--border); margin-block-end:16px; }
  .qdb-tabs__tab { display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    padding:10px 16px; font-size:14px; font-weight:600; color:var(--muted);
    border-block-end:2px solid transparent; margin-block-end:-1px; }
  .qdb-tabs__panel { display:none; font-size:15px; line-height:1.7; color:var(--muted); }
  .qdb-tabs__radio:nth-of-type(1):checked ~ .qdb-tabs__strip .qdb-tabs__tab:nth-of-type(1),
  .qdb-tabs__radio:nth-of-type(2):checked ~ .qdb-tabs__strip .qdb-tabs__tab:nth-of-type(2),
  .qdb-tabs__radio:nth-of-type(3):checked ~ .qdb-tabs__strip .qdb-tabs__tab:nth-of-type(3),
  .qdb-tabs__radio:nth-of-type(4):checked ~ .qdb-tabs__strip .qdb-tabs__tab:nth-of-type(4) {
    color:var(--tab-accent, var(--g)); border-block-end-color:var(--tab-accent, var(--g));
  }
  .qdb-tabs__radio:nth-of-type(1):checked ~ .qdb-tabs__panel:nth-of-type(1),
  .qdb-tabs__radio:nth-of-type(2):checked ~ .qdb-tabs__panel:nth-of-type(2),
  .qdb-tabs__radio:nth-of-type(3):checked ~ .qdb-tabs__panel:nth-of-type(3),
  .qdb-tabs__radio:nth-of-type(4):checked ~ .qdb-tabs__panel:nth-of-type(4) { display:block; }

  .qdb-acc__item { background:var(--surface); border:1px solid var(--border);
    border-radius:10px; overflow:hidden; margin-block-end:10px; }
  .qdb-acc__head { display:flex; align-items:center; gap:12px; padding:14px 16px;
    font-size:15px; font-weight:600; cursor:pointer; list-style:none; }
  .qdb-acc__head::-webkit-details-marker { display:none; }
  .qdb-acc__body { padding:0 16px 16px; font-size:14px; line-height:1.7; color:var(--muted); }

  /* Custom field UI — editor chrome, not canvas content. */
  .pf-swatches { display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:6px; }
  .pf-swatches button { block-size:32px; border-radius:5px; border:2px solid transparent;
    cursor:pointer; padding:0; }
  .pf-swatches button[aria-pressed="true"] { border-color:#0078d4; box-shadow:0 0 0 2px #deecf9; }
  .pf-hint { font-size:11px; color:#5d6b7a; margin-block-start:6px;
    font-family:ui-monospace,Consolas,monospace; }

  .cdn-err { background:#fdecec; border:1px solid #f3c0c0; color:#8a1f1f;
    padding:18px 20px; margin:20px; border-radius:8px; font-size:13.5px; line-height:1.6; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="shell">
    <nav class="sitemap"></nav>
    <div class="work">
      <div class="cmdbar">
        <span class="title">Designer — About Reyada</span>
        <span class="pill" data-tone="info">Real Puck editor</span>
        <div class="row" style="gap:2px;margin-inline-start:10px">
          <button class="btn" id="modeEdit" data-v="primary">Edit</button>
          <button class="btn" id="modeView">View</button>
        </div>
        <span class="sp"></span>
        <span class="muted" id="modeHint" style="font-size:12px">Drag from the left · click a block to edit · undo/redo and viewports in the Puck header</span>
      </div>
      <div class="puck-host" id="puckHost">
        <div class="empty">Loading the Puck editor…</div>
      </div>
    </div>
  </div>
</div>

<script src="shared/icons.js"></script>
<script src="shared/mock-data.js"></script>
<script src="shared/shell.js"></script>
<script>
  // The shell needs a .screen to route to; this file has a single view.
  Shell.init("02-designer.html", "designer");
</script>

<script type="module">
import React, { useState } from "react";
import { createRoot } from "react-dom/client";
import { Puck, Render } from "@puckeditor/core";

const h = React.createElement;

/* =====================================================================
   Design tokens offered to authors.

   Colour is chosen as a TOKEN SLUG and rendered as var(--slug). Authors
   never see a hex value, so only approved brand colours can reach a page,
   and a rebrand changes token values with nothing redeployed.
   ===================================================================== */
const INK_TOKENS = [
  ["g", "Brand green", "#3d8a72"],
  ["navy", "Navy", "#1b3a63"],
  ["purple", "Purple", "#6b4bb0"],
  ["ink", "Text", "#1a2129"],
  ["muted", "Text muted", "#5d6b7a"],
];
const SURFACE_TOKENS = [
  ["surface", "White", "#ffffff"],
  ["canvas", "Canvas", "#f4f6f8"],
  ["gs", "Green tint", "#e6f2ee"],
  ["navys", "Navy tint", "#e9f0fb"],
];
const v = (slug, fb) => `var(--${slug || fb})`;

/* --------------------------------------------------------- custom fields */

/** Swatch picker over a fixed token list. Stores the SLUG, never a colour. */
const tokenField = (label, list) => ({
  type: "custom",
  label,
  render: ({ value, onChange }) =>
    h("div", null,
      h("div", { className: "pf-swatches" },
        list.map(([slug, name, hex]) =>
          h("button", {
            key: slug, type: "button", title: `${name} · --${slug}`,
            "aria-label": name, "aria-pressed": value === slug,
            style: { background: hex },
            onClick: () => onChange(slug),
          }))),
      h("div", { className: "pf-hint" }, `--${value || ""}`)),
});

/** Media picker over the library. Stores the ASSET KEY, never a URL. */
const mediaField = (label) => ({
  type: "custom",
  label,
  render: ({ value, onChange }) => {
    const found = MEDIA.find(m => m.key === value);
    return h("div", null,
      h("div", { className: "pf-swatches" },
        MEDIA.map(m =>
          h("button", {
            key: m.key, type: "button", title: `${m.name} · ${m.key}`,
            "aria-label": m.name, "aria-pressed": value === m.key,
            style: { background: m.css, backgroundSize: "cover" },
            onClick: () => onChange(m.key),
          }))),
      h("div", { className: "pf-hint" },
        found ? `${found.key} — ${found.name}` : (value ? `unknown asset: ${value}` : "none selected")));
  },
});

const MEDIA_CSS = Object.fromEntries(MEDIA.map(m => [m.key, m.css]));

/* --------------------------------------------------------------- helpers */
const isAr = (p) => p?.metadata?.locale === "ar";
const tx = (p, en, ar) => isAr(p) ? (ar || en) : (en || ar);

const pairFields = (base, label, type = "text") => ({
  [`${base}En`]: { type, label: `${label} (EN)` },
  [`${base}Ar`]: { type, label: `${label} (AR)` },
});

const ALIGN = { type: "radio", label: "Align",
  options: [{ label: "Start", value: "start" }, { label: "Center", value: "center" }, { label: "End", value: "end" }] };

/* =====================================================================
   Component library — every Puck field type is exercised here:
   text, textarea, radio, select, array, slot and custom.
   ===================================================================== */
const config = {
  categories: {
    layout:      { title: "Layout",      components: ["Section", "Columns", "Spacer", "Divider"] },
    content:     { title: "Content",     components: ["Heading", "Text", "Image", "IconBlock"] },
    actions:     { title: "Actions",     components: ["Button", "ButtonGroup"] },
    interactive: { title: "Interactive", components: ["Tabs", "Accordion"] },
    data:        { title: "Data",        components: ["StatCard", "Callout"] },
  },

  root: {
    fields: { content: { type: "slot" } },
    // minEmptyHeight gives an empty slot a real target to aim at. Without it a
    // drop zone with no children collapses to zero height, so there is nothing
    // to drag onto and the editor looks like it has no "add" affordance.
    render: ({ content: Content }) =>
      h("div", { className: "qdb-page" }, h(Content, { minEmptyHeight: 140 })),
  },

  components: {

    /* ------------------------------------------------------------ layout */
    Section: {
      label: "Section",
      fields: {
        background: tokenField("Background — token", SURFACE_TOKENS),
        padding: { type: "radio", label: "Padding",
          options: [{ label: "S", value: "20px" }, { label: "M", value: "40px" }, { label: "L", value: "68px" }] },
        maxWidth: { type: "radio", label: "Width",
          options: [{ label: "Narrow", value: "680px" }, { label: "Wide", value: "1100px" }, { label: "Full", value: "100%" }] },
        items: { type: "slot" },
      },
      defaultProps: { background: "surface", padding: "40px", maxWidth: "1100px" },
      render: ({ background, padding, maxWidth, items: Items }) =>
        h("section", { style: { background: v(background, "surface"), paddingBlock: padding } },
          h("div", { style: { maxWidth, margin: "0 auto", paddingInline: "22px" } },
            h(Items, { minEmptyHeight: 110 }))),
    },

    Columns: {
      label: "Columns",
      fields: {
        gap: { type: "radio", label: "Gap",
          options: [{ label: "S", value: "12px" }, { label: "M", value: "22px" }, { label: "L", value: "34px" }] },
        items: { type: "slot" },
      },
      defaultProps: { gap: "22px" },
      render: ({ gap, items: Items }) =>
        h(Items, { minEmptyHeight: 90, style: {
          display: "grid",
          // minmax(0,…) lets tracks shrink; without it long content widens the
          // grid past its container.
          gridTemplateColumns: "repeat(auto-fit, minmax(min(190px,100%), 1fr))",
          gap, marginBlockEnd: "16px" } }),
    },

    Spacer: {
      label: "Spacer",
      fields: { size: { type: "radio", label: "Height",
        options: [{ label: "S", value: "16px" }, { label: "M", value: "44px" }, { label: "L", value: "88px" }] } },
      defaultProps: { size: "44px" },
      render: ({ size }) => h("div", { style: { blockSize: size }, "aria-hidden": true }),
    },

    Divider: {
      label: "Divider",
      fields: { color: tokenField("Colour — token", SURFACE_TOKENS) },
      defaultProps: { color: "canvas" },
      render: ({ color }) =>
        h("hr", { style: { border: 0, borderBlockStart: `1px solid ${v(color, "border")}`, marginBlock: "26px" } }),
    },

    /* ----------------------------------------------------------- content */
    Heading: {
      label: "Heading",
      fields: {
        ...pairFields("text", "Text"),
        level: { type: "radio", label: "Level",
          options: [{ label: "H1", value: "1" }, { label: "H2", value: "2" }, { label: "H3", value: "3" }] },
        color: tokenField("Colour — token, not hex", INK_TOKENS),
        align: ALIGN,
      },
      defaultProps: { textEn: "Heading", textAr: "عنوان", level: "2", color: "ink", align: "start" },
      render: ({ textEn, textAr, level, color, align, puck }) =>
        h(`h${level}`, { style: {
          margin: "0 0 14px",
          fontSize: { "1": "34px", "2": "25px", "3": "19px" }[level] || "25px",
          fontWeight: 700, color: v(color, "ink"), textAlign: align,
        } }, tx(puck, textEn, textAr)),
    },

    Text: {
      label: "Text",
      fields: {
        ...pairFields("body", "Body", "textarea"),
        color: tokenField("Colour — token", INK_TOKENS),
        align: ALIGN,
        size: { type: "radio", label: "Size",
          options: [{ label: "S", value: "13px" }, { label: "M", value: "15px" }, { label: "L", value: "18px" }] },
      },
      defaultProps: { bodyEn: "Body text.", bodyAr: "نص الفقرة.", color: "muted", align: "start", size: "15px" },
      render: ({ bodyEn, bodyAr, color, align, size, puck }) =>
        h("p", { style: { margin: "0 0 16px", fontSize: size, lineHeight: 1.75,
          color: v(color, "muted"), textAlign: align } }, tx(puck, bodyEn, bodyAr)),
    },

    Image: {
      label: "Image",
      fields: {
        asset: mediaField("Asset — from library"),
        height: { type: "radio", label: "Height",
          options: [{ label: "S", value: "150px" }, { label: "M", value: "240px" }, { label: "L", value: "360px" }] },
        radius: { type: "radio", label: "Corners",
          options: [{ label: "None", value: "0" }, { label: "M", value: "10px" }, { label: "Round", value: "999px" }] },
        ...pairFields("alt", "Alt text"),
      },
      defaultProps: { asset: "tech-ai", height: "240px", radius: "10px", altEn: "Image", altAr: "صورة" },
      render: ({ asset, height, radius, altEn, altAr, puck }) =>
        h("div", { role: "img", "aria-label": tx(puck, altEn, altAr),
          style: { blockSize: height, borderRadius: radius, marginBlockEnd: "16px",
            background: MEDIA_CSS[asset] || "repeating-linear-gradient(45deg,#f3d6d6 0 8px,#e9bdbd 8px 16px)",
            backgroundSize: "cover", backgroundPosition: "center" } }),
    },

    IconBlock: {
      label: "Icon",
      fields: {
        name: { type: "select", label: "Icon",
          options: Object.keys(ICON_PATHS).sort().map(k => ({ label: k, value: k })) },
        color: tokenField("Colour — token", INK_TOKENS),
        background: tokenField("Circle — token", SURFACE_TOKENS),
        size: { type: "radio", label: "Size",
          options: [{ label: "S", value: "18" }, { label: "M", value: "26" }, { label: "L", value: "38" }] },
        ...pairFields("label", "Label"),
        align: ALIGN,
      },
      defaultProps: { name: "award", color: "g", background: "gs", size: "26",
        labelEn: "", labelAr: "", align: "start" },
      render: ({ name, color, background, size, labelEn, labelAr, align, puck }) => {
        const label = tx(puck, labelEn, labelAr);
        const justify = align === "center" ? "center" : align === "end" ? "flex-end" : "flex-start";
        return h("div", { style: { display: "flex", justifyContent: justify, marginBlockEnd: "16px" } },
          h("div", { style: { display: "flex", alignItems: "center", gap: "11px" } },
            h("span", {
              style: { inlineSize: Number(size) * 1.9, blockSize: Number(size) * 1.9,
                borderRadius: "50%", background: v(background, "gs"), color: v(color, "g"),
                display: "grid", placeItems: "center" },
              dangerouslySetInnerHTML: { __html: icon(name, Number(size)) },
            }),
            label ? h("span", { style: { fontSize: 15, fontWeight: 600 } }, label) : null));
      },
    },

    /* ----------------------------------------------------------- actions */
    Button: {
      label: "Button",
      fields: {
        ...pairFields("label", "Label"),
        variant: { type: "select", label: "Variant",
          options: [
            { label: "Primary (green)", value: "primary" },
            { label: "Navy", value: "navy" },
            { label: "Outline", value: "outline" },
          ] },
        iconName: { type: "select", label: "Icon",
          options: [{ label: "none", value: "" }].concat(
            Object.keys(ICON_PATHS).sort().map(k => ({ label: k, value: k }))) },
        href: { type: "text", label: "Link" },
        fullWidth: { type: "radio", label: "Width",
          options: [{ label: "Auto", value: "auto" }, { label: "Full", value: "full" }] },
      },
      defaultProps: { labelEn: "Button", labelAr: "زر", variant: "primary",
        iconName: "chevron", href: "#", fullWidth: "auto" },
      render: ({ labelEn, labelAr, variant, iconName, href, fullWidth, puck }) => {
        const label = tx(puck, labelEn, labelAr);
        const props = { className: "qdb-btn", "data-v": variant, "data-full": fullWidth === "full" };
        const kids = [
          label,
          iconName ? h("span", { key: "i", dangerouslySetInnerHTML: { __html: icon(iconName, 15) } }) : null,
        ];
        // Inert while editing: a real anchor would navigate the author out of
        // the canvas. Shipping the guard inside the component is why Button
        // exists rather than raw links.
        return puck?.isEditing
          ? h("span", props, kids)
          : h("a", { ...props, href: href || "#" }, kids);
      },
    },

    ButtonGroup: {
      label: "Button group",
      fields: { align: ALIGN, items: { type: "slot" } },
      defaultProps: { align: "start" },
      render: ({ align, items: Items }) =>
        h(Items, { style: { display: "flex", flexWrap: "wrap", gap: "12px", marginBlockEnd: "16px",
          justifyContent: align === "center" ? "center" : align === "end" ? "flex-end" : "flex-start" } }),
    },

    /* ------------------------------------------------------- interactive */
    Tabs: {
      label: "Tabs",
      fields: {
        accent: tokenField("Accent — token", INK_TOKENS),
        tabs: {
          type: "array", label: "Tabs",
          arrayFields: {
            ...pairFields("label", "Label"),
            iconName: { type: "select", label: "Icon",
              options: [{ label: "none", value: "" }].concat(
                Object.keys(ICON_PATHS).sort().map(k => ({ label: k, value: k }))) },
            ...pairFields("body", "Content", "textarea"),
          },
        },
      },
      defaultProps: {
        accent: "g",
        tabs: [
          { labelEn: "Overview", labelAr: "نظرة عامة", iconName: "grid",
            bodyEn: "First tab content.", bodyAr: "محتوى التبويب الأول." },
          { labelEn: "Details", labelAr: "التفاصيل", iconName: "pages",
            bodyEn: "Second tab content.", bodyAr: "محتوى التبويب الثاني." },
        ],
      },
      render: ({ accent, tabs, id, puck }) => {
        const list = tabs || [];
        // Radio group name is namespaced by component id, or two Tabs blocks
        // on one page would control each other.
        const group = `qdbtabs-${id}`;
        return h("div", { className: "qdb-tabs", style: { ["--tab-accent"]: v(accent, "g"), marginBlockEnd: "18px" } },
          list.map((t, i) => h("input", { key: `r${i}`, type: "radio", name: group,
            id: `${group}-${i}`, defaultChecked: i === 0, className: "qdb-tabs__radio" })),
          h("div", { className: "qdb-tabs__strip", role: "tablist" },
            list.map((t, i) => h("label", { key: `l${i}`, htmlFor: `${group}-${i}`, className: "qdb-tabs__tab" },
              t.iconName ? h("span", { dangerouslySetInnerHTML: { __html: icon(t.iconName, 15) } }) : null,
              tx(puck, t.labelEn, t.labelAr)))),
          list.map((t, i) => h("div", { key: `p${i}`, className: "qdb-tabs__panel", role: "tabpanel" },
            tx(puck, t.bodyEn, t.bodyAr))));
      },
    },

    Accordion: {
      label: "Accordion",
      fields: {
        items: {
          type: "array", label: "Items",
          arrayFields: { ...pairFields("title", "Title"), ...pairFields("body", "Body", "textarea") },
        },
      },
      defaultProps: {
        items: [{ titleEn: "Question one", titleAr: "السؤال الأول",
          bodyEn: "The answer.", bodyAr: "الإجابة." }],
      },
      render: ({ items, puck }) =>
        h("div", { style: { marginBlockEnd: "18px" } },
          (items || []).map((it, i) =>
            h("details", { key: i, className: "qdb-acc__item" },
              h("summary", { className: "qdb-acc__head" },
                h("span", null, tx(puck, it.titleEn, it.titleAr)),
                h("span", { style: { marginInlineStart: "auto" },
                  dangerouslySetInnerHTML: { __html: icon("chevron", 15) } })),
              h("div", { className: "qdb-acc__body" }, tx(puck, it.bodyEn, it.bodyAr))))),
    },

    /* -------------------------------------------------------------- data */
    StatCard: {
      label: "Stat card",
      fields: {
        ...pairFields("label", "Label"),
        value: { type: "text", label: "Value" },
        ...pairFields("trend", "Trend"),
        iconName: { type: "select", label: "Icon",
          options: Object.keys(ICON_PATHS).sort().map(k => ({ label: k, value: k })) },
        accent: tokenField("Accent — token", INK_TOKENS),
      },
      defaultProps: { labelEn: "Metric", labelAr: "المؤشر", value: "12",

/* ------------------------------------------------------------------ app */
function App() {
  const [locale, setLocale] = useState(
    document.querySelector("#localePick")?.value === "ar" ? "ar" : "en");
  const [mode, setMode] = useState("edit");

  // Data is held here rather than inside Puck so that View renders exactly
  // what the author has just edited. Without lifting it, View would keep
  // showing the seed and the round trip would be a lie.
  const [data, setData] = useState(seed);

  // The shell's locale picker drives the canvas, so the CMS chrome and the
  // editor never disagree about which language is being previewed.
  React.useEffect(() => {
    const pick = document.querySelector("#localePick");
    if (!pick) return;
    const on = (e) => setLocale(e.target.value);
    pick.addEventListener("change", on);
    return () => pick.removeEventListener("change", on);
  }, []);

  // Edit / View toggle lives in the CMS command bar, not Puck's header, so it
  // reads as a property of the page rather than of the editor.
  React.useEffect(() => {
    const edit = document.querySelector("#modeEdit");
    const view = document.querySelector("#modeView");
    const hint = document.querySelector("#modeHint");
    if (!edit || !view) return;

    const apply = (next) => {
      setMode(next);
      edit.setAttribute("data-v", next === "edit" ? "primary" : "");
      view.setAttribute("data-v", next === "view" ? "primary" : "");
      if (hint) hint.textContent = next === "edit"
        ? "Drag from the left · click a block to edit · undo/redo and viewports in the Puck header"
        : "Rendered as a visitor sees it — no editor chrome, no drop zones, links live";
    };
    const onEdit = () => apply("edit");
    const onView = () => apply("view");
    edit.addEventListener("click", onEdit);
    view.addEventListener("click", onView);
    return () => { edit.removeEventListener("click", onEdit); view.removeEventListener("click", onView); };
  }, []);

  if (mode === "view") {
    // <Render> is the runtime component — no editor bundle, no drop zones,
    // and Button renders a real anchor because puck.isEditing is false.
    return h("div", {
      dir: locale === "ar" ? "rtl" : "ltr",
      style: { blockSize: "100%", overflowY: "auto", background: "var(--canvas, #f4f6f8)" },
    }, h(Render, { config, data, metadata: { locale } }));
  }

  return h(Puck, {
    config,
    data,
    onChange: setData,
    metadata: { locale },
    iframe: { enabled: true },
    // A narrower default viewport keeps the canvas near 100% zoom. At the
    // auto-fitted 37% every drop target was a third of its real size, which
    // made dragging feel broken rather than merely fiddly.
    viewports: [
      { width: 900,  label: "Desktop", icon: "Monitor" },
      { width: 768,  label: "Tablet",  icon: "Tablet" },
      { width: 390,  label: "Mobile",  icon: "Smartphone" },
    ],
    headerPath: "About Reyada",
    onPublish: (data) => {
      const bytes = new Blob([JSON.stringify(data)]).size;
      toast(`Publish → qdb_PublishPage · ${bytes.toLocaleString()} bytes · audit row written`);
    },
  });
}

const host = document.getElementById("puckHost");
try {
  createRoot(host).render(h(App));
} catch (err) {
  host.innerHTML = `<div class="cdn-err"><b>Editor failed to start.</b><br>${String(err)}</div>`;
}

window.addEventListener("error", (e) => {
  if (String(e.filename || "").includes("esm.sh") || String(e.message || "").includes("import")) {
    host.innerHTML = `<div class="cdn-err">
      <b>Could not load React and Puck from esm.sh.</b><br><br>
      This screen — and only this screen — loads the editor over the network. Every other screen in
      the prototype runs offline.<br><br>
      In production Puck ships <b>bundled into a single Dataverse web resource</b> with no external
      requests, because a hardened CRM blocks CDN loads by CSP.<br><br>
      Open this page with an internet connection, or use the other screens.</div>`;
  }
});
