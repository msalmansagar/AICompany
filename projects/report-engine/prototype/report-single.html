<meta charset="utf-8" />
<title>Report Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  The single-report runtime. Opened with a report already chosen — from a ribbon command, a form, a
  dashboard tile — it shows that report's filters and its data, and nothing else.

  Deliberately absent: the catalogue, the dashboards nav, the back-to-catalogue button. Picking a
  report happened in the menu that launched this; offering the choice again invites the user to
  wander off, and an earlier attempt that reused the catalogue shell did exactly that — it opened
  the full catalogue and looked, reasonably, like the command was ignoring its report.

  The rendering is not a copy. report-engine-core.js is the same file the catalogue loads, so a fix
  to the report view reaches both and the two cannot drift apart.
-->
<link rel="stylesheet" href="qdb_reportengine_core.css" />

<div class="app">
  <!--
    No product branding, no "running as", no avatar. This page is hosted inside CRM, which already
    shows the app name and the signed-in user in its own header — repeating them here is a second
    chrome bar competing with the first, and it costs vertical space the report should have.
    Only the theme control remains.
  -->
  <header class="app-header">
    <div class="header-accent"></div>
    <div class="header-spacer"></div>
    <button class="icon-btn" id="themeToggle" title="Change theme">
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1.5A7.5 7.5 0 001.5 9c0 3.6 3 5.5 5.7 5.1 1-.15 1.3-1.2.7-1.9-.6-.7-.2-1.7.7-1.7H12a4.5 4.5 0 004.5-4.5C16.5 3.9 13 1.5 9 1.5zM5 8a1 1 0 110-2 1 1 0 010 2zm2.6-2.6a1 1 0 110-2 1 1 0 010 2zm3.8 0a1 1 0 110-2 1 1 0 010 2zM13 8a1 1 0 110-2 1 1 0 010 2z" fill="currentColor"/></svg>
    </button>
    <div class="theme-menu" id="themeMenu">
      <div class="tm-h">Appearance</div>
      <button class="theme-opt" data-set-theme="light"><span class="sw sw-light"></span><span>Light</span></button>
      <button class="theme-opt" data-set-theme="dark"><span class="sw sw-dark"></span><span>Dark</span></button>
      <button class="theme-opt" data-set-theme="glass"><span class="sw sw-glass"></span><span>Glass</span></button>
      <button class="theme-opt" data-set-theme="vibrant"><span class="sw sw-vibrant"></span><span>Vibrant</span></button>
    </div>
  </header>

  <!-- No <nav>: there is nowhere else to go. body-single drops the grid to one full-width column,
       which the shared layout otherwise reserves for the navigation rail. -->
  <div class="body body-single">
    <main class="content" id="content"></main>
  </div>
</div>

<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toast-wrap" id="toasts"></div>
<script src="qdb_reportengine_core.js"></script>
<script>bootSingleReport();</script>
