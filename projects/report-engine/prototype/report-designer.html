    mainEntityLogicalName: record.qdb_mainentitylogicalname,
    isGoverned: !!record.qdb_isgoverned,
    rowLimit: record.qdb_rowlimit,
    timeoutMs: record.qdb_timeoutms,
    category: formattedValue(record, "qdb_category"),
    module: formattedValue(record, "qdb_module"),
    status: record.qdb_ispublished ? "Published" : (formattedValue(record, "qdb_status") || "Draft"),
    version: record.qdb_currentversionnumber,
    dataSources,
    filters: filters.map(f => ({
      fieldAlias: f.qdb_fieldalias,
      operator: { code: f.qdb_operator, label: f["qdb_operator@OData.Community.Display.V1.FormattedValue"] },
      value: f.qdb_value, sequence: f.qdb_sequence, groupId: f.qdb_groupid, isRuntimePrompt: !!f.qdb_isruntimeprompt
    })),
    parameters: parameters.map(p => ({
      parameterName: p.qdb_parametername, label: p.qdb_label, isRequired: !!p.qdb_isrequired,
      defaultValue: p.qdb_defaultvalue, displayOrder: p.qdb_displayorder, lookupTargetEntity: p.qdb_lookuptargetentity,
      defaultSource: p.qdb_defaultsource, paramType: p.qdb_paramtype
    })),
    formulas: formulas.map(f => ({
      formulaAlias: f.qdb_formulaalias, expression: f.qdb_expression, evaluationOrder: f.qdb_evaluationorder
    })),
    layout: layouts.length ? { themeColor: layouts[0].qdb_themecolor, layoutJson: layouts[0].qdb_layoutjson } : null,
    transformations: transformations.map(t => ({
      transformType: t.qdb_transformtype == null ? null : { code: t.qdb_transformtype },
      configJson: t.qdb_configjson, stepOrder: t.qdb_steporder, enabled: t.qdb_enabled !== false
    })),
    security: security.map(s => ({
      principalType: s.qdb_principaltype == null ? null : { code: s.qdb_principaltype },
      principalIdText: s.qdb_principalidtext,
      canExecute: !!s.qdb_canexecute, canExport: !!s.qdb_canexport,
      canEdit: !!s.qdb_canedit, canApprove: !!s.qdb_canapprove
    }))
  };
}

/* Only the column's logical name is stored, so its data type comes back from metadata rather than
   being assumed. Without this every reopened column is "Text", and a currency column loses its
   formatting and its right alignment the moment the report is reopened. */
async function resolveColumnTypes(report) {
  const entities = [...new Set((report.columns || []).map(c => c.entity || report.mainEntity).filter(Boolean))];
  await Promise.all(entities.map(entity =>
    metadata.attributesByEntity[entity] ? Promise.resolve() : loadAttributeMetadata(entity)));
  for (const column of report.columns || []) {
    const known = attributesOf(column.entity || report.mainEntity).find(a => a.a === column.attribute);
    if (known) { column.type = known.t; column.name = column.name || known.n; }
  }
}

// The reverse of dashboardToDefinition: turn a persisted DashboardDefinition back into the
// composer's in-memory model so a saved dashboard can be reopened and edited. Composer widget
// kinds are the lowercased enum names; aggregations match the enum verbatim. cardIcon/badge
// hints aren't persisted server-side, so they fall back to defaults on reload.
function definitionToDashboard(def) {
  return {
    id: def.id,
    savedId: def.id,
    title: def.title || "Untitled dashboard",
    code: def.code || "",
    description: def.description || "",
    owner: "Saved",
    modified: new Date().toISOString().slice(0, 10),
    isGoverned: !!def.isGoverned,
    dataSources: (def.dataSources || []).map(source => ({
      id: source.id,
      name: source.name || "Source",
      type: source.sourceType || "CRM View",
      entity: source.entity || "account",
      query: source.queryPayload || "",
      primary: !!source.isPrimary
    })),
    sections: (def.sections || []).map(section => ({
      id: section.id || newGuid(),
      title: section.title || "",
      cols: Math.min(Math.max(section.columns || 4, 1), 4),
      widgets: (section.widgets || []).map(widget => ({
        id: widget.id || newGuid(),
        title: widget.title || "",
        widget: String(widget.kind || "Metric").toLowerCase(),
        entity: widget.entity || "account",
        groupBy: widget.groupByAttribute || "",
        measure: widget.measureAttribute || "",
        agg: widget.aggregation || "Sum",
        chartType: widget.chartType || "Column",
        sourceId: widget.dataSourceId || null,
        cardIcon: "money", badgeText: "", badgeLevel: ""
      }))
    }))
  };
}

async function loadDashboardDefinition(id) {
  const record = await dvRetrieve("qdb_dashboard", id,
    "?$select=qdb_dashboardid,qdb_dashboardname,qdb_dashboardcode,qdb_description,qdb_isgoverned");
  const sections = await dvList("qdb_dashboardsection",
    `?$filter=_qdb_dashboardid_value eq ${id}&$select=qdb_dashboardsectionid,qdb_dashboardsectionname,qdb_columns&$orderby=qdb_sequence`);

  const mapped = [];
  for (const section of sections) {
    const widgets = await dvList("qdb_dashboardwidget",
      `?$filter=_qdb_dashboardsectionid_value eq ${section.qdb_dashboardsectionid}`
      + "&$select=qdb_dashboardwidgetid,qdb_dashboardwidgetname,qdb_kind,qdb_entity,qdb_groupby,qdb_measure,qdb_aggregation,qdb_charttype,_qdb_datasourceid_value&$orderby=qdb_sequence");
    mapped.push({
      id: section.qdb_dashboardsectionid,
      title: section.qdb_dashboardsectionname,
      columns: section.qdb_columns,
      widgets: widgets.map(w => ({
        id: w.qdb_dashboardwidgetid, title: w.qdb_dashboardwidgetname, kind: w.qdb_kind, entity: w.qdb_entity,
        groupByAttribute: w.qdb_groupby, measureAttribute: w.qdb_measure,
        aggregation: w.qdb_aggregation, chartType: w.qdb_charttype,
        dataSourceId: w._qdb_datasourceid_value || null
      }))
    });
  }

  const sources = await dvList("qdb_dashboarddatasource",
    `?$filter=_qdb_dashboardid_value eq ${id}`
    + "&$select=qdb_dashboarddatasourceid,qdb_dashboarddatasourcename,qdb_sourcetype,qdb_entity,qdb_querypayload,qdb_isprimary&$orderby=qdb_sequence");

  return {
    id: record.qdb_dashboardid,
    title: record.qdb_dashboardname,
    code: record.qdb_dashboardcode || "",
    description: record.qdb_description || "",
    isGoverned: !!record.qdb_isgoverned,
    dataSources: sources.map(source => ({
      id: source.qdb_dashboarddatasourceid,
      name: source.qdb_dashboarddatasourcename,
      sourceType: source.qdb_sourcetype,
      entity: source.qdb_entity,
      queryPayload: source.qdb_querypayload,
      isPrimary: !!source.qdb_isprimary
    })),
    sections: mapped
  };
}

/* ============================ CANVAS ENGINE (shared) ============================ */
function makeNodeDraggable(node, onMove) {
  let sx, sy, ox, oy, dragging = false;
  const move = (e) => { if (!dragging) return; node.style.left = Math.max(0, ox + (e.clientX - sx)) + "px"; node.style.top = Math.max(0, oy + (e.clientY - sy)) + "px"; onMove && onMove(); };
  const up = () => { dragging = false; node.classList.remove("dragging"); window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  node.addEventListener("mousedown", (e) => { if (e.target.closest(".ndel")) return; dragging = true; node.classList.add("dragging"); sx = e.clientX; sy = e.clientY; ox = parseFloat(node.style.left)||0; oy = parseFloat(node.style.top)||0; e.preventDefault(); window.addEventListener("mousemove", move); window.addEventListener("mouseup", up); });
}
function drawWires(svg, conns) {
  svg.innerHTML = conns.map(c => {
    const a = c.from, b = c.to; if (!a || !b) return "";
    const x1 = a.offsetLeft + a.offsetWidth, y1 = a.offsetTop + 23, x2 = b.offsetLeft, y2 = b.offsetTop + 23, mx = (x1 + x2) / 2;
    const col = c.color || "var(--primary)";
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" style="fill:none;stroke:${col};stroke-width:2;${c.dashed?"stroke-dasharray:5 4;":""}"/>${c.label?`<text x="${mx}" y="${(y1+y2)/2-5}" text-anchor="middle" style="font-size:10px;fill:${col};font-weight:600;paint-order:stroke;stroke:var(--surface-alt);stroke-width:3px">${esc(c.label)}</text>`:""}`;
  }).join("");
}
function canvasNode(id, headClass, title, bodyHtml, x, y, delAttr) {
  return `<div class="node" data-node="${id}" style="left:${x}px;top:${y}px"><div class="node-head ${headClass}"><span>${esc(title)}</span>${delAttr?`<button class="ndel" ${delAttr}>✕</button>`:""}</div><div class="node-body">${bodyHtml}</div><span class="port l"></span><span class="port r"></span></div>`;
}
function viewToggle(current, options) {
  return `<div class="view-toggle">${options.map(o=>`<button class="${current===o.k?"active":""}" data-view="${o.k}">${o.icon||""}${esc(o.label)}</button>`).join("")}</div>`;
}

/* Copies the whole definition, not just the header row: a clone whose columns, filters and security
   were left behind would open looking finished and return nothing. */
async function cloneSavedReport(report) {
  beginBusy("Cloning report…");
  try {
    const copy = definitionToReport(await loadReportDefinition(report.id));
    copy.savedId = null;
    copy.name = `${report.name} (copy)`;
    copy.reportCode = "";
    copy.isPublished = false;
    await saveReportToServer(copy);
  } catch (error) {
    toast("Clone failed — " + error.message, "err");
  } finally {
    endBusy("Cloning report…");
  }
}

async function publishSavedReport(report) {
  beginBusy("Publishing…");
  try {
    await dvUpdate("qdb_reportdefinition", report.id, {
      qdb_ispublished: true,
      qdb_status: RPT_STATUS_CODES.Published,
      qdb_currentversionnumber: (report.version || 0) + 1
    });
    toast(`“${report.name}” published as v${(report.version || 0) + 1}`, "ok");
    reportCatalog.refresh();
  } catch (error) {
    toast("Publish failed — " + error.message, "err");
  } finally {
    endBusy("Publishing…");
  }
}
/* Publishing writes to Dataverse rather than flipping a field in memory, so what the list shows and
   what the runtime honours are the same fact. */
async function togglePublishState(report) {
  if (!report.savedId) { toast("Save the report before publishing it", "warn"); return; }
  if (report.governed && report.approver === report.owner) {
    toast("Governed reports need an approver different from the author (BR-3)", "warn");
    return;
  }
  const publishing = report.status !== "Published";
  const version = publishing ? (report.version || 0) + 1 : report.version;
  const label = publishing ? "Publishing…" : "Unpublishing…";
  beginBusy(label);
  try {
    await dvUpdate("qdb_reportdefinition", report.savedId, {
      qdb_ispublished: publishing,
      qdb_status: publishing ? RPT_STATUS_CODES.Published : RPT_STATUS_CODES.Draft,
      qdb_currentversionnumber: version
    });
    report.status = publishing ? "Published" : "Draft";
    report.version = version;
    toast(publishing ? `Published as v${version}` : "Report unpublished", "ok");
    reportCatalog.refresh();
    render();
  } catch (error) {
    toast("Publish failed — " + error.message, "err");
  } finally {
    endBusy(label);
  }
}

/** An attribute the report has not been given yet reads as an em dash, not as an invented value. */
const cell = value => (value === null || value === undefined || value === "") ? "—" : esc(String(value));

function rowHtml(r) {
  return `<tr data-id="${r.id}">
    <td class="row-check"><input type="checkbox"></td>

    <td><span class="pill ${String(r.status).toLowerCase()}">${esc(r.status)}</span></td>
    <td class="num">${cell(r.version)}</td><td>${cell(r.modified)}</td>
    <td>${r.governed?ic("check"):"—"}</td>

}

/* Both the tabbed screen and the dock along the bottom of the canvas host their panels in an element
   carrying this id, and the panels re-enter here after adding or deleting a row — so this stays the
   single way a panel is drawn rather than each surface growing its own copy. */

/* helper: editable list table */
function listTable(cols, rows, renderRow, onAdd, addLabel) {
  const head = `<thead><tr><th style="width:28px"></th>${cols.map(c=>`<th ${c.num?'class="num"':""} ${c.w?`style="width:${c.w}"`:""}>${c.t}</th>`).join("")}<th style="width:36px"></th></tr></thead>`;
  const body = rows.length ? rows.map(renderRow).join("") : `<tr class="empty-row"><td colspan="${cols.length+2}">No rows yet — use “${esc(addLabel)}” to add one.</td></tr>`;
  const wrap = el(`<div style="overflow-x:auto"><table class="subgrid">${head}<tbody>${body}</tbody></table></div>`);
  const add = el(`<button class="btn sm btn-add">${ic("add")}${esc(addLabel)}</button>`);
  add.onclick = onAdd;
  const frag = document.createDocumentFragment(); frag.appendChild(wrap); frag.appendChild(add);
  return frag;
}
function bindInputs(scope, arr) {
  scope.querySelectorAll("[data-i]").forEach(inp => {
    const handler = () => {
      const i = +inp.dataset.i, key = inp.dataset.k;
      let v = inp.type==="checkbox" ? inp.checked : inp.value;
      if (inp.dataset.num) v = +v;
      arr[i][key] = v;
      if (inp.dataset.rerender) renderTab();
    };
    inp.addEventListener(comboSafeEvent(inp), handler);
  });
  scope.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { arr.splice(+b.dataset.del,1); renderTab(); });
}

/**
 * The report's own joins, unless the primary source is a saved view.
 *
 * A view replaces the whole query, so link-entities built from these rows never reach Dataverse.
 * Showing an editor there would be configuration that saves and changes nothing; the view's own
 * joins are shown instead, because those are what the data actually comes from.
 */
function appendJoinsSection(body, r) {
  const primarySource = (r.dataSources || []).find(source => source.primary) || (r.dataSources || [])[0];
  if (primarySource && isCrmViewSource(primarySource.type)) {
    body.appendChild(el(viewJoinsHtml(r.mainEntity, primarySource.query)));
    return;
  }

  const jcard = el(`<div class="section-card"><h3>Joined CRM entities</h3><div class="hint">Combine multiple entities with inner / left / right joins on matching keys. Stored in <span class="kbd">qdb_reportrelationship</span>.</div></div>`);

  // Picking the related table is when the keys can be offered from the relationship itself.

/* ---- Columns ---- */
/**
 * Names the columns a view-backed report asks for but will never receive.
 *
 * Unlike the wizard's checklist this tab takes the attribute as free text, so it cannot offer only
 * what the view returns. What it can do is say which of the configured columns arrive empty, rather
 * than leaving the author to discover blank cells at runtime.
 */
function warnAboutColumnsTheViewOmits(body, r) {
  const primarySource = (r.dataSources || []).find(source => source.primary) || (r.dataSources || [])[0];
  if (!primarySource || !isCrmViewSource(primarySource.type)) return;

  const selection = viewSelection(r.mainEntity, primarySource.query);
  if (!selection || !selection.attributes.length) return;

  const linked = new Set(selection.links.flatMap(link => link.attributes));
  const missing = (r.columns || [])
    .filter(column => column.attribute)
    .filter(column => !selection.attributes.includes(column.attribute) && !linked.has(column.attribute))
    .map(column => column.attribute);

  if (!missing.length) return;

  body.appendChild(el(`<div class="info-banner" style="border-left-color:var(--warn,#c19c00)">${ic("info")}<div>
    <b>${esc(primarySource.query)}</b> does not return ${missing.length === 1 ? "this column" : "these columns"}, so ${missing.length === 1 ? "it renders" : "they render"} empty:
    ${missing.map(a => `<span class="kbd">${esc(a)}</span>`).join(" ")}.
    Add ${missing.length === 1 ? "it" : "them"} to the view in CRM, or remove ${missing.length === 1 ? "it" : "them"} here.</div></div>`));
}

/* ---- Parameters ---- */
/* An empty "Lookup entity" box read as "nothing is configured, so where do these records come from?"
   — a reasonable reading of a blank field. It is optional by design: the runtime takes the table from
   the column the parameter filters, so the records offered are always ones that column can hold.
   The box says which column that is, and stays available as an override. */
function lookupEntityHint(parameter, report) {
  if (parameter.type !== "Lookup") return "—";
  const boundFilter = (report.filters || []).find(f => f.param && f.param === parameter.name);
  return boundFilter && boundFilter.attribute
    ? `auto — from ${boundFilter.attribute}`
    : "auto — add a filter, or name a table here";
}

/* ---- Transformations ---- */
function tabTransform(body, r) {
  const card = el(`<div class="section-card"><h3>Transformation pipeline</h3><div class="hint">Steps run in sequence on the result set. Masking is applied before export. Stored in <span class="kbd">qdb_reporttransformation</span>.</div></div>`);
  const columns = transformColumnsOfReport(r);
  const cols = [{t:"Seq",num:true},{t:"Transformation"},{t:"Target column"},{t:"Settings"}];
  // Settings are controls, not a JSON string — see TRANSFORM_CONFIG_SPECS. The row summarises them

  const rowHtml = (t,i) => `<tr>
    <td class="handle">${ic("flow")}</td>

    <td><button class="btn sm" data-tcfg="${i}">${r._txOpen===i?"Hide settings":"Settings"}</button>
      <div class="hint-inline"${r._txOpen===i?' id="txrow_summary"':""}>${esc(transformConfigSummary(t.type, t.config, columns))}</div></td>
    <td><button class="del" data-del="${i}">${ic("trash")}</button></td></tr>
    ${r._txOpen===i?`<tr><td></td><td colspan="5" style="background:var(--surface-alt)"><div id="tx_cfg" style="padding:10px 4px;max-width:520px">${transformConfigHtml(t.type, t.config, columns, "txrow")}</div></td></tr>`:""}`;
  card.appendChild(listTable(cols, r.transformations, rowHtml, () => { r.transformations.push({type:TRANSFORM_TYPES[0],target:"",config:"",seq:r.transformations.length+1}); renderTab(); }, "Add transformation"));
  body.appendChild(card); bindInputs(card, r.transformations);
  card.querySelectorAll('[data-k="type"]').forEach(select => select.addEventListener("change", () => {
    // Settings belong to the type that defined them; carrying them across would describe nothing.
    r.transformations[+select.dataset.i].config = "";

  card.querySelectorAll("[data-tcfg]").forEach(b => b.onclick = () => { const i=+b.dataset.tcfg; r._txOpen = r._txOpen===i ? null : i; renderTab(); });
  const open = r._txOpen != null ? r.transformations[r._txOpen] : null;
  const host = card.querySelector("#tx_cfg");
  if (open && host) bindTransformConfig(host, open.type, "txrow", open, renderTab, columns);
}

function reportPreviewCols(r) {
  return r.columns.filter(c => c.visible).map(c => ({ name:c.name, key:c.attribute||c.name, type:c.type, right:c.align==="Right", masked:c.masked }));
}
function renderPaper(host, r) {
  const cols = reportPreviewCols(r);
  const rows = previewRows(cols, r.mainEntity).map(row => { cols.forEach(c => { if (c.masked) row[c.key] = "•••••"; }); return row; });
  if (!rows.length) { host.innerHTML = previewPlaceholder(cols, r.mainEntity); return; }
  const L = r.layout;
  const langs = r.languages || ["en"];
  const lang = r._previewLang || r.primaryLang || "en";
  const hd = ["Master-Detail Report","Invoice Layout"].includes(L.type) && (r.detailTables||[]).some(t=>t.columns.length);
  const hCols = cols.map((c,i) => ({ ...c, label:(r.columns[i]&&r.columns[i].label)||c.name, labelPos:(r.columns[i]&&r.columns[i].labelPos)||"left" }));
  const kpi = ((r._renderMode||r.renderMode||"report")!=="report") ? kpiTiles(cols, rows) : "";
  const body = cols.length ? (kpi + (hd ? buildHeaderDetailBody(hCols, rows[0]||{}, r.detailTables, lang) : buildPreviewBody(L.type, cols, rows, { groupBy: L.groupBy && L.groupBy!=="(none)" ? L.groupBy : null, lang, chartType:L.chartType, cardIcon:L.cardIcon, drill:r._chartDrill }))) : `<div class="page-sub">No visible columns — add columns to preview.</div>`;
  const mode = r._renderMode || r.renderMode || "report";
  const langBar = renderModeTabs(mode) + langTabsHtml(langs, lang);
  const nameOf = (attr) => { const c=(r.columns||[]).find(x=>x.attribute===attr); if(c) return c.name; const a=attributesOf(r.mainEntity).find(x=>x.a===attr); return a?a.n:attr; };
  const filterBar = (L.showFilterBar!==false) ? filtersParamBar(r.filters, r.parameters, nameOf) : "";
  const paper = el(`<div>${langBar}<div class="report-paper ${mode!=="report"?"render-"+mode:""}" dir="${(LANGUAGES.find(x=>x.code===lang)||{}).rtl?"rtl":"ltr"}" style="${themeStyle(r.theme)}">
    ${L.showHeader?`<div class="rp-head">
      <div style="display:flex;gap:12px;align-items:center">${L.showLogo?logoBox(r.logoData):""}<div><div class="rp-title">${esc(r.name)}</div><div style="font-size:11px;color:#605e5c">${esc(r.category)} · ${esc(r.module||"—")} · ${esc(L.type)}</div></div></div>
      <div class="rp-meta">${L.genDate?"Generated 15/07/2026 12:00<br>":""}${L.genBy?"By "+esc(r.owner):""}</div>
    </div>`:""}
    ${filterBar}
    <div class="rp-params">
      <span><span class="k">Layout:</span> ${esc(L.type)}</span><span><span class="k">Theme:</span> ${esc((THEMES.find(t=>t.id===r.theme)||THEMES[0]).name)}</span><span><span class="k">Entity:</span> ${esc(r.mainEntity)}</span><span><span class="k">Orientation:</span> ${esc(L.orientation)}</span>
    </div>
    <div style="margin-top:6px">${body}</div>
    ${L.watermark?`<div class="watermark-note">${esc(L.watermark)}</div>`:""}
    ${L.showFooter?`<div class="rp-foot"><span>Report Engine · metadata-driven</span><span>${L.pageNumber?"Page 1 of 1":""}</span></div>`:""}
  </div></div>`);
  paper.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { r._previewLang = b.dataset.lang; renderPaper(host, r); });
  paper.querySelectorAll("[data-rmode]").forEach(b => b.onclick = () => { r._renderMode = b.dataset.rmode; renderPaper(host, r); });
  paper.querySelectorAll("[data-slice]").forEach(elc => elc.onclick = () => { r._chartDrill = elc.dataset.slice; renderPaper(host, r); });
  paper.querySelectorAll("[data-drillclear]").forEach(b => b.onclick = () => { r._chartDrill = null; renderPaper(host, r); });
  host.innerHTML = ""; host.appendChild(paper);
}
function runExport(format, r) {
  if (format === "CSV") {
    const cols = reportPreviewCols(r);
    const rows = previewRows(cols, r.mainEntity);
    const header = cols.map(c=>`"${c.name}"`).join(",");
    const lines = rows.map(row => cols.map(c=>{ let v = c.masked?"•••••":row[c.key]; return `"${v}"`; }).join(",")).join("\n");
    const blob = new Blob([header+"\n"+lines], {type:"text/csv"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (r.name.replace(/\s+/g,"_"))+"_2026-07-15.csv"; a.click();
    toast("CSV generated and downloaded"); return;
  }
  const engine = { "PDF":"QuestPDF","Excel":"ClosedXML","Word":"Open XML SDK","Image (PNG)":"ScottPlot" }[format] || "engine";
  toast(`${format} generated in the middle tier (${engine})`, "info");
}

/* ============================ MANUAL BANDED DESIGNER ============================ */
const FIELD_TRANSFORMS = {
  "Text": ["None","UPPERCASE","lowercase","Capitalize","Trim","Mask"],
  "Whole number": ["None","Thousands","Percentage"],
  "Decimal": ["None","2 decimals","0 decimals","Thousands","Percentage"],
  "Currency": ["None","0 decimals"],
  "Date/Time": ["None","dd/MM/yyyy","MMM dd, yyyy","yyyy-MM-dd","Relative"],
  "Option set": ["None","UPPERCASE","lowercase","Capitalize"],
  "Lookup": ["None","UPPERCASE"],
  "Boolean": ["None","Yes / No","✓ / ✕"]
};
function transformsFor(type) { return FIELD_TRANSFORMS[type] || ["None"]; }
function applyFieldTransform(type, tf, v) {
  tf = tf || "None"; if (v == null || v === "") return "";
  if (type === "Currency") { const n = +v||0; return tf==="0 decimals" ? "QAR "+Math.round(n).toLocaleString("en-US") : money(n); }
  if (type === "Decimal" || type === "Whole number") { const n = +v||0;
    if (tf==="Percentage") return n.toLocaleString()+"%";
    if (tf==="0 decimals") return Math.round(n).toLocaleString();
    if (tf==="2 decimals") return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    if (tf==="Thousands") return n.toLocaleString();
    return String(n); }
  if (type === "Date/Time") { const p = String(v).split("-"), y=p[0], m=p[1]||"01", dd=p[2]||"01", M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][(+m||1)-1];
    if (tf==="dd/MM/yyyy") return `${dd}/${m}/${y}`;
    if (tf==="MMM dd, yyyy") return `${M} ${dd}, ${y}`;
    if (tf==="yyyy-MM-dd") return `${y}-${m}-${dd}`;
    if (tf==="Relative") return `${M} ${y}`;
    return `${dd}/${m}/${y}`; }
  if (type === "Boolean") { if (tf==="Yes / No") return v?"Yes":"No"; if (tf==="✓ / ✕") return v?"✓":"✕"; return String(v); }
  let s = String(v);
  if (tf==="UPPERCASE") return s.toUpperCase();
  if (tf==="lowercase") return s.toLowerCase();
  if (tf==="Capitalize") return s.charAt(0).toUpperCase()+s.slice(1);
  if (tf==="Trim") return s.trim();
  if (tf==="Mask") return "••••"+s.slice(-2);
  return s;
}

/* ---------- left rail ----------

   carries more than three working regions at once.

   The panels here are stacked cards rather than the spreadsheet rows the tabbed screen uses. That is
   the whole reason they fit: a filter row is seven controls wide and needs the width of the window,
   while the same seven stacked in a card need 250px. It also puts one filter in one box instead of
   spreading it across a row the eye has to track back to its heading.

   Fifteen tabs become eight sections because several of them were one subject split three ways:
   transformations, formulas and drilldown are all "what happens to the data on the way out", and
   security, ribbon and export are all "who gets it and how". Grouping them keeps the strip readable

function renderRailStrip(r) {
  const strip = $("#md_strip");
  if (!strip) return;
  strip.innerHTML = "";
  RAIL_SECTIONS.forEach(section => {
    const count = railSectionCount(section, r);
    const button = el(`<button class="md-railbtn ${state.railSection === section.key ? "on" : ""}"
      title="${esc(section.label)}">${ic(section.icon)}<span>${esc(section.label)}</span>${
      count ? `<span class="rb-count">${count}</span>` : ""}</button>`);
    button.onclick = () => { state.railSection = section.key; render(); };
    strip.appendChild(button);
  });
  renderRail(r);
}

/** What a section holds, summed across its panels, so the strip says what the report contains. */
function railSectionCount(section, r) {
  if (!section.panels) return 0;
  return section.panels.reduce((total, key) => total + ((RAIL_PANELS[key].list(r) || []).length), 0);
}

function renderRail(r) {
  const host = $("#md_ds");
  if (!host) return;
  if (state.railSection === "fields") { dsPanel(r); return; }
  const section = RAIL_SECTIONS.find(s => s.key === state.railSection) || RAIL_SECTIONS[1];
  host.innerHTML = "";
  section.panels.forEach(key => railPanel(host, r, key, RAIL_PANELS[key]));
}

function railPanel(host, r, key, spec) {
  if (!spec.list(r)) r[railListName(key)] = [];
  const list = spec.list(r);
  host.appendChild(el(`<div><h4 class="${host.children.length ? "mt" : ""}">${esc(spec.title)}</h4>
    <div class="hint" style="margin-bottom:10px">${esc(spec.hint)}</div></div>`));

  if (!list.length) host.appendChild(el(`<div class="np-empty" style="margin-bottom:8px">None yet.</div>`));
  list.forEach((item, index) => host.appendChild(railCard(r, spec, item, () => {
    list.splice(index, 1);
    renderRailStrip(r);
  })));

  const add = el(`<button class="btn sm btn-add" style="width:100%">${ic("add")}Add</button>`);
  add.onclick = () => {
    list.push(typeof spec.add === "function" ? spec.add(r) : spec.add);
    renderRailStrip(r);
  };
  host.appendChild(add);
}

/* The report holds each list under its own name, and the panel key matches it everywhere except
   where the tabbed screen chose a different word for the same thing. */
const RAIL_LIST_NAMES = { relationships: "relationships", externalSources: "externalSources" };
const railListName = key => RAIL_LIST_NAMES[key] || key;

function railCard(r, spec, item, onRemove) {
  const card = el(`<div class="rail-card">
    <div class="rc-head"><b>${esc(spec.label(item))}</b><button class="del" data-rcdel>${ic("trash")}</button></div>
    <div class="rc-body"></div></div>`);
  const body = card.querySelector(".rc-body");
  spec.fields.forEach(field => body.appendChild(el(railField(r, field, item))));
  card.querySelector("[data-rcdel]").onclick = onRemove;
  bindRailCard(card, item, r);
  return card;
}

function railField(r, field, item) {
  const value = item[field.k];
  if (field.type === "check") {
    return `<label class="toggle" style="margin-bottom:6px"><input type="checkbox" data-k="${field.k}"
      ${value ? "checked" : ""}><span class="track"></span><span class="tlabel">${esc(field.label)}</span></label>`;
  }
  const control = field.type === "attr"
    ? attributePickerHtml(item.entity || r.mainEntity, value, `data-k="${field.k}"`, "Search fields…")
    : field.type === "entity"
      ? entityPickerHtml(value, `data-k="${field.k}"`)
      : field.options
        ? `<select class="fluent-select" data-k="${field.k}">${opts(field.options(r), value)}</select>`
        : `<input class="fluent-input" data-k="${field.k}" value="${esc(value == null ? "" : value)}">`;
  return `<div class="mini-field"><label>${esc(field.label)}</label>${control}</div>`;
}

/* Edits write straight through to the report. The card is not redrawn on each keystroke, which
   would take the focus out of the box being typed into; only the heading is kept in step. */
function bindRailCard(card, target, r) {
  card.querySelectorAll("[data-k]").forEach(input => input.addEventListener(comboSafeEvent(input), () => {
    target[input.dataset.k] = input.type === "checkbox" ? input.checked : input.value;
    if (renderManualDesigner._refresh) renderManualDesigner._refresh();
  }));
}

/** Renders the active panel, reusing the tab renderers the tabbed screen already uses. */
function renderTabInto(host, r) {

    general: tabGeneral, datasources: tabDataSources, columns: tabColumns, filters: tabFilters,
    parameters: tabParameters, drilldown: tabDrilldown, transform: tabTransform, formulas: tabFormulas,
    layout: tabLayout, formatting: tabFormatting, security: tabSecurity, ribbon: tabRibbon,
    export: tabExport, style: tabStyle, preview: tabPreview

function dsPanel(r) {

  /* The tree is the same problem in a narrower column: a main entity contributes hundreds of
     draggable fields, and each expanded relationship adds hundreds more. */
  const term = r._fieldSearch || "";
  // The tree offers the same fields the wizard does. Under a saved view that is the view's own
  // fields plus the tables it joins — the report's other relationships are unreachable, because the
  // view's query replaces the generated one and never links to them.
  const source = primarySourceOf(r);
  const viaView = source && isCrmViewSource(source.type);
  const groups = ent ? attributeGroupsFor(ent, source && source.type, source && source.query, []) : [];
  const groupFor = entity => groups.find(g => g.entity === entity);
  const matches = attrs => attrs.filter(at => matchesSearch(term, at.n, at.a, at.t, at.linkedEntityLabel || ""));
  const visible = (entity) => matches(groupFor(entity) ? groupFor(entity).attrs : attributesOf(entity));
  const fieldsHtml = (entity) => {
    const found = visible(entity);
    return found.length
      ? found.map(at => fieldItem(at, entity)).join("")
      : `<div class="page-sub" style="padding:6px 0">No field matches “${esc(term)}”.</div>`;
  };

  let tree;
  if (!ent) tree = `<div class="page-sub">Select a main entity to see its fields.</div>`;
  else {
    const rootGroup = groupFor(ent);
    const total = rootGroup ? rootGroup.attrs.length : attributesOf(ent).length;
    const search = `<div class="mini-field"><input class="fluent-input" id="md_fieldsearch" autocomplete="off"
      placeholder="Search ${total} fields…" value="${esc(term)}"></div>`;
    const related = viaView
      ? groups.filter(g => g.joinedByView).map(g => {
          const exp = r._dsExpanded[g.entity];
          const cols = exp ? `<div class="ds-rel">${matches(g.attrs).map(at => fieldItem(at, g.entity)).join("") || `<div class="page-sub" style="padding:6px 0">No field matches.</div>`}</div>` : "";
          return `<div class="ds-ent" data-exp="${esc(g.entity)}"><span class="caret">${exp?"▾":"▸"}</span>${ic("tree")}<span>${esc(g.label)}</span><span class="pt" style="margin-left:auto;font-size:10px">${g.attrs.length} via view</span></div>${cols}`;
        }).join("")
      : relationsOf(ent).map(rel => { const exp = r._dsExpanded[rel.entity]; const cols = exp ? `<div class="ds-rel">${fieldsHtml(rel.entity)}</div>` : ""; return `<div class="ds-ent" data-exp="${esc(rel.entity)}"><span class="caret">${exp?"▾":"▸"}</span>${ic("tree")}<span>${esc(rel.label)}</span><span class="pt" style="margin-left:auto;font-size:10px">${esc(rel.entity)}</span></div>${cols}`; }).join("");
    const relatedHeading = viaView ? "Joined by the view" : "Related entities";
    const relatedEmpty = viaView
      ? `<div class="page-sub">This view joins no other table.</div>`
      : `<div class="page-sub">No related entities.</div>`;
    const viewNote = viaView
      ? `<div class="page-sub" style="padding:4px 0 8px">Fields <b>${esc(source.query || "the view")}</b> returns.</div>`
      : "";

  { key:"basics", title:"Basics", desc:"Name & category" },
  { key:"data", title:"Data", desc:"Entity & source" },

/* ---------- Starting shapes ----------
   These replace a catalogue of ready-made reports that named tables — qdb_loanapplication,
   qdb_processhistory, qdb_slatracking — which do not exist in this org, and whose columns did not
   exist on the two tables that do. Every report started from one was born broken: it saved happily
   and failed at DataFetch, which is exactly how the "Overdue Facilities" sample came to select a
   qdb_amount column that was never on the table.

   A shape names nothing. It carries a layout, sensible export defaults, and a rule for picking
   columns from whatever entity the author chooses — so it cannot reference something that is not
   there, and it is as useful in one org as in the next. The columns it suggests are only a starting
   point; the Columns step is still where the author decides. */
const REPORT_SHAPES = {
  tabular: {
    label: "Simple table",
    desc: "Every row, straight down the page. The plainest useful report.",
    layoutType: "Tabular Report",
    exports: ["PDF", "Excel", "CSV"],
    pick: columnsForTable
  },
  grouped: {
    label: "Grouped with totals",
    desc: "Rows gathered under a category — a choice or lookup column — with a total per group.",
    layoutType: "Grouped Report",
    exports: ["PDF", "Excel", "CSV"],
    pick: columnsForGrouping
  },
  summary: {
    label: "Summary",
    desc: "One line per category with its total. The grouped report without the detail.",
    layoutType: "Summary Report",
    exports: ["PDF", "Excel"],
    pick: columnsForGrouping
  },
  chart: {
    label: "Chart",
    desc: "A category and a measure, drawn. Falls back to a count when nothing numeric exists.",
    layoutType: "Chart Report",
    exports: ["PDF", "Image (PNG)"],
    pick: columnsForGrouping
  },
  kpi: {
    label: "KPI cards",
    desc: "Headline numbers rather than rows — totals and counts across the table.",
    layoutType: "Dashboard Report",
    exports: ["PDF", "Image (PNG)"],
    pick: columnsForGrouping
  }
};

/** The name of the record first, then whatever else reads usefully in a plain table. */
function columnsForTable(entity) {
  return takeColumns(entity, [primaryNameOf(entity)], 6);
}

/** The name, a category to group by, a number to total, and a little context around them. */
function columnsForGrouping(entity) {
  const usable = reportableAttributes(entity);
  const category = usable.find(a => ["Option set", "Lookup"].includes(a.t));
  const measure = usable.find(a => a.t === "Currency") || usable.find(a => ["Decimal", "Whole number"].includes(a.t));
  const preferred = [primaryNameOf(entity), category && category.a, measure && measure.a, "createdon"];
  return takeColumns(entity, preferred, 5);
}

/**
 * The preferred columns that exist, topped up from what is left.
 *
 * Ordering matters more than it looks: attributes arrive sorted by display name, so filling straight
 * from the top gives whatever begins with a digit — "1st disbursement date", "Aging30" — which is a
 * valid suggestion and a useless one.
 */
function takeColumns(entity, preferred, limit) {
  const usable = reportableAttributes(entity);
  const chosen = [];
  for (const attribute of preferred) {
    if (attribute && usable.some(a => a.a === attribute) && !chosen.includes(attribute)) chosen.push(attribute);
  }

  for (const attribute of usable) {
    if (chosen.length >= limit) break;
    if (!chosen.includes(attribute.a)) chosen.push(attribute.a);
  }

  return chosen.slice(0, limit);
}

const primaryNameOf = entity => (entityRecord(entity) || {}).primaryName;

/* Attributes worth offering as a starting point. Every table carries keys, state fields, audit
   stamps, currency shadows and workflow plumbing — all real, all terrible first suggestions. */
const UNHELPFUL_FIRST_COLUMNS =
  /^(traversedpath|processid|stageid|versionnumber|importsequencenumber|overriddencreatedon|timezoneruleversionnumber|utcconversiontimezonecode|exchangerate|transactioncurrencyid|entityimage.*|.*_base|owning(businessunit|team|user)|statecode|statuscode|(created|modified)onbehalfby|(created|modified)by)$/i;

function reportableAttributes(entity) {
  return attributesOf(entity).filter(a =>
    a.t !== "Uniqueidentifier" && !UNHELPFUL_FIRST_COLUMNS.test(a.a));
}

/**
 * The fields a report can actually show, which is not always every field on the table.
 *
 * Reading via a CRM View means the view's query runs instead of a generated one, so only what the
 * view selects comes back. Offering the whole table there would let someone pick a field that
 * renders as an empty column with nothing to explain it.
 *
 * Falls back to the full list when the view has not loaded yet or its FetchXML cannot be read —
 * an author blocked from choosing any column at all is worse than one offered too many.
 */
function availableAttributes(entity, sourceType, viewName) {
  const all = attributesOf(entity);
  if (!isCrmViewSource(sourceType)) return all;

  const selection = viewSelection(entity, viewName);
  if (!selection || !selection.attributes.length) return all;

  const selected = new Set(selection.attributes);
  return all.filter(a => selected.has(a.a)).concat(linkedAttributesOf(selection));
}

/**
 * The fields a view brings in from its joined tables, as columns the report can select.
 *
 * They are keyed by the view's own alias rather than by the attribute name, because that is how the
 * row arrives — two joined tables can both carry <c>name</c>, and only the alias tells them apart.
 * Marked so the picker can label which table each came from.
 */
function linkedAttributesOf(selection) {
  return selection.links.flatMap(link => link.attributes.map(attribute => {
    const known = attributesOf(link.entity).find(a => a.a === attribute);
    return {
      a: `${link.alias}.${attribute}`,
      n: known ? known.n : attribute,
      t: known ? known.t : "Text",
      attribute,
      linkedEntity: link.entity,
      linkedEntityLabel: entityLabel(link.entity) || link.entity
    };
  }));
}

/**
 * The narrowing a view already does, shown beside the filters the report adds.
 *
 * The two combine with AND — the report's conditions are appended to the view's query rather than
 * replacing them — so an author who cannot see the view's own conditions cannot predict the result.
 * A report filtered to "city = Doha" on a view of active accounts returns active Doha accounts, and
 * nothing on the Filters tab said the first half of that.
 */
function viewFiltersHtml(entity, viewName) {
  const selection = viewSelection(entity, viewName);
  if (!selection) return "";

  const readable = condition => `<span class="kbd">${esc(condition.attribute)}</span> ${
    esc(FETCH_OPERATORS[condition.operator] || condition.operator)}${
    condition.value ? ` <b>${esc(condition.value)}</b>` : ""}`;

  const body = selection.conditions.length
    ? `<div class="join-visual" style="flex-wrap:wrap;gap:8px">${
        selection.conditions.map(c => `<span class="ent-chip">${readable(c)}</span>`).join("")}</div>`
    : `<div class="canvas-hint" style="padding:6px 0">This view narrows nothing on its own — every ${esc(entity)} row reaches your filters.</div>`;

  return `<div class="section-card" style="max-width:900px"><h3>Already filtered by the view</h3>
    <div class="hint"><b>${esc(viewName)}</b> applies these before your own filters, and the two combine with <b>AND</b>. Anything you add below narrows the result further; it cannot widen it.</div>
    ${body}</div>`;
}

/** The source the report reads through. Its type decides what the field pickers may offer. */
function primarySourceOf(report) {
  const sources = report.dataSources || [];
  return sources.find(source => source.primary) || sources[0] || null;
}

/**
 * The fields a report can offer, grouped by the table each comes from.
 *
 * One shape for every picker — the wizard's list and canvas palette, and the manual designer's field
 * tree — so they cannot disagree about what is selectable. Under a CRM View the groups come from the
 * view: its own table, then each table it joins. Otherwise, from the report's own joins.
 */
function attributeGroupsFor(mainEntity, sourceType, viewName, joins = []) {
  const named = entity => entityLabel(entity) || entity;
  if (!isCrmViewSource(sourceType)) {
    return [{ entity: mainEntity, label: named(mainEntity), attrs: attributesOf(mainEntity) }]
      .concat(joins.filter(j => j.entity).map(j => ({
        entity: j.entity, label: named(j.entity), joined: true,
        // Keyed by table and field: the alias the joined column is projected under, and what keeps
        // two joined tables that both have "name" apart.
        attrs: attributesOf(j.entity).map(a => ({ ...a, a: `${j.entity}.${a.a}`, attribute: a.a,
          joinEntity: j.entity, joinEntityLabel: named(j.entity) }))
      })));
  }

  const available = availableAttributes(mainEntity, sourceType, viewName);
  const groups = [{ entity: mainEntity, label: named(mainEntity), attrs: available.filter(a => !a.linkedEntity) }];
  available.filter(a => a.linkedEntity).forEach(attribute => {
    const existing = groups.find(group => group.entity === attribute.linkedEntity);
    if (existing) existing.attrs.push(attribute);
    else groups.push({ entity: attribute.linkedEntity, label: attribute.linkedEntityLabel, joinedByView: true, attrs: [attribute] });
  });

  return groups.filter(group => group.attrs.length);
}

/** Every field the draft can offer, flat: the primary table plus whatever the view or report joined. */
function draftColumnCatalogue(draft) {
  return attributeGroupsFor(draft.mainEntity, draft.sourceType, draft.dataSourceQuery, draft.joins)
    .flatMap(group => group.attrs);
}

/**
 * The heading for a picked field. A linked one names its table, since "Email" alone does not say
 * whose — unless the field's own label already does, which would read "Account Name (Account)".
 */
function columnHeadingFor(entry) {
  if (!entry.linkedEntity && !entry.joinEntity) return entry.n;
  const table = entry.linkedEntityLabel || entry.joinEntityLabel;
  return entry.n.toLowerCase().includes(table.toLowerCase()) ? entry.n : `${entry.n} (${table})`;
}

/** Splits a picker entry back into what gets stored: the attribute, its table, and its row key. */
function columnSourceOf(entry, mainEntity) {
  // A view's linked field and a report's joined field are stored the same way — attribute, its own
  // table, and the alias it arrives under. Only where they come from differs.
  const from = entry.linkedEntity || entry.joinEntity;
  return from
    ? { attribute: entry.attribute, entity: from, sourceAlias: entry.a }
    : { attribute: entry.a, entity: mainEntity, sourceAlias: "" };
}
const wiz = { step:0, draft:null };
function openWizard() {
  wiz.step = 0;
  wiz.draft = { start:"blank", dupPick:"", shape:"", name:"", description:"", category:"", module:"", owner:state.userName||"", governed:false,

    layoutType:"Tabular Report", exports:["PDF","Excel","CSV"], theme:"qdb", languages:["en"], primaryLang:"en", previewLang:"en", logoData:null, renderMode:"report", chartType:"Column", cardIcon:"chart",
    placements:{ form:false, grid:true, dashboard:false, subgrid:false, sitemap:false, entity:"", role:"", passRecord:true, passSelected:true, passUserBu:true, passFields:[] } };

async function applyStart(d) {
  if (d.start && d.start.startsWith("tpl:")) {
    applyShape(d, d.start.slice(4));
  } else if (d.start === "duplicate") {
    await copyStoredReportIntoDraft(d);
  }
}

/**
 * Fills a join's keys from the relationship that already exists between the two tables.
 *
 * Dataverse knows how these tables relate. Making someone type both sides of a foreign key from
 * memory is asking them to restate metadata, and to get it wrong silently. Only fills what is
 * empty, so a deliberate choice is never overwritten, and stays quiet when no relationship exists —
 * a guessed key would be worse than a blank one.
 */
function suggestJoinKeys(d, join) {
  if (!d.mainEntity || !join.entity || (join.leftKey && join.rightKey)) return;

  /* Only when the answer is unambiguous. Two tables often relate several ways — contact carries a
     handful of separate lookups to account — and picking the first would quietly join on the wrong
     one, which is worse than leaving the author to choose. */
  const candidates = relationsOf(d.mainEntity).filter(r => r.entity === join.entity);
  const primary = entityRecord(d.mainEntity);
  if (candidates.length !== 1 || !primary) return;

  // A one-to-many: the child carries the foreign key, the parent is matched on its own id.
  if (!join.leftKey) join.leftKey = primary.primaryId;
  if (!join.rightKey) join.rightKey = candidates[0].foreignKey;
}

/* A shape contributes its layout and export defaults now, and its column rule later — once the
   author has chosen a table. Nothing here names an entity, which is the whole point. */
function applyShape(d, shapeId) {
  const shape = REPORT_SHAPES[shapeId];
  if (!shape) return;
  d.shape = shapeId;
  d.layoutType = shape.layoutType;
  d.exports = shape.exports.slice();
}

/**
 * Suggests the shape's columns against the table the author picked. Only ever suggests: it runs when
 * nothing has been chosen yet, so it cannot overwrite a selection someone has already made.
 */
function suggestShapeColumns(d) {
  if (!d.shape || !d.mainEntity || (d.columns && d.columns.length)) return;
  const shape = REPORT_SHAPES[d.shape];
  if (!shape) return;

  const suggested = shape.pick(d.mainEntity);
  if (!suggested.length) return;

  d.columns = suggested;
  d.colMeta = d.colMeta || {};
  for (const attribute of suggested) {
    const known = attributesOf(d.mainEntity).find(a => a.a === attribute);
    if (!d.colMeta[attribute]) d.colMeta[attribute] = { label: known ? known.n : attribute, labelPos: "left" };
  }
}

/* Duplicating reads the stored definition rather than a row from the list. The list carries a name
   and a category; the columns, filters and parameters the user expects to be copied only exist in
   Dataverse. */
async function copyStoredReportIntoDraft(d) {
  const chosen = reportCatalog.get().find(r => r.name === d.dupPick);
  if (!chosen) { toast("Pick a report to duplicate", "warn"); return; }
  beginBusy("Reading report to duplicate…");
  try {
    const src = definitionToReport(await loadReportDefinition(chosen.id));
    d.name = `${chosen.name} (copy)`;
    d.category = chosen.category || d.category;
    d.module = chosen.module || d.module;
    d.mainEntity = src.mainEntity;
    d.sourceType = src.dataSources[0].type;
    d.dataSourceQuery = src.dataSources[0].query || "";
    d.columns = src.columns.map(c => c.attribute);
    d.layoutType = src.layout.type;
    d.exports = src.exports.filter(e => e.enabled).map(e => e.format);
    d.filters = src.filters.map(f => ({ attribute:f.attribute, operator:f.operator, value:f.value, param:f.param }));
    d.parameters = src.parameters.map(p => ({ name:p.name, prompt:p.prompt, type:p.type, required:p.required }));
  } catch (error) {
    toast("Couldn't read the report to duplicate — " + error.message, "err");
  } finally {
    endBusy("Reading report to duplicate…");
  }
}

function wizBasics(host, d) {

    <div class="field col-2"><label class="lbl">Description</label><textarea class="fluent-input" id="wz_description" rows="2" placeholder="What does this report answer?">${esc(d.description)}</textarea></div>

    <div class="field"><label class="lbl">Module</label><select class="fluent-select" id="wz_module">${opts(["", ...reportChoiceLabels("qdb_module")], d.module)}</select></div>

  </div>`;

  /* Written as they are typed, not only on Next. The step re-renders when the Category and Module
     choices arrive, and a re-render reads from the draft — anything not yet written would be lost
     mid-sentence, which is a strange thing to have happen while naming a report. */
  const bind = (id, key) => {
    const input = $("#" + id);
    if (input) input.addEventListener(input.type === "checkbox" ? "change" : "input",
      () => { d[key] = input.type === "checkbox" ? input.checked : input.value; });
  };
  [["wz_name","name"],["wz_description","description"],["wz_category","category"],
   ["wz_module","module"],["wz_owner","owner"],["wz_governed","governed"]].forEach(([id,key]) => bind(id,key));
  $("#wz_category").addEventListener("change", () => { d.category = $("#wz_category").value; });
  $("#wz_module").addEventListener("change", () => { d.module = $("#wz_module").value; });
}
function wizData(host, d) {
  d._dataView = d._dataView || "form";
  host.innerHTML = `<div id="wz_dv"></div>`;
  const render = () => { const c = $("#wz_dv"); c.innerHTML = ""; c.appendChild(el(viewToggle(d._dataView, [{k:"form",label:"Form view"},{k:"canvas",label:"Join canvas"}]))); const inner = el(`<div></div>`); c.appendChild(inner); (d._dataView==="canvas"?wizDataCanvas:wizDataForm)(inner, d); c.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ d._dataView=b.dataset.view; render(); }); };
  render();
}
/* The canvas could add a node and not describe it: "Add joined entity" dropped an empty box and
   sent you to Form view to say what it joined. It now selects whatever you add and edits it here,
   so arranging the shape of the data and defining it are the same act. */
function wizDataCanvas(host, d) {
  d._pos = d._pos || {};
  const pos = (id, dx, dy) => { if (!d._pos[id]) d._pos[id] = { x:dx, y:dy }; return d._pos[id]; };
  const viaView = isCrmViewSource(d.sourceType);
  const viewLinks = viaView ? (viewSelection(d.mainEntity, d.dataSourceQuery) || { links: [] }).links : [];

  const pp = pos("primary", 40, 60);
  const primaryBody = `<div class="kv"><span>role</span><b>Primary</b></div><div class="kv"><span>via</span><b>${esc(d.sourceType)}</b></div>`;
  let nodes = canvasNode("primary", "c-extract", d.mainEntity || "(no table)", primaryBody, pp.x, pp.y, "");

  // A view supplies its own joins, and the report's are discarded — so they are shown, not offered.
  if (viaView) {
    viewLinks.forEach((link, i) => { const p = pos("v"+i, 320, 30 + i*110);
      nodes += canvasNode("v"+i, "c-transform", link.entity, `<div class="kv"><span>join</span><b>${esc(link.linkType)}</b></div><div class="kv"><span>on</span><b>${esc(link.to)}</b></div>`, p.x, p.y, ""); });
  } else {
    d.joins.forEach((j,i) => { const p = pos("j"+i, 320, 30 + i*110);
      nodes += canvasNode("j"+i, "c-transform", j.entity || "(pick a table)", `<div class="kv"><span>join</span><b>${esc(j.joinType.replace(" join",""))}</b></div><div class="kv"><span>on</span><b>${esc(j.leftKey||"—")}</b></div>`, p.x, p.y, `data-jdel="${i}"`); });
  }
  const linkCount = viaView ? viewLinks.length : d.joins.length;
  d.externalSources.forEach((x,i) => { const p = pos("x"+i, 320, 30 + (linkCount+i)*110 + 20);
    nodes += canvasNode("x"+i, "c-ext", x.connector || "(pick a system)", `<div class="kv"><span>dir</span><b>${esc(x.direction)}</b></div><div class="kv"><span>key</span><b>${esc(x.crmKey||"—")}</b></div>`, p.x, p.y, `data-xdel="${i}"`); });

  host.innerHTML = `<div class="wtitle">Data — join canvas</div><div class="wsub">Click a box to edit it here; drag to arrange. Lines show joins between CRM tables and links to external systems.</div>
    <div class="canvas-toolbar">
      <button class="btn sm" id="cv_addjoin" ${viaView?"disabled":""}>${ic("add")}Add joined entity</button>
      <button class="btn sm" id="cv_addext">${ic("add")}Add external source</button>
      <span class="canvas-hint">${viaView
        ? `${viewLinks.length} join(s) from <b>${esc(d.dataSourceQuery || "the view")}</b>`
        : `${d.joins.length} join(s)`} · ${d.externalSources.length} external source(s)</span></div>
    <div class="canvas-grid">
      <div>
        <div class="canvas-wrap" id="cv_canvas"><svg class="canvas-svg" id="cv_svg"></svg>${nodes}</div>
        <div class="canvas-hint">Blue = CRM joins · amber dashed = external systems (parameter passing direction shown).</div>
      </div>
      <div class="node-props" id="cv_props"></div>
    </div>`;

  const canvas = $("#cv_canvas"), svg = $("#cv_svg");
  const redraw = () => { const conns = [];
    const to = id => canvas.querySelector('[data-node="'+id+'"]');
    if (viaView) viewLinks.forEach((link,i)=> conns.push({ from:to("primary"), to:to("v"+i), label:link.linkType }));
    else d.joins.forEach((j,i)=> conns.push({ from:to("primary"), to:to("j"+i), label:j.joinType.replace(" join","") }));
    d.externalSources.forEach((x,i)=> conns.push({ from:to("primary"), to:to("x"+i), label:x.direction.includes("→ Source")?"CRM →":(x.direction.includes("Source →")?"→ CRM":"↔"), dashed:true, color:"var(--warning)" }));
    drawWires(svg, conns); };

  const paintSelection = () => canvas.querySelectorAll(".node").forEach(n => n.classList.toggle("sel", n.dataset.node === d._cvSel));
  const select = (id) => { d._cvSel = id; paintSelection(); renderProps(); };

  const renderProps = () => {
    const panel = $("#cv_props");
    panel.innerHTML = dataNodeProps(d, d._cvSel, viaView, viewLinks);
    bindDataNodeProps(panel, d, () => wizDataCanvas(host, d), redraw);
  };

  canvas.querySelectorAll(".node").forEach(n => {
    makeNodeDraggable(n, () => { const p = d._pos[n.dataset.node]; if (p) { p.x = parseFloat(n.style.left)||0; p.y = parseFloat(n.style.top)||0; } redraw(); });
    n.addEventListener("mousedown", () => select(n.dataset.node));
  });
  canvas.querySelectorAll("[data-jdel]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); d.joins.splice(+b.dataset.jdel,1); d._pos={}; d._cvSel=null; wizDataCanvas(host,d); });
  canvas.querySelectorAll("[data-xdel]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); d.externalSources.splice(+b.dataset.xdel,1); d._pos={}; d._cvSel=null; wizDataCanvas(host,d); });

  // Adding selects what was added: an empty box with no panel open is the thing being fixed.
  $("#cv_addjoin").onclick = () => { d.joins.push({entity:"",joinType:"Inner join",leftKey:"",rightKey:""}); d._cvSel = "j"+(d.joins.length-1); wizDataCanvas(host,d); };
  $("#cv_addext").onclick = () => { d.externalSources.push({connectorId:"",connector:"",operation:"",crmKey:"",extKey:"",direction:"CRM → Source",pass:""}); d._cvSel = "x"+(d.externalSources.length-1); wizDataCanvas(host,d); };

  paintSelection();
  renderProps();
  redraw();
}

/**
 * The relationships that could join these two tables, when there is more than one.
 *
 * suggestJoinKeys declines to guess between them, and rightly — contact reaches account four
 * separate ways on this org. But leaving two empty key pickers behind says nothing about why, when
 * the author's real decision is simply which relationship they meant. Naming them turns a dead end
 * into a choice; the key pickers stay for a join no relationship describes.
 */
function relationshipChoiceHtml(draft, join, index) {
  if (!draft.mainEntity || !join.entity) return "";
  const candidates = relationsOf(draft.mainEntity).filter(relation => relation.entity === join.entity);
  if (candidates.length < 2) return "";

  const chosen = candidates.findIndex(relation => relation.foreignKey === join.rightKey);
  return `<div class="field"><label class="lbl">Join on relationship</label>
    <select class="fluent-select" data-jrel="${index}">
      <option value="">— pick the relationship —</option>
      ${candidates.map((relation, at) => `<option value="${at}" ${at === chosen ? "selected" : ""}>${esc(relation.label)} · ${esc(relation.foreignKey)}</option>`).join("")}
    </select>
    <div class="np-empty" style="margin-top:6px">${chosen >= 0
      ? `Keys set from this relationship. Change them below if you meant a different link.`
      : `${esc(join.entity)} relates to ${esc(draft.mainEntity)} ${candidates.length} ways, so the keys are not filled in for you — pick the one you mean.`}</div></div>`;
}

/** The editor for whichever node is selected, or an instruction when none is. */
function dataNodeProps(d, selected, viaView, viewLinks) {
  if (!selected) {
    return `<h4>Properties</h4><div class="np-sub">Nothing selected</div>
      <div class="np-empty">Click a box on the canvas to edit it here, or add a joined table or external system from the toolbar.</div>`;
  }

  if (selected === "primary") {
    return `<h4>${esc(d.mainEntity || "Primary table")}</h4><div class="np-sub">The table this report reads</div>
      <div class="field"><label class="lbl">Read via</label><input class="fluent-input" value="${esc(d.sourceType)}" disabled></div>
      ${viaView ? `<div class="field"><label class="lbl">Saved view</label><input class="fluent-input" value="${esc(d.dataSourceQuery || "—")}" disabled></div>` : ""}
      <div class="np-empty">The table and read method are chosen in Form view, because changing either clears the columns picked from the old one.</div>`;
  }

  if (selected.startsWith("v")) {
    const link = viewLinks[+selected.slice(1)];
    if (!link) return `<h4>Properties</h4><div class="np-empty">This join no longer exists.</div>`;
    return `<h4>${esc(link.entity)}</h4><div class="np-sub">Joined by <b>${esc(d.dataSourceQuery || "the view")}</b></div>
      <div class="field"><label class="lbl">Join type</label><input class="fluent-input" value="${esc(link.linkType)} join" disabled></div>
      <div class="field"><label class="lbl">Left key</label><input class="fluent-input" value="${esc(link.to)}" disabled></div>
      <div class="field"><label class="lbl">Right key</label><input class="fluent-input" value="${esc(link.from)}" disabled></div>
      <div class="np-empty">The view carries this join and its query replaces the report's, so it cannot be edited here. Change it in CRM, or read via FetchXML.</div>`;
  }

  if (selected.startsWith("j")) {
    const i = +selected.slice(1), join = d.joins[i];
    if (!join) return `<h4>Properties</h4><div class="np-empty">This join no longer exists.</div>`;
    return `<h4>Joined table</h4><div class="np-sub">Combined with ${esc(d.mainEntity || "the primary table")}</div>
      <div class="field"><label class="lbl">Join type</label><select class="fluent-select" data-ji="${i}" data-jk="joinType">${opts(JOIN_TYPES, join.joinType)}</select></div>
      <div class="field"><label class="lbl">Related entity</label>${entityPickerHtml(join.entity, `data-ji="${i}" data-jk="entity"`)}</div>
      ${relationshipChoiceHtml(d, join, i)}
      <div class="field"><label class="lbl">Left key (on ${esc(d.mainEntity || "primary")})</label>${attributePickerHtml(d.mainEntity, join.leftKey, `data-ji="${i}" data-jk="leftKey"`, "Search primary fields…")}</div>
      <div class="field"><label class="lbl">Right key (on ${esc(join.entity || "related")})</label>${attributePickerHtml(join.entity, join.rightKey, `data-ji="${i}" data-jk="rightKey"`, "Search related fields…")}</div>`;
  }

  const i = +selected.slice(1), source = d.externalSources[i];
  if (!source) return `<h4>Properties</h4><div class="np-empty">This source no longer exists.</div>`;
  return `<h4>External system</h4><div class="np-sub">Blended with the CRM rows on a matching key</div>
    <div class="field"><label class="lbl">System (connector)</label><select class="fluent-select" data-xi="${i}" data-xk="connector">${opts(["", ...connectorCatalog.get().map(c=>c.name)], source.connector)}</select></div>
    <div class="field"><label class="lbl">Operation</label><input class="fluent-input" data-xi="${i}" data-xk="operation" value="${esc(source.operation)}" placeholder="GET /balances"></div>
    <div class="field"><label class="lbl">Direction</label><select class="fluent-select" data-xi="${i}" data-xk="direction">${opts(["CRM → Source","Source → CRM","Both ways"], source.direction)}</select></div>
    <div class="field"><label class="lbl">Match: CRM field</label>${attributePickerHtml(d.mainEntity, source.crmKey, `data-xi="${i}" data-xk="crmKey"`, "Search fields…")}</div>
    <div class="field"><label class="lbl">Match: ${esc(source.connector || "source")} field</label><input class="fluent-input" data-xi="${i}" data-xk="extKey" value="${esc(source.extKey)}" placeholder="customerNumber"></div>
    <div class="field"><label class="lbl">Parameters passed</label><input class="fluent-input" data-xi="${i}" data-xk="pass" value="${esc(source.pass)}" placeholder="branchCode, dateFrom"></div>`;

/**
 * Binds the properties panel to the draft.
 *
 * Edits that change what a node says — its table, its key — rebuild the canvas so the box and the
 * panel agree; the rest only redraw the wires, so a half-typed value is not interrupted.
 */
function bindDataNodeProps(panel, d, rebuild, redraw) {
  panel.querySelectorAll("[data-jrel]").forEach(select => select.addEventListener("change", () => {
    const join = d.joins[+select.dataset.jrel];
    const relation = relationsOf(d.mainEntity).filter(r => r.entity === join.entity)[+select.value];
    if (!relation) return;
    const primary = entityRecord(d.mainEntity);
    join.leftKey = primary ? primary.primaryId : join.leftKey;
    join.rightKey = relation.foreignKey;
    rebuild();
  }));
  panel.querySelectorAll("[data-ji]").forEach(input => input.addEventListener(comboSafeEvent(input), () => {
    const join = d.joins[+input.dataset.ji];
    join[input.dataset.jk] = input.value;
    if (input.dataset.jk === "entity") suggestJoinKeys(d, join);
    rebuild();
  }));
  panel.querySelectorAll("[data-xi]").forEach(input => input.addEventListener(comboSafeEvent(input), () => {
    const source = d.externalSources[+input.dataset.xi];
    source[input.dataset.xk] = input.value;
    if (input.dataset.xk === "connector") {
      const chosen = connectorCatalog.get().find(c => c.name === input.value);
      source.connectorId = chosen ? chosen.id : "";
    }
    if (input.dataset.xk === "connector" || input.dataset.xk === "direction" || input.dataset.xk === "crmKey") rebuild();
    else redraw();
  }));
}
function wizDataForm(host, d) {
  /* The keys were free-text boxes: you had to know a column's logical name and type it correctly,

      <td>${entityPickerHtml(j.entity, `data-ji="${i}" data-jk="entity"`)}</td>
      <td>${attributePickerHtml(d.mainEntity, j.leftKey, `data-ji="${i}" data-jk="leftKey"`, "Search primary fields…")}</td>
      <td>${attributePickerHtml(j.entity, j.rightKey, `data-ji="${i}" data-jk="rightKey"`, "Search related fields…")}</td>
      <td><button class="del" data-jdel="${i}">${ic("trash")}</button></td></tr>`).join("")
    : `<tr class="empty-row"><td colspan="5">No joins — the report reads a single entity.</td></tr>`;

        <div class="field"><label class="lbl">Operation</label><input class="fluent-input" data-xi="${i}" data-xk="operation" value="${esc(x.operation)}" placeholder="GET /balances:batch"></div>
        <div class="field"><label class="lbl">Direction</label><select class="fluent-select" data-xi="${i}" data-xk="direction">${opts(["CRM → Source","Source → CRM","Both ways"], x.direction)}</select></div>
        <div class="field"><label class="lbl">Match: CRM field</label><input class="fluent-input" data-xi="${i}" data-xk="crmKey" value="${esc(x.crmKey)}" placeholder="qdb_customernumber"></div>
        <div class="field"><label class="lbl">Match: ${esc((x.connector||"source"))} field</label><input class="fluent-input" data-xi="${i}" data-xk="extKey" value="${esc(x.extKey)}" placeholder="customerNumber"></div>

    ? viewJoinsHtml(d.mainEntity, d.dataSourceQuery)
    : `<div class="section-card" style="max-width:900px"><h3>Related CRM entities (joins)</h3><div class="hint">Combine multiple CRM tables with inner / left / right joins on matching keys.</div>
      <div class="join-visual"><span class="ent-chip">${esc(d.mainEntity)} <span style="color:var(--text-secondary)">(primary)</span></span>${d.joins.map(j=>`<span class="join-badge">${esc(j.joinType.replace(" join",""))} ▸</span><span class="ent-chip">${esc(j.entity)}</span>`).join("")}</div>

      <div class="action-row">
        <button class="btn sm" id="wz_addjoin">${ic("add")}Add joined entity</button>
        <button class="btn sm" id="wz_joindata" ${d.joins.some(isRunnableJoin)?"":"disabled"}>${ic("play")}View data</button>
        <span class="canvas-hint">Runs the joined query against your data — the only way to see whether these keys really match.</span>
      </div></div>`;

  host.innerHTML = `<div class="wtitle">What data is this report about?</div><div class="wsub">Pick the table this report reads. Everything else here is optional: reuse another report's query, join in related tables, or blend an outside system.</div>
    <div class="section-card" style="max-width:900px"><h3>Reuse a saved query <span class="rel-tag">optional</span></h3><div class="hint">Every report stores how it reads its data. Pick another report's source to copy its read method and query text — leave this alone and the engine builds the query from the table, columns and filters you choose below.</div>
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:6px">
        <div class="field" style="max-width:440px;flex:1"><label class="lbl">Reusable data source</label><select class="fluent-select" id="wz_ds">${datasourceOptions(d.dataSourceName)}</select></div>
      </div></div>
    <div class="section-card" style="max-width:900px"><h3>Primary CRM entity</h3><div class="hint">The table this report reads. This is the one thing the step actually needs.</div>
      <div class="field" style="max-width:340px;margin-bottom:16px"><label class="lbl">Main entity<span class="req">*</span></label>${entityPickerHtml(d.mainEntity, 'id="wz_entity"')}</div>
      <label class="lbl" style="display:block;margin-bottom:8px">Read via</label>
      <div class="choice-cards" id="wz_sources" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${SOURCES.map(s=>`<div class="choice-card ${d.sourceType===s.label?"sel":""}" data-src="${esc(s.label)}" style="padding:12px"><div class="cc-t">${esc(s.label)}</div><div class="cc-d">${esc(SOURCE_DESCRIPTIONS[s.label] || "")}</div>${s.live?"":`<div class="rel-tag" style="margin-top:6px">stored, not applied yet</div>`}</div>`).join("")}</div>
      ${isCrmViewSource(d.sourceType) ? `<div class="field" style="max-width:440px;margin-top:16px"><label class="lbl">Saved view<span class="req">*</span></label>${viewPickerHtml(d.mainEntity, d.dataSourceQuery, 'id="wz_view"')}<div class="hint" style="margin-top:6px">The view decides <b>which rows</b> come back and in what order — its filters and sort replace the ones you set later. The columns you pick still decide what is <b>shown</b>, so choose fields the view itself selects, or they arrive empty.</div></div>` : ""}</div>

    ${joinsCard}

    <div class="section-card" style="max-width:900px"><h3>External data sources</h3>

      <button class="btn sm btn-add" id="wz_addext">${ic("add")}Add external source</button></div>`;

  $("#wz_ds").onchange = (e) => {
    const ds = dataSourceCatalog.get().find(x=>x.name===e.target.value);

      d.dataSourceConnectorId = ds.connectorId || "";

  });
  host.querySelectorAll("[data-ji]").forEach(inp => inp.addEventListener(comboSafeEvent(inp), () => {

/* Synthesize type-appropriate sample rows for any entity + column set */
/* ---------- Preview rows ----------
   Every preview surface — the paper preview, the banded designer, KPI tiles, charts and dashboard
   tiles — used to render invented rows: Doha Main, QNB Corp, amounts down a fixed list. It looked
   convincing and told the user nothing, because the numbers had no relationship to their data.

   These read the org instead: a small FetchXML over the entity the draft is built on, top 10 rows,
   just the selected columns. Formatted values are preferred so a choice shows its label and a
   currency shows its symbol, exactly as the report will render it.

   Synchronous, for the same reason the metadata accessors are: the render path cannot await. A miss
   starts the query and returns nothing, and the fetch re-renders when it lands. */

const PREVIEW_ROW_LIMIT = 10;
const previewData = { byKey: {}, pending: {} };

const previewKey = (entity, cols) => entity + "|" + cols.map(c => c.key).join(",");

function previewRows(cols, entity) {
  const usable = (cols || []).filter(c => c && c.key);
  if (!entity || !usable.length) return [];
  const key = previewKey(entity, usable);
  if (!previewData.byKey[key]) { loadPreviewRows(key, entity, usable); return []; }
  return previewData.byKey[key];
}

async function loadPreviewRows(key, entity, cols) {
  if (previewData.pending[key]) return;
  previewData.pending[key] = true;
  beginBusy(`Previewing ${entity}…`);
  try {
    const rows = await dvList(entity, "?fetchXml=" + encodeURIComponent(previewFetchXml(entity, cols)));
    previewData.byKey[key] = rows.map(row => toPreviewRow(row, cols));
  } catch (error) {
    // An entity the user cannot read, or a column that no longer exists: an empty preview is the
    // honest answer. It must not fall back to invented rows.
    previewData.byKey[key] = [];
  }
  delete previewData.pending[key];
  endBusy(`Previewing ${entity}…`);
  render();
}

function previewFetchXml(entity, cols) {
  const attributes = [...new Set(cols.map(c => c.key))]
    .map(name => `<attribute name="${esc(name)}"/>`).join("");
  return `<fetch top="${PREVIEW_ROW_LIMIT}"><entity name="${esc(entity)}">${attributes}</entity></fetch>`;
}

/* ---------- Seeing a join actually work ----------
   Join keys are the easiest thing in the designer to get wrong and the hardest to notice: a wrong
   pair still saves, still previews the primary table happily, and only shows up later as a report
   returning nothing or the wrong number of rows. Running the joined query here answers the one
   question the configuration cannot — do these two tables actually match on these two columns. */

  if (button) button.disabled = !(draft.joins || []).some(isRunnableJoin);

/** The FetchXML the configured joins describe: the root table plus one link-entity per join. */
function joinPreviewFetchXml(draft) {
  const usable = (draft.joins || []).filter(isRunnableJoin);
  const rootColumns = previewColumnsFor(draft.mainEntity, usable.map(j => j.leftKey));

  const links = usable.map((join, index) => {
    const columns = previewColumnsFor(join.entity, [join.rightKey]);
    return `<link-entity name="${esc(join.entity)}" from="${esc(join.rightKey)}" to="${esc(join.leftKey)}"`
      + ` link-type="${esc(linkTypeOf(join.joinType))}" alias="${JOIN_ALIAS(index)}">`
      + columns.map(c => `<attribute name="${esc(c)}"/>`).join("")
      + `</link-entity>`;
  }).join("");

  return `<fetch top="${JOIN_PREVIEW_LIMIT}"><entity name="${esc(draft.mainEntity)}">`
    + rootColumns.map(c => `<attribute name="${esc(c)}"/>`).join("") + links + `</entity></fetch>`;
}

/**
 * The table's own name, plus the keys being joined on — the columns that show whether it worked.
 *
 * A key that is the record's own id is left out. It is a GUID: unreadable, identical to the value on
 * the other side by definition, and it proves nothing a name does not. Where the key is a lookup it
 * stays, because its display text names the row it points at, which is the match made visible.
 */
function previewColumnsFor(entity, keys) {
  const name = primaryNameOf(entity);
  const known = attributesOf(entity);
  const isIdentifier = a => (known.find(x => x.a === a) || {}).t === "Unique identifier";
  const exists = a => !known.length || known.some(x => x.a === a) || a === name;

  const wanted = [name].concat(keys.filter(k => !isIdentifier(k))).filter(Boolean);
  return [...new Set(wanted.filter(exists))];
}

const linkTypeOf = joinType => {
  const label = String(joinType || "").toLowerCase();
  if (label.startsWith("left")) return "outer";
  if (label.startsWith("right")) return "outer";
  return "inner";
};

/**
 * Runs the joined query and shows what came back.
 *
 * A right join is reported rather than silently run as something else: FetchXML has no right join,
 * so honouring it would mean swapping the tables around, and a preview that quietly reshapes the
 * query is not evidence of anything.
 */
async function openJoinPreview(draft) {
  const usable = (draft.joins || []).filter(isRunnableJoin);
  if (!draft.mainEntity) { toast("Pick a main entity first", "warn"); return; }
  if (!usable.length) { toast("Add a join with both keys set, then view the data", "warn"); return; }

  const fetchXml = joinPreviewFetchXml(draft);
  let rows = null;
  let failure = null;
  try {
    rows = await dvList(draft.mainEntity, "?fetchXml=" + encodeURIComponent(fetchXml));
  } catch (error) {
    failure = error.message || String(error);
  }

  showJoinPreview(draft, usable, fetchXml, rows, failure);
}

function showJoinPreview(draft, joins, fetchXml, rows, failure) {
  const columns = joinPreviewColumns(draft, joins);
  const body = failure
    ? `<div class="info-banner" style="border-left-color:var(--error)">${ic("info")}<div><b>The query was rejected.</b>
        That usually means the two keys are not comparable — a lookup matched against a text column,
        or a column that is not on the table it was chosen from.<div style="margin-top:6px">${esc(failure)}</div></div></div>`
    : rows.length
      ? `<div class="page-sub" style="margin-bottom:10px">${rows.length} row${rows.length===1?"":"s"}${rows.length===JOIN_PREVIEW_LIMIT?` (first ${JOIN_PREVIEW_LIMIT})`:""} · joined as configured</div>
         <div class="grid-wrap" style="max-height:340px;overflow:auto"><table class="grid"><thead><tr>${
           columns.map(c=>`<th>${esc(c.label)}<div class="hint-inline">${esc(c.source)}</div></th>`).join("")
         }</tr></thead><tbody>${
           rows.map(row=>`<tr>${columns.map(c=>`<td>${cell(readPreviewCell(row, c.key))}</td>`).join("")}</tr>`).join("")
         }</tbody></table></div>`
      : `<div class="info-banner">${ic("info")}<div><b>The query ran and matched nothing.</b>
          The join is valid but no row on the primary table has a match — either the keys pair the
          wrong columns, or there genuinely is no related data yet.</div></div>`;

  // Opened from inside the wizard overlay, so it needs to sit above it.
  const scrim = el(`<div class="scrim above-wizard"><div class="dialog" role="dialog" aria-modal="true" style="width:860px;max-width:94vw">
    <div class="dialog-head"><div><h3>Joined data</h3><div class="page-sub" style="margin-top:2px">${esc(draft.mainEntity)}${
      joins.map(j=>` · ${esc(j.joinType)} ${esc(j.entity)}`).join("")}</div></div><button class="close-x">✕</button></div>
    <div class="dialog-body">${body}
      <details style="margin-top:14px"><summary class="page-sub" style="cursor:pointer">The query that ran</summary>
        <pre style="white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;margin-top:8px">${esc(fetchXml)}</pre>
      </details></div>
    <div class="dialog-foot"><button class="btn" data-close>Close</button></div>
  </div></div>`);
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.querySelector(".close-x").onclick = close;
  scrim.querySelector("[data-close]").onclick = close;
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
}

/** One column per attribute the preview asked for, labelled with the table it came from. */
function joinPreviewColumns(draft, joins) {
  const label = (entity, attribute) => (attributesOf(entity).find(a => a.a === attribute) || {}).n || attribute;
  const columns = previewColumnsFor(draft.mainEntity, joins.map(j => j.leftKey))
    .map(a => ({ key: a, label: label(draft.mainEntity, a), source: draft.mainEntity }));

  joins.forEach((join, index) => {
    previewColumnsFor(join.entity, [join.rightKey]).forEach(a =>
      columns.push({ key: `${JOIN_ALIAS(index)}.${a}`, label: label(join.entity, a), source: join.entity }));
  });

  return columns;
}

/** Aliased join columns arrive as "j0.attribute"; formatted values win where the platform sent one. */
function readPreviewCell(row, key) {
  const formatted = row[key + FORMATTED_SUFFIX];
  return formatted !== undefined && formatted !== null ? formatted : row[key];
}

/** Keyed by attribute, because that is what every preview renderer looks the value up by. */
/* A lookup asked for as "ownerid" comes back as "_ownerid_value" — the attribute name and the column
   name in the response are simply not the same thing for lookups. Reading only the attribute name
   yielded undefined, which surfaced as a chart slice literally labelled "undefined".
   The display name lives in the formatted annotation; the raw value is a GUID and is the last
   resort, because a GUID on a chart axis tells the reader nothing. */
function previewCellValue(row, key) {
  const lookupKey = `_${key}_value`;
  const candidates = [row[key + FORMATTED_SUFFIX], row[lookupKey + FORMATTED_SUFFIX], row[key], row[lookupKey]];
  return candidates.find(value => value !== undefined && value !== null);
}

function toPreviewRow(row, cols) {
  const shaped = {};
  for (const col of cols) shaped[col.key] = previewCellValue(row, col.key);
  return shaped;
}

/** Whether a preview is still waiting on its query, so the UI can say so rather than look empty. */
function previewIsLoading(cols, entity) {
  const usable = (cols || []).filter(c => c && c.key);
  if (!entity || !usable.length) return false;
  return !previewData.byKey[previewKey(entity, usable)];
}

function previewPlaceholder(cols, entity) {
  if (previewIsLoading(cols, entity)) {
    // Skeleton rows in the shape of the columns already chosen, so the preview does not jump.
    return `<div class="section-card" style="max-width:940px">${loadingNote(`Reading ${entity} from Dataverse…`)}
      <div style="margin-top:12px">${skeletonRows(Math.min((cols || []).length || 3, 6))}</div></div>`;
  }
  const message = !entity
    ? "Pick a main entity to preview real rows from your data."
    : `No rows returned from <span class="kbd">${esc(entity)}</span>. The preview shows your own data, so an empty table here means the query returned nothing or you cannot read that table.`;
  return `<div class="section-card" style="max-width:940px"><div class="page-sub">${message}</div></div>`;
}

}
