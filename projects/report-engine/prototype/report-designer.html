/* ---------- small helpers ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const money = (n) => "QAR " + n.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function opts(list, sel) { return list.map(o => `<option ${o===sel?"selected":""}>${esc(o)}</option>`).join(""); }
function opts2(pairs, sel) { return pairs.map(([v,l]) => `<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`).join(""); }
/* Tag each grid cell with its column label so tables can render as cards on small screens */
function labelizeGrid(scope) {
  scope.querySelectorAll("table.grid").forEach(tbl => {
    const heads = [...tbl.querySelectorAll("thead th")].map(th => th.textContent.replace(/[↓↑]/g,"").trim());
    tbl.querySelectorAll("tbody tr").forEach(tr => { [...tr.children].forEach((td,i) => { if (heads[i]) td.setAttribute("data-label", heads[i]); }); });
  });
}
function toast(msg, kind="ok") {
  const t = el(`<div class="toast ${kind==="ok"?"":kind}"><span class="dot"></span><span>${esc(msg)}</span></div>`);
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),300); }, 2600);
}

/* ---------- Busy tracking ----------
   Nothing in the designer is computed locally any more: opening a report, filling a picker and
   drawing a preview are all round trips. Every one of them goes through here.

   While any of them is in flight the app is LOCKED, not merely annotated. A shield covers the whole
   surface and swallows pointer events, and Enter/Space/Escape are refused, so a second operation
   cannot be started on top of the first. That matters beyond tidiness: the designer replaces a
   report's children wholesale on save, so a Delete or a second Save fired mid-write would race
   against a definition that is momentarily half-written.

   The tracker counts overlapping operations rather than toggling a flag, because several run at
   once — a list refresh while attribute metadata and a preview query are still in flight — and the
   first one to finish must not unlock the app for the others. It lives on the document, outside the
   re-rendered region, so a render mid-flight does not wipe it. */
const busy = { depth: 0, labels: [], revealTimer: null, watchdog: null };

/* A lock that never releases is worse than no lock: the app would be dead until a reload, with no
   clue why. If a caller ever loses its endBusy — a throw on a path without a finally, a hung
   request — the watchdog releases everything and says so, rather than leaving a shield up. */
const BUSY_WATCHDOG_MS = 45000;

function beginBusy(label) {
  busy.depth++;
  if (label) busy.labels.push(label);
  clearTimeout(busy.watchdog);
  busy.watchdog = setTimeout(releaseStuckBusy, BUSY_WATCHDOG_MS);
  paintBusy();
}

function releaseStuckBusy() {
  const stuck = busy.labels.slice();
  busy.depth = 0;
  busy.labels = [];
  paintBusy();
  toast(`Timed out waiting for ${stuck[stuck.length - 1] || "an operation"} — the screen was unlocked.`, "err");
}

function endBusy(label) {
  busy.depth = Math.max(0, busy.depth - 1);
  const at = label ? busy.labels.indexOf(label) : -1;
  if (at >= 0) busy.labels.splice(at, 1);
  clearTimeout(busy.watchdog);
  if (busy.depth > 0) busy.watchdog = setTimeout(releaseStuckBusy, BUSY_WATCHDOG_MS);
  paintBusy();
}

/* Long enough that a fast round trip never flashes a modal over the screen, short enough that
   anything a user would call slow is covered. Input is blocked from the first millisecond either
   way — only the dimming waits. */
const BUSY_VISIBLE_AFTER_MS = 180;

function paintBusy() {
  const active = busy.depth > 0;
  busyElement("qdbBusyBar", "busy-bar").classList.toggle("on", active);
  active ? raiseShield() : dropShield();
}

/** The newest label wins: it is the thing the user just asked for. */
const currentBusyLabel = () => busy.labels[busy.labels.length - 1] || "Working…";

function raiseShield() {
  const shield = busyElement("qdbBusyShield", "busy-shield");
  shield.innerHTML = `<div class="busy-panel"><span class="spinner lg"></span><span>${esc(currentBusyLabel())}</span></div>`;
  if (busy.revealTimer) return;
  busy.revealTimer = setTimeout(() => {
    const node = document.getElementById("qdbBusyShield");
    if (node) node.classList.add("visible");
  }, BUSY_VISIBLE_AFTER_MS);
}

function dropShield() {
  clearTimeout(busy.revealTimer);
  busy.revealTimer = null;
  const shield = document.getElementById("qdbBusyShield");
  if (shield) shield.remove();
}

/* Pointer events stop at the shield, but a focused control can still be fired from the keyboard,
   and Escape would close a dialog out from under an operation. Both are refused while busy. */
function blockKeyboardWhileBusy(event) {
  if (busy.depth === 0) return;
  if (["Enter", " ", "Spacebar", "Escape"].includes(event.key)) {
    event.preventDefault();
    event.stopPropagation();
  }
}
document.addEventListener("keydown", blockKeyboardWhileBusy, true);

/* Steps whose content is a list of fields. They are empty until attribute metadata arrives, and the
   wizard lives in its own overlay outside the re-rendered region — so a load that lands while one is
   open has to refresh it explicitly, or the step stays blank until the user navigates away and back.

   Deliberately not every step: rebuilding the overlay discards whatever is typed into the current
   one, and the steps left out are the ones a user types into rather than picks from. */
/* Basics is on this list for its Category and Module dropdowns: they come from the report
   definition's own choice columns, which load lazily. Landing on the step before they arrive showed
   an empty list under a required field, and nothing brought them in afterwards. */
const METADATA_DRIVEN_WIZARD_STEPS = ["basics", "data", "columns", "filters", "details"];

/**
 * Re-labels attribute combos once their table's fields arrive.
 *
 * A picker rendered before its metadata landed shows the raw logical name, and the step it sits on
 * is not always one worth rebuilding — the join rows live beside an entity picker someone may be
 * typing into. Relabelling in place fixes the display without disturbing anything.
 */
function refreshComboLabels() {
  document.querySelectorAll('.combo > .combo-input[data-combo="attribute"]').forEach(input => {
    if (document.activeElement === input) return;
    const chosen = input.dataset.entity;
    if (chosen) NATIVE_INPUT_VALUE.set.call(input, comboDisplay(input, chosen));
  });
}

/**
 * Re-offers join keys once the relationships they come from have arrived.
 *
 * Choosing a table usually beats its relationship metadata back, so the suggestion had nothing to
 * work with and quietly did nothing — it worked only when the metadata happened to be cached. The
 * inputs are written directly rather than by re-rendering the step, which sits next to an entity
 * picker somebody may be typing into.
 */
function refreshJoinKeySuggestions(entity) {
  const draft = (typeof wiz === "object" && wiz && wiz.draft) ? wiz.draft : null;
  if (!draft || draft.mainEntity !== entity || !document.getElementById("wizOverlay")) return;

  (draft.joins || []).forEach((join, index) => {
    suggestJoinKeys(draft, join);
    ["leftKey", "rightKey"].forEach(key => {
      const input = document.querySelector(`[data-ji="${index}"][data-jk="${key}"]`);
      if (input && !input.dataset.entity && join[key]) input.value = join[key];
    });
  });
}

function refreshOpenWizard() {
  if (!document.getElementById("wizOverlay")) return;
  const step = WIZ_STEPS[wiz.step];
  if (step && METADATA_DRIVEN_WIZARD_STEPS.includes(step.key)) renderWizard();
}

function busyElement(id, className) {
  let node = document.getElementById(id);
  if (!node) {
    node = document.createElement("div");
    node.id = id;
    node.className = className;
    document.body.appendChild(node);
  }
  return node;
}

/**
 * Runs an async operation with the busy signal raised, and lowers it however the operation ends.
 * Rejections propagate — the caller still decides what a failure means.
 */
async function withBusy(label, operation) {
  beginBusy(label);
  try {
    return await operation();
  } finally {
    endBusy(label);
  }
}

/**
 * The same, for a command button: it also disables and spins so the user cannot fire it twice.
 * Buttons are looked up live because a render can replace the element underneath us.
 */
async function withBusyButton(selector, label, operation) {
  const button = typeof selector === "string" ? $(selector) : selector;
  const original = button ? button.innerHTML : null;
  if (button) {
    button.disabled = true;
    button.classList.add("busy");
    button.innerHTML = `<span class="spinner"></span>${esc(label)}`;
  }
  try {
    return await withBusy(label, operation);
  } finally {
    if (button && button.isConnected) {
      button.disabled = false;
      button.classList.remove("busy");
      button.innerHTML = original;
    }
  }
}

/** The inline "still loading" line a list or panel shows in place of its content. */
const loadingNote = text => `<div class="loading-note"><span class="spinner"></span><span>${esc(text)}</span></div>`;

/** Placeholder rows shaped like the table that is coming. */
function skeletonRows(columns, rows = 4) {
  const cells = Array.from({ length: columns }, () => `<div class="skeleton-cell"></div>`).join("");
  return Array.from({ length: rows }, () => `<div class="skeleton-row">${cells}</div>`).join("");
}

/* ---------- Dataverse persistence (ADR-RPT-011) ----------
   Report and dashboard definitions are written straight to Dataverse with Xrm.WebApi, as the
   signed-in user. There is no middle tier to POST to any more.

   These are CONFIGURATION writes, so unlike report execution they need no audit record and no
   Custom API: what a designer saves is metadata about a report, not anybody's data. Execution is the
   part that has to be logged, and that still goes through qdb_RunReport.

   The attribute names, @odata.bind navigation properties and create ordering mirror the retired
   ReportDefinitionWriter/DashboardWriter exactly, so definitions written here load identically. */

function xrmApi() {
  const found = window.Xrm || (window.parent && window.parent.Xrm) || (window.top && window.top.Xrm);
  if (!found || !found.WebApi) {
    throw new Error("Saving needs a CRM session — open the designer as a web resource.");
  }
  return found.WebApi;
}

const dvCreate = async (entity, data) => (await xrmApi().createRecord(entity, data)).id;
const dvUpdate = (entity, id, data) => xrmApi().updateRecord(entity, id, data);
const dvDelete = (entity, id) => xrmApi().deleteRecord(entity, id);
const dvRetrieve = (entity, id, query) => xrmApi().retrieveRecord(entity, id, query);
const dvList = async (entity, query) => (await xrmApi().retrieveMultipleRecords(entity, query)).entities || [];

/* Metadata does not go through Xrm.WebApi: it rejects EntityDefinitions with "the entity cannot be
   found", because retrieveMultipleRecords resolves a logical name to a record collection and the
   metadata endpoints are neither. They are read straight off the Web API on the signed-in session
   instead. Note $top is rejected on these endpoints, so paging options must not be added here. */
async function dvMetadata(path) {
  const xrm = window.Xrm || (window.parent && window.parent.Xrm) || (window.top && window.top.Xrm);
  if (!xrm || !xrm.Utility) throw new Error("Reading metadata needs a CRM session.");
  const url = `${xrm.Utility.getGlobalContext().getClientUrl()}/api/data/v9.2/${path}`;
  const response = await fetch(url, {
    headers: { Accept: "application/json", "OData-Version": "4.0", "OData-MaxVersion": "4.0" }
  });
  const payload = await response.json();
  if (!response.ok) {
    throw new Error((payload.error && payload.error.message) || `Metadata request failed (${response.status})`);
  }
  return payload.value || [];
}

/** Children hang off the report by this lookup; the Web API exposes it with the _value spelling. */
const byReport = id => `?$filter=_qdb_reportdefinitionid_value eq ${id}`;

/* Xrm.WebApi returns a display string alongside every choice, lookup and date, under this suffix.
   Reading it rather than mapping option-set codes here keeps the labels in step with the org. */
const FORMATTED_SUFFIX = "@OData.Community.Display.V1.FormattedValue";
const formattedValue = (row, attribute) => row[attribute + FORMATTED_SUFFIX] || null;

/**
 * One Dataverse-backed list, fetched once per session.
 *
 * Every catalogue in the designer used to be a literal array, so the UI looked populated in an
 * environment that had nothing in it. These load on demand instead, and a load that fails is kept
 * rather than swallowed: an empty grid and a broken query are indistinguishable on screen, and
 * showing "no reports" when the query actually failed is the same class of lie as the seed data.
 */
function dataverseCatalog(entity, query, mapRow) {
  const catalog = {
    rows: null,
    error: null,
    loading: false,
    /** Rows if loaded, otherwise an empty list — and starts the fetch the first time it is asked. */
    get() {
      if (catalog.rows === null && !catalog.loading) catalog.load();
      return catalog.rows || [];
    },
    isLoading: () => catalog.rows === null,
    async load() {
      catalog.loading = true;
      beginBusy(`Reading ${entity}…`);
      try {
        catalog.rows = (await dvList(entity, typeof query === "function" ? query() : query)).map(mapRow);
        catalog.error = null;
      } catch (error) {
        catalog.rows = [];
        catalog.error = error.message || String(error);
      }
      catalog.loading = false;
      endBusy(`Reading ${entity}…`);
      render();
    },
    /** Re-reads from Dataverse, for the Refresh command and after a save. */
    refresh() {
      catalog.rows = null;
      return catalog.load();
    }
  };
  return catalog;
}

/** The message a list shows in place of rows: still loading, failed, or genuinely empty. */
function catalogEmptyState(catalog, emptyMessage) {
  if (catalog.error) {
    return `<div class="page-sub" style="color:var(--danger)">Couldn't read from Dataverse — ${esc(catalog.error)}</div>`;
  }
  if (catalog.isLoading()) return loadingNote("Loading from Dataverse…");
  return `<div class="page-sub">${esc(emptyMessage)}</div>`;
}

/**
 * Every data source the author defined, not only the first.
 *
 * Only dataSources[0] used to be written, so a report built with several sources lost all but one on
 * save — the tab offered an Add button whose result never survived. The entity mappings (the columns
 * and joins) belong to the primary source, which is the one the engine reads; the others carry their
 * own type, payload and connector so the definition is stored whole.
 */
function dataSourcesOf(report, alias, rootEntity, columns, joinMappings) {
  const authored = (report.dataSources || []).filter(source => source && (source.name || source.type));
  const sources = authored.length ? authored : [{ name: "Primary source", primary: true }];
  const primaryIndex = Math.max(0, sources.findIndex(source => source.primary));

  const mapped = sources.map((source, index) => {
    const chosen = sourceByLabel(source.type);
    const isPrimary = index === primaryIndex;
    return {
      id: newGuid(),
      name: source.name || (isPrimary ? "Primary source" : `Source ${index + 1}`),
      isPrimary,
      // The type and its payload decide where rows come from: a view name, a FetchXML document, or
      // inline rows. Left empty, the engine builds the query from the columns and filters as before.
      sourceType: chosen ? coded(chosen.code, chosen.label) : null,
      queryPayload: source.query || null,
      // Unique within the report: (report, alias) is an alternate key, so two sources left
      // aliasless would refuse to coexist.
      sourceAlias: isPrimary ? alias : (source.alias || `s${index + 1}`),
      externalConnectorId: source.connectorId || null,
      executionOrder: index + 1,
      // The mappings describe the report's own columns and joins, so they hang off the source the
      // engine actually executes.
      entityMappings: isPrimary
        ? [{ id: newGuid(), entityLogicalName: rootEntity, entityAlias: alias, depth: 0, columns }].concat(joinMappings)
        : []
    };
  });

  return mapped.concat(externalSourcesOf(report, mapped.length));
}

/* The External data sources card collected an operation and a key mapping and stored none of it —
   reportToDefinition never looked at report.externalSources. It is stored as what it is: a data
   source that reaches through a connector, with the mapping in the payload. That needs no new table,
   and the marker below is what lets a load tell it apart from a query payload. */
const EXTERNAL_MAPPING_KEY = "externalMapping";
const EXTERNAL_SOURCE_LABEL = "External REST API";

function externalSourcesOf(report, alreadyWritten) {
  return (report.externalSources || [])
    .filter(mapping => mapping && (mapping.connectorId || mapping.operation))
    .map((mapping, index) => {
      const chosen = sourceByLabel(EXTERNAL_SOURCE_LABEL);
      return {
        id: newGuid(),
        name: mapping.operation || mapping.connector || `External source ${index + 1}`,
        isPrimary: false,
        sourceType: chosen ? coded(chosen.code, chosen.label) : null,
        queryPayload: JSON.stringify({
          [EXTERNAL_MAPPING_KEY]: {
            operation: mapping.operation || "",
            crmKey: mapping.crmKey || "",
            extKey: mapping.extKey || "",
            direction: mapping.direction || "",
            pass: mapping.pass || ""
          }
        }),
        sourceAlias: `ext${index + 1}`,
        externalConnectorId: mapping.connectorId || null,
        executionOrder: alreadyWritten + index + 1,
        entityMappings: []
      };
    });
}

/** The mapping a stored payload carries, or null when it is an ordinary query. */
function externalMappingIn(queryPayload) {
  if (!queryPayload || queryPayload.indexOf(EXTERNAL_MAPPING_KEY) === -1) return null;
  try {
    const parsed = JSON.parse(queryPayload);
    return parsed && parsed[EXTERNAL_MAPPING_KEY] ? parsed[EXTERNAL_MAPPING_KEY] : null;
  } catch (error) {
    return null;
  }
}

/**
 * The @odata.bind for a data source's connector, or nothing at all when it reads Dataverse.
 * Binding an empty or unknown id would have Dataverse reject the whole source record.
 *
 * The property is the relationship's navigation name — "Qdb_externalconnectorid", capital Q — not the
 * attribute's logical name. The lowercase spelling is rejected, and because the save deletes a
 * report's children before rewriting them, that rejection left the report with none at all.
 */
function connectorBinding(connectorId) {
  return connectorId
    ? { "Qdb_externalconnectorid@odata.bind": `/qdb_externalconnectors(${connectorId})` }
    : {};
}

/**
 * Which event a control's handler should listen to.
 *
 * A search combo is an <input>, and binding it to `input` fires the handler on every keystroke. In
 * the join rows that meant re-rendering the whole step as the user typed: the box they were typing
 * into was destroyed and rebuilt, the caret and the scroll position went with it, and the page
 * appeared to jump away mid-search. A combo only has a meaningful value once something is chosen,
 * which is exactly when it raises `change`.
 */
const comboSafeEvent = input =>
  (input.tagName === "SELECT" || input.type === "checkbox" || input.dataset.combo) ? "change" : "input";

/** Drops null/undefined so an unset optional never overwrites a value with null. */
function defined(attributes) {
  const kept = {};
  for (const key of Object.keys(attributes)) {
    if (attributes[key] !== null && attributes[key] !== undefined) kept[key] = attributes[key];
  }
  return kept;
}

const codeOf = value => (value && value.code != null) ? value.code : null;
function newGuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random()*16|0; return (c==="x" ? r : (r&0x3|0x8)).toString(16);
  });
}
// Composer widget kinds/aggregations are lowercase; the API contract is PascalCase enums.
const WIDGET_KIND_MAP = { metric:"Metric", gauge:"Gauge", badge:"Badge", progress:"Progress", chart:"Chart", infocards:"InfoCards", profile:"Profile", checklist:"Checklist", matrix:"Matrix", table:"Table" };
const AGGREGATION_MAP = { sum:"Sum", average:"Average", avg:"Average", count:"Count", max:"Max", min:"Min" };
function toWidgetKind(kind) { return WIDGET_KIND_MAP[String(kind||"").toLowerCase()] || "Metric"; }
function toAggregation(agg) { return AGGREGATION_MAP[String(agg||"sum").toLowerCase()] || "Sum"; }

// Maps the composer's in-memory dashboard onto the DashboardDefinition the API persists. The id
// fields are placeholders — the server always creates a new record and assigns real ids.
function dashboardToDefinition(dashboard) {
  return {
    id: "00000000-0000-0000-0000-000000000000",
    title: dashboard.title || "Untitled dashboard",
    code: dashboard.code || null,
    description: dashboard.description || null,
    isGoverned: !!dashboard.isGoverned,
    dataSources: (dashboard.dataSources || []).map(source => ({
      id: source.id,
      name: source.name || "Source",
      sourceType: source.type || "CRM View",
      entity: source.entity || null,
      queryPayload: source.query || null,
      isPrimary: !!source.primary
    })),
    sections: (dashboard.sections || []).map(section => ({
      id: newGuid(),
      title: section.title || null,
      columns: Math.min(Math.max(section.cols || 4, 1), 4),
      widgets: (section.widgets || []).map(widget => ({
        id: newGuid(),
        kind: toWidgetKind(widget.widget),
        entity: widget.entity || "account",
        groupByAttribute: widget.groupBy || null,
        measureAttribute: widget.measure || null,
        aggregation: toAggregation(widget.agg),
        title: widget.title || null,
        chartType: widget.chartType || null,
        dataSourceId: widget.sourceId || null
      }))
    }))
  };
}
// A dashboard that was loaded from Dataverse (has savedId) updates in place (PUT); a new one is
// created (POST). This keeps edit→save a true round-trip instead of duplicating the record.
/* ---------- dashboard writer ----------
   These tables were provisioned via EntityDefinitions, which names the primary attribute
   qdb_<entity>name — so it is qdb_dashboardname, not qdb_name. Widget kind and aggregation are
   stored as strings deliberately, to avoid option-set churn as the widget catalogue grows. */

/* Widgets name their source by the id the composer generated, and the server assigns its own on
   create — so the write returns a map from one to the other for the widget rows to bind through. */
async function writeDashboardSources(dashboardId, def) {
  const idByComposerId = {};
  let sequence = 1;
  for (const source of def.dataSources || []) {
    idByComposerId[source.id] = await dvCreate("qdb_dashboarddatasource", defined({
      qdb_dashboarddatasourcename: source.name,
      qdb_sourcetype: source.sourceType,
      qdb_entity: source.entity,
      qdb_querypayload: source.queryPayload,
      qdb_isprimary: source.isPrimary,
      qdb_sequence: sequence++,
      "qdb_DashboardId@odata.bind": `/qdb_dashboards(${dashboardId})`
    }));
  }
  return idByComposerId;
}

async function deleteDashboardSources(dashboardId) {
  const sources = await dvList("qdb_dashboarddatasource",
    `?$filter=_qdb_dashboardid_value eq ${dashboardId}&$select=qdb_dashboarddatasourceid`);
  for (const source of sources) await dvDelete("qdb_dashboarddatasource", source.qdb_dashboarddatasourceid);
}

async function writeDashboardSections(dashboardId, def, sourceIdMap = {}) {
  let sectionSequence = 1;
  for (const section of def.sections || []) {
    const sectionId = await dvCreate("qdb_dashboardsection", defined({
      qdb_dashboardsectionname: section.title || "Section",
      qdb_columns: Math.min(Math.max(section.columns || 4, 1), 4),
      qdb_sequence: sectionSequence++,
      "qdb_DashboardId@odata.bind": `/qdb_dashboards(${dashboardId})`
    }));

    let widgetSequence = 1;
    for (const widget of section.widgets || []) {
      await dvCreate("qdb_dashboardwidget", defined({
        qdb_dashboardwidgetname: widget.title || widget.kind,
        qdb_kind: widget.kind,
        qdb_entity: widget.entity,
        qdb_groupby: widget.groupByAttribute,
        qdb_measure: widget.measureAttribute,
        qdb_aggregation: widget.aggregation,
        qdb_charttype: widget.chartType,
        qdb_sequence: widgetSequence++,
        "qdb_DashboardSectionId@odata.bind": `/qdb_dashboardsections(${sectionId})`,
        ...(sourceIdMap[widget.dataSourceId]
          ? { "qdb_DataSourceId@odata.bind": `/qdb_dashboarddatasources(${sourceIdMap[widget.dataSourceId]})` }
          : {})
      }));
    }
  }
}

/** Widgets before their section, so a widget never outlives the section it points at. */
async function deleteDashboardSections(dashboardId) {
  const sections = await dvList("qdb_dashboardsection",
    `?$filter=_qdb_dashboardid_value eq ${dashboardId}&$select=qdb_dashboardsectionid`);
  for (const section of sections) {
    const widgets = await dvList("qdb_dashboardwidget",
      `?$filter=_qdb_dashboardsectionid_value eq ${section.qdb_dashboardsectionid}&$select=qdb_dashboardwidgetid`);
    for (const widget of widgets) await dvDelete("qdb_dashboardwidget", widget.qdb_dashboardwidgetid);
    await dvDelete("qdb_dashboardsection", section.qdb_dashboardsectionid);
  }
}

async function saveDashboardToServer(dashboard) {
  const button = $("#dash_save");
  if (button) button.disabled = true;
  beginBusy("Saving dashboard…");
  const def = dashboardToDefinition(dashboard);
  const isUpdate = !!dashboard.savedId;
  const attributes = defined({
    qdb_dashboardname: def.title,
    qdb_dashboardcode: def.code,
    qdb_description: def.description,
    qdb_isgoverned: !!def.isGoverned
  });

  try {
    if (isUpdate) {
      // Sections hold the widgets that reference a source, so they go before the sources do.
      await deleteDashboardSections(dashboard.savedId);
      await deleteDashboardSources(dashboard.savedId);
      await dvUpdate("qdb_dashboard", dashboard.savedId, attributes);
    } else {
      dashboard.savedId = await dvCreate("qdb_dashboard", attributes);
    }
    const sourceIdMap = await writeDashboardSources(dashboard.savedId, def);
    await writeDashboardSections(dashboard.savedId, def, sourceIdMap);
    toast(isUpdate ? "Dashboard updated in Dataverse" : "Dashboard saved to Dataverse", "ok");
    dashboardCatalog.refresh();
  } catch (error) {
    toast("Save failed — " + error.message, "err");
  } finally {
    if (button) button.disabled = false;
    endBusy("Saving dashboard…");
  }
}

// Option-set codes are 100000000-based (verified against the org); aggregate "None" is omitted.
const RPT_OPERATOR_CODES = { "Equals":100000000,"Not equals":100000001,"Contains":100000002,"Begins with":100000003,"Ends with":100000004,"Greater than":100000005,"Less than":100000006,"Between":100000007,"In":100000008,"Not in":100000009,"Is null":100000010,"Is not null":100000011,"Last X days":100000012,"This month":100000013,"This year":100000014 };
const RPT_AGG_CODES = { "Sum":100000001,"Count":100000002,"Average":100000003,"Avg":100000003,"Min":100000004,"Max":100000005 };
const RPT_JOIN_CODES = { "Inner join":100000000, "Left join":100000001, "Right join":100000002, "Full join":100000003 };
const RPT_PRINCIPAL_CODES = { "User":100000000, "Team":100000001, "Security role":100000002, "Business unit":100000003 };
const RPT_PRINCIPAL_LABELS = { 100000000:"User", 100000001:"Team", 100000002:"Security role", 100000003:"Business unit" };
const RPT_JOIN_LABELS = { 100000000:"Inner join", 100000001:"Left join", 100000002:"Right join", 100000003:"Full join" };
const RPT_STATUS_CODES = { "Draft":100000000, "Published":100000001 };
function coded(code, label) { return code == null ? null : { code, label }; }

// Maps the designer's report onto the ReportDefinition the API persists. First slice: definition +
// one data source/entity mapping + visible columns + filters + parameters + layout + formulas.
// Transformations and relationships (drilldown) are not mapped yet — a documented follow-up.
function reportToDefinition(report) {
  const alias = "t";
  const rootEntity = report.mainEntity || "account";

  /* Columns say which entity they came from, so each mapping takes its own. A column with no entity
     is assumed to be on the main one, which is how single-entity reports have always behaved.

     Where a joined column belongs depends on who did the joining. A saved view supplies the whole
     query, so its linked columns ride the ROOT mapping — their own table has no mapping with join
     keys, and a mapping without them is dropped when the query is built. A join the report declares
     is the opposite: the generated query builds a link-entity for it, and the column has to sit
     inside that, or the root entity is asked for an attribute belonging to another table. */
  const joinedTables = new Set((report.joins || []).map(j => j.entity).filter(Boolean));
  const joinedByTheView = c => !!c.sourceAlias && !joinedTables.has(c.entity);
  const columnsForEntity = (entity, isRoot) => (report.columns || [])
    .filter(c => c.visible !== false)
    .filter(c => (isRoot && joinedByTheView(c))
      || (!joinedByTheView(c) && ((c.entity || rootEntity) === entity || (isRoot && !c.entity))))
    .map((c, i) => ({
      id: newGuid(),
      columnLogicalName: c.attribute || c.name,
      displayName: c.name,
      // A column taken from a view's linked table arrives under that view's own alias, so that is
      // what identifies it. Everything else is keyed by its own attribute name.
      outputAlias: c.sourceAlias || c.attribute || c.name,
      aggregateFunction: (c.agg && c.agg !== "None") ? coded(RPT_AGG_CODES[c.agg] ?? null, c.agg) : null,
      sortOrder: i + 1,
      groupOrder: 0,
      isVisible: c.visible !== false
    }));

  const columns = columnsForEntity(rootEntity, true);

  /* Each join becomes its own entity mapping. FetchXML's link-entity reads `from` as the attribute on
     the joined entity and `to` as the one on the parent, which is the reverse of how the designer
     labels them — the right key is on the entity being joined. A join missing either key is dropped
     rather than persisted half-formed. */
  const joinMappings = (report.joins || [])
    .filter(j => j.entity && j.leftKey && j.rightKey)
    .map((j, i) => ({
      id: newGuid(),
      entityLogicalName: j.entity,
      entityAlias: "j" + (i + 1),
      depth: i + 1,
      joinType: coded(RPT_JOIN_CODES[j.joinType] ?? null, j.joinType),
      joinExpressionJson: JSON.stringify({ from: j.rightKey, to: j.leftKey }),
      columns: columnsForEntity(j.entity, false)
    }));
  return {
    id: "00000000-0000-0000-0000-000000000000",
    name: report.name || "Untitled report",
    description: report.description || null,
    mainEntityLogicalName: report.mainEntity || null,
    isGoverned: !!report.governed,
    rowLimit: report.rowLimit || null,
    timeoutMs: report.timeout ? report.timeout * 1000 : null,
    category: report.category || null,
    module: report.module || null,
    status: report.status || "Draft",
    version: report.version || 1,
    dataSources: dataSourcesOf(report, alias, rootEntity, columns, joinMappings),
    filters: (report.filters || []).map((f, i) => ({
      id: newGuid(),
      fieldAlias: f.attribute,
      operator: coded(RPT_OPERATOR_CODES[f.operator] ?? null, f.operator),
      value: boundParameterOf(f) || f.value || null,
      sequence: i + 1,
      groupId: f.group != null ? String(f.group) : null,
      isRuntimePrompt: !!boundParameterOf(f)
    })),
    parameters: (report.parameters || []).map((p, i) => ({
      id: newGuid(),
      parameterName: p.name,
      label: p.prompt || p.name,
      isRequired: !!p.required,
      defaultValue: p.def || null,
      displayOrder: i + 1,
      lookupTargetEntity: p.lookup || null,
      defaultSource: CONTEXT_TOKEN_CODES[p.token] ?? null,
      paramType: PARAM_TYPE_CODES[p.type] ?? null
    })),
    formulas: (report.formulas || []).map((f, i) => ({
      id: newGuid(), formulaAlias: f.target || f.name, expression: f.expression, evaluationOrder: i + 1, isConditional: false
    })),
    /* The pipeline the runtime applies after formulas. A step whose type is not in the option set
       cannot be stored at all, so an unrecognised label is dropped here rather than failing the
       whole save — the catalogue and the option set are kept in step precisely to prevent that. */
    transformations: (report.transformations || [])
      .map((step, i) => ({ step, known: transformByLabel(step.type), typed: Number(step.seq) || i + 1 }))
      .filter(entry => entry.known)
      // Sorted by the sequence the user typed, then renumbered 1..n. The table carries a unique key
      // on (report, step order), so two steps sharing a number fail the whole save with a 412 — and
      // typing the same number twice is an easy thing to do. Their intended order is preserved.
      .sort((a, b) => a.typed - b.typed)
      .map((entry, index) => ({
        id: newGuid(),
        transformType: coded(entry.known.code, entry.known.name),
        configJson: entry.step.config || "{}",
        stepOrder: index + 1,
        enabled: true
      })),
    /* Access rules. The table has no "can view" column — only execute, export, edit and approve — so
       the designer's View checkbox is not persisted; catalog visibility follows the right to run.
       Only `canExecute` is enforced by the plugin; the rest are advisory in this architecture and
       that is stated on the tab rather than implied. */
    security: (report.security || [])
      .filter(rule => rule.ref)
      .map(rule => ({
        id: newGuid(),
        principalType: coded(RPT_PRINCIPAL_CODES[rule.ptype] ?? null, rule.ptype),
        principalIdText: rule.ref,
        canExecute: !!rule.run,
        canExport: !!rule.export,
        canEdit: !!rule.edit,
        canApprove: !!rule.approve
      })),
    // Conditional formatting rides in the layout JSON: it has no table of its own, and the as-built
    // schema already consolidates presentation concerns there rather than adding a row per rule.
    /* The canvas arrangement — which fields sit in which section, their labels and alignment — was
       built by dragging and then never written anywhere: reportToDefinition simply did not carry it,
       so a report designed on the canvas came back empty and the work was silently lost on the first
       save. It travels in the layout JSON for the same reason the formatting rules do: it is
       presentation, and the alternative is a row per field in a new table for something only the
       designer reads.
       The row is now written when there is a design even if there is no layout, or a manual report
       would still have nowhere to store it. */
    layout: (report.layout || report.design) ? {
      id: newGuid(),
      themeColor: (report.layout && report.layout.themeColor) || "#0078d4",
      layoutJson: JSON.stringify(Object.assign({}, report.layout, {
        conditionalFormatting: (report.formatting || [])
          .filter(rule => rule.column && rule.condition)
          .map(rule => ({ column: rule.column, condition: rule.condition, style: rule.style })),
        canvasDesign: report.design || null
      }))
    } : null
  };
}
/* ---------- report definition writer ---------- */

/** Definition first, then data source → entity mapping → columns, then the flat child sets. */
/**
 * Creates every child of a report. Each created record is appended to `written` so the caller can
 * undo them if a later create is rejected — Dataverse gives no transaction across these calls.
 */
async function writeReportChildren(reportId, def, written = []) {
  const create = async (entity, attributes) => {
    const id = await dvCreate(entity, attributes);
    written.push({ entity, id });
    return id;
  };
  let executionOrder = 0;
  for (const source of def.dataSources || []) {
    executionOrder++;
    const sourceId = await create("qdb_reportdatasource", defined({
      qdb_name: source.name || "Data source",
      qdb_isprimary: !!source.isPrimary,
      qdb_sourcetype: codeOf(source.sourceType),
      qdb_querypayload: source.queryPayload,
      qdb_sourcealias: source.sourceAlias,
      // Was hardcoded to 1, so a report with several sources lost the order they run in.
      qdb_executionorder: source.executionOrder || executionOrder,
      // The connector a source reaches through. This was never written, so choosing one in the
      // designer looked like configuration and was discarded on save.
      ...connectorBinding(source.externalConnectorId),
      "Qdb_reportdefinitionid@odata.bind": `/qdb_reportdefinitions(${reportId})`
    }));

    for (const mapping of source.entityMappings || []) {
      const mappingId = await create("qdb_reportentitymapping", defined({
        qdb_name: mapping.entityLogicalName || "Entity",
        qdb_entitylogicalname: mapping.entityLogicalName,
        qdb_entityalias: mapping.entityAlias,
        qdb_depth: mapping.depth || 0,
        // Join fields are absent on the root mapping, which has no parent to link to.
        qdb_jointype: codeOf(mapping.joinType),
        qdb_joinexpressionjson: mapping.joinExpressionJson,
        "Qdb_reportdatasourceid@odata.bind": `/qdb_reportdatasources(${sourceId})`
      }));

      for (const column of mapping.columns || []) {
        await create("qdb_reportcolumn", defined({
          qdb_name: column.displayName || column.outputAlias || column.columnLogicalName || "Column",
          qdb_columnlogicalname: column.columnLogicalName,
          qdb_outputalias: column.outputAlias,
          qdb_aggregatefunction: codeOf(column.aggregateFunction),
          qdb_sortorder: column.sortOrder,
          qdb_grouporder: column.groupOrder,
          qdb_isvisible: column.isVisible !== false,
          "Qdb_reportentitymappingid@odata.bind": `/qdb_reportentitymappings(${mappingId})`
        }));
      }
    }
  }

  const parent = { "Qdb_reportdefinitionid@odata.bind": `/qdb_reportdefinitions(${reportId})` };

  for (const filter of def.filters || []) {
    await create("qdb_reportfilter", defined(Object.assign({
      qdb_name: filter.fieldAlias || "Filter",
      qdb_fieldalias: filter.fieldAlias,
      qdb_operator: codeOf(filter.operator),
      qdb_value: filter.value,
      qdb_sequence: filter.sequence,
      qdb_groupid: filter.groupId,
      qdb_isruntimeprompt: !!filter.isRuntimePrompt
    }, parent)));
  }

  for (const parameter of def.parameters || []) {
    await create("qdb_reportparameter", defined(Object.assign({
      qdb_name: parameter.parameterName || parameter.label || "Parameter",
      qdb_parametername: parameter.parameterName,
      qdb_label: parameter.label,
      qdb_isrequired: !!parameter.isRequired,
      qdb_defaultvalue: parameter.defaultValue,
      qdb_displayorder: parameter.displayOrder,
      qdb_lookuptargetentity: parameter.lookupTargetEntity,
      qdb_defaultsource: parameter.defaultSource,
      qdb_paramtype: parameter.paramType
    }, parent)));
  }

  for (const formula of def.formulas || []) {
    await create("qdb_reportformula", defined(Object.assign({
      qdb_name: formula.formulaAlias || "Formula",
      qdb_formulaalias: formula.formulaAlias,
      qdb_expression: formula.expression,
      qdb_evaluationorder: formula.evaluationOrder,
      qdb_isconditional: !!formula.isConditional
    }, parent)));
  }

  for (const step of def.transformations || []) {
    await create("qdb_reporttransformation", defined(Object.assign({
      qdb_name: (step.transformType && step.transformType.label) || "Transformation",
      qdb_transformtype: codeOf(step.transformType),
      qdb_configjson: step.configJson,
      qdb_steporder: step.stepOrder,
      qdb_enabled: step.enabled !== false
    }, parent)));
  }

  for (const rule of def.security || []) {
    await create("qdb_reportsecurity", defined(Object.assign({
      qdb_name: rule.principalIdText || "Principal",
      qdb_principaltype: codeOf(rule.principalType),
      qdb_principalidtext: rule.principalIdText,
      qdb_canexecute: !!rule.canExecute,
      qdb_canexport: !!rule.canExport,
      qdb_canedit: !!rule.canEdit,
      qdb_canapprove: !!rule.canApprove
    }, parent)));
  }

  if (def.layout) {
    await create("qdb_reportlayout", defined(Object.assign({
      qdb_name: "Layout",
      qdb_themecolor: def.layout.themeColor,
      qdb_layoutjson: def.layout.layoutJson
    }, parent)));
  }
}

/** Leaf-first, so a child never outlives the parent it points at. */
/**
 * Every child record of a report, deepest first, so deleting the list in order never orphans a row.
 * Finding and deleting are separate steps because a save has to know what was there before it can
 * safely replace it.
 */
async function findReportChildren(reportId) {
  const found = [];
  // The alias comes back too: a replace has to park it and be able to put it back.
  const sources = await dvList("qdb_reportdatasource",
    byReport(reportId) + "&$select=qdb_reportdatasourceid,qdb_sourcealias");
  for (const source of sources) {
    const mappings = await dvList("qdb_reportentitymapping",
      `?$filter=_qdb_reportdatasourceid_value eq ${source.qdb_reportdatasourceid}&$select=qdb_reportentitymappingid`);
    for (const mapping of mappings) {
      const columns = await dvList("qdb_reportcolumn",
        `?$filter=_qdb_reportentitymappingid_value eq ${mapping.qdb_reportentitymappingid}&$select=qdb_reportcolumnid`);
      for (const column of columns) found.push({ entity: "qdb_reportcolumn", id: column.qdb_reportcolumnid });
      found.push({ entity: "qdb_reportentitymapping", id: mapping.qdb_reportentitymappingid });
    }
    found.push({
      entity: "qdb_reportdatasource",
      id: source.qdb_reportdatasourceid,
      sourceAlias: source.qdb_sourcealias || null
    });
  }

  const flat = [
    ["qdb_reportfilter", "qdb_reportfilterid"], ["qdb_reportparameter", "qdb_reportparameterid"],
    ["qdb_reportformula", "qdb_reportformulaid"], ["qdb_reporttransformation", "qdb_reporttransformationid"],
    ["qdb_reportrelationship", "qdb_reportrelationshipid"], ["qdb_reportsecurity", "qdb_reportsecurityid"],
    ["qdb_reportlayout", "qdb_reportlayoutid"]
  ];
  for (const [entity, idField] of flat) {
    for (const row of await dvList(entity, byReport(reportId) + `&$select=${idField}`)) {
      found.push({ entity, id: row[idField] });
    }
  }
  return found;
}

/* Category, module and status are written, not just collected. They were captured by the General tab
   and then dropped on save, so the list could only ever show them blank. */
function reportDefinitionAttributes(def) {
  return defined({
    qdb_name: def.name,
    qdb_description: def.description,
    qdb_mainentitylogicalname: def.mainEntityLogicalName,
    qdb_isgoverned: !!def.isGoverned,
    qdb_rowlimit: def.rowLimit,
    qdb_timeoutms: def.timeoutMs,
    qdb_category: reportChoiceCode("qdb_category", def.category),
    qdb_module: reportChoiceCode("qdb_module", def.module),
    qdb_status: reportChoiceCode("qdb_status", def.status),
    qdb_ispublished: def.status === "Published",
    qdb_currentversionnumber: def.version
  });
}

/* ============================ PUBLISH TO CRM (ribbon placement) ============================
   Turns the Ribbon tab's placements into an actual button on the target entity's command bar.

   Until now this tab only described what it would do — the banner named qdb_reportribbonplacement
   and nothing ever wrote a row, so a placement was configuration that did nothing at all.

   Two things are written:
     1. qdb_reportribbonplacement — which report belongs on which table and where. The record of
        intent, and what the placement list reads back.
     2. appaction rows — the command bar itself, as a three-level menu:
            Dropdown "Reports"  ->  Group  ->  one button per placed report

   WHY THE COMMANDS ARE GENERATED RATHER THAN READ AT CLICK TIME: the classic ribbon could populate
   a flyout when the user opened it, so a placement row alone was enough. Modern commands — which is
   what this org renders — cannot. Each report therefore needs its own command row, which is why
   publishing is an action here instead of a side effect of saving a row. */

const CRM_COMMAND_LOCATIONS = {
  "Entity form ribbon": { placementType: 100000000, location: 0, key: "Form" },
  "Home grid ribbon": { placementType: 100000001, location: 1, key: "MainGrid" },
  "Subgrid ribbon": { placementType: 100000002, location: 2, key: "SubGrid" }
};
// Dashboard and sitemap placements are stored but have no command-bar equivalent to generate.
const CRM_PLACEMENT_ONLY = { "Dashboard button": 100000003, "Sitemap page": 100000004 };

const RIBBON_HANDLER_WEB_RESOURCE = "qdb_reportengine_ribbon.js";
const RIBBON_ICON_WEB_RESOURCE = "qdb_reportengine_appicon.svg";
const RIBBON_HANDLER_FUNCTION = "QdbReportEngine.openReportFromCommand";

const APPACTION_TYPE = { button: 0, dropdown: 1, group: 3 };
// 21 is a literal string, 7 is PrimaryControl. Type 4 looks like a string and is contextual — it
// resolves to the record's own id on a form, which reads as a valid report id and opens the wrong thing.
const APPACTION_PARAMETER = { literalString: 21, primaryControl: 7 };

function crmClientUrl() {
  const xrm = window.Xrm || (window.parent && window.parent.Xrm) || (window.top && window.top.Xrm);
  if (!xrm || !xrm.Utility) throw new Error("Publishing needs a CRM session.");
  return xrm.Utility.getGlobalContext().getClientUrl();
}

/** Single-object metadata read: dvMetadata returns a collection and these endpoints return an entity. */
async function crmEntityMetadataId(logicalName) {
  const url = `${crmClientUrl()}/api/data/v9.2/EntityDefinitions(LogicalName='${logicalName}')?$select=MetadataId`;
  const response = await fetch(url, { headers: { Accept: "application/json" } });
  const payload = await response.json();
  if (!response.ok) throw new Error(`No table named "${logicalName}" in this environment.`);
  return payload.MetadataId;
}

async function crmPublish(path, body) {
  const response = await fetch(`${crmClientUrl()}/api/data/v9.2/${path}`, {
    method: "POST", headers: { Accept: "application/json", "Content-Type": "application/json" }, body
  });
  if (!response.ok) throw new Error(`Publish failed (${response.status}).`);
}

/* A newly created command stays invisible until a FULL publish — observed repeatedly: the rows were
   there and the command bar did not show them until PublishAllXml ran. An existing command that only
   changed is published narrowly, which returns in seconds rather than minutes and leaves everyone
   else's session alone. Nothing at all is published when nothing changed.

   The narrow form is not proven to take effect — PublishXml returns 204 for an <appactions> element
   whether or not it recognises it — so it is used only where the alternative is a full publish that
   was itself only sometimes needed. */
async function publishCommandChanges() {
  const { created, updated, deleted, touchedIds } = commandChanges;
  if (!created && !updated && !deleted) return "nothing to publish";
  if (created || deleted) {
    await crmPublish("PublishAllXml", "{}");
    return `published ${created + deleted} new or removed command(s)`;
  }
  const parameterXml = "<importexportxml><appactions>"
    + touchedIds.map(id => `<appaction>${id}</appaction>`).join("")
    + "</appactions></importexportxml>";
  await crmPublish("PublishXml", JSON.stringify({ ParameterXml: parameterXml }));
  return `published ${updated} changed command(s)`;
}

async function webResourceId(name) {
  const found = await dvList("webresource", `?$select=webresourceid&$filter=name eq '${name}'&$top=1`);
  if (!found.length) throw new Error(`${name} is not deployed to this environment.`);
  return found[0].webresourceid;
}

/* The @odata.bind key is the relationship's navigation property, which is NOT the lookup attribute
   name and is not guessable — here it is "Qdb_reportdefinitionid", capital Q and nothing else.
   Guessing yields only "undeclared property", so ask the metadata. */
let reportLookupNavigationProperty = null;
async function reportPlacementLookupProperty() {
  if (reportLookupNavigationProperty) return reportLookupNavigationProperty;
  const relationships = await dvMetadata(
    "EntityDefinitions(LogicalName='qdb_reportribbonplacement')/ManyToOneRelationships"
    + "?$select=ReferencingAttribute,ReferencingEntityNavigationPropertyName");
  const match = relationships.find(r => r.ReferencingAttribute === "qdb_reportdefinitionid");
  if (!match) throw new Error("qdb_reportribbonplacement has no report lookup relationship.");
  reportLookupNavigationProperty = match.ReferencingEntityNavigationPropertyName;
  return reportLookupNavigationProperty;
}

/* Placement rows are replaced wholesale for this report, so removing one in the UI removes it here.
   Returns the tables the report used to be placed on. The caller needs them: a table dropped from
   the Ribbon tab is no longer in the list to publish, so nothing would rebuild its command bar and
   the menu would keep an item for a report that is no longer meant to be there. */
async function writeRibbonPlacements(reportId, reportName, placements) {
  const lookupProperty = await reportPlacementLookupProperty();
  const existing = await dvList("qdb_reportribbonplacement",
    `?$select=qdb_reportribbonplacementid,qdb_entitylogicalname,qdb_placementtype`
    + `&$filter=_qdb_reportdefinitionid_value eq ${reportId}`);
  const previousTables = existing
    .filter(row => row.qdb_entitylogicalname)
    .map(row => ({ entity: row.qdb_entitylogicalname, placementType: row.qdb_placementtype }));
  for (const row of existing) await dvDelete("qdb_reportribbonplacement", row.qdb_reportribbonplacementid);

  for (const placement of placements) {
    const mapping = CRM_COMMAND_LOCATIONS[placement.loc];
    const placementType = mapping ? mapping.placementType : CRM_PLACEMENT_ONLY[placement.loc];
    if (!placementType || !placement.entity) continue;
    await dvCreate("qdb_reportribbonplacement", defined({
      qdb_name: reportName,
      qdb_entitylogicalname: placement.entity.trim().toLowerCase(),
      qdb_placementtype: placementType,
      qdb_isenabled: true,
      qdb_formidtext: placement.form || null,
      qdb_securityroleidtext: placement.role || null,
      [`${lookupProperty}@odata.bind`]: `/qdb_reportdefinitions(${reportId})`
    }));
  }
  return previousTables;
}

const commandUniqueName = (kind, entity, key, suffix) =>
  `qdb_ReportEngine.${kind}.${entity}.${key}${suffix ? "." + suffix : ""}`;

/* Publishing is the expensive part of this button. On a large organisation a full publish makes
   every user's shell recompose itself, so it has to be earned: nothing is published unless something
   actually changed, and the whole run publishes once at the end rather than per table. */
const commandChanges = { created: 0, updated: 0, deleted: 0, touchedIds: [] };

/* A lookup is written as "Name@odata.bind" and read back as "_name_value". Comparing without that
   translation makes every run look like a change, which would republish on every click — exactly
   the cost this is meant to avoid. */
function comparableCommandFields(mutableFields) {
  const scalars = {}, lookups = {};
  for (const [key, value] of Object.entries(mutableFields)) {
    if (!key.endsWith("@odata.bind")) { scalars[key] = value; continue; }
    const attribute = key.slice(0, -"@odata.bind".length).toLowerCase();
    const id = String(value).match(/\(([0-9a-fA-F-]{36})\)/);
    lookups[`_${attribute}_value`] = id ? id[1].toLowerCase() : null;
  }
  return { scalars, lookups };
}

function commandDiffers(stored, mutableFields) {
  const { scalars, lookups } = comparableCommandFields(mutableFields);
  for (const [key, value] of Object.entries(scalars)) {
    if (String(stored[key] ?? "") !== String(value ?? "")) return true;
  }
  for (const [key, value] of Object.entries(lookups)) {
    if (String(stored[key] ?? "").toLowerCase() !== String(value ?? "")) return true;
  }
  return false;
}

async function upsertCommand(uniqueName, record, mutableFields) {
  const { scalars, lookups } = comparableCommandFields(mutableFields);
  const select = ["appactionid", ...Object.keys(scalars), ...Object.keys(lookups)].join(",");
  const existing = await dvList("appaction", `?$select=${select}&$filter=uniquename eq '${uniqueName}'&$top=1`);

  if (existing.length) {
    if (!commandDiffers(existing[0], mutableFields)) return existing[0].appactionid;
    await dvUpdate("appaction", existing[0].appactionid, mutableFields);
    commandChanges.updated += 1;
    commandChanges.touchedIds.push(existing[0].appactionid);
    return existing[0].appactionid;
  }
  const id = await dvCreate("appaction", record);
  commandChanges.created += 1;
  commandChanges.touchedIds.push(id);
  return id;
}

/** Everything a command needs regardless of its level in the menu. */
function commandContext(entity, location, metadataId) {
  return {
    location,
    context: 1,
    contextvalue: entity,
    "ContextEntity@odata.bind": `/entities(${metadataId})`,
    hidden: false,
    isdisabled: false,
    visibilitytype: 0
  };
}

/* Rebuilt from the placement rows every publish, so a report removed from a table loses its menu
   item rather than lingering as a command that opens something no longer meant to be there. */
async function syncCommandsForTable(entity, mapping, resources) {
  const metadataId = await crmEntityMetadataId(entity);
  const placements = await dvList("qdb_reportribbonplacement",
    `?$select=qdb_name,_qdb_reportdefinitionid_value&$filter=qdb_entitylogicalname eq '${entity}'`
    + ` and qdb_isenabled eq true and qdb_placementtype eq ${mapping.placementType}`
    + ` and _qdb_reportdefinitionid_value ne null&$orderby=qdb_name asc`);

  const staleFilter = `?$select=appactionid&$filter=startswith(uniquename,'qdb_ReportEngine.Report')`
    + ` and contains(uniquename,'.${entity}.${mapping.key}')`;
  if (!placements.length) {
    for (const row of await dvList("appaction", staleFilter)) await dvDelete("appaction", row.appactionid);
    return 0;
  }

  const base = commandContext(entity, mapping.location, metadataId);
  const dropdownName = commandUniqueName("Reports", entity, mapping.key);
  const dropdownId = await upsertCommand(dropdownName, Object.assign({}, base, {
    name: dropdownName, uniquename: dropdownName, type: APPACTION_TYPE.dropdown,
    buttonlabeltext: "Reports", buttontooltiptitle: "Reports",
    buttontooltipdescription: "Run a Report Engine report",
    "IconWebResourceId@odata.bind": `/webresourceset(${resources.iconId})`,
    sequence: 100100050
  }), {
    buttonlabeltext: "Reports", type: APPACTION_TYPE.dropdown, hidden: false, isdisabled: false,
    "IconWebResourceId@odata.bind": `/webresourceset(${resources.iconId})`,
    onclickeventtype: 0, onclickeventjavascriptfunctionname: null, onclickeventjavascriptparameters: null
  });

  const groupName = commandUniqueName("ReportsGroup", entity, mapping.key);
  const groupId = await upsertCommand(groupName, Object.assign({}, base, {
    name: groupName, uniquename: groupName, type: APPACTION_TYPE.group,
    buttonlabeltext: "Reports", grouptitle: "Reports", sequence: 100100051,
    "ParentAppActionId@odata.bind": `/appactions(${dropdownId})`
  }), { grouptitle: "Reports", type: APPACTION_TYPE.group, hidden: false, isdisabled: false });

  let sequence = 100100052;
  for (const placement of placements) {
    const reportId = placement._qdb_reportdefinitionid_value;
    const parameters = JSON.stringify([
      { type: APPACTION_PARAMETER.literalString, value: reportId },
      { type: APPACTION_PARAMETER.primaryControl, value: null }
    ]);
    const itemName = commandUniqueName("Report", entity, mapping.key, reportId);
    await upsertCommand(itemName, Object.assign({}, base, {
      name: itemName, uniquename: itemName, type: APPACTION_TYPE.button,
      buttonlabeltext: placement.qdb_name || "Report",
      buttontooltiptitle: placement.qdb_name || "Report",
      buttontooltipdescription: "Run this report",
      "IconWebResourceId@odata.bind": `/webresourceset(${resources.iconId})`,
      sequence: sequence++,
      onclickeventtype: 2,
      onclickeventjavascriptfunctionname: RIBBON_HANDLER_FUNCTION,
      onclickeventjavascriptparameters: parameters,
      "OnClickEventJavaScriptWebResourceId@odata.bind": `/webresourceset(${resources.handlerId})`,
      "ParentAppActionId@odata.bind": `/appactions(${groupId})`
    }), {
      buttonlabeltext: placement.qdb_name || "Report", hidden: false, isdisabled: false,
      onclickeventjavascriptfunctionname: RIBBON_HANDLER_FUNCTION,
      onclickeventjavascriptparameters: parameters,
      // Re-parenting belongs in the update too: an item written against an earlier shape otherwise
      // stays attached to its old parent and never appears in the menu.
      "ParentAppActionId@odata.bind": `/appactions(${groupId})`
    });
  }
  return placements.length;
}

/** The Ribbon tab's "Publish to CRM" action: save the placements, then build the command bars. */
async function publishRibbonToCrm(report) {
  if (!report.savedId) {
    toast("Save the report first — a placement needs a report to point at.", "err");
    return;
  }
  const targets = report.ribbon.filter(p => p.entity && p.entity.trim());
  if (!targets.length) {
    toast("Add a placement with a target table first.", "err");
    return;
  }

  beginBusy("Publishing to CRM…");
  try {
    const resources = {
      handlerId: await webResourceId(RIBBON_HANDLER_WEB_RESOURCE),
      iconId: await webResourceId(RIBBON_ICON_WEB_RESOURCE)
    };
    const previousTables = await writeRibbonPlacements(report.savedId, report.name, targets);

    /* Every command bar this report touches NOW, plus every one it touched BEFORE. Without the
       second set, dropping a table from the tab leaves its menu advertising a report that no longer
       claims to be there. */
    const tables = new Map();
    const remember = (entity, mapping) => {
      if (mapping && entity) tables.set(`${entity}|${mapping.key}`, { entity, mapping });
    };
    for (const placement of targets) {
      remember(placement.entity.trim().toLowerCase(), CRM_COMMAND_LOCATIONS[placement.loc]);
    }
    const mappingByPlacementType = Object.values(CRM_COMMAND_LOCATIONS)
      .reduce((all, mapping) => Object.assign(all, { [mapping.placementType]: mapping }), {});
    for (const previous of previousTables) {
      remember(previous.entity, mappingByPlacementType[previous.placementType]);
    }

    let itemCount = 0;
    for (const { entity, mapping } of tables.values()) itemCount += await syncCommandsForTable(entity, mapping, resources);

    const publishOutcome = await publishCommandChanges();
    toast(tables.size
      ? `Saved — ${itemCount} report button(s) across ${tables.size} command bar(s); ${publishOutcome}. Refresh CRM to see them.`
      : "Placements saved. Dashboard and sitemap placements do not create a command bar button.", "ok");
  } catch (error) {
    toast("Publish failed — " + error.message, "err");
  } finally {
    endBusy("Publishing to CRM…");
  }
}

// A report loaded from Dataverse (has savedId) updates in place; a new one is created.
/**
 * Saves the report and replaces its children.
 *
 * The old children are deleted only once the new ones are safely written. Dataverse has no
 * transaction across these calls, and deleting first meant a single rejected create — one wrong
 * navigation property was enough — left the report with no columns, filters, parameters or layout at
 * all, silently, with only a toast to say so. Writing first costs a moment of duplication that
 * nothing reads, and turns a destructive failure into a no-op.
 */
async function saveReportToServer(report) {
  const def = reportToDefinition(report);
  const isUpdate = !!report.savedId;
  beginBusy(isUpdate ? "Saving report…" : "Creating report…");
  try {
    if (isUpdate) {
      const previousChildren = await findReportChildren(report.savedId);
      await dvUpdate("qdb_reportdefinition", report.savedId, reportDefinitionAttributes(def));
      await replaceReportChildren(report.savedId, def, previousChildren);
    } else {
      report.savedId = await dvCreate("qdb_reportdefinition", reportDefinitionAttributes(def));
      await writeReportChildren(report.savedId, def);
    }
    toast(isUpdate ? "Report updated in Dataverse" : "Report saved to Dataverse", "ok");
    reportCatalog.refresh();
  } catch (error) {
    toast("Save failed — " + error.message, "err");
  } finally {
    endBusy(isUpdate ? "Saving report…" : "Creating report…");
  }
}

/**
 * Replaces a report's children, and puts the old ones back if the new ones cannot be written.
 *
 * The obvious safe order — write the new rows, then delete the old — does not work here. Five of the
 * child tables carry alternate keys scoped to the report (data source alias, parameter name, formula
 * alias, transformation step, security principal), so a replacement row refuses to coexist with the
 * row it replaces. The old ones genuinely have to go first.
 *
 * What makes that survivable is keeping the definition that was stored. If the write fails, whatever
 * this call created is removed and the previous definition is written back through the same writer —
 * so a failed save ends where it started rather than leaving a report stripped of its columns,
 * filters and layout, which is exactly what used to happen.
 */
async function replaceReportChildren(reportId, def, previousChildren) {
  const previousDefinition = await loadReportDefinition(reportId);
  await deleteRecords(previousChildren);

  const written = [];
  try {
    await writeReportChildren(reportId, def, written);
  } catch (error) {
    await deleteRecords(written.reverse());
    await restorePreviousDefinition(reportId, previousDefinition);
    throw error;
  }
}

/**
 * Puts back what was stored before the failed save. It goes through the same writer, so it is
 * writing a graph that Dataverse has already accepted once. If even this fails the report really has
 * lost its children, and that must be said out loud rather than left to be discovered later.
 */
async function restorePreviousDefinition(reportId, previousDefinition) {
  try {
    await writeReportChildren(reportId, previousDefinition, []);
  } catch (error) {
    toast("The save failed AND the previous definition could not be restored. "
      + "Do not close this tab — its contents are still on screen. " + error.message, "err");
  }
}

/** Best effort: one row that refuses to delete must not fail a save that already succeeded. */
async function deleteRecords(records) {
  for (const record of records) {
    try { await dvDelete(record.entity, record.id); } catch (error) { /* already gone, or blocked */ }
  }
}

// Reverse of reportToDefinition. Starts from a full default report (so every array the designer
// touches exists) and overwrites what was persisted, so a saved report reopens ready to edit.
const RPT_AGG_LABELS = { 100000001:"Sum", 100000002:"Count", 100000003:"Average", 100000004:"Min", 100000005:"Max" };

/* The option set's own labels are PascalCase ("BeginsWith"), the designer's dropdown is written for
   people ("Begins with"). Matching them by text meant every stored filter fell back to the first
   option and was saved back as Equals — a report could be opened, saved untouched, and come out
   filtering on something else. The code is the identity; the label is presentation on either side. */
const RPT_OPERATOR_LABELS = Object.fromEntries(
  Object.entries(RPT_OPERATOR_CODES).map(([label, code]) => [code, label]));

/** The parameter a filter is bound to, or nothing — "(none)" is the picker's empty, not a name. */
function boundParameterOf(filter) {
  const bound = filter.param;
  return bound && bound !== "(none)" ? bound : "";
}

function operatorLabel(operator) {
  if (!operator) return "Equals";
  return RPT_OPERATOR_LABELS[operator.code]
    || (OPERATORS.includes(operator.label) ? operator.label : "Equals");
}
function aggLabel(aggregate) { return aggregate && aggregate.code != null ? (RPT_AGG_LABELS[aggregate.code] || "None") : "None"; }
function definitionToReport(def) {
  const report = newDefinition(null);
  report.id = def.id;
  report.savedId = def.id;
  report.name = def.name || "Untitled report";
  report.description = def.description || "";
  report.mainEntity = def.mainEntityLogicalName || report.mainEntity;
  report.governed = !!def.isGoverned;
  report.rowLimit = def.rowLimit || report.rowLimit;
  report.timeout = def.timeoutMs ? Math.round(def.timeoutMs / 1000) : report.timeout;
  report.category = def.category || "";
  report.module = def.module || "";
  report.status = def.status || "Draft";
  report.version = def.version || 1;

  const columns = [];
  (def.dataSources || []).forEach(ds => (ds.entityMappings || []).forEach(m => (m.columns || []).forEach(c => {
    // An alias that is not simply the attribute name came from a joined table, and losing it on
    // reload would turn a working column into one that looks up a key the row does not carry.
    const sourceAlias = c.outputAlias && c.outputAlias !== c.columnLogicalName ? c.outputAlias : "";
    /* The alias names the table it came from — "contact.fullname" — and that is more trustworthy
       than the mapping it happens to be filed under: a column stored against the wrong mapping would
       otherwise reload as a column of that table and be written back wrongly for ever. */
    const aliasTable = sourceAlias.includes(".") ? sourceAlias.slice(0, sourceAlias.indexOf(".")) : "";
    columns.push({ name: c.displayName || c.columnLogicalName, entity: aliasTable || m.entityLogicalName || def.mainEntityLogicalName,
      attribute: c.columnLogicalName, sourceAlias, type: "Text", format: "", width: 120, align: "Left", agg: aggLabel(c.aggregateFunction), masked: false, visible: c.isVisible !== false });
  })));
  if (columns.length) report.columns = columns;

  // Rebuild the join list from the non-root mappings — without this, reopening a multi-entity report
  // and saving it again would quietly flatten it back to a single entity.
  const joins = [];
  (def.dataSources || []).forEach(ds => (ds.entityMappings || []).forEach(m => {
    if (!m.joinExpressionJson || m.entityLogicalName === def.mainEntityLogicalName) return;
    let link = {};
    try { link = JSON.parse(m.joinExpressionJson); } catch (e) { return; }
    if (!link.from || !link.to) return;
    joins.push({
      entity: m.entityLogicalName,
      joinType: RPT_JOIN_LABELS[m.joinType && m.joinType.code] || "Inner join",
      leftKey: link.to,     // on the parent entity
      rightKey: link.from   // on the joined entity
    });
  }));
  report.joins = joins;

  if ((def.transformations || []).length) {
    report.transformations = def.transformations.map((step, i) => {
      const known = transformByCode(step.transformType && step.transformType.code);
      return {
        type: known ? (known.live ? known.label : `${known.label} — stored, not applied yet`) : TRANSFORM_TYPES[0],
        target: "",
        config: step.configJson || "{}",
        seq: step.stepOrder || i + 1
      };
    });
  }

  // View is not stored — the table has no column for it — so a loaded rule shows View ticked
  // wherever the principal may run the report, which is what catalog visibility follows.
  if ((def.security || []).length) {
    report.security = def.security.map(rule => ({
      ptype: RPT_PRINCIPAL_LABELS[rule.principalType && rule.principalType.code] || "Security role",
      ref: rule.principalIdText || "",
      view: !!rule.canExecute,
      run: !!rule.canExecute,
      export: !!rule.canExport,
      edit: !!rule.canEdit,
      approve: !!rule.canApprove
    }));
  }
  // A prompt keeps the parameter's name in the value; splitting them back out is what lets the
  // Bind parameter column show which one, instead of the word "param" over a literal.
  report.filters = (def.filters || []).map(f => ({ attribute: f.fieldAlias, operator: operatorLabel(f.operator),
    value: f.isRuntimePrompt ? "" : (f.value || ""), param: f.isRuntimePrompt ? (f.value || "") : "",
    token: "(none)", group: f.groupId ? (Number(f.groupId) || 0) : 0, andor: "And" }));
  report.parameters = (def.parameters || []).map(p => ({ name: p.parameterName, prompt: p.label || p.parameterName, type: "Text",
    required: !!p.isRequired, def: p.defaultValue || "",
    // Round-trips the binding: without this a saved "Current record ID" reopened as "(none)" and the
    // next save quietly discarded it.
    type: PARAM_TYPE_BY_CODE[p.paramType] || "Text",
    token: CONTEXT_TOKEN_BY_CODE[p.defaultSource] || "(none)",
    lookup: p.lookupTargetEntity || "" }));
  report.formulas = (def.formulas || []).map(f => ({ name: f.formulaAlias, expression: f.expression || "", type: "Number", target: f.formulaAlias }));
  // Rows carrying an external mapping go back to the card they came from, not the data-source grid.
  const stored = def.dataSources || [];
  report.externalSources = stored
    .map(ds => ({ mapping: externalMappingIn(ds.queryPayload), ds }))
    .filter(entry => entry.mapping)
    .map(entry => ({
      connectorId: entry.ds.externalConnectorId || "",
      connector: entry.ds.externalConnectorName || "",
      operation: entry.mapping.operation || "",
      crmKey: entry.mapping.crmKey || "",
      extKey: entry.mapping.extKey || "",
      direction: entry.mapping.direction || "CRM → Source",
      pass: entry.mapping.pass || ""
    }));

  report.dataSources = stored.filter(ds => !externalMappingIn(ds.queryPayload)).map(ds => {
    const known = sourceByCode(ds.sourceType && ds.sourceType.code);
    return {
      name: ds.name || "Primary source",
      type: known ? (known.live ? known.label : `${known.label} — stored, not applied yet`) : "FetchXML",
      // Both are kept: the id is what round-trips, the name is what the picker displays.
      connectorId: ds.externalConnectorId || "",
      connector: ds.externalConnectorName || "",
      alias: ds.sourceAlias || "",
      query: ds.queryPayload || "",
      primary: !!ds.isPrimary, joinL: "", joinR: ""
    };
  });
  if (def.dataSources && def.dataSources.length === 0) report.dataSources = newDefinition(null).dataSources;
  if (def.layout && def.layout.layoutJson) {
    try {
      const stored = JSON.parse(def.layout.layoutJson);
      // Formatting rules travel inside the layout JSON but belong on the report, so lift them back
      // out — otherwise reopening a report would quietly drop every rule on the next save.
      if (Array.isArray(stored.conditionalFormatting)) report.formatting = stored.conditionalFormatting;
      delete stored.conditionalFormatting;
      // Same reasoning as the formatting rules: it rides in the layout JSON but belongs on the
      // report, and leaving it inside would make the next save nest one design within another.
      if (stored.canvasDesign) report.design = stored.canvasDesign;
      delete stored.canvasDesign;
      report.layout = stored;
    } catch (e) { /* keep default layout */ }
  }
  /* A report authored anywhere but the canvas has no stored design, and the canvas renders only
     from one — so without this every existing report opens as a blank page saying "drag a field
     here" despite already having columns. Deriving one from those columns means the canvas shows
     the report that exists rather than an empty sheet. */
  if (!report.design) report.design = designFromColumns(report);
  return report;
}

/** Lays a report's declared columns out as one section, the arrangement the canvas can render. */
function designFromColumns(report) {
  const design = newDesign();
  design.header.title = report.name || "";
  const columns = (report.columns || []).filter(column => column.attribute);
  if (!columns.length) return design;

  design.tables.push({
    id: "t1",
    name: report.name || "Detail",
    entity: report.mainEntity,
    role: "master",
    parentId: null,
    displayAs: "table",
    showTotals: false,
    columns: columns.map(column => ({
      name: column.name,
      attr: column.attribute,
      type: column.type,
      entity: column.entity || report.mainEntity,
      transform: "None",
      label: column.name,
      labelPos: "left",
      align: column.align || (["Currency", "Decimal", "Whole number"].includes(column.type) ? "Right" : "Left")
    }))
  });
  return design;
}

/** Reassembles the stored graph into the ReportDefinition shape definitionToReport expects. */
async function loadReportDefinition(id) {
  const record = await dvRetrieve("qdb_reportdefinition", id,
    "?$select=qdb_reportdefinitionid,qdb_name,qdb_description,qdb_mainentitylogicalname,qdb_isgoverned,"
    + "qdb_rowlimit,qdb_timeoutms,qdb_category,qdb_module,qdb_status,qdb_ispublished,qdb_currentversionnumber");

  const [sources, filters, parameters, formulas, layouts, transformations, security] = await Promise.all([
    dvList("qdb_reportdatasource", byReport(id) + "&$select=qdb_reportdatasourceid,qdb_name,qdb_isprimary,qdb_sourcealias,qdb_sourcetype,qdb_querypayload,qdb_executionorder,_qdb_externalconnectorid_value&$orderby=qdb_executionorder"),
    dvList("qdb_reportfilter", byReport(id) + "&$select=qdb_fieldalias,qdb_operator,qdb_value,qdb_sequence,qdb_groupid,qdb_isruntimeprompt&$orderby=qdb_sequence"),
    dvList("qdb_reportparameter", byReport(id) + "&$select=qdb_parametername,qdb_label,qdb_isrequired,qdb_defaultvalue,qdb_displayorder,qdb_lookuptargetentity,qdb_defaultsource,qdb_paramtype&$orderby=qdb_displayorder"),
    dvList("qdb_reportformula", byReport(id) + "&$select=qdb_formulaalias,qdb_expression,qdb_evaluationorder&$orderby=qdb_evaluationorder"),
    dvList("qdb_reportlayout", byReport(id) + "&$select=qdb_themecolor,qdb_layoutjson"),
    dvList("qdb_reporttransformation", byReport(id)
      + "&$select=qdb_transformtype,qdb_configjson,qdb_steporder,qdb_enabled&$orderby=qdb_steporder"),
    dvList("qdb_reportsecurity", byReport(id)
      + "&$select=qdb_principaltype,qdb_principalidtext,qdb_canexecute,qdb_canexport,qdb_canedit,qdb_canapprove")
  ]);

  const dataSources = [];
  for (const source of sources) {
    const mappings = await dvList("qdb_reportentitymapping",
      `?$filter=_qdb_reportdatasourceid_value eq ${source.qdb_reportdatasourceid}`
      + "&$select=qdb_reportentitymappingid,qdb_entitylogicalname,qdb_entityalias,qdb_depth,"
      + "qdb_jointype,qdb_joinexpressionjson&$orderby=qdb_depth");

    const entityMappings = [];
    for (const mapping of mappings) {
      const columns = await dvList("qdb_reportcolumn",
        `?$filter=_qdb_reportentitymappingid_value eq ${mapping.qdb_reportentitymappingid}`
        + "&$select=qdb_name,qdb_columnlogicalname,qdb_outputalias,qdb_aggregatefunction,qdb_sortorder,qdb_grouporder,qdb_isvisible&$orderby=qdb_sortorder");
      entityMappings.push({
        id: mapping.qdb_reportentitymappingid,
        entityLogicalName: mapping.qdb_entitylogicalname,
        entityAlias: mapping.qdb_entityalias,
        depth: mapping.qdb_depth,
        joinType: mapping.qdb_jointype == null ? null : { code: mapping.qdb_jointype },
        joinExpressionJson: mapping.qdb_joinexpressionjson,
        columns: columns.map(c => ({
          columnLogicalName: c.qdb_columnlogicalname, outputAlias: c.qdb_outputalias, displayName: c.qdb_name,
          aggregateFunction: c.qdb_aggregatefunction == null ? null : { code: c.qdb_aggregatefunction },
          sortOrder: c.qdb_sortorder, groupOrder: c.qdb_grouporder, isVisible: c.qdb_isvisible !== false
        }))
      });
    }
    dataSources.push({
      id: source.qdb_reportdatasourceid, name: source.qdb_name,
      isPrimary: !!source.qdb_isprimary, sourceAlias: source.qdb_sourcealias,
      sourceType: source.qdb_sourcetype == null ? null : { code: source.qdb_sourcetype },
      queryPayload: source.qdb_querypayload,
      executionOrder: source.qdb_executionorder,
      externalConnectorId: source._qdb_externalconnectorid_value || null,
      externalConnectorName: formattedValue(source, "_qdb_externalconnectorid_value"),
      entityMappings
    });
  }

  return {
    id: record.qdb_reportdefinitionid,
    name: record.qdb_name,
