<meta charset="utf-8" />
<title>Report Engine — Designer Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* ============ Fluent / Power Platform design tokens ============ */
  :root {
    --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    --primary: #0078d4;
    --primary-hover: #106ebe;
    --primary-pressed: #005a9e;
    --primary-tint: #deecf9;
    --primary-tint-2: #eff6fc;

    --bg: #f3f2f1;
    --surface: #ffffff;
    --surface-alt: #faf9f8;
    --header-bg: #ffffff;
    --nav-bg: #f3f2f1;

    --border: #edebe9;
    --border-strong: #e1dfdd;
    --border-input: #8a8886;

    --text: #201f1e;
    --text-secondary: #605e5c;
    --text-disabled: #a19f9d;

    --success: #107c10;
    --success-bg: #dff6dd;
    --warning: #ca7c11;
    --warning-bg: #fff4ce;
    --error: #a4262c;
    --error-bg: #fde7e9;
    --neutral-chip: #f3f2f1;

    --shadow-8: 0 1.6px 3.6px rgba(0,0,0,.13), 0 .3px .9px rgba(0,0,0,.11);
    --shadow-16: 0 3.2px 7.2px rgba(0,0,0,.13), 0 .6px 1.8px rgba(0,0,0,.11);
    --shadow-64: 0 12.8px 28.8px rgba(0,0,0,.22), 0 2.4px 7.2px rgba(0,0,0,.18);
    --radius: 2px;
    --radius-lg: 4px;

    /* app header (light default = Power Platform blue bar) */
    --header-bg: #0078d4; --header-border: #005a9e;
    --header-fg: #ffffff; --header-fg-dim: rgba(255,255,255,.82);
    --header-hover: rgba(255,255,255,.16); --header-accent: rgba(255,255,255,.7);
    --header-search-bg: rgba(255,255,255,.16); --header-search-border: rgba(255,255,255,.32);
    --header-search-ph: rgba(255,255,255,.72);
    --header-avatar-bg: #ffffff; --header-avatar-fg: #0078d4;

    /* decorative full-viewport backdrop (glass / vibrant only) */
    --app-bg-image: none; --surface-blur: none;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #2899f5; --primary-hover: #3aa0f3; --primary-pressed: #1a86dc;
      --primary-tint: #0b3a5c; --primary-tint-2: #10334d;
      --bg: #1b1a19; --surface: #292827; --surface-alt: #201f1e;
      --header-bg: #201f1e; --nav-bg: #1b1a19;
      --border: #3b3a39; --border-strong: #484644; --border-input: #605e5c;
      --text: #f3f2f1; --text-secondary: #c8c6c4; --text-disabled: #797775;
      --success: #6bb700; --success-bg: #1f2e10; --warning: #fce100; --warning-bg: #3a3410;
      --error: #f1707b; --error-bg: #3a1416; --neutral-chip: #3b3a39;
      --shadow-8: 0 1.6px 3.6px rgba(0,0,0,.4); --shadow-16: 0 3.2px 7.2px rgba(0,0,0,.5);
      --shadow-64: 0 12.8px 28.8px rgba(0,0,0,.6);
      --header-bg: #141312; --header-border: #3b3a39;
      --header-fg: #f3f2f1; --header-fg-dim: rgba(243,242,241,.72);
      --header-hover: rgba(255,255,255,.08); --header-accent: #2899f5;
      --header-search-bg: rgba(255,255,255,.06); --header-search-border: rgba(255,255,255,.14);
      --header-search-ph: rgba(243,242,241,.5);
      --header-avatar-bg: #2899f5; --header-avatar-fg: #0b1a26;
    }
  }
  :root[data-theme="dark"] {
    --primary: #2899f5; --primary-hover: #3aa0f3; --primary-pressed: #1a86dc;
    --primary-tint: #0b3a5c; --primary-tint-2: #10334d;
    --bg: #1b1a19; --surface: #292827; --surface-alt: #201f1e;
    --header-bg: #201f1e; --nav-bg: #1b1a19;
    --border: #3b3a39; --border-strong: #484644; --border-input: #605e5c;
    --text: #f3f2f1; --text-secondary: #c8c6c4; --text-disabled: #797775;
    --success: #6bb700; --success-bg: #1f2e10; --warning: #fce100; --warning-bg: #3a3410;
    --error: #f1707b; --error-bg: #3a1416; --neutral-chip: #3b3a39;
    --shadow-8: 0 1.6px 3.6px rgba(0,0,0,.4); --shadow-16: 0 3.2px 7.2px rgba(0,0,0,.5);
    --shadow-64: 0 12.8px 28.8px rgba(0,0,0,.6);
    --header-bg: #141312; --header-border: #3b3a39;
    --header-fg: #f3f2f1; --header-fg-dim: rgba(243,242,241,.72);
    --header-hover: rgba(255,255,255,.08); --header-accent: #2899f5;
    --header-search-bg: rgba(255,255,255,.06); --header-search-border: rgba(255,255,255,.14);
    --header-search-ph: rgba(243,242,241,.5);
    --header-avatar-bg: #2899f5; --header-avatar-fg: #0b1a26;
  }
  :root[data-theme="light"] {
    --primary: #0078d4; --primary-hover: #106ebe; --primary-pressed: #005a9e;
    --primary-tint: #deecf9; --primary-tint-2: #eff6fc;
    --bg: #f3f2f1; --surface: #ffffff; --surface-alt: #faf9f8;
    --header-bg: #ffffff; --nav-bg: #f3f2f1;
    --border: #edebe9; --border-strong: #e1dfdd; --border-input: #8a8886;
    --text: #201f1e; --text-secondary: #605e5c; --text-disabled: #a19f9d;
    --success: #107c10; --success-bg: #dff6dd; --warning: #ca7c11; --warning-bg: #fff4ce;
    --error: #a4262c; --error-bg: #fde7e9; --neutral-chip: #f3f2f1;
    --header-bg: #0078d4; --header-border: #005a9e;
    --header-fg: #ffffff; --header-fg-dim: rgba(255,255,255,.82);
    --header-hover: rgba(255,255,255,.16); --header-accent: rgba(255,255,255,.7);
    --header-search-bg: rgba(255,255,255,.16); --header-search-border: rgba(255,255,255,.32);
    --header-search-ph: rgba(255,255,255,.72);
    --header-avatar-bg: #ffffff; --header-avatar-fg: #0078d4;
    --app-bg-image: none; --surface-blur: none;
  }

  /* ---- Glass: frosted glassmorphism over a soft pastel mesh ---- */
  :root[data-theme="glass"] {
    --primary: #5b5bd6; --primary-hover: #4d4dc7; --primary-pressed: #3f3fb0;
    --primary-tint: rgba(91,91,214,.18); --primary-tint-2: rgba(91,91,214,.10);
    --bg: rgba(248,250,255,.30); --surface: rgba(255,255,255,.55); --surface-alt: rgba(255,255,255,.38);
    --nav-bg: rgba(255,255,255,.28);
    --border: rgba(255,255,255,.55); --border-strong: rgba(255,255,255,.72); --border-input: rgba(110,110,150,.45);
    --text: #1c1c2e; --text-secondary: #494963; --text-disabled: #9a9ab0;
    --success: #0f7a4f; --success-bg: rgba(16,124,74,.16); --warning: #b5730a; --warning-bg: rgba(202,124,17,.16);
    --error: #c0392b; --error-bg: rgba(164,38,44,.16); --neutral-chip: rgba(120,120,150,.14);
    --shadow-8: 0 4px 16px rgba(31,38,90,.10); --shadow-16: 0 8px 28px rgba(31,38,90,.14);
    --shadow-64: 0 24px 60px rgba(31,38,90,.24);
    --radius: 8px; --radius-lg: 16px;
    --app-bg-image: linear-gradient(135deg, #c2e9fb 0%, #e0c3fc 46%, #ffd3e0 100%);
    --surface-blur: saturate(1.5) blur(16px);
    --header-bg: rgba(255,255,255,.32); --header-border: rgba(255,255,255,.5);
    --header-fg: #1c1c2e; --header-fg-dim: rgba(28,28,46,.66);
    --header-hover: rgba(255,255,255,.55); --header-accent: #5b5bd6;
    --header-search-bg: rgba(255,255,255,.5); --header-search-border: rgba(255,255,255,.62);
    --header-search-ph: rgba(28,28,46,.5);
    --header-avatar-bg: #5b5bd6; --header-avatar-fg: #ffffff;
  }

  /* ---- Vibrant: bold saturated gradient with punchy violet accents ---- */
  :root[data-theme="vibrant"] {
    --primary: #7c3aed; --primary-hover: #6d28d9; --primary-pressed: #5b21b6;
    --primary-tint: #ede9fe; --primary-tint-2: #f5f3ff;
    --bg: rgba(250,248,255,.82); --surface: #ffffff; --surface-alt: #f7f5ff;
    --nav-bg: rgba(255,255,255,.55);
    --border: rgba(124,58,237,.14); --border-strong: rgba(124,58,237,.24); --border-input: #b9a7e8;
    --text: #1e1b2e; --text-secondary: #5a5470; --text-disabled: #a99fc0;
    --success: #0f9d58; --success-bg: #e3f7ec; --warning: #d97706; --warning-bg: #fef3e2;
    --error: #e11d48; --error-bg: #fde7ec; --neutral-chip: #efeafc;
    --shadow-8: 0 6px 18px rgba(124,58,237,.16); --shadow-16: 0 10px 30px rgba(124,58,237,.20);
    --shadow-64: 0 26px 64px rgba(124,58,237,.32);
    --radius: 8px; --radius-lg: 16px;
    --app-bg-image: linear-gradient(135deg, #6366f1 0%, #a855f7 40%, #ec4899 74%, #f59e0b 100%);
    --surface-blur: saturate(1.4) blur(14px);
    --header-bg: linear-gradient(90deg, #7c3aed 0%, #db2777 100%); --header-border: rgba(255,255,255,.22);
    --header-fg: #ffffff; --header-fg-dim: rgba(255,255,255,.85);
    --header-hover: rgba(255,255,255,.2); --header-accent: rgba(255,255,255,.85);
    --header-search-bg: rgba(255,255,255,.2); --header-search-border: rgba(255,255,255,.4);
    --header-search-ph: rgba(255,255,255,.75);
    --header-avatar-bg: #ffffff; --header-avatar-fg: #7c3aed;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--font); color: var(--text);
    background-color: var(--bg); background-image: var(--app-bg-image);
    background-attachment: fixed; background-size: cover; background-position: center;
    font-size: 14px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4 { margin: 0; font-weight: 600; text-wrap: balance; }
  button { font-family: inherit; }
  a { color: var(--primary); }

  /* ============ App shell ============ */
  .app { display: grid; grid-template-rows: 48px 1fr; height: 100vh; overflow: hidden; }

  .app-header {
    display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 4px;
    background: var(--header-bg); border-bottom: 1px solid var(--border-strong);
    position: relative; z-index: 30;
  }
  .waffle, .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border: none; background: transparent; cursor: pointer;
    color: var(--text-secondary); border-radius: var(--radius);
  }
  .waffle:hover, .icon-btn:hover { background: var(--surface-alt); color: var(--text); }
  .app-title { display: flex; align-items: baseline; gap: 10px; padding-left: 4px; }
  .app-title .env { color: var(--text-secondary); font-weight: 400; }
  .app-title .name { font-weight: 600; font-size: 16px; }
  .app-title .name::after { content: ""; }
  .header-accent { width: 3px; height: 24px; background: var(--primary); border-radius: 2px; margin: 0 4px; }
  .header-spacer { flex: 1; }
  .header-search {
    display: flex; align-items: center; gap: 6px; height: 32px; width: 320px; max-width: 34vw;
    background: var(--surface-alt); border: 1px solid var(--border-strong); border-radius: var(--radius);
    padding: 0 10px; color: var(--text-secondary);
  }
  .header-search input { border: none; background: transparent; outline: none; color: var(--text); width: 100%; font-size: 13px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    margin-left: 4px;
  }
  /* Theme-driven top app bar — colours come from --header-* tokens per theme */
  .app-header { background: var(--header-bg); border-bottom: 1px solid var(--header-border); }
  .app-header .waffle, .app-header .icon-btn { color: var(--header-fg-dim); }
  .app-header .waffle:hover, .app-header .icon-btn:hover { background: var(--header-hover); color: var(--header-fg); }
  .app-header .app-title .env { color: var(--header-fg-dim); }
  .app-header .app-title .name { color: var(--header-fg); }
  .app-header .header-accent { background: var(--header-accent); }
  .app-header .header-search { background: var(--header-search-bg); border-color: var(--header-search-border); color: var(--header-fg); }
  .app-header .header-search input { color: var(--header-fg); }
  .app-header .header-search input::placeholder { color: var(--header-search-ph); }
  .app-header .avatar { background: var(--header-avatar-bg); color: var(--header-avatar-fg); }

  /* Frosted surfaces — glass & vibrant paint --surface-blur onto the chrome */
  [data-theme="glass"] .app-header, [data-theme="vibrant"] .app-header,
  [data-theme="glass"] .nav, [data-theme="vibrant"] .nav,
  [data-theme="glass"] .cmdbar, [data-theme="vibrant"] .cmdbar,
  [data-theme="glass"] .pivot, [data-theme="vibrant"] .pivot,
  [data-theme="glass"] .grid-wrap, [data-theme="vibrant"] .grid-wrap,
  [data-theme="glass"] .section-card, [data-theme="vibrant"] .section-card,
  [data-theme="glass"] .theme-menu, [data-theme="vibrant"] .theme-menu {
    -webkit-backdrop-filter: var(--surface-blur); backdrop-filter: var(--surface-blur);
  }

  /* Theme picker menu (opened from the header palette button) */
  .theme-menu {
    position: absolute; top: 46px; right: 8px; z-index: 60; width: 244px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-64); padding: 6px; display: none;
  }
  .theme-menu.open { display: block; animation: pop .14s ease; }
  .theme-menu .tm-h {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-secondary);
    font-weight: 700; padding: 8px 8px 6px;
  }
  .theme-opt {
    display: flex; align-items: center; gap: 11px; padding: 8px; border-radius: var(--radius);
    cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
    color: var(--text); font-family: inherit; font-size: 13.5px;
  }
  .theme-opt:hover { background: var(--surface-alt); }
  .theme-opt .sw { width: 36px; height: 24px; border-radius: 6px; border: 1px solid rgba(0,0,0,.14); flex-shrink: 0; }
  .theme-opt .tm-txt { flex: 1; min-width: 0; }
  .theme-opt .tm-name { font-weight: 600; }
  .theme-opt .tm-desc { font-size: 11.5px; color: var(--text-secondary); }
  .theme-opt .chk { flex-shrink: 0; opacity: 0; color: var(--primary); }
  .theme-opt.sel .chk { opacity: 1; }
  .sw-light { background: linear-gradient(135deg, #ffffff 50%, #0078d4 50%); }
  .sw-dark { background: linear-gradient(135deg, #292827 50%, #2899f5 50%); }
  .sw-glass { background: linear-gradient(135deg, #c2e9fb, #e0c3fc 55%, #ffd3e0); }
  .sw-vibrant { background: linear-gradient(135deg, #7c3aed, #ec4899 60%, #f59e0b); }

  .body { display: grid; grid-template-columns: auto 1fr; min-height: 0; }

  /* ============ Sitemap nav ============ */
  .nav {
    background: var(--nav-bg); border-right: 1px solid var(--border);
    width: 240px; transition: width .15s ease; overflow-y: auto; overflow-x: hidden;
    padding: 8px 0; flex-shrink: 0;
  }
  .nav.collapsed { width: 48px; }
  .nav-group-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-secondary);
    padding: 12px 16px 4px; font-weight: 600; white-space: nowrap;
  }
  .nav.collapsed .nav-group-label { opacity: 0; height: 8px; padding: 0; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 36px; cursor: pointer;
    color: var(--text); border: none; background: transparent; width: 100%; text-align: left;
    font-size: 14px; position: relative; white-space: nowrap;
  }
  .nav-item:hover { background: var(--surface-alt); }
  .nav-item.active { background: var(--primary-tint-2); font-weight: 600; }
  .nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px;
    background: var(--primary); border-radius: 0 2px 2px 0;
  }
  .nav-item svg { flex-shrink: 0; }
  .nav.collapsed .nav-item span { opacity: 0; }

  /* ============ Content region ============ */
  .content { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }

  .cmdbar {
    display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px;
    background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto;
  }
  .cmd {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: none;
    background: transparent; color: var(--text); cursor: pointer; border-radius: var(--radius);
    font-size: 13px; white-space: nowrap;
  }
  .cmd:hover { background: var(--surface-alt); }
  .cmd:disabled { color: var(--text-disabled); cursor: default; }
  .cmd:disabled:hover { background: transparent; }
  .cmd.primary { color: var(--primary); font-weight: 600; }
  .cmd-sep { width: 1px; height: 20px; background: var(--border-strong); margin: 0 4px; flex-shrink: 0; }
  .cmd-spacer { flex: 1; }

  .scroll { overflow: auto; flex: 1; min-height: 0; }
  .page { padding: 16px 20px 20px; max-width: none; width: 100%; display: flex; flex-direction: column; min-height: 100%; }
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; }
  .page-sub { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }

  /* ============ Dataverse grid ============ */
  .grid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: auto; flex: 1; min-height: 0; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.grid thead th {
    text-align: left; font-weight: 600; color: var(--text-secondary); padding: 8px 12px; height: 40px;
    border-bottom: 1px solid var(--border-strong); background: var(--surface); position: sticky; top: 0;
    white-space: nowrap; font-size: 12px;
  }
  table.grid tbody td { padding: 8px 12px; border-bottom: 1px solid var(--border); height: 44px; vertical-align: middle; }
  table.grid tbody tr:hover { background: var(--primary-tint-2); }
  table.grid tbody tr.selected { background: var(--primary-tint); }
  table.grid .num { text-align: right; font-variant-numeric: tabular-nums; }
  .link-cell { color: var(--primary); font-weight: 600; cursor: pointer; }
  .link-cell:hover { text-decoration: underline; }
  .row-check { width: 36px; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 11px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
  .pill.published { background: var(--success-bg); color: var(--success); }
  .pill.draft { background: var(--neutral-chip); color: var(--text-secondary); }
  .pill.unpublished { background: var(--warning-bg); color: var(--warning); }
  .pill.archived { background: var(--neutral-chip); color: var(--text-disabled); }
  .pill.success { background: var(--success-bg); color: var(--success); }
  .pill.partial { background: var(--warning-bg); color: var(--warning); }
  .pill.failed { background: var(--error-bg); color: var(--error); }

  /* ============ Designer form / pivot ============ */
  .designer { display: grid; grid-template-columns: 1fr; min-height: 0; height: 100%; }
  .pivot {
    display: flex; gap: 2px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    overflow-x: auto; flex-shrink: 0;
  }
  .pivot-tab {
    border: none; background: transparent; padding: 12px 12px 10px; font-size: 14px; color: var(--text-secondary);
    cursor: pointer; position: relative; white-space: nowrap; font-family: inherit;
  }
  .pivot-tab:hover { color: var(--text); }
  .pivot-tab.active { color: var(--primary); font-weight: 600; }
  .pivot-tab.active::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--primary);
  }
  .pivot-tab .badge {
    display: inline-block; min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 5px;
    background: var(--neutral-chip); color: var(--text-secondary); border-radius: 9px; font-size: 11px; margin-left: 6px;
    font-weight: 600;
  }
  .pivot-tab.active .badge { background: var(--primary-tint); color: var(--primary); }

  .tab-body { padding: 20px; }
  .section-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow-8);
  }
  .section-card > h3 { font-size: 15px; margin-bottom: 4px; }
  .section-card > .hint { color: var(--text-secondary); font-size: 12.5px; margin-bottom: 14px; }
  .rel-tag {
    display: inline-block; font-size: 11px; color: var(--text-secondary); background: var(--surface-alt);
    border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; margin-left: 8px; font-weight: 400;
    vertical-align: middle;
  }

  /* form fields */
  .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px 18px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.col-2 { grid-column: span 2; }
  label.lbl { font-size: 13px; font-weight: 600; color: var(--text); }
  label.lbl .req { color: var(--error); margin-left: 2px; }
  .fluent-input, .fluent-select, textarea.fluent-input {
    height: 32px; border: 1px solid var(--border-input); border-bottom-width: 1px; border-radius: var(--radius);
    background: var(--surface); color: var(--text); padding: 0 8px; font-size: 14px; font-family: inherit;
    outline: none; width: 100%;
  }
  textarea.fluent-input { height: auto; padding: 6px 8px; resize: vertical; min-height: 60px; }
  .fluent-input:focus, .fluent-select:focus, textarea.fluent-input:focus {
    border-color: var(--primary); border-bottom-width: 2px; padding-bottom: 0;
  }
  .fluent-select { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23605e5c' fill='none' stroke-width='1.4'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 26px; cursor: pointer; }
  .hint-inline { font-size: 11.5px; color: var(--text-secondary); }
  .fluent-input.badjson { border-color: var(--error); border-bottom-width: 2px; }
  .fluent-input.badjson:focus { border-color: var(--error); }

  /* toggle */
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .toggle input { display: none; }
  .toggle .track { width: 40px; height: 20px; border-radius: 10px; background: var(--border-input); position: relative; transition: background .12s; }
  .toggle .track::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff; top: 4px; left: 4px; transition: left .12s; }
  .toggle input:checked + .track { background: var(--primary); }
  .toggle input:checked + .track::after { left: 24px; }
  .toggle .tlabel { font-size: 13px; }

  /* editable sub-grid tables */
  .subgrid { width: 100%; border-collapse: collapse; font-size: 13px; }
  .subgrid th { text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
  .subgrid td { padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .subgrid tr:hover td { background: var(--surface-alt); }
  .subgrid .fluent-input, .subgrid .fluent-select { height: 28px; font-size: 13px; }
  .subgrid .del { color: var(--error); cursor: pointer; border: none; background: transparent; padding: 4px; border-radius: 3px; }
  .subgrid .del:hover { background: var(--error-bg); }
  .subgrid .handle { color: var(--text-disabled); cursor: grab; }
  .empty-row td { color: var(--text-secondary); text-align: center; padding: 18px; font-style: italic; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--border-input); background: var(--surface); color: var(--text); cursor: pointer;
    font-size: 14px; font-family: inherit;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
  .btn-add { margin-top: 12px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border-radius: 14px;
    background: var(--primary-tint-2); border: 1px solid var(--border-strong); font-size: 13px; color: var(--text);
  }
  .chip .x { border: none; background: transparent; cursor: pointer; color: var(--text-secondary); width: 20px; height: 20px; border-radius: 50%; }
  .chip .x:hover { background: var(--border-strong); }

  /* two-column designer: form + preview */
  .split { display: grid; grid-template-columns: 1fr; gap: 0; }

  /* preview render */
  .preview-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .report-paper {
    background: #fff; color: #201f1e; border: 1px solid var(--border-strong); border-radius: var(--radius);
    box-shadow: var(--shadow-16); padding: 28px 32px; max-width: 900px; margin: 0 auto;
    --ac:#0078d4; --acd:#005a9e; --acb:#eff6fc; --acb2:#deecf9; --acl:#cfe4f7;
    font-family: var(--rp-font, "Segoe UI", sans-serif);
  }
  .report-paper[dir="rtl"] { text-align: right; }
  :root[data-theme="dark"] .report-paper, [data-theme="dark"] .report-paper { background: #fbfbfa; }
  .rp-head { display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 2px solid var(--ac); padding-bottom: 12px; margin-bottom: 6px; }
  .rp-logo { width: 40px; height: 40px; border-radius: 6px; background: var(--ac); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
  .rp-title { font-size: 18px; font-weight: 700; color: #201f1e; }
  .rp-meta { font-size: 11px; color: #605e5c; text-align: right; }
  .rp-params { font-size: 11.5px; color: #605e5c; margin: 10px 0; display: flex; gap: 14px; flex-wrap: wrap; }
  .rp-params .k { font-weight: 600; color: #323130; }
  table.rp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; color: #201f1e; margin-top: 8px; }
  table.rp-table th { background: #f3f2f1; text-align: left; padding: 7px 10px; border-bottom: 1px solid #c8c6c4; font-size: 11.5px; color: #323130; }
  table.rp-table td { padding: 6px 10px; border-bottom: 1px solid #edebe9; }
  table.rp-table td.num, table.rp-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.group-head td { background: var(--acb); font-weight: 700; color: var(--acd); border-top: 1px solid #c8c6c4; }
  tr.group-total td { font-weight: 600; background: #faf9f8; }
  tr.grand-total td { font-weight: 700; background: var(--acb2); border-top: 2px solid var(--ac); color: #201f1e; }
  .rp-foot { display: flex; justify-content: space-between; font-size: 10.5px; color: #605e5c; border-top: 1px solid #edebe9; margin-top: 14px; padding-top: 8px; }
  .watermark-note { text-align: center; color: #a19f9d; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; }
  /* ============ "Modern page" render mode ============ */
  .report-paper.render-modern { background: #f4f6fb; border: none; box-shadow: none; padding: 20px; border-radius: 14px; }
  .report-paper.render-modern .rp-head { background: linear-gradient(120deg, var(--ac), var(--acd)); color: #fff; border: none; border-radius: 14px; padding: 26px 30px; margin-bottom: 18px; box-shadow: 0 10px 26px rgba(0,0,0,.14); }
  .report-paper.render-modern .rp-head .rp-title { color: #fff; font-size: 26px; }
  .report-paper.render-modern .rp-head .rp-meta { color: rgba(255,255,255,.9); }
  .report-paper.render-modern .rp-head div[style*="605e5c"] { color: rgba(255,255,255,.85) !important; }
  .report-paper.render-modern .rp-logo { background: rgba(255,255,255,.22); }
  .report-paper.render-modern .rp-params { background: #fff; border-radius: 12px; padding: 12px 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .report-paper.render-modern table.rp-table { background: #fff; border-radius: 12px; overflow: hidden; border-collapse: separate; border-spacing: 0; box-shadow: 0 2px 14px rgba(0,0,0,.06); margin-top: 6px; }
  .report-paper.render-modern table.rp-table th { background: var(--acb); color: var(--acd); border: none; padding: 12px 14px; }
  .report-paper.render-modern table.rp-table td { border: none; border-top: 1px solid #eef1f6; padding: 11px 14px; }
  .report-paper.render-modern tr.group-head td { background: transparent; color: var(--acd); font-size: 14.5px; border-top: none; padding-top: 14px; }
  .report-paper.render-modern tr.grand-total td { background: var(--acb); }
  .report-paper.render-modern .drop-zone-label { font-size: 15px; color: var(--acd); font-weight: 700; text-transform: none; letter-spacing: 0; margin: 18px 4px 8px; }
  .report-paper.render-modern .cv-section { background: #fff; border: none; border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.06); padding: 12px 16px; margin: 12px 0; }
  .report-paper.render-modern .cv-hdrgrid { gap: 10px 22px; }
  .report-paper.render-modern .cv-field { border-radius: 8px; }

  /* ============ "Minimal" render mode — editorial, borderless, monochrome ============ */
  .report-paper.render-minimal { background: #fff; border: none; box-shadow: none; padding: 30px 34px; border-radius: 0; }
  .report-paper.render-minimal .rp-head { border-bottom: 1px solid #e6e6e6; padding-bottom: 14px; }
  .report-paper.render-minimal .rp-logo { background: transparent; color: var(--ac); border: 1.5px solid var(--ac); }
  .report-paper.render-minimal .rp-title { font-weight: 600; letter-spacing: -.2px; }
  .report-paper.render-minimal table.rp-table th { background: transparent; color: #8a8886; text-transform: uppercase; letter-spacing: .6px; font-size: 10.5px; border-bottom: 1px solid #e6e6e6; }
  .report-paper.render-minimal table.rp-table td { border-bottom: 1px solid #f2f2f2; }
  .report-paper.render-minimal tr.group-head td { background: transparent; color: #201f1e; border-top: none; padding-top: 14px; }
  .report-paper.render-minimal tr.group-total td { background: transparent; }
  .report-paper.render-minimal tr.grand-total td { background: transparent; border-top: 2px solid #201f1e; color: #201f1e; }
  .report-paper.render-minimal .kpi-tile { background: transparent; box-shadow: none; border: none; border-left: 2px solid #e6e6e6; border-radius: 0; }
  .report-paper.render-minimal .cv-section { background: transparent; border: none; border-top: 1px solid #f2f2f2; border-radius: 0; box-shadow: none; }

  /* ============ "Dark" render mode — slate paper, light ink (overrides inline light colours) ============ */
  .report-paper.render-dark { background: #14171f; color: #dfe4ec; border: 1px solid #262b36; box-shadow: 0 12px 34px rgba(0,0,0,.42); border-radius: 12px; padding: 24px 28px; }
  :root[data-theme="dark"] .report-paper.render-dark, [data-theme="dark"] .report-paper.render-dark { background: #14171f; }
  .report-paper.render-dark .rp-head { border-bottom-color: var(--ac); }
  .report-paper.render-dark .rp-title { color: #f4f7fb; }
  .report-paper.render-dark .rp-logo { color: #fff; }
  .report-paper.render-dark [style*="605e5c"], .report-paper.render-dark .rp-meta,
  .report-paper.render-dark .rp-params, .report-paper.render-dark .rp-foot,
  .report-paper.render-dark .watermark-note, .report-paper.render-dark .kpi-label { color: #9aa6b8 !important; }
  .report-paper.render-dark [style*="323130"], .report-paper.render-dark .rp-params .k { color: #c6d0de !important; }
  .report-paper.render-dark [style*="201f1e"] { color: #e6ebf2 !important; }
  .report-paper.render-dark table.rp-table { color: #dfe4ec; }
  .report-paper.render-dark table.rp-table th { background: #1c2029; color: #aeb9c9; border-bottom: 1px solid #2c3340; }
  .report-paper.render-dark table.rp-table td { border-bottom: 1px solid #232936; }
  .report-paper.render-dark tr.group-head td { background: rgba(255,255,255,.04); color: var(--acl); border-top: 1px solid #2c3340; }
  .report-paper.render-dark tr.group-total td { background: rgba(255,255,255,.03); }
  .report-paper.render-dark tr.grand-total td { background: rgba(255,255,255,.06); color: #f4f7fb; border-top: 2px solid var(--ac); }
  .report-paper.render-dark .cv-section { background: #1c2029; border-color: #2c3340; }
  .report-paper.render-dark .kpi-tile { background: #1c2029; box-shadow: none; border-left-color: var(--ac); }
  .report-paper.render-dark [style*="dashed"] { border-color: #3a4150 !important; }

  /* ============ "Glass" render mode — frosted panels over a soft gradient ============ */
  .report-paper.render-glass { background: linear-gradient(135deg, #e0e7ff 0%, #f5e1f7 50%, #e0f2fe 100%); border: 1px solid rgba(255,255,255,.6); box-shadow: 0 14px 40px rgba(80,80,140,.18); padding: 22px; border-radius: 18px; }
  .report-paper.render-glass .rp-head { background: rgba(255,255,255,.5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.6); border-radius: 14px; padding: 20px 24px; margin-bottom: 16px; }
  .report-paper.render-glass .rp-logo { background: rgba(255,255,255,.6); color: var(--acd); }
  .report-paper.render-glass .rp-params, .report-paper.render-glass .cv-section, .report-paper.render-glass .kpi-tile { background: rgba(255,255,255,.5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.55); border-radius: 14px; box-shadow: none; }
  .report-paper.render-glass table.rp-table { background: rgba(255,255,255,.5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.55); border-radius: 14px; overflow: hidden; border-collapse: separate; border-spacing: 0; margin-top: 8px; }
  .report-paper.render-glass table.rp-table th { background: rgba(255,255,255,.35); color: var(--acd); border: none; border-bottom: 1px solid rgba(255,255,255,.5); padding: 11px 14px; }
  .report-paper.render-glass table.rp-table td { border: none; border-top: 1px solid rgba(255,255,255,.45); padding: 10px 14px; }
  .report-paper.render-glass tr.group-head td { background: rgba(255,255,255,.32); color: var(--acd); border-top: none; }
  .report-paper.render-glass tr.grand-total td { background: rgba(255,255,255,.42); }

  /* ============ "Vibrant" render mode — bold saturated gradient, punchy accents ============ */
  .report-paper.render-vibrant { background: #faf7ff; border: none; box-shadow: 0 12px 34px rgba(124,58,237,.16); padding: 20px; border-radius: 18px; }
  .report-paper.render-vibrant .rp-head { background: linear-gradient(120deg, #7c3aed 0%, #db2777 55%, #f59e0b 120%); color: #fff; border: none; border-radius: 16px; padding: 26px 30px; margin-bottom: 18px; box-shadow: 0 12px 30px rgba(124,58,237,.3); }
  .report-paper.render-vibrant .rp-head .rp-title { color: #fff; font-size: 26px; }
  .report-paper.render-vibrant .rp-head .rp-meta { color: rgba(255,255,255,.9); }
  .report-paper.render-vibrant .rp-head [style*="605e5c"] { color: rgba(255,255,255,.85) !important; }
  .report-paper.render-vibrant .rp-logo { background: rgba(255,255,255,.25); color: #fff; }
  .report-paper.render-vibrant .rp-params { background: #fff; border-radius: 12px; padding: 12px 16px; box-shadow: 0 3px 12px rgba(124,58,237,.08); }
  .report-paper.render-vibrant table.rp-table { background: #fff; border-radius: 14px; overflow: hidden; border-collapse: separate; border-spacing: 0; box-shadow: 0 4px 18px rgba(124,58,237,.1); margin-top: 6px; }
  .report-paper.render-vibrant table.rp-table th { background: linear-gradient(90deg, #7c3aed, #db2777); color: #fff; border: none; padding: 12px 14px; }
  .report-paper.render-vibrant table.rp-table td { border: none; border-top: 1px solid #f1e9fb; padding: 11px 14px; }
  .report-paper.render-vibrant tr.group-head td { background: #f5f0ff; color: #7c3aed; border-top: none; padding-top: 14px; }
  .report-paper.render-vibrant tr.grand-total td { background: #f5f0ff; color: #6d28d9; border-top: 2px solid #7c3aed; }
  .report-paper.render-vibrant .cv-section { background: #fff; border: none; border-radius: 14px; box-shadow: 0 4px 18px rgba(124,58,237,.1); }
  .report-paper.render-vibrant .kpi-tile { background: #fff; border-left: 4px solid #db2777; box-shadow: 0 4px 18px rgba(124,58,237,.1); }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 18px; }
  .kpi-tile { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 2px 14px rgba(0,0,0,.06); border-left: 4px solid var(--ac); }
  .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #8a8886; font-weight: 600; }
  .kpi-value { font-size: 23px; font-weight: 800; color: var(--acd); margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* ============ Charts (table-driven, click to drill) ============ */
  .chart-wrap { margin: 6px 0 4px; }
  .chart-hint { font-size: 11px; color: #605e5c; margin-top: 8px; }
  .chart-cols { display: flex; align-items: flex-end; gap: 10px; height: 200px; padding: 6px 4px 0; }
  .chart-col { flex: 1; min-width: 24px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; border: none; background: transparent; cursor: pointer; font-family: inherit; padding: 0; }
  .chart-col .col-bar { width: 100%; max-width: 54px; border-radius: 6px 6px 0 0; transition: opacity .12s, transform .12s; min-height: 3px; }
  .chart-col:hover .col-bar { opacity: .82; transform: translateY(-2px); }
  .chart-col .col-val { font-size: 11px; font-weight: 700; color: #323130; font-variant-numeric: tabular-nums; }
  .chart-col .col-lbl { font-size: 10.5px; color: #605e5c; text-align: center; line-height: 1.2; word-break: break-word; }
  .chart-bars { display: flex; flex-direction: column; gap: 8px; }
  .chart-bar-row { display: flex; align-items: center; gap: 10px; border: none; background: transparent; cursor: pointer; font-family: inherit; padding: 2px; border-radius: 4px; text-align: left; width: 100%; }
  .chart-bar-row:hover { background: var(--acb); }
  .chart-bar-row .bl { width: 100px; font-size: 11.5px; color: #323130; flex-shrink: 0; }
  .chart-bar-row .bt { flex: 1; background: var(--acb); border-radius: 4px; overflow: hidden; }
  .chart-bar-row .bf { height: 16px; border-radius: 4px; }
  .chart-bar-row .bv { width: 116px; text-align: right; font-size: 11.5px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .chart-svg-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .chart-svg { overflow: visible; }
  .chart-svg .slice, .chart-svg .pt { cursor: pointer; transition: opacity .12s; }
  .chart-svg .slice:hover { opacity: .82; }
  .chart-legend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .chart-legend button { display: flex; align-items: center; gap: 8px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 12px; color: var(--text); padding: 2px 4px; border-radius: 4px; text-align: left; }
  .chart-legend button:hover { background: var(--acb); }
  .chart-legend .dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .chart-legend .lv { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; padding-left: 12px; }
  .drill-panel { margin-top: 16px; border-top: 1px dashed var(--border-strong); padding-top: 12px; }
  .drill-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .drill-head .dt { font-size: 12.5px; font-weight: 700; color: var(--acd); }
  .drill-clear { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 4px; font-size: 11.5px; padding: 3px 9px; cursor: pointer; color: var(--text); font-family: inherit; }
  .drill-clear:hover { background: var(--surface-alt); }

  /* ============ Info cards (icon + label + total) ============ */
  .info-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin: 4px 0; }
  .info-card { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #e1dfdd; border-radius: 14px; padding: 16px 18px; cursor: pointer; text-align: left; font-family: inherit; box-shadow: 0 2px 12px rgba(0,0,0,.05); transition: transform .12s, box-shadow .12s; width: 100%; }
  .info-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.10); }
  .info-card .ic-badge { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
  .info-card .ic-badge svg { width: 24px; height: 24px; }
  .info-card .ic-body { display: flex; flex-direction: column; min-width: 0; }
  .info-card .ic-label { display: block; font-size: 11.5px; color: #605e5c; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info-card .ic-total { display: block; font-size: 19px; font-weight: 800; color: #201f1e; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 3px; white-space: nowrap; }
  .report-paper.render-dark .info-card { background: #1c2029; border-color: #2c3340; }
  .report-paper.render-dark .info-card .ic-total { color: #f4f7fb; }
  .report-paper.render-dark .info-card .ic-label { color: #9aa6b8; }
  .report-paper.render-glass .info-card { background: rgba(255,255,255,.5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-color: rgba(255,255,255,.55); }

  /* ============ Applied filters & parameters strip ============ */
  .rp-filterbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 4px 0 10px; padding: 10px 12px; background: var(--acb); border: 1px solid var(--acl); border-radius: 8px; }
  .rp-filterbar .fb-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--acd); margin-right: 2px; }
  .rp-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; background: #fff; border: 1px solid var(--acl); border-radius: 13px; padding: 3px 10px; color: #323130; }
  .rp-chip.param { border-style: dashed; }
  .rp-chip b { font-weight: 700; color: var(--acd); }
  .report-paper.render-dark .rp-filterbar { background: rgba(255,255,255,.05); border-color: #2c3340; }
  .report-paper.render-dark .rp-chip { background: #1c2029; border-color: #2c3340; color: #dfe4ec; }

  /* ============ Dashboard composer (grid of data-bound widget tiles) ============ */
  .dash-shell { flex: 1; min-height: 0; display: flex; }
  .dash-palette { width: 176px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--nav-bg); padding: 12px 10px; overflow-y: auto; }

  .dash-add { display: flex; align-items: center; gap: 9px; width: 100%; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 7px; padding: 8px 10px; margin-bottom: 7px; cursor: pointer; font-family: inherit; font-size: 12.5px; color: var(--text); text-align: left; }

  /* widget visuals */

  /* sections with N columns + placeholders */
  .ds-sections { padding: 16px; display: flex; flex-direction: column; gap: 18px; }

  /* filter bar */

  .dash-grid.preview [data-slice], .ds-section [data-slice] { }

  /* panel / dialog */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: flex; }
  .panel {
    margin-left: auto; width: 420px; max-width: 92vw; background: var(--surface); height: 100%;
    box-shadow: var(--shadow-64); display: flex; flex-direction: column; animation: slideIn .18s ease;
  }
  @keyframes slideIn { from { transform: translateX(30px); opacity: .6; } to { transform: none; opacity: 1; } }
  .dialog {
    margin: auto; width: 480px; max-width: 92vw; background: var(--surface); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-64); animation: pop .16s ease; max-height: 86vh; display: flex; flex-direction: column;
  }
  @keyframes pop { from { transform: scale(.96); opacity: .5; } to { transform: none; opacity: 1; } }
  .panel-head, .dialog-head {

  }
  .panel-head h3, .dialog-head h3 { font-size: 18px; }

  .close-x { border: none; background: transparent; cursor: pointer; color: var(--text-secondary); width: 32px; height: 32px; border-radius: var(--radius); font-size: 16px; }
  .close-x:hover { background: var(--surface-alt); }

  .ver-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .ver-badge { width: 34px; height: 34px; border-radius: 50%; background: var(--primary-tint); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .ver-item .meta { flex: 1; }
  .ver-item .meta .t { font-weight: 600; font-size: 13px; }
  .ver-item .meta .s { font-size: 12px; color: var(--text-secondary); }

  /* toast */
  .toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    display: flex; align-items: center; gap: 10px; background: var(--text); color: var(--surface); padding: 10px 16px;
    border-radius: var(--radius-lg); box-shadow: var(--shadow-16); font-size: 13px; animation: pop .16s ease; max-width: 90vw;
  }
  .toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .toast.info .dot { background: var(--primary); }
  .toast.warn .dot { background: var(--warning); }
  .toast.err .dot { background: var(--error); }

  .info-banner {
    display: flex; gap: 10px; align-items: flex-start; background: var(--primary-tint-2); border: 1px solid var(--border-strong);
    border-left: 3px solid var(--primary); border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; margin-bottom: 16px; color: var(--text);
  }
  .kbd { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; background: var(--surface-alt); border: 1px solid var(--border-strong); border-radius: 3px; padding: 1px 5px; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-top: 10px; }
  .legend b { color: var(--text); }

  /* ============ New-report wizard ============ */
  .wiz-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 60; display: flex; flex-direction: column; animation: pop .16s ease; }
  .wiz-header { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border-strong); flex-shrink: 0; }

  .wiz-body { flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
  .wiz-rail { background: var(--nav-bg); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
  .wiz-step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: var(--radius-lg); color: var(--text-secondary); }
  .wiz-step.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-8); }

  .wiz-content { overflow: auto; padding: 32px 40px 40px; }
  .wiz-content .wtitle { font-size: 22px; margin-bottom: 6px; }
  .wiz-content .wsub { color: var(--text-secondary); margin-bottom: 24px; max-width: 620px; }
  .wiz-foot { min-height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 24px; background: var(--surface); border-top: 1px solid var(--border-strong); flex-shrink: 0; }
  .wiz-foot .spacer { flex: 1; }
  .attr-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; max-width: 900px; }
  .attr-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); cursor: pointer; background: var(--surface); user-select: none; }

  .review-row .rv { font-size: 13px; font-weight: 600; }

  /* Manual banded report designer */
  .md-grid { display:grid; grid-template-columns:300px 1fr 1fr; flex:1; min-height:0; }
  .md-pane { overflow:auto; border-right:1px solid var(--border); padding:16px; }

  .md-pane h4 { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-secondary); margin:0 0 10px; }
  .md-pane h4.mt { margin-top:20px; }
  .ds-ent { display:flex; align-items:center; gap:6px; font-weight:600; cursor:pointer; padding:5px 6px; border-radius:var(--radius); font-size:13px; }
  .ds-ent:hover { background:var(--surface-alt); }

  .ds-rel { margin-left:14px; border-left:1px solid var(--border); padding-left:6px; }
  .band { border:1px solid var(--border-strong); border-radius:var(--radius-lg); margin-bottom:12px; background:var(--surface); box-shadow:var(--shadow-8); }
  .band-head { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--surface-alt); border-bottom:1px solid var(--border); border-radius:var(--radius-lg) var(--radius-lg) 0 0; font-weight:600; font-size:12.5px; }
  .band-head .bt { display:flex; align-items:center; gap:8px; }
  .band-tag { font-size:10px; text-transform:uppercase; letter-spacing:.5px; padding:1px 7px; border-radius:9px; font-weight:700; }
  .band.master { border-left:3px solid var(--primary); } .band.master .band-tag { background:var(--primary-tint); color:var(--primary); }
  .band.child { border-left:3px solid var(--success); margin-left:22px; } .band.child .band-tag { background:var(--success-bg); color:var(--success); }
  .band.hdr, .band.ftr { border-left:3px solid var(--warning); } .band.hdr .band-tag, .band.ftr .band-tag { background:var(--warning-bg); color:var(--warning); }
  .band-body { padding:12px; }
  .band-body .col-chip { border-left-width:3px; }
  .band[draggable="true"] .bgrip { cursor:grab; color:var(--text-disabled); }
  .bmove { border:1px solid var(--border-strong); background:var(--surface); cursor:pointer; width:22px; height:22px; border-radius:var(--radius); font-size:9px; color:var(--text-secondary); line-height:1; padding:0; }
  .bmove:hover:not(:disabled) { background:var(--surface-alt); color:var(--text); border-color:var(--primary); }
  .bmove:disabled { opacity:.35; cursor:default; }
  .band.dragging { opacity:.45; }
  .band.dragover { outline:2px dashed var(--primary); outline-offset:2px; }

  .band.reparent-target .band-head::after { content:"drop to re-parent"; font-size:10px; color:var(--primary); font-weight:700; }
  .band-drophint { height:3px; background:var(--primary); border-radius:2px; margin:-6px 0 8px; opacity:0; transition:opacity .1s; }
  .band.dragover + .band-drophint { opacity:1; }
  .mini-field { display:flex; flex-direction:column; gap:3px; margin-bottom:8px; }
  .mini-field label { font-size:11px; color:var(--text-secondary); font-weight:600; }
  .ds-col[draggable="true"] { cursor:grab; }
  .ds-col[draggable="true"]:active { cursor:grabbing; }
  .band-drop { min-height:34px; border-radius:var(--radius); }
  .band-drop.over { outline:2px dashed var(--primary); outline-offset:2px; background:var(--primary-tint-2); }
  .drop-empty { color:var(--text-secondary); font-size:12px; font-style:italic; padding:12px; text-align:center; border:1px dashed var(--border-strong); border-radius:var(--radius); }

/* =====================================================================
   Report Engine — Designer Prototype  (RPT-ENG-001)
   Self-contained, no dependencies. Fluent / Power Platform design language.
   Demonstrates all 15 feature areas of the metadata-driven Report Designer.
   ===================================================================== */
"use strict";

const OPERATORS = ["Equals","Not equals","Contains","Begins with","Ends with","Greater than","Less than","Between","In","Not in","Is null","Is not null","Last X days","This month","This year"];
/* Data source types, matching the qdb_sourcetype option set exactly.
   `live` says whether the engine honours the choice. Three do, because they resolve to something the
   plugin can reach: a saved view already holds FetchXML, an author can supply FetchXML directly, and
   a static dataset carries its rows inline. The rest are stored but change nothing, and the dropdown
   says so — QueryExpression and Web API are other routes to the same Dataverse data the engine
   already queries, SQL cannot be reached from the plugin sandbox, and the four external sources were
   scoped to V2/V3 by the CEO gate decision. */
const SOURCES = [
  { label:"CRM View",            code:100000000, live:true  },
  { label:"FetchXML",            code:100000001, live:true  },

/* ---------- Dataverse metadata ----------
   Entities, their attributes and their relationships are read from the org rather than listed here.
   The designer used to carry a literal catalogue of five invented tables, so every column picker,
   filter list and dashboard tile offered fields that existed nowhere — a report built from them
   could not run. Reading metadata means the pickers can only offer what the org actually has.

   Reads are cached for the session and shared by every picker: the entity list is one request, and
   each entity's attributes are fetched the first time something asks for them. Accessors are
   synchronous because the render path is, so a miss returns empty and re-renders when the fetch
   lands — the same contract as dataverseCatalog above. */

/** Dataverse attribute types, in the vocabulary the designer's column editors already speak. */
const ATTRIBUTE_TYPE_LABELS = {
  String: "Text", Memo: "Text",
  Integer: "Whole number", BigInt: "Whole number",
  Decimal: "Decimal", Double: "Decimal",
  Money: "Currency",
  DateTime: "Date/Time",
  Boolean: "Boolean",
  Picklist: "Option set", State: "Option set", Status: "Option set",
  MultiSelectPicklist: "Multi-select option set",
  Lookup: "Lookup", Owner: "Lookup", Customer: "Lookup"
};

const metadata = {
  entities: null,
  entitiesError: null,
  entitiesLoading: false,
  attributesByEntity: {},
  relationsByEntity: {},
  optionSets: {},
  pending: {}
};

/** Entities a report can be built over: those the org exposes to advanced find. */
async function loadEntityMetadata() {
  if (metadata.entitiesLoading) return;
  metadata.entitiesLoading = true;
  try {
    const rows = await dvMetadata(
      "EntityDefinitions?$select=LogicalName,EntitySetName,DisplayName,PrimaryIdAttribute,PrimaryNameAttribute"
      + "&$filter=IsValidForAdvancedFind eq true");
    metadata.entities = rows
      .filter(e => e.EntitySetName)
      .map(e => ({
        logicalName: e.LogicalName,
        entitySet: e.EntitySetName,
        label: (e.DisplayName && e.DisplayName.UserLocalizedLabel && e.DisplayName.UserLocalizedLabel.Label) || e.LogicalName,
        primaryId: e.PrimaryIdAttribute,
        primaryName: e.PrimaryNameAttribute
      }))
      .sort((a, b) => a.label.localeCompare(b.label));
    metadata.entitiesError = null;
  } catch (error) {
    metadata.entities = [];
    metadata.entitiesError = error.message || String(error);
  }
  metadata.entitiesLoading = false;
  syncEntityDatalist();
  render();
}

async function loadAttributeMetadata(entity) {
  if (metadata.pending[entity]) return;
  metadata.pending[entity] = true;
  try {
    const rows = await dvMetadata(
      `EntityDefinitions(LogicalName='${entity}')/Attributes?$select=LogicalName,AttributeType,DisplayName,AttributeOf,IsValidForRead`);
    metadata.attributesByEntity[entity] = rows
      // A shadow attribute (AttributeOf) is the formatted twin of a real one and cannot be selected.
      .filter(a => a.IsValidForRead && !a.AttributeOf && ATTRIBUTE_TYPE_LABELS[a.AttributeType])
      .map(a => ({
        a: a.LogicalName,
        n: (a.DisplayName && a.DisplayName.UserLocalizedLabel && a.DisplayName.UserLocalizedLabel.Label) || a.LogicalName,
        t: ATTRIBUTE_TYPE_LABELS[a.AttributeType]
      }))
      .sort((x, y) => x.n.localeCompare(y.n));
  } catch (error) {
    metadata.attributesByEntity[entity] = [];
  }
  delete metadata.pending[entity];
  render();
}

/** One-to-many relationships, which is what the manual designer's detail tables can hang off. */
async function loadRelationshipMetadata(entity) {
  const key = "rel:" + entity;
  if (metadata.pending[key]) return;
  metadata.pending[key] = true;
  try {
    const rows = await dvMetadata(
      `EntityDefinitions(LogicalName='${entity}')/OneToManyRelationships?$select=ReferencingEntity,ReferencingAttribute,SchemaName`);
    metadata.relationsByEntity[entity] = rows.map(r => ({
      entity: r.ReferencingEntity,
      label: entityLabel(r.ReferencingEntity),
      foreignKey: r.ReferencingAttribute,
      schema: r.SchemaName
    }));
  } catch (error) {
    metadata.relationsByEntity[entity] = [];
  }
  delete metadata.pending[key];
  render();
}

/* Choice columns read their options from the org too. The designer used to offer categories and
   modules it had invented — "Financial", "Lending", "Treasury" — none of which are in the option set,
   so a chosen value could never be stored. */
async function loadOptionSets(entity) {
  const key = "opts:" + entity;
  if (metadata.pending[key]) return;
  metadata.pending[key] = true;
  try {
    const rows = await dvMetadata(
      `EntityDefinitions(LogicalName='${entity}')/Attributes/Microsoft.Dynamics.CRM.PicklistAttributeMetadata`
      + "?$select=LogicalName&$expand=OptionSet($select=Options)");
    const byAttribute = {};
    for (const row of rows) {
      byAttribute[row.LogicalName] = ((row.OptionSet && row.OptionSet.Options) || []).map(o => ({
        value: o.Value,
        label: (o.Label && o.Label.UserLocalizedLabel && o.Label.UserLocalizedLabel.Label) || String(o.Value)
      }));
    }
    metadata.optionSets[entity] = byAttribute;
  } catch (error) {
    metadata.optionSets[entity] = {};
  }
  delete metadata.pending[key];
  render();
}

function optionSetOf(entity, attribute) {
  if (!metadata.optionSets[entity]) { loadOptionSets(entity); return []; }
  return metadata.optionSets[entity][attribute] || [];
}

/** Labels of a report-definition choice column, for the designer's dropdowns. */
const reportChoiceLabels = attribute =>
  optionSetOf("qdb_reportdefinition", attribute).map(o => o.label);

/** Turns a chosen label back into the code Dataverse stores. */
function reportChoiceCode(attribute, label) {
  const match = optionSetOf("qdb_reportdefinition", attribute).find(o => o.label === label);
  return match ? match.value : null;
}

/** Logical names of every reportable entity. Empty until the metadata request lands. */
function entityNames() {
  if (metadata.entities === null) loadEntityMetadata();
  return (metadata.entities || []).map(e => e.logicalName);
}

function entityRecord(logicalName) {
  if (metadata.entities === null) loadEntityMetadata();
  return (metadata.entities || []).find(e => e.logicalName === logicalName) || null;
}

function entityLabel(logicalName) {
  const record = entityRecord(logicalName);
  return record ? record.label : logicalName;
}

/** The OData collection name — "accounts", not "accounts" guessed by appending an s. */
function entitySetOf(logicalName) {
  const record = entityRecord(logicalName);
  return record ? record.entitySet : null;
}

function attributesOf(entity) {
  if (!entity) return [];
  if (!metadata.attributesByEntity[entity]) { loadAttributeMetadata(entity); return []; }
  return metadata.attributesByEntity[entity];
}

function relationsOf(entity) {
  if (!entity) return [];
  if (!metadata.relationsByEntity[entity]) { loadRelationshipMetadata(entity); return []; }
  return metadata.relationsByEntity[entity];
}

   metadata lands, so a form with six pickers costs six inputs, not six thousand options. */
const ENTITY_DATALIST_ID = "dvEntityNames";

function syncEntityDatalist() {
  let list = document.getElementById(ENTITY_DATALIST_ID);
  if (!list) {
    list = document.createElement("datalist");
    list.id = ENTITY_DATALIST_ID;
    document.body.appendChild(list);
  }
  list.innerHTML = (metadata.entities || [])
    .map(e => `<option value="${esc(e.logicalName)}">${esc(e.label)}</option>`).join("");
}
