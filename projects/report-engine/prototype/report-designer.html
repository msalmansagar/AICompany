  { label:"Formula",                name:"Formula",               code:100000008, live:false, desc:"Computed column (see the Formulas tab)" },
  { label:"Conditional value",      name:"ConditionalValue",      code:100000009, live:false, desc:"Value depending on a condition" },
  { label:"Value mapping",          name:"Mapping",               code:100000010, live:true,  desc:"Show stored codes as friendly text" },
  { label:"Aggregation",            name:"Aggregation",           code:100000011, live:false, desc:"Sum / average / count (use a column aggregate instead)" },
  { label:"Grouping",               name:"Grouping",              code:100000012, live:false, desc:"Collapse rows by a key" },
  { label:"Pivot",                  name:"Pivot",                 code:100000013, live:false, desc:"Rows → columns" },
  { label:"JSON flatten",           name:"JsonFlatten",           code:100000014, live:false, desc:"Expand a JSON column" },
  { label:"External data map",      name:"ExternalMapping",       code:100000015, live:false, desc:"Map fields from an outside system" },
  { label:"Data masking",           name:"Masking",               code:100000016, live:true,  desc:"Hide all but the last few characters" },
  { label:"Null handling",          name:"NullHandling",          code:100000017, live:true,  desc:"What to show where a value is missing" }
];
const TRANSFORM_TYPES = TRANSFORMS.map(t => t.live ? t.label : `${t.label} — stored, not applied yet`);
const transformByLabel = label => TRANSFORMS.find(t => label === t.label || label === `${t.label} — stored, not applied yet`);
const transformByCode = code => TRANSFORMS.find(t => t.code === code);
/* The wizard used to offer its own list of 21 operations, eleven of which matched no transform type
   at all — and the save mapped anything unmatched to "Rename column", so choosing "Deduplicate"
   stored a rename that renamed nothing. Both surfaces now offer the same catalogue. */
const ETL_OPS = TRANSFORMS.map(t => ({ op: t.live ? t.label : `${t.label} — stored, not applied yet`, desc: t.desc }));
const LAYOUT_CATALOG = [
  { type:"Tabular Report", best:"Simple lists", ex:"Customer List, Loan List" },
  { type:"Grouped Report", best:"Hierarchical data", ex:"Customers → Loans" },
  { type:"Master-Detail Report", best:"Parent-child records", ex:"Loan → Installments" },
  { type:"Matrix (Cross Tab)", best:"Dynamic rows/columns", ex:"Branch × Product" },
  { type:"Summary Report", best:"KPIs", ex:"Total Loans, Total Amount" },
  { type:"Dashboard Report", best:"Executive overview", ex:"Charts + KPIs" },
  { type:"Chart Report", best:"Visual analytics", ex:"Bar / Line / Pie — click to drill" },
  { type:"Info Cards", best:"Icon KPI cards", ex:"Icon + Label + Total" },
  { type:"Card Layout", best:"Individual records", ex:"Customer Profile" },
  { type:"Form Layout", best:"Single record", ex:"Loan Application" },
  { type:"Label Layout", best:"Printing labels", ex:"Address Labels" },
  { type:"Invoice Layout", best:"Printable documents", ex:"Invoice, Receipt" },
  { type:"Statement Layout", best:"Financial statements", ex:"Account Statement" },
  { type:"Certificate Layout", best:"Certificates", ex:"Approval Certificate" },
  { type:"Letter Layout", best:"Mail merge", ex:"Offer Letter" },
  { type:"Multi-Column Layout", best:"Catalogs", ex:"Product Catalog" },
  { type:"Timeline Layout", best:"History", ex:"Case History" },
  { type:"Calendar Layout", best:"Events", ex:"Task Calendar" },
  { type:"Gantt Layout", best:"Project tracking", ex:"Process Timeline" },
  { type:"Tree Layout", best:"Hierarchy", ex:"Organization Structure" },
  { type:"Org Chart", best:"Organization", ex:"Reporting Structure" },
  { type:"Kanban Layout", best:"Workflow", ex:"Cases by Status" },
  { type:"Pivot Report", best:"Interactive analysis", ex:"Sales Analysis" },
  { type:"Drill-down Report", best:"Expand/collapse", ex:"Region → Branch" },
  { type:"Comparison Report", best:"Side-by-side", ex:"Year Comparison" },
  { type:"Nested Report", best:"Complex hierarchy", ex:"Customer → Accounts → Loans" },
  { type:"Book Layout", best:"Multi-page", ex:"Annual Report" }
];
const LAYOUT_TYPES = LAYOUT_CATALOG.map(l => l.type);
const EXPORT_FORMATS = ["PDF","Excel","CSV","Word","Image (PNG)","HTML"];
const PRINCIPAL_TYPES = ["Security role","Team","User"];
const RIBBON_LOCS = ["Entity form ribbon","Home grid ribbon","Subgrid ribbon","Dashboard button","Sitemap page"];

/* ---------- Dataverse metadata ----------
   Entities, their attributes and their relationships are read from the org rather than listed here.
   The designer used to carry a literal catalogue of five invented tables, so every column picker,
   filter list and dashboard tile offered fields that existed nowhere — a report built from them
   could not run. Reading metadata means the pickers can only offer what the org actually has.

   Reads are cached for the session and shared by every picker: the entity list is one request, and
   each entity's attributes are fetched the first time something asks for them. Accessors are
   synchronous because the render path is, so a miss returns empty and re-renders when the fetch
   lands — the same contract as dataverseCatalog above. */

/** Dataverse attribute types, in the vocabulary the designer's column editors already speak. */
const ATTRIBUTE_TYPE_LABELS = {
  String: "Text", Memo: "Text",
  Integer: "Whole number", BigInt: "Whole number",
  Decimal: "Decimal", Double: "Decimal",
  Money: "Currency",
  DateTime: "Date/Time",
  Boolean: "Boolean",
  Picklist: "Option set", State: "Option set", Status: "Option set",
  MultiSelectPicklist: "Multi-select option set",
  Lookup: "Lookup", Owner: "Lookup", Customer: "Lookup",
  // Kept because a record's id is a legitimate join key. It is filtered out of column suggestions
  // separately — offering it and suggesting it are different questions.
  Uniqueidentifier: "Unique identifier"
};

const metadata = {
  entities: null,
  entitiesError: null,
  entitiesLoading: false,
  attributesByEntity: {},
  relationsByEntity: {},
  optionSets: {},
  viewsByEntity: {},
  pending: {}
};

/* Tables that belong to the platform rather than to the business. Advanced-find validity alone
   leaves a couple of thousand of them in every picker — Field Service, Marketing, Portals, Power
   Automate and scheduling — and an author looking for "Account" has to find it among them.
   Prefixes are listed separately on purpose: "msdyn_" does not cover "msdyncrm_". */
const PLATFORM_TABLE_PREFIXES = [
  "msdyn_", "msdyncrm_", "msdynmkt_", "adx_", "mspp_", "flow", "bookableresource"
];
const isPlatformTable = logicalName =>
  PLATFORM_TABLE_PREFIXES.some(prefix => String(logicalName || "").toLowerCase().startsWith(prefix));

/** Entities a report can be built over: those the org exposes to advanced find. */
async function loadEntityMetadata() {
  if (metadata.entitiesLoading) return;
  metadata.entitiesLoading = true;
  beginBusy("Loading tables…");
  try {
    const rows = await dvMetadata(
      "EntityDefinitions?$select=LogicalName,EntitySetName,DisplayName,PrimaryIdAttribute,PrimaryNameAttribute"
      + "&$filter=IsValidForAdvancedFind eq true");
    metadata.entities = rows
      .filter(e => e.EntitySetName)
      .map(e => ({
        logicalName: e.LogicalName,
        entitySet: e.EntitySetName,
        label: (e.DisplayName && e.DisplayName.UserLocalizedLabel && e.DisplayName.UserLocalizedLabel.Label) || e.LogicalName,
        primaryId: e.PrimaryIdAttribute,
        primaryName: e.PrimaryNameAttribute
      }))
      .sort((a, b) => a.label.localeCompare(b.label));
    metadata.entitiesError = null;
  } catch (error) {
    metadata.entities = [];
    metadata.entitiesError = error.message || String(error);
  }
  metadata.entitiesLoading = false;
  endBusy("Loading tables…");
  syncEntityDatalist();
  render();
  refreshOpenWizard();
}

async function loadAttributeMetadata(entity) {
  if (metadata.pending[entity]) return;
  metadata.pending[entity] = true;
  beginBusy(`Loading ${entity} fields…`);
  try {
    const rows = await dvMetadata(
      `EntityDefinitions(LogicalName='${entity}')/Attributes?$select=LogicalName,AttributeType,DisplayName,AttributeOf,IsValidForRead`);
    metadata.attributesByEntity[entity] = rows
      // A shadow attribute (AttributeOf) is the formatted twin of a real one and cannot be selected.
      .filter(a => a.IsValidForRead && !a.AttributeOf && ATTRIBUTE_TYPE_LABELS[a.AttributeType])
      .map(a => ({
        a: a.LogicalName,
        n: (a.DisplayName && a.DisplayName.UserLocalizedLabel && a.DisplayName.UserLocalizedLabel.Label) || a.LogicalName,
        t: ATTRIBUTE_TYPE_LABELS[a.AttributeType]
      }))
      .sort((x, y) => x.n.localeCompare(y.n));
  } catch (error) {
    metadata.attributesByEntity[entity] = [];
  }
  delete metadata.pending[entity];
  endBusy(`Loading ${entity} fields…`);
  render();
  refreshOpenWizard();
  refreshOpenDataSourceDialog();
  refreshComboLabels();
}

/** One-to-many relationships, which is what the manual designer's detail tables can hang off. */
async function loadRelationshipMetadata(entity) {
  const key = "rel:" + entity;
  if (metadata.pending[key]) return;
  metadata.pending[key] = true;
  beginBusy(`Loading ${entity} relationships…`);
  try {
    const rows = await dvMetadata(
      `EntityDefinitions(LogicalName='${entity}')/OneToManyRelationships?$select=ReferencingEntity,ReferencingAttribute,SchemaName`);
    metadata.relationsByEntity[entity] = rows.map(r => ({
      entity: r.ReferencingEntity,
      label: entityLabel(r.ReferencingEntity),
      foreignKey: r.ReferencingAttribute,
      schema: r.SchemaName
    }));
  } catch (error) {
    metadata.relationsByEntity[entity] = [];
  }
  delete metadata.pending[key];
  endBusy(`Loading ${entity} relationships…`);
  render();
  refreshJoinKeySuggestions(entity);
}

/* Choice columns read their options from the org too. The designer used to offer categories and
   modules it had invented — "Financial", "Lending", "Treasury" — none of which are in the option set,
   so a chosen value could never be stored. */
async function loadOptionSets(entity) {
  const key = "opts:" + entity;
  if (metadata.pending[key]) return;
  metadata.pending[key] = true;
  beginBusy(`Loading ${entity} choices…`);
  try {
    const rows = await dvMetadata(
      `EntityDefinitions(LogicalName='${entity}')/Attributes/Microsoft.Dynamics.CRM.PicklistAttributeMetadata`
      + "?$select=LogicalName&$expand=OptionSet($select=Options)");
    const byAttribute = {};
    for (const row of rows) {
      byAttribute[row.LogicalName] = ((row.OptionSet && row.OptionSet.Options) || []).map(o => ({
        value: o.Value,
        label: (o.Label && o.Label.UserLocalizedLabel && o.Label.UserLocalizedLabel.Label) || String(o.Value)
      }));
    }
    metadata.optionSets[entity] = byAttribute;
  } catch (error) {
    metadata.optionSets[entity] = {};
  }
  delete metadata.pending[key];
  endBusy(`Loading ${entity} choices…`);
  render();
}

function optionSetOf(entity, attribute) {
  if (!metadata.optionSets[entity]) { loadOptionSets(entity); return []; }
  return metadata.optionSets[entity][attribute] || [];
}

/** Labels of a report-definition choice column, for the designer's dropdowns. */
const reportChoiceLabels = attribute =>
  optionSetOf("qdb_reportdefinition", attribute).map(o => o.label);

/** Turns a chosen label back into the code Dataverse stores. */
function reportChoiceCode(attribute, label) {
  const match = optionSetOf("qdb_reportdefinition", attribute).find(o => o.label === label);
  return match ? match.value : null;
}

/* ---------- Saved views ----------
   Choosing "CRM View" as the read method means the report runs a saved view's query instead of a
   generated one, and the engine finds that view BY NAME. The designer offered a free-text box, so
   the name had to be typed from memory and exactly — a typo produced a report that saved happily
   and then found no view at runtime. These are the views the org actually has. */

/** querytype tells a view meant for people from one that is lookup or de-dup plumbing. */
const VIEW_KINDS = { 0: "Main view", 1: "Advanced find", 2: "Associated", 4: "Quick find", 64: "Lookup" };
const MAIN_VIEW_TYPE = 0;

async function loadViews(entity) {
  const key = "views:" + entity;
  if (metadata.pending[key]) return;
  metadata.pending[key] = true;
  beginBusy(`Loading ${entity} views…`);
  try {
    const system = await dvList("savedquery",
      `?$select=name,querytype,fetchxml&$filter=returnedtypecode eq '${entity}' and statecode eq 0&$orderby=name`);
    let personal = [];
    try {
      personal = await dvList("userquery", `?$select=name,fetchxml&$filter=returnedtypecode eq '${entity}'`);
    } catch (error) { /* personal views are not always readable; system views are enough */ }

    const views = system.map(v => ({
      name: v.name,
      kind: VIEW_KINDS[v.querytype] || "System view",
      isMain: v.querytype === MAIN_VIEW_TYPE,
      fetchXml: v.fetchxml
    })).concat(personal.map(v => ({ name: v.name, kind: "Personal view", isMain: false, fetchXml: v.fetchxml })));

    // Main views first: they are what someone means by "the view", the rest is plumbing.
    // Views without a stored query are left out entirely — the engine skips them and then reports
    // the view as missing, so offering one would only produce a report that cannot run.
    metadata.viewsByEntity[entity] = views
      .filter(v => v.fetchXml)
      .sort((a, b) => (b.isMain - a.isMain) || String(a.name).localeCompare(String(b.name)));
  } catch (error) {
    metadata.viewsByEntity[entity] = [];
  }
  delete metadata.pending[key];
  endBusy(`Loading ${entity} views…`);
  render();
  refreshOpenWizard();
  refreshOpenDataSourceDialog();
}

function viewsOf(entity) {
  if (!entity) return [];
  if (!metadata.viewsByEntity[entity]) { loadViews(entity); return []; }
  return metadata.viewsByEntity[entity];
}

/* ---------- What a view actually returns ----------
   A view replaces the whole query, so the report gets the view's rows and nothing else. A column the
   view does not select arrives empty — the report renders, the cell is blank, and nothing says why.
   Reading the view's own FetchXML is what lets the designer offer only the fields that will arrive. */

/** The attributes a view selects on its own entity, plus the tables it reaches through. */
function viewSelection(entity, viewName) {
  const view = viewsOf(entity).find(v => v.name === viewName);
  if (!view || !view.fetchXml) return null;

  const fetch = parseFetchXml(view.fetchXml);
  if (!fetch) return null;

  const root = fetch.querySelector("entity");
  if (!root) return null;

  return {
    attributes: directAttributesOf(root),
    links: linksUnder(root, root.getAttribute("name")),
    conditions: conditionsUnder(root)
  };
}

/** FetchXML operator names, as a person would read them. */
const FETCH_OPERATORS = {
  eq: "equals", ne: "does not equal", neq: "does not equal", like: "contains", "not-like": "does not contain",
  "begins-with": "begins with", "not-begin-with": "does not begin with", "ends-with": "ends with",
  gt: "is after", ge: "is on or after", lt: "is before", le: "is on or before",
  null: "is empty", "not-null": "is not empty", in: "is one of", "not-in": "is not one of",
  between: "is between", "eq-userid": "is the current user", "ne-userid": "is not the current user",
  "eq-businessid": "is the current business unit", "last-x-days": "is in the last X days",
  "this-month": "is this month", "this-year": "is this year", "olderthan-x-months": "is older than X months"
};

/**
 * The conditions a view applies to its own table, flattened with the group each belongs to.
 *
 * Conditions inside a link-entity are left out: they narrow the joined table, not the rows the
 * report lists, and showing them beside the others would read as a filter on the primary table.
 */
function conditionsUnder(entity, depth = 0) {
  return Array.from(entity.children)
    .filter(child => child.tagName === "filter")
    .flatMap(filter => {
      const group = (filter.getAttribute("type") || "and").toUpperCase();
      const own = Array.from(filter.children)
        .filter(child => child.tagName === "condition")
        .map(condition => ({
          attribute: condition.getAttribute("attribute"),
          operator: condition.getAttribute("operator") || "eq",
          value: condition.getAttribute("value")
            || Array.from(condition.children).filter(v => v.tagName === "value").map(v => v.textContent).join(", "),
          group,
          depth
        }));
      return own.concat(conditionsUnder(filter, depth + 1));
    });
}

/**
 * The tables a fetch element reaches, in the shape they are nested.
 *
 * A link-entity can hang off another link-entity, not only off the root. Flattening them would
 * present a second-level join as though its key matched the primary table's, which is a join the
 * report does not have.
 */
function linksUnder(element, parentEntity, depth = 0) {
  return Array.from(element.children)
    .filter(child => child.tagName === "link-entity")
    .flatMap(link => {
      const entity = link.getAttribute("name");
      return [{
        entity,
        parentEntity,
        depth,
        alias: link.getAttribute("alias") || entity,
        from: link.getAttribute("from"),
        to: link.getAttribute("to"),
        linkType: link.getAttribute("link-type") || "inner",
        attributes: directAttributesOf(link)
      }].concat(linksUnder(link, entity, depth + 1));
    });
}

function parseFetchXml(fetchXml) {
  const parsed = new DOMParser().parseFromString(fetchXml, "text/xml");
  return parsed.querySelector("parsererror") ? null : parsed;
}

/** Attributes belonging to this element, not to a link-entity nested inside it. */
function directAttributesOf(element) {
  return Array.from(element.children)
    .filter(child => child.tagName === "attribute")
    .map(child => child.getAttribute("name"))
    .filter(Boolean);
}

/**
 * The tables a view already reaches, shown rather than edited.
 *
 * A view replaces the whole query, so joins configured on the report never reach Dataverse — the
 * editor would save happily and change nothing. What the author needs to know is which other tables
 * their data can come from, and the view answers that itself.
 */
function viewJoinsHtml(entity, viewName) {
  const selection = viewSelection(entity, viewName);
  const intro = `<div class="hint">A saved view carries its own joins, and its query replaces the report's — so these come from <b>${esc(viewName || "the view")}</b> and are not editable here. To join a different table, edit the view in CRM or read via FetchXML.</div>`;

  if (!selection) {
    return `<div class="section-card" style="max-width:900px"><h3>Related CRM entities (joins)</h3>${intro}
      <div class="canvas-hint" style="padding:10px 0">${esc(unreadableViewReason(entity, viewName))}</div></div>`;
  }

  // The left key belongs to whichever table the link hangs off, which is not always the primary.
  const rows = selection.links.length
    ? selection.links.map(link => `<tr><td>${esc(link.linkType)} join</td>
        <td>${link.depth ? `<span style="color:var(--text-secondary)">via ${esc(link.parentEntity)} ▸ </span>` : ""}<span class="kbd">${esc(link.entity)}</span></td>
        <td><span class="kbd">${esc(link.to)}</span>${link.depth ? ` <span style="color:var(--text-secondary)">on ${esc(link.parentEntity)}</span>` : ""}</td>
        <td><span class="kbd">${esc(link.from)}</span></td>
        <td>${link.attributes.length ? link.attributes.map(a => `<span class="kbd">${esc(a)}</span>`).join(" ") : "—"}</td></tr>`).join("")
    : `<tr class="empty-row"><td colspan="5">This view reads ${esc(entity)} only — no other table is joined.</td></tr>`;

  return `<div class="section-card" style="max-width:900px"><h3>Related CRM entities (joins)</h3>${intro}
    <div class="join-visual"><span class="ent-chip">${esc(entity)} <span style="color:var(--text-secondary)">(primary)</span></span>${
      selection.links.filter(link => !link.depth).map(link => `<span class="join-badge">${esc(link.linkType)} ▸</span><span class="ent-chip">${esc(link.entity)}</span>`).join("")}</div>
    <div style="overflow-x:auto"><table class="subgrid"><thead><tr><th>Join type</th><th>Related entity</th><th>Left key</th><th>Right key (related)</th><th>Fields it brings</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/** Why a view's joins cannot be shown — the three cases read very differently to an author. */
function unreadableViewReason(entity, viewName) {
  if (!viewName) return "Pick a saved view above.";
  const view = viewsOf(entity).find(v => v.name === viewName);
  if (!view) return "Reading the view…";
  return "This view's query could not be read, so its joins cannot be shown.";
}

/* The source-type label carries a suffix for the types that are stored but not applied, so it is
   matched by prefix rather than compared. */
const isCrmViewSource = type => String(type || "").startsWith("CRM View");
const isStaticSource = type => String(type || "").startsWith("Static Dataset");

/** What the payload box is actually for, which depends entirely on the read method. */
function queryPlaceholder(type) {
  if (isStaticSource(type)) return '[ { "column": "value" } ] — inline rows';
  if (String(type || "").startsWith("FetchXML")) return "<fetch>…</fetch> — leave empty to generate";
  return "Leave empty — the engine builds the query";
}

/** A searchable picker over an entity's saved views. The stored value is the name the engine matches. */
function viewPickerHtml(entity, selected, attrs = "") {
  const placeholder = !entity ? "Pick a table first"
    : (viewsOf(entity).length ? "Search saved views…" : "Loading views…");
  return `<div class="combo"><input class="fluent-input combo-input" autocomplete="off" role="combobox"
    data-combo="view" data-combo-entity="${esc(entity || "")}" value="${esc(selected || "")}"
    data-entity="${esc(selected || "")}" placeholder="${esc(placeholder)}" ${attrs}>
    <div class="combo-panel"></div></div>`;
}

/** Logical names of every reportable entity. Empty until the metadata request lands. */
function entityNames() {
  if (metadata.entities === null) loadEntityMetadata();
  return (metadata.entities || []).map(e => e.logicalName);
}

function entityRecord(logicalName) {
  if (metadata.entities === null) loadEntityMetadata();
  return (metadata.entities || []).find(e => e.logicalName === logicalName) || null;
}

function entityLabel(logicalName) {
  const record = entityRecord(logicalName);
  return record ? record.label : logicalName;
}

/** The OData collection name — "accounts", not "accounts" guessed by appending an s. */
function entitySetOf(logicalName) {
  const record = entityRecord(logicalName);
  return record ? record.entitySet : null;
}

function attributesOf(entity) {
  if (!entity) return [];
  if (!metadata.attributesByEntity[entity]) { loadAttributeMetadata(entity); return []; }
  return metadata.attributesByEntity[entity];
}

function relationsOf(entity) {
  if (!entity) return [];
  if (!metadata.relationsByEntity[entity]) { loadRelationshipMetadata(entity); return []; }
  return metadata.relationsByEntity[entity];
}

/* ---------- Searching long lists ----------
   Both places a user picks from metadata are long: an org has thousands of reportable tables, and a
   table like account carries nearly six hundred columns. Neither is a list anyone scrolls. */

/** Case-insensitive substring match across several fields of a candidate. */
function matchesSearch(term, ...fields) {
  const needle = (term || "").trim().toLowerCase();
  if (!needle) return true;
  return fields.some(field => String(field || "").toLowerCase().includes(needle));
}

/** Marks the matched run, so a result shows why it came back. */
function highlight(text, term) {
  const value = String(text == null ? "" : text);
  const needle = (term || "").trim();
  if (!needle) return esc(value);
  const at = value.toLowerCase().indexOf(needle.toLowerCase());
  if (at < 0) return esc(value);
  return esc(value.slice(0, at)) + "<mark>" + esc(value.slice(at, at + needle.length)) + "</mark>"
    + esc(value.slice(at + needle.length));
}

/* The entity picker was a datalist, and browsers filter those on the option's VALUE — the logical
   name. Typing "Account" worked by luck; typing "Loan" to reach qdb_loan_application found nothing,
   because the display name lives in the option's text and is not searched. This filters on display
   name and logical name together, shows both, and keeps arrow keys and Enter working. */
const ENTITY_RESULT_LIMIT = 60;

function entityPickerHtml(selected, attrs = "") {
  entityNames();
  const record = entityRecord(selected);
  const shown = record ? `${record.label} (${record.logicalName})` : (selected || "");
  const placeholder = metadata.entities === null ? "Loading tables…" : "Search tables by name…";
  return `<div class="combo"><input class="fluent-input combo-input" autocomplete="off" role="combobox"
    data-combo="entity" value="${esc(shown)}" data-entity="${esc(selected || "")}" placeholder="${placeholder}" ${attrs}>
    <div class="combo-panel"></div></div>`;
}

/**
 * The same combo over one table's columns, for the places that ask for a field by name — join keys
 * above all, which were free-text boxes you had to type a logical name into from memory.
 */
function attributePickerHtml(entity, selected, attrs = "", placeholderText) {
  const known = entity ? attributesOf(entity).find(a => a.a === selected) : null;
  const shown = known ? `${known.n} (${known.a})` : (selected || "");
  const placeholder = !entity ? "Pick a table first"
    : (attributesOf(entity).length ? (placeholderText || "Search fields…") : "Loading fields…");
  return `<div class="combo"><input class="fluent-input combo-input" autocomplete="off" role="combobox"
    data-combo="attribute" data-combo-entity="${esc(entity || "")}" value="${esc(shown)}"
    data-entity="${esc(selected || "")}" placeholder="${esc(placeholder)}" ${attrs}>
    <div class="combo-panel"></div></div>`;
}

/** What a combo offers, and how each option reads. One shape, two sources. */
function comboCandidates(input) {
  const scope = input.dataset.comboEntity;
  if (input.dataset.combo === "attribute") {
    return attributesOf(scope).map(a => ({ id: a.a, title: a.n, subtitle: `${a.a} · ${a.t}` }));
  }

  // A view is identified by its name, so the id and the title are the same string.
  if (input.dataset.combo === "view") {
    return viewsOf(scope).map(v => ({ id: v.name, title: v.name, subtitle: v.kind }));
  }

  return offerableEntities(input.dataset.entity)
    .map(e => ({ id: e.logicalName, title: e.label, subtitle: e.logicalName }));
}

/* Platform tables are hidden from what a picker OFFERS, not from what the designer knows. Filtering
   the metadata itself would strip the label off any report already built on one, and a report whose
   table simply vanished from its own picker would look corrupted rather than filtered.
   Whatever is already selected is therefore always kept in the list. */
function offerableEntities(selectedLogicalName) {
  return (metadata.entities || []).filter(e =>
    !isPlatformTable(e.logicalName) || e.logicalName === selectedLogicalName);
}

const comboDisplay = (input, id) => {
  if (input.dataset.combo === "view") return id || "";
  const found = comboCandidates(input).find(c => c.id === id);
  return found ? `${found.title} (${found.id})` : (id || "");
};

/**
 * Wires every entity combo inside `scope`.
 *
 * The input's `value` is redefined to report the chosen logical name rather than the text on screen,
 * because every existing handler — bindInputs, the onchange handlers, the wizard — already reads
 * `.value` and expects a logical name. The visible text stays human.
 */
const NATIVE_INPUT_VALUE = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");

function bindEntityCombos(scope) {
  (scope || document).querySelectorAll(".combo > .combo-input").forEach(input => {
    if (input.dataset.bound) return;
    input.dataset.bound = "1";

    const panel = input.parentElement.querySelector(".combo-panel");
    let active = -1;

    // The text on screen, reached through the native accessor because `value` is redefined below.
    const shownText = () => NATIVE_INPUT_VALUE.get.call(input);
    const setShownText = text => NATIVE_INPUT_VALUE.set.call(input, text);

    /* The panel is fixed, so it has to be told where the input is. Doing it on open also keeps it
       correct inside the horizontally scrolling tables that clipped it before. */
    const place = () => {
      const box = input.getBoundingClientRect();
      const room = window.innerHeight - box.bottom;
      panel.style.left = `${box.left}px`;
      panel.style.width = `${Math.max(box.width, 240)}px`;
      // Flip above when the input sits near the bottom of the window.
      if (room < 200 && box.top > room) {
        panel.style.top = "auto";
        panel.style.bottom = `${window.innerHeight - box.top + 2}px`;
        panel.style.maxHeight = `${box.top - 12}px`;
      } else {
        panel.style.bottom = "auto";
        panel.style.top = `${box.bottom + 2}px`;
        panel.style.maxHeight = `${Math.max(140, room - 12)}px`;
      }
    };

    const NOUNS = { attribute: "field", view: "saved view" };
    const noun = () => NOUNS[input.dataset.combo] || "table";

    const draw = () => {
      const term = shownText();
      const found = comboCandidates(input).filter(c => matchesSearch(term, c.title, c.subtitle));
      const shown = found.slice(0, ENTITY_RESULT_LIMIT);
      panel.innerHTML = shown.length
        ? shown.map((c, i) => `<div class="combo-option ${i === active ? "active" : ""}" data-pick="${esc(c.id)}">
            <div class="cn">${highlight(c.title, term)}</div><div class="cl">${highlight(c.subtitle, term)}</div></div>`).join("")
          + (found.length > shown.length ? `<div class="combo-more">${found.length - shown.length} more — keep typing to narrow</div>` : "")
        : `<div class="combo-more">No ${noun()} matches “${esc(term)}”.</div>`;
      place();
      panel.classList.add("open");
      panel.querySelectorAll("[data-pick]").forEach(option =>
        option.addEventListener("mousedown", event => { event.preventDefault(); choose(option.dataset.pick); }));
    };

    const choose = id => {
      input.dataset.entity = id;
      setShownText(comboDisplay(input, id));
      panel.classList.remove("open");
      // Both, because some callers listen for one and some for the other.
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.dispatchEvent(new Event("change", { bubbles: true }));
    };

    Object.defineProperty(input, "value", {
      configurable: true,
      get: () => input.dataset.entity || "",
      set: id => { input.dataset.entity = id || ""; setShownText(comboDisplay(input, id)); }
    });

    input.addEventListener("focus", () => { active = -1; input.select(); draw(); });
    input.addEventListener("input", () => { active = -1; draw(); });
    input.addEventListener("blur", () => setTimeout(() => {
      panel.classList.remove("open");
      // Typing something and wandering off must not leave half a name on screen.
      setShownText(comboDisplay(input, input.dataset.entity));
    }, 140));
    // A fixed panel does not travel with its input, so it closes rather than floating loose.
    window.addEventListener("scroll", () => panel.classList.remove("open"), true);
    input.addEventListener("keydown", event => {
      const options = [...panel.querySelectorAll("[data-pick]")];
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        active = Math.max(0, Math.min(options.length - 1, active + (event.key === "ArrowDown" ? 1 : -1)));
        draw();
        const current = panel.querySelectorAll("[data-pick]")[active];
        if (current) current.scrollIntoView({ block: "nearest" });
      } else if (event.key === "Enter" && options[active]) {
        event.preventDefault();
        choose(options[active].dataset.pick);
      } else if (event.key === "Escape") {
        panel.classList.remove("open");
      }
    });
  });
}

/* Combos are emitted from eight places — tabs, dialogs, the wizard overlay, the dashboard composer —
   and each renders on its own schedule. Watching for them is one rule that cannot be forgotten at a
   new call site, which hooking each render path would be. */
function watchForEntityCombos() {
  bindEntityCombos(document);
  new MutationObserver(mutations => {
    for (const mutation of mutations) {
      if (mutation.addedNodes.length) { bindEntityCombos(document); return; }
    }
  }).observe(document.body, { childList: true, subtree: true });
}

/* Deep-ish clone helper for the working report definition */

    description: "",
    category: seed ? seed.category : "", module: seed ? seed.module : "",
    owner: seed ? seed.owner : (state.userName || ""), approver: "",
    status: seed ? seed.status : "Draft", mainEntity: "",
    executionMode: "Auto", rowLimit: 50000, timeout: 120, governed: seed ? seed.governed : false,
    version: seed ? seed.version : 1,
    dataSources: [ { name:"Primary", type:"FetchXML", connector:"", query:"", primary:true, joinL:"", joinR:"" } ],
    columns: [],
    filters: [],
    parameters: [],
    relationships: [],
    transformations: [],
    formulas: [],
    layout: { type:"Tabular Report", showHeader:true, showFooter:true, showLogo:true, pageNumber:true, genDate:true, genBy:true, watermark:"", orientation:"Landscape", pageSize:"A4", groupBy:"(none)", grandTotal:true, chartType:"Column", cardIcon:"chart", showFilterBar:true },
    formatting: [],

    exports: [

    ],

}

  fieldFilter: "",
