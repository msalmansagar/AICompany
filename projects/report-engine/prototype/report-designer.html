function buildHeaderDetailBody(hCols, hRow, details, lang) {

  const fmt = (c,v) => c.type==="Currency"?money(+v||0):(c.type==="Date/Time"?String(v).split("-").reverse().join("/"):v);
  const disp = (c,v) => (["Currency","Decimal","Whole number","Date/Time"].includes(c.type)) ? fmt(c,v) : T(fmt(c,v));
  const fieldBox = (c) => { const lp=c.labelPos||"left", label=esc(T(c.label||c.name)), val=esc(disp(c,hRow[c.key]));
    if (lp==="top") return `<div><div style="color:#605e5c;font-size:11px">${label}</div><div style="font-weight:600">${val}</div></div>`;
    if (lp==="right") return `<div style="display:flex;gap:6px;align-items:baseline;justify-content:flex-end"><div style="font-weight:600">${val}</div><div style="color:#605e5c;font-size:12px">${label}</div></div>`;
    return `<div style="display:flex;gap:8px;align-items:baseline"><div style="color:#605e5c;font-size:12px;min-width:96px">${label}:</div><div style="font-weight:600">${val}</div></div>`; };
  const header = `<div style="font-weight:700;color:var(--acd);border-bottom:2px solid var(--ac);padding-bottom:6px;margin-bottom:10px">Header record</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 20px;margin-bottom:16px">${hCols.map(fieldBox).join("")}</div>`;
  const tables = (details||[]).filter(dt=>dt.columns.length).map(dt=>{
    const cols = dt.columns.map(c=>({name:c.name, key:c.attr, type:c.type, right:["Currency","Decimal","Whole number"].includes(c.type)}));
    const rows = previewRows(cols, dt.entity).slice(0,4);
    const vc = cols.find(c=>c.right); const sub = vc?rows.reduce((s,r)=>s+(+r[vc.key]||0),0):0, tax = Math.round(sub*0.1);
    const totals = dt.showTotals && vc ? `<div style="display:flex;justify-content:flex-end;margin-top:6px"><table style="font-size:12.5px"><tr><td style="padding:2px 14px;color:#605e5c">${T("Subtotal")}</td><td style="text-align:right">${money(sub)}</td></tr><tr><td style="padding:2px 14px;color:#605e5c">Tax (10%)</td><td style="text-align:right">${money(tax)}</td></tr><tr style="font-weight:700"><td style="padding:5px 14px;border-top:2px solid var(--ac)">${T("Total")}</td><td style="text-align:right;border-top:2px solid var(--ac)">${money(sub+tax)}</td></tr></table></div>` : "";
    return `<div style="margin-bottom:16px"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#605e5c;font-weight:700;margin-bottom:4px">${esc(T(dt.label))} (detail)</div><table class="rp-table"><thead><tr>${cols.map(c=>`<th class="${c.right?"num":""}">${esc(T(c.name))}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.right?"num":""}">${esc(disp(c,r[c.key]))}</td>`).join("")}</tr>`).join("")}</tbody></table>${totals}</div>`;
  }).join("");

}
function renderMiniPreview(host, d) {

  const rows = previewRows(cols, d.mainEntity);
  // The preview reads the org, so an empty one means something — say which, rather than drawing an
  // empty chart that reads as a rendering fault.
  if (!rows.length) { host.innerHTML = previewPlaceholder(cols, d.mainEntity); return; }
  const lang = d.previewLang || d.primaryLang || "en";
  const meta = d.colMeta || {};
  const hCols = cols.map(c => ({ ...c, label:(meta[c.key]&&meta[c.key].label)||c.name, labelPos:(meta[c.key]&&meta[c.key].labelPos)||"left" }));

  host.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { d.previewLang = b.dataset.lang; renderMiniPreview(host, d); });

}

/* ---------- Transformation configuration ----------
   Every step's settings were a JSON box. The shape differed per type, nothing checked it, and a
   misspelt key produced a step that saved cleanly and did nothing — the same silence as an
   unimplemented type. These specs mirror ReportTransformationPipeline exactly: change a case there
   and change the spec here, or the designer starts describing a transform the engine does not run. */
const TRANSFORM_CONFIG_SPECS = {
  RenameColumns: [
    { key:"renames", kind:"columnMap", label:"Rename these columns", valueLabel:"New heading" }
  ],
  NullHandling: [
    { key:"default", kind:"text", label:"Show this where a value is missing", placeholder:"—" },
    { key:"columns", kind:"columnMap", label:"Or per column", valueLabel:"Show instead" }
  ],
  Masking: [
    { key:"columns", kind:"columnList", label:"Columns to mask" },
    { key:"keepLast", kind:"number", label:"Characters left visible at the end", fallback:4, min:0 },
    { key:"mask", kind:"text", label:"Mask character", fallback:"*", maxLength:1 }
  ],
  NumberFormat: [
    { key:"columns", kind:"columnList", label:"Columns" },
    { key:"decimals", kind:"number", label:"Decimal places", fallback:2, min:0 },
    { key:"thousands", kind:"boolean", label:"Thousands separator", fallback:true }
  ],
  CurrencyFormat: [
    { key:"columns", kind:"columnList", label:"Columns" },
    { key:"symbol", kind:"text", label:"Currency symbol", fallback:"QAR" },
    { key:"decimals", kind:"number", label:"Decimal places", fallback:2, min:0 }
  ],
  DateFormat: [
    { key:"columns", kind:"columnList", label:"Columns" },
    { key:"format", kind:"choice", label:"Show dates as", fallback:"yyyy-MM-dd",
      options:["yyyy-MM-dd","dd/MM/yyyy","dd MMM yyyy","dd MMMM yyyy","MM/dd/yyyy","dd-MM-yyyy HH:mm"] }
  ],
  Mapping: [
    { key:"column", kind:"column", label:"Column" },
    { key:"map", kind:"valueMap", label:"Show each stored value as" },
    { key:"default", kind:"text", label:"Anything else shows as", placeholder:"leave empty to keep the raw value" }
  ],
  MergeColumns: [
    { key:"columns", kind:"columnList", label:"Columns to combine, in order" },
    { key:"into", kind:"text", label:"Key for the new column", placeholder:"fullName" },
    { key:"label", kind:"text", label:"Heading for the new column", placeholder:"Full name" },
    { key:"separator", kind:"text", label:"Joined with", fallback:" " }
  ]
};

/** The engine name for a transform's friendly label — the specs and the pipeline are keyed by it. */
const transformSpecFor = label => {
  const known = transformByLabel(label);
  return known ? TRANSFORM_CONFIG_SPECS[known.name] : null;
};

function parseConfigObject(json) {
  if (!json) return {};
  try {
    const parsed = JSON.parse(json);
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  } catch (error) {
    return {};
  }
}

/**
 * The settings for one step, as controls rather than as JSON.
 *
 * `prefix` namespaces the inputs so the same editor can appear in the wizard's panel, its list and
 * the designer tab without their handlers colliding.
 */
function transformConfigHtml(label, configJson, columns, prefix) {
  const spec = transformSpecFor(label);
  const known = transformByLabel(label);
  if (!spec) {
    return `<div class="np-empty">${known && !known.live
      ? `The engine does not apply <b>${esc(known.label)}</b> yet, so there is nothing to configure — the step is stored and ignored.`
      : `This type has no settings.`}</div>`;
  }

  return spec.map(field => `<div class="field"><label class="lbl">${esc(field.label)}</label>
    ${configFieldHtml(field, configJson, columns, prefix)}</div>`).join("");
}

function configFieldHtml(field, configJson, columns, prefix) {
  const config = parseConfigObject(configJson);
  const stored = config[field.key];
  const id = `${prefix}_${field.key}`;
  const pick = (selected) => columns.map(c =>
    `<option value="${esc(c.key)}" ${c.key === selected ? "selected" : ""}>${esc(c.label)}</option>`).join("");

  if (field.kind === "text") {
    return `<input class="fluent-input" data-cfg="${esc(id)}" data-cfgkind="text" value="${esc(stored == null ? (field.fallback ?? "") : stored)}"
      placeholder="${esc(field.placeholder || "")}" ${field.maxLength ? `maxlength="${field.maxLength}"` : ""}>`;
  }
  if (field.kind === "number") {
    return `<input class="fluent-input" type="number" data-cfg="${esc(id)}" data-cfgkind="number"
      value="${stored == null ? field.fallback : esc(stored)}" ${field.min != null ? `min="${field.min}"` : ""}>`;
  }
  if (field.kind === "boolean") {
    const on = stored == null ? field.fallback : stored !== false;
    return `<label class="chip" style="cursor:pointer"><input type="checkbox" data-cfg="${esc(id)}" data-cfgkind="boolean" ${on ? "checked" : ""}> Yes</label>`;
  }
  if (field.kind === "choice") {
    const value = stored == null ? field.fallback : stored;
    const known = field.options.includes(value);
    return `<select class="fluent-select" data-cfg="${esc(id)}" data-cfgkind="text">
      ${field.options.map(o => `<option ${o === value ? "selected" : ""}>${esc(o)}</option>`).join("")}
      ${known ? "" : `<option selected>${esc(value)}</option>`}</select>`;
  }
  if (field.kind === "column") {
    return `<select class="fluent-select" data-cfg="${esc(id)}" data-cfgkind="text">
      <option value="">— pick a column —</option>${pick(stored)}</select>`;
  }
  if (field.kind === "columnList") {
    const chosen = Array.isArray(stored) ? stored : [];
    return columns.length
      ? `<div class="chips" data-cfg="${esc(id)}" data-cfgkind="columnList">${columns.map(c =>
          `<label class="chip" style="cursor:pointer"><input type="checkbox" value="${esc(c.key)}" ${chosen.includes(c.key) ? "checked" : ""}> ${esc(c.label)}</label>`).join("")}</div>`
      : `<div class="np-empty">Choose the report's columns first.</div>`;
  }
  if (field.kind === "columnMap") {
    const entries = stored && typeof stored === "object" ? Object.entries(stored) : [];
    const rows = entries.map(([column, value], at) => `<tr>
      <td><select class="fluent-select" data-maprow="${at}" data-mapkey><option value="">—</option>${pick(column)}</select></td>
      <td><input class="fluent-input" data-maprow="${at}" data-mapvalue value="${esc(value)}"></td>
      <td><button class="del" data-mapdel="${at}">${ic("trash")}</button></td></tr>`).join("");
    return `<div data-cfg="${esc(id)}" data-cfgkind="map">
      <table class="subgrid"><thead><tr><th>Column</th><th>${esc(field.valueLabel)}</th><th></th></tr></thead>
      <tbody>${rows || `<tr class="empty-row"><td colspan="3">Nothing yet.</td></tr>`}</tbody></table>
      <button class="btn sm" data-mapadd style="margin-top:6px">${ic("add")}Add</button></div>`;
  }

  // valueMap: the stored value is whatever the column holds, so it is typed, not picked.
  const pairs = stored && typeof stored === "object" ? Object.entries(stored) : [];
  const rows = pairs.map(([raw, shown], at) => `<tr>
    <td><input class="fluent-input" data-maprow="${at}" data-mapkey value="${esc(raw)}" placeholder="0"></td>
    <td><input class="fluent-input" data-maprow="${at}" data-mapvalue value="${esc(shown)}" placeholder="No"></td>
    <td><button class="del" data-mapdel="${at}">${ic("trash")}</button></td></tr>`).join("");
  return `<div data-cfg="${esc(id)}" data-cfgkind="map">
    <table class="subgrid"><thead><tr><th>Stored value</th><th>Shown as</th><th></th></tr></thead>
    <tbody>${rows || `<tr class="empty-row"><td colspan="3">Nothing yet.</td></tr>`}</tbody></table>
    <button class="btn sm" data-mapadd style="margin-top:6px">${ic("add")}Add</button></div>`;
}

/** Reads the controls back into the JSON the engine parses. Empty values are left out entirely. */
function readTransformConfig(host, label, prefix) {
  const spec = transformSpecFor(label);
  if (!spec) return null;

  const config = {};
  for (const field of spec) {
    const node = host.querySelector(`[data-cfg="${prefix}_${field.key}"]`);
    if (!node) continue;
    const value = readConfigField(node, field);
    if (value !== undefined) config[field.key] = value;
  }

  return JSON.stringify(config);
}

function readConfigField(node, field) {
  const kind = node.dataset.cfgkind;
  if (kind === "number") {
    const parsed = Number(node.value);
    return Number.isFinite(parsed) ? parsed : field.fallback;
  }
  if (kind === "boolean") return node.checked;
  if (kind === "columnList") {
    const chosen = [...node.querySelectorAll("input:checked")].map(input => input.value);
    return chosen.length ? chosen : undefined;
  }
  if (kind === "map") {
    const map = {};
    node.querySelectorAll("tbody tr").forEach(row => {
      const key = row.querySelector("[data-mapkey]");
      const value = row.querySelector("[data-mapvalue]");
      if (key && key.value) map[key.value] = value ? value.value : "";
    });
    return Object.keys(map).length ? map : undefined;
  }
  return node.value === "" ? undefined : node.value;
}

/**
 * Wires the editor. Every change rewrites the stored JSON, so what is saved is always what the
 * controls show — there is no separate "apply" for a value to be lost behind.
 */
function bindTransformConfig(host, label, prefix, step, onChange, columns = []) {
  const write = () => {
    const json = readTransformConfig(host, label, prefix);
    if (json === null) return;
    step.config = json;
    const summary = document.getElementById(prefix + "_summary");
    if (summary) summary.textContent = transformConfigSummary(label, step.config, columns);
  };

  host.querySelectorAll("[data-cfg]").forEach(node => {
    if (node.dataset.cfgkind === "map") return;
    node.addEventListener(node.tagName === "SELECT" || node.type === "checkbox" ? "change" : "input", write);
  });
  host.querySelectorAll('[data-cfgkind="columnList"] input').forEach(box => box.addEventListener("change", write));
  host.querySelectorAll('[data-cfgkind="map"]').forEach(mapNode => {
    mapNode.querySelectorAll("[data-mapkey],[data-mapvalue]").forEach(input =>
      input.addEventListener(input.tagName === "SELECT" ? "change" : "input", write));
    // Rows are added and removed by rebuilding, so the caller re-renders rather than patching HTML.
    const add = mapNode.querySelector("[data-mapadd]");
    if (add) add.onclick = () => { addConfigMapRow(step, label, prefix, mapNode); onChange(); };
    mapNode.querySelectorAll("[data-mapdel]").forEach(button => button.onclick = () => {
      removeConfigMapRow(step, label, prefix, mapNode, +button.dataset.mapdel); onChange();
    });
  });
}

function configMapKeyOf(prefix, mapNode) { return mapNode.dataset.cfg.slice(prefix.length + 1); }

function addConfigMapRow(step, label, prefix, mapNode) {
  const config = parseConfigObject(step.config);
  const key = configMapKeyOf(prefix, mapNode);
  const map = config[key] && typeof config[key] === "object" ? config[key] : {};
  // A blank key would be dropped on read, so the placeholder row is keyed until it is filled in.
  map[""] = map[""] ?? "";
  config[key] = map;
  step.config = JSON.stringify(config);
}

function removeConfigMapRow(step, label, prefix, mapNode, at) {
  const config = parseConfigObject(step.config);
  const key = configMapKeyOf(prefix, mapNode);
  const entries = Object.entries(config[key] || {});
  entries.splice(at, 1);
  config[key] = Object.fromEntries(entries);
  step.config = JSON.stringify(config);
}

/** What a step is configured to do, in a phrase — so a collapsed row still says something. */
function transformConfigSummary(label, configJson, columns) {
  const spec = transformSpecFor(label);
  const known = transformByLabel(label);
  if (!spec) return known && !known.live ? "Stored, not applied yet" : "No settings";

  const config = parseConfigObject(configJson);
  const nameOf = key => (columns.find(c => c.key === key) || { label: key }).label;
  const parts = [];
  for (const field of spec) {
    const value = config[field.key];
    if (value == null || value === "") continue;
    if (field.kind === "columnList") parts.push(value.map(nameOf).join(", "));
    else if (field.kind === "column") parts.push(nameOf(value));
    else if (field.kind === "columnMap" || field.kind === "valueMap") {
      const count = Object.keys(value).filter(Boolean).length;
      if (count) parts.push(`${count} ${count === 1 ? "entry" : "entries"}`);
    } else if (field.kind === "boolean") parts.push(value ? field.label.toLowerCase() : `no ${field.label.toLowerCase()}`);
    else parts.push(`${field.label.toLowerCase()}: ${value}`);
  }

  return parts.length ? parts.join(" · ") : "Not configured yet";
}

/** The columns a transform can name: the aliases rows actually arrive under. */
function transformColumnsOfDraft(draft) {
  const catalogue = draftColumnCatalogue(draft);
  return (draft.columns || []).map(key => {
    const found = catalogue.find(a => a.a === key);
    return { key, label: found ? columnHeadingFor(found) : key };
  });
}

function transformColumnsOfReport(report) {
  return (report.columns || [])
    .filter(column => column.attribute || column.sourceAlias)
    .map(column => ({ key: column.sourceAlias || column.attribute, label: column.name || column.attribute }));
}

function wizETLFlow(host, d) {
  d._etlpos = d._etlpos || {};
  const pos = (id,x,y) => { if (!d._etlpos[id]) d._etlpos[id] = {x,y}; return d._etlpos[id]; };
  const extract = [{id:"src0",label:d.mainEntity || "(no table)"},
    ...(isCrmViewSource(d.sourceType) ? [] : d.joins.map((j,i)=>({id:"srcj"+i,label:j.entity||"(join)"}))),
    ...d.externalSources.map((x,i)=>({id:"srcx"+i,label:x.connector||"(external)"}))];
  let nodes = "";
  extract.forEach((s,i)=>{ const p = pos(s.id, 24, 24+i*92); nodes += canvasNode(s.id, "c-extract", s.label, `<div class="kv"><span>stage</span><b>Extract</b></div>`, p.x, p.y, ""); });
  d.etl.forEach((s,i)=>{ const p = pos("t"+i, 300, 34+i*92); nodes += canvasNode("t"+i, "c-transform", s.op, `<div class="kv"><span>seq</span><b>${s.seq}</b></div><div class="kv"><span>on</span><b>${esc(s.target==="(all columns)"?"all":(s.target||"all"))}</b></div>`, p.x, p.y, `data-tdel="${i}"`); });
  const lp = pos("load", 596, 54); nodes += canvasNode("load", "c-load", "Report output", `<div class="kv"><span>layout</span><b>${esc(d.layoutType)}</b></div>`, lp.x, lp.y, "");

  host.innerHTML = `<div class="wtitle">Transform — ETL flow canvas</div><div class="wsub">Click a step to configure it here; drag to arrange the Extract → Transform → Load flow.</div>
    <div class="canvas-toolbar">${TRANSFORMS.filter(t=>t.live).slice(0,5).map(t=>`<button class="btn sm" data-fquick="${esc(t.label)}" title="${esc(t.desc)}">${ic("add")}${esc(t.label)}</button>`).join("")}<span class="canvas-hint">${d.etl.length} step(s)</span></div>
    <div class="canvas-grid">
      <div>
        <div class="canvas-wrap" id="et_canvas"><svg class="canvas-svg" id="et_svg"></svg>${nodes}</div>
        <div class="canvas-hint">Blue = extract feed · amber = transform chain · green = load into the report layout.</div>
      </div>
      <div class="node-props" id="et_props"></div>
    </div>`;

  const canvas = $("#et_canvas"), svg = $("#et_svg");
  const redraw = () => { const conns = []; const q = id => canvas.querySelector('[data-node="'+id+'"]');
    if (d.etl.length) { extract.forEach(s=>conns.push({from:q(s.id),to:q("t0"),color:"var(--primary)"})); for (let i=0;i<d.etl.length-1;i++) conns.push({from:q("t"+i),to:q("t"+(i+1)),color:"var(--warning)"}); conns.push({from:q("t"+(d.etl.length-1)),to:q("load"),color:"var(--success)"}); }
    else extract.forEach(s=>conns.push({from:q(s.id),to:q("load"),color:"var(--primary)"}));
    drawWires(svg, conns); };

  const paintSelection = () => canvas.querySelectorAll(".node").forEach(n => n.classList.toggle("sel", n.dataset.node === d._etlSel));
  const renderProps = () => {
    const panel = $("#et_props");
    panel.innerHTML = etlNodeProps(d, d._etlSel, extract);
    bindEtlNodeProps(panel, d, () => wizETLFlow(host, d), redraw);
  };

  canvas.querySelectorAll(".node").forEach(n => {
    makeNodeDraggable(n, () => { const p = d._etlpos[n.dataset.node]; if (p) { p.x=parseFloat(n.style.left)||0; p.y=parseFloat(n.style.top)||0; } redraw(); });
    n.addEventListener("mousedown", () => { d._etlSel = n.dataset.node; paintSelection(); renderProps(); });
  });
  canvas.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); d.etl.splice(+b.dataset.tdel,1); d._etlpos={}; d._etlSel=null; wizETLFlow(host,d); });
  // The step is selected as it is added, so its configuration is the next thing in front of you.
  host.querySelectorAll("[data-fquick]").forEach(b=>b.onclick=()=>{ const op=b.dataset.fquick;
    d.etl.push({op, target:"(all columns)", config:"", seq:d.etl.length+1});
    d._etlpos={}; d._etlSel="t"+(d.etl.length-1); wizETLFlow(host,d); });

  paintSelection();
  renderProps();
  redraw();
}

/** The editor for the selected step, or a description of a stage that has nothing to configure. */
function etlNodeProps(d, selected, extract) {
  if (!selected) {
    return `<h4>Properties</h4><div class="np-sub">Nothing selected</div>
      <div class="np-empty">Click a step on the canvas to configure it, or add one from the toolbar.</div>`;
  }

  if (selected === "load") {
    return `<h4>Report output</h4><div class="np-sub">Where the transformed rows land</div>
      <div class="field"><label class="lbl">Layout</label><input class="fluent-input" value="${esc(d.layoutType)}" disabled></div>
      <div class="np-empty">The layout is chosen in the Layout step.</div>`;
  }

  if (selected.startsWith("src")) {
    const source = extract.find(s => s.id === selected);
    return `<h4>${esc(source ? source.label : "Source")}</h4><div class="np-sub">Feeds rows into the chain</div>
      <div class="np-empty">Extract sources come from the Data step — the table, its joins, and any external systems.</div>`;
  }

  const i = +selected.slice(1), step = d.etl[i];
  if (!step) return `<h4>Properties</h4><div class="np-empty">This step no longer exists.</div>`;
  const columns = transformColumnsOfDraft(d);
  const described = (ETL_OPS.find(o => o.op === step.op) || {}).desc || "";

  return `<h4>${esc(step.op)}</h4><div class="np-sub">${esc(described)}</div>
    <div class="field"><label class="lbl">Operation</label><select class="fluent-select" data-ei="${i}" data-ek="op" data-rerender>${ETL_OPS.map(o=>`<option ${o.op===step.op?"selected":""}>${esc(o.op)}</option>`).join("")}</select></div>
    <div class="field"><label class="lbl">Applies to</label><select class="fluent-select" data-ei="${i}" data-ek="target">${opts(["(all columns)",...columns.map(c=>c.label)], step.target||"(all columns)")}</select></div>
    ${transformConfigHtml(step.op, step.config, columns, "etlcv")}
    <div class="field"><label class="lbl">Sequence</label><input class="fluent-input" type="number" data-ei="${i}" data-ek="seq" data-num value="${step.seq}"></div>`;
}

/**
 * Binds the step editor. Only changes the box itself shows — the operation, what it applies to, its
 * order — rebuild the canvas; typing a config redraws nothing, so the caret stays put.
 */
function bindEtlNodeProps(panel, d, rebuild, redraw) {
  panel.querySelectorAll("[data-ei]").forEach(input => input.addEventListener(input.tagName==="SELECT"?"change":"input", () => {
    const step = d.etl[+input.dataset.ei];
    step[input.dataset.ek] = input.dataset.num ? +input.value : input.value;
    // Changing the operation changes which settings exist, so the old ones cannot be carried over.
    if (input.dataset.ek === "op") step.config = "";
    rebuild();
  }));
  const step = d.etl[+((panel.querySelector("[data-ei]") || {}).dataset || {}).ei];
  if (step) bindTransformConfig(panel, step.op, "etlcv", step, rebuild, transformColumnsOfDraft(d));
}
function wizETLList(host, d) {
  const extract = [d.mainEntity, ...d.joins.map(j=>j.entity), ...d.externalSources.map(x=>x.connector)].filter(Boolean);
  const layoutCatalogue = draftColumnCatalogue(d);
  const columns = transformColumnsOfDraft(d);
  const colNames = columns.map(c => c.label);
  // The settings no longer fit a table cell, so the row summarises them and expands to edit.
  const stepRows = d.etl.length ? d.etl.map((s,i)=>`<tr>
      <td class="handle">${ic("flow")}</td>
      <td><input class="fluent-input" type="number" data-ei="${i}" data-ek="seq" data-num value="${s.seq}" style="width:52px"></td>
      <td><select class="fluent-select" data-ei="${i}" data-ek="op" data-rerender>${ETL_OPS.map(o=>`<option ${o.op===s.op?"selected":""}>${esc(o.op)}</option>`).join("")}</select><div class="hint-inline">${esc((ETL_OPS.find(o=>o.op===s.op)||{}).desc||"")}</div></td>
      <td><select class="fluent-select" data-ei="${i}" data-ek="target">${opts(["(all columns)",...colNames], s.target||"(all columns)")}</select></td>
      <td><button class="btn sm" data-ecfg="${i}">${d._etlOpen===i?"Hide settings":"Settings"}</button>
        <div class="hint-inline"${d._etlOpen===i?' id="etlrow_summary"':""}>${esc(transformConfigSummary(s.op, s.config, columns))}</div></td>
      <td><button class="del" data-edel="${i}">${ic("trash")}</button></td></tr>
      ${d._etlOpen===i?`<tr><td></td><td colspan="5" style="background:var(--surface-alt)"><div id="wz_etlcfg" style="padding:10px 4px;max-width:520px">${transformConfigHtml(s.op, s.config, columns, "etlrow")}</div></td></tr>`:""}`).join("")
    : `<tr class="empty-row"><td colspan="6">No transform steps — data flows straight through. Add steps to clean, reshape, aggregate or enrich.</td></tr>`;
  const stageBox = (n,title,inner,hot) => `<div style="flex:1;min-width:160px;border:1px solid ${hot?"var(--primary)":"var(--border-strong)"};${hot?"background:var(--primary-tint-2);":""}border-radius:6px;padding:12px 14px"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--primary);font-weight:700">${n} · ${title}</div><div style="font-size:12px;margin-top:6px">${inner}</div></div>`;
  host.innerHTML = `<div class="wtitle">Transform your data <span class="rel-tag">ETL</span></div><div class="wsub">Build an Extract → Transform → Load pipeline. Steps run top-to-bottom on the combined dataset (CRM joins + external sources) before it reaches the layout.</div>
    <div style="display:flex;gap:10px;align-items:stretch;margin-bottom:18px;flex-wrap:wrap">
      ${stageBox(1,"Extract", extract.map(e=>`<span class="ent-chip" style="margin:2px 4px 2px 0;padding:2px 8px">${esc(e)}</span>`).join("")||"—", false)}
      <div style="display:flex;align-items:center;color:var(--text-secondary);font-size:18px">▸</div>
      ${stageBox(2,"Transform", `${d.etl.length} step(s)`, true)}
      <div style="display:flex;align-items:center;color:var(--text-secondary);font-size:18px">▸</div>
      ${stageBox(3,"Load", `${esc(d.layoutType)} · ${colNames.length} columns`, false)}
    </div>
    <div class="section-card" style="max-width:980px"><h3>Transform steps</h3><div class="hint">Ordered pipeline. Stored in <span class="kbd">qdb_reporttransformation</span>. Formulas use the sandboxed NCalc engine.</div>
      <div style="overflow-x:auto"><table class="subgrid"><thead><tr><th style="width:24px"></th><th>Seq</th><th>Operation</th><th>Target</th><th>Config</th><th></th></tr></thead><tbody>${stepRows}</tbody></table></div>

/* Theme + language aware wrappers */
function logoBox(dataUrl) { return dataUrl ? `<img src="${dataUrl}" alt="logo" style="width:40px;height:40px;object-fit:contain;border-radius:6px">` : `<div class="rp-logo">RE</div>`; }
function themeStyle(themeId) {
  const t = THEMES.find(x=>x.id===themeId) || THEMES[0];
  return `--ac:${t.accent};--acd:${t.accent};--acb:${t.tint};--acb2:${t.tint};--acl:${t.tint};--rp-font:${t.font}`;

function kpiTiles(cols, rows) {
  if (!cols || !cols.length || !rows || !rows.length) return "";
  const valCol = cols.find(c=>["Currency","Decimal","Whole number"].includes(c.type));
  // pick a real grouping column: a category that actually repeats (distinct < rows), preferring option set / lookup
  let catCol = null, bestDistinct = Infinity;
  cols.filter(c=>["Text","Option set","Lookup"].includes(c.type)).forEach(c => { const dcount = new Set(rows.map(r=>r[c.key])).size; const boost = (c.type==="Option set"||c.type==="Lookup")?0.5:1; if (dcount>1 && dcount<rows.length && dcount*boost<bestDistinct) { bestDistinct = dcount*boost; catCol = c; } });
  const sum = valCol ? rows.reduce((s,r)=>s+(+r[valCol.key]||0),0) : 0;
  const tiles = [["Records", rows.length]];
  if (valCol) { tiles.push(["Total " + valCol.name, money(sum)]); tiles.push(["Average", money(sum/rows.length)]); }
  if (catCol) tiles.push([catCol.name + " groups", new Set(rows.map(r=>r[catCol.key])).size]);
  return `<div class="kpi-row">${tiles.map(t=>`<div class="kpi-tile"><div class="kpi-label">${esc(String(t[0]))}</div><div class="kpi-value">${esc(String(t[1]))}</div></div>`).join("")}</div>`;
}

/**
 * Removes columns the chosen source cannot return, and says so.
 *
 * Switching to a view after picking columns leaves selections the view does not select. The picker
 * would stop offering them while they stayed in the report, so they would survive to runtime as
 * empty columns nobody chose to keep.
 */
function dropColumnsTheSourceCannotSupply(draft) {
  const available = new Set(draftColumnCatalogue(draft).map(a => a.a));
  const dropped = draft.columns.filter(attribute => !available.has(attribute));
  if (!dropped.length) return;

  draft.columns = draft.columns.filter(attribute => available.has(attribute));
  dropped.forEach(attribute => delete draft.colMeta[attribute]);
  toast(`${dropped.length} column${dropped.length > 1 ? "s" : ""} removed — ${esc(draft.dataSourceQuery)} does not return ${dropped.length > 1 ? "them" : "it"}.`, "warn");
}

async function wizNext() {
  const d = wiz.draft, key = WIZ_STEPS[wiz.step].key;
  if (key === "start") {
    // Awaited: duplicating reads the stored definition, and advancing before it lands would show
    // the next step with none of the copied columns in it.
    await applyStart(d);

    d.name = $("#wz_name").value.trim(); d.description = $("#wz_description").value; d.category = $("#wz_category").value;
    d.module = $("#wz_module").value; d.owner = $("#wz_owner").value; d.governed = $("#wz_governed").checked;
    if (!d.name) { toast("Report name is required", "warn"); return; }
  } else if (key === "data") {
    if (!d.mainEntity) { toast("Pick a main entity", "warn"); return; }
    if (isCrmViewSource(d.sourceType) && !d.dataSourceQuery) {
      toast("Pick the saved view this report reads", "warn");
      return;
    }
    dropColumnsTheSourceCannotSupply(d);
  } else if (key === "columns") {
    if (!d.columns.length) { toast("Select at least one column", "warn"); return; }

  if (wiz.step < WIZ_STEPS.length - 1) { wiz.step++; renderWizard(); } else wizCreate();

/* Re-reads the report's rows and reports what actually came back. This used to close the dialog and
   toast "9 rows in 0.4s" whatever happened — a fixed number, for a query it never ran. */
async function runReportPreview(report) {
  const cols = reportPreviewCols(report);
  if (!report.mainEntity) return { ok: false, message: "Pick a main entity before running the report." };
  if (!cols.length) return { ok: false, message: "Select at least one column before running the report." };

  const key = previewKey(report.mainEntity, cols);
  delete previewData.byKey[key];
  const startedAt = performance.now();
  await loadPreviewRows(key, report.mainEntity, cols);
  const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);
  const rows = previewData.byKey[key] || [];
  return rows.length
    ? { ok: true, message: `Report executed — ${rows.length} row${rows.length === 1 ? "" : "s"} in ${seconds}s` }
    : { ok: false, message: `No rows returned from ${report.mainEntity} in ${seconds}s` };
}

/** Row selection driving the command bar, for the lists that act on a selected record. */
function wireRowCommands(scroll, commands) {
  let selectedId = null;
  const refresh = () => commands.forEach(cmd => { $("#" + cmd.id).disabled = !selectedId; });
  scroll.querySelectorAll("tbody tr[data-id]").forEach(row => {
    row.addEventListener("click", () => {
      scroll.querySelectorAll("tbody tr").forEach(other => other.classList.remove("selected"));
      row.classList.add("selected");
      selectedId = row.dataset.id;
      refresh();
    });
    const link = row.querySelector(".link-cell");
    if (link) link.addEventListener("click", e => {
      e.stopPropagation();
      const open = commands.find(cmd => cmd.isDefault);
      if (open) open.run(row.dataset.id);
    });
  });
  commands.forEach(cmd => {
    $("#" + cmd.id).onclick = () =>
      selectedId && withBusyButton("#" + cmd.id, cmd.busyLabel || cmd.label + "…", async () => cmd.run(selectedId));
  });
}

/* The log is written with the system identity so a user cannot suppress their own trail, which means
   ownerid names the system, not the person who ran the report. Their id is in the summary. */
const ACTING_USER_PATTERN = /user=([0-9a-f-]{36})/i;
function actingUserIdOf(summary) {
  const match = ACTING_USER_PATTERN.exec(summary || "");
  return match ? match[1] : null;
}
function outcomeFromSummary(summary) {
  return /outcome=success/i.test(summary || "") ? "Success" : (summary ? "Failed" : null);
}

/* Names for the ids found in those summaries, resolved once per set of logs so the audit view reads
   as people rather than GUIDs. */
const userNames = { byId: {}, pending: false };
async function resolveUserNames(ids) {
  const missing = [...new Set(ids.filter(id => id && !userNames.byId[id]))];
  if (!missing.length || userNames.pending) return;
  userNames.pending = true;
  beginBusy("Resolving users…");
  try {
    const filter = missing.map(id => `systemuserid eq ${id}`).join(" or ");
    for (const user of await dvList("systemuser", `?$select=systemuserid,fullname&$filter=${filter}`)) {
      userNames.byId[user.systemuserid] = user.fullname;
    }
    for (const id of missing) userNames.byId[id] = userNames.byId[id] || "(unknown user)";
  } catch (error) {
    for (const id of missing) userNames.byId[id] = "(unresolved)";
  }
  userNames.pending = false;
  endBusy("Resolving users…");
  render();
}

/* ---------------- Record forms ----------------
   The connector form's dropdowns are built from option-set metadata rather than listed here. They
   used to offer "Web API", "Certificate" and "Managed Identity", none of which are in the org's
   option sets — choiceCode returned null and the field was dropped on save, so a connector could be
   created with no type and no auth mode and nothing said so. */
const FORM_SPECS = {
  connector: {
    title: "External Connector", table: "qdb_externalconnector", saveLabel: "Save",
    banner: "Secrets are stored as <b>Key Vault references</b> — enter the secret <em>name</em>, never the secret value itself (condition C-9).",
    fields: () => [
      { key:"name", label:"Name", required:true, placeholder:"e.g. Core Banking API", full:true },
      { key:"type", label:"Connector type", type:"select", required:true,
        options: connectorChoiceLabels("qdb_connectortype") },
      { key:"auth", label:"Auth mode", type:"select", required:true,
        options: connectorChoiceLabels("qdb_authmode") },
      { key:"url", label:"Endpoint URL", placeholder:"https://… (no credentials)", full:true,
        hint:"Must be https, and must not carry a user name or password." },
      { key:"secret", label:"Credential reference (Key Vault)", placeholder:"kv:my-secret-name",
        hint:"The secret's NAME. The value itself must never reach Dataverse." },
      { key:"timeout", label:"Timeout (seconds)", type:"number", value:"30" },
      { key:"retry", label:"Retry count", type:"number", value:"0" },
      { key:"region", label:"Residency region", placeholder:"e.g. Qatar Central" },
      { key:"headers", label:"Default headers (JSON)", type:"textarea", full:true,
        placeholder:'{ "Accept": "application/json" }', hint:"Sent with every call. Never put a credential here." },
      { key:"active", label:"Active", type:"toggle", toggleLabel:"Active", value:true }
    ],
    validate: validateConnector,
    onSave: saveConnector
  },
};

const connectorChoiceLabels = attribute =>
  optionSetOf("qdb_externalconnector", attribute).map(o => o.label);

/**
 * Rejects what must not be stored, with the reason. Returns a message, or null when the values are
 * acceptable.
 *
 * The endpoint rules are not cosmetic: an outbound banking integration over http is a finding on its
 * own, and credentials in the URL's userinfo would be written to Dataverse in clear and echoed into
 * every log line that prints the connector.
 */
function validateConnector(values) {
  const url = (values.url || "").trim();
  if (url) {
    let parsed;
    try { parsed = new URL(url); } catch (error) { return "Endpoint URL is not a valid URL."; }
    if (parsed.protocol !== "https:") return "Endpoint URL must use https.";
    if (parsed.username || parsed.password) return "Endpoint URL must not contain a user name or password.";
  }
  if (looksLikeASecret(values.secret)) {
    return "That looks like a secret value, not a reference. Enter the Key Vault secret NAME instead.";
  }
  for (const [key, label] of [["timeout", "Timeout"], ["retry", "Retry count"]]) {
    const raw = String(values[key] ?? "").trim();
    if (raw && (!/^\d+$/.test(raw) || Number(raw) > 3600)) return `${label} must be a whole number of 3600 or less.`;
  }

  const headers = (values.headers || "").trim();
  if (headers) {
    let parsed;
    try { parsed = JSON.parse(headers); } catch (error) { return "Default headers must be valid JSON."; }
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return "Default headers must be a JSON object.";
    // A header is the other place a credential gets pasted by accident, and it would be stored in clear.
    const credentialHeader = Object.keys(parsed).find(name => /^(authorization|x-api-key|api-key|cookie)$/i.test(name));
    if (credentialHeader) return `Remove the "${credentialHeader}" header — credentials belong in the credential reference, not here.`;
  }
  return null;
}

/* A reference is a short name. Anything long, or carrying the punctuation of an encoded token or a
   connection string, is far more likely to be the credential itself being pasted by mistake. */
function looksLikeASecret(reference) {
  const value = (reference || "").trim();
  if (!value) return false;
  return value.length > 120
    || /password\s*=|pwd\s*=|secret\s*=|apikey\s*=/i.test(value)
    || /^ey[A-Za-z0-9_-]{20,}\./.test(value);
}

/** Creates or updates, depending on whether the form was opened on an existing record. */
async function saveConnector(values, existingId) {
  const attributes = defined({
    qdb_name: values.name,
    qdb_connectortype: choiceCode("qdb_externalconnector", "qdb_connectortype", values.type),
    qdb_authmode: choiceCode("qdb_externalconnector", "qdb_authmode", values.auth),
    qdb_endpointurl: values.url || null,
    // The reference to a secret, not a secret. Never store the value itself (condition C-9).
    qdb_credentialreference: values.secret || null,
    qdb_timeoutseconds: values.timeout ? Number(values.timeout) : null,
    qdb_retrycount: values.retry ? Number(values.retry) : null,
    qdb_residencyregion: values.region || null,
    qdb_headersjson: values.headers || null,
    qdb_isactive: !!values.active
  });

  beginBusy(existingId ? "Saving connector…" : "Creating connector…");
  try {
    if (existingId) await dvUpdate("qdb_externalconnector", existingId, attributes);
    else await dvCreate("qdb_externalconnector", attributes);
    toast(existingId ? "Connector updated" : "Connector created in Dataverse", "ok");
    connectorCatalog.refresh();
  } catch (error) {
    toast("Couldn't save the connector — " + error.message, "err");
  } finally {
    endBusy(existingId ? "Saving connector…" : "Creating connector…");
  }
}

/**
 * Deletes a connector, unless a data source still points at it.
 *
 * Dataverse would happily null the lookups and leave those reports silently reconfigured to read
 * Dataverse instead — a change nobody asked for and nothing records. Naming the reports lets the
 * author decide.
 */
async function deleteConnector(connector) {
  const users = dataSourceCatalog.get().filter(source => source.connectorId === connector.id);
  if (users.length) {
    const reports = [...new Set(users.map(source => source.report).filter(Boolean))];
    toast(`“${connector.name}” is used by ${users.length} data source${users.length === 1 ? "" : "s"}`
      + (reports.length ? ` in ${reports.join(", ")}` : "") + " — remove those first.", "warn");
    return;
  }
  beginBusy("Deleting connector…");
  try {
    await dvDelete("qdb_externalconnector", connector.id);
    toast("Connector deleted", "ok");
    await connectorCatalog.refresh();
  } catch (error) {
    toast("Delete failed — " + error.message, "err");
  } finally {
    endBusy("Deleting connector…");
  }
}

/** Disabling is the reversible alternative to deleting one that is in use. */
async function toggleConnectorActive(connector) {
  beginBusy(connector.isActive ? "Disabling connector…" : "Enabling connector…");
  try {
    await dvUpdate("qdb_externalconnector", connector.id, { qdb_isactive: !connector.isActive });
    toast(connector.isActive ? `“${connector.name}” disabled` : `“${connector.name}” enabled`, "ok");
    await connectorCatalog.refresh();
  } catch (error) {
    toast("Couldn't change the connector — " + error.message, "err");
  } finally {
    endBusy(connector.isActive ? "Disabling connector…" : "Enabling connector…");
  }
}

/**
 * Opens a record form. With `existing` it edits that record — the same spec, pre-filled — so create
 * and edit cannot drift apart into two forms that accept different things.
 */
function openEntityForm(entityKey, existing) {
  const spec = FORM_SPECS[entityKey]; if (!spec) return;
  // Fields are a function so their choices come from metadata each time the form opens.
  const fields = (typeof spec.fields === "function" ? spec.fields() : spec.fields)
    .map(field => existing && existing[field.key] !== undefined ? { ...field, value: existing[field.key] } : field);

  const scrim = el(`<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" style="width:600px">
    <div class="dialog-head"><div><h3>${esc(spec.title)}</h3><div class="page-sub" style="margin-top:2px">${existing ? "Edit" : "New"} record · <span class="kbd">${esc(spec.table)}</span></div></div><button class="close-x" aria-label="Close">✕</button></div>
    <div class="dialog-body">
      ${spec.banner?`<div class="info-banner">${ic("info")}<div>${spec.banner}</div></div>`:""}
      <div class="field-grid">${fields.map(fieldHtml).join("")}</div>
    </div>
    <div class="dialog-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="efSave">${ic("save")}${esc(spec.saveLabel||"Save")}</button></div>
  </div></div>`);
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.querySelector(".close-x").onclick = close;
  scrim.querySelector("[data-close]").onclick = close;
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  scrim.querySelector("#efSave").onclick = () => {
    const values = {};
    fields.forEach(f => { const n = scrim.querySelector(`[data-f="${f.key}"]`); values[f.key] = n.type==="checkbox" ? n.checked : n.value; });

    const missing = fields.find(f => f.required && !String(values[f.key]||"").trim());
    if (missing) { toast(`${missing.label} is required`, "warn"); return; }
    // Validation happens at the boundary, before anything is written.
    const rejection = spec.validate ? spec.validate(values) : null;
    if (rejection) { toast(rejection, "warn"); return; }

    close();
    spec.onSave(values, existing && existing.id);
  };
}

/* A real table has hundreds of attributes, so a tile asks for the ones it is bound to plus a few for
   the table widget to show — not every column in the entity, which would be an unreadable tile and a
   needlessly wide query. */
const DASH_TILE_COLUMN_LIMIT = 8;

/* The same curated list the field rail offers. Taking the first few of everything put deprecated
   process columns and identifiers into table widgets, where they rendered as columns of "undefined". */
function dashEntityCols(entity) {
  return usefulAttributes(entity).slice(0, DASH_TILE_COLUMN_LIMIT).map(c => ({ name:c.n, key:c.a, type:c.t }));
}

/** The tile's own bindings always come back, even if they fall outside the display slice. */
function dashTileCols(tile) {
  const bound = [tile.groupBy, tile.measure].filter(Boolean);
  const extra = attributesOf(tile.entity)
    .filter(c => bound.includes(c.a))
    .map(c => ({ name:c.n, key:c.a, type:c.t }));
  const shown = dashEntityCols(tile.entity);
  const seen = new Set(shown.map(c => c.key));
  return shown.concat(extra.filter(c => !seen.has(c.key)));
}

/* ---------- dashboard data sources ----------
   A widget reads either a table directly or a named data source, which is a saved query the
   dashboard owns. Only the three types that this screen can actually execute are offered: a widget
   bound to SQL or Core Banking would save perfectly and draw nothing, because dashboards render in
   the browser and have no server-side runtime executing sources the way qdb_RunReport does for
   reports. The rest are named on screen as waiting for that runtime rather than being offered and
   silently discarded. */
const DASHBOARD_SOURCE_TYPES = ["CRM View", "FetchXML", "Static Dataset"];
const DEFERRED_SOURCE_TYPES = ["QueryExpression", "Dataverse Web API", "Custom API / Plugin", "SQL",
  "External REST API", "Middleware API", "Core Banking API", "MIS API"];

const dashboardSources = dashboard => (dashboard && dashboard.dataSources) || [];
const findSource = (dashboard, id) => dashboardSources(dashboard).find(source => source.id === id) || null;
const widgetSource = widget => widget.sourceId ? findSource(state.dashboard, widget.sourceId) : null;

const sourceData = { byKey: {}, pending: {} };
const sourceKey = (source, cols) =>
  `${source.id}|${source.type}|${source.entity}|${source.query}|${cols.map(c => c.key).join(",")}`;

/** A static dataset is its own payload — no query to run, so it resolves without a round trip. */
function staticDatasetRows(source) {
  try {
    const parsed = JSON.parse(source.query || "[]");
    return Array.isArray(parsed) ? parsed : [];
  } catch (error) {
    return [];
  }
}

/* A view and a hand-written FetchXML are used exactly as authored — choosing one is a statement
   about which rows the widget should see, and rewriting it would quietly overrule that. */
function executableFetchXml(source) {
  if (source.type === "FetchXML") return source.query || "";
  const view = viewsOf(source.entity).find(candidate => candidate.name === source.query);
  return view ? view.fetchXml : "";
}

function sourceRows(source, cols) {
  if (source.type === "Static Dataset") return staticDatasetRows(source);
  const key = sourceKey(source, cols);
  if (!sourceData.byKey[key]) { loadSourceRows(key, source, cols); return []; }
  return sourceData.byKey[key];
}

async function loadSourceRows(key, source, cols) {
  if (sourceData.pending[key]) return;
  const fetchXml = executableFetchXml(source);
  if (!fetchXml) { sourceData.byKey[key] = []; return; }
  sourceData.pending[key] = true;
  beginBusy(`Reading ${source.name}…`);
  try {
    const rows = await dvList(source.entity, "?fetchXml=" + encodeURIComponent(fetchXml));
    sourceData.byKey[key] = rows.map(row => toPreviewRow(row, cols));
  } catch (error) {
    // A view the user cannot read, or FetchXML that no longer parses: an empty result is the honest
    // answer, and the tile says the source returned nothing rather than inventing rows.
    sourceData.byKey[key] = [];
  }
  delete sourceData.pending[key];
  endBusy(`Reading ${source.name}…`);
  render();
}

function dashRows(tile) {
  const source = widgetSource(tile);
  return source ? sourceRows(source, dashTileCols(tile)) : previewRows(dashTileCols(tile), tile.entity);
}

/**
 * Whether the widget's bindings survive the source it reads through.
 *
 * A view selects the columns it selects. Group a widget by a field the view does not return and
 * every row reads undefined there — which draws as a chart of one slice called "undefined", the
 * exact failure this project has just finished fixing. Saying so is far better than drawing it.
 */
function bindingProblem(widget) {
  const source = widgetSource(widget);
  if (!source || source.type === "Static Dataset") return null;
  const rows = dashRows(widget);
  if (!rows.length) return null;
  const missing = [widget.groupBy, widgetIsMeasured(widget) ? widget.measure : null]
    .filter(Boolean)
    .filter(attribute => rows[0][attribute] === undefined);
  return missing.length ? `${source.name} does not return ${missing.join(" or ")}.` : null;
}
function defaultBind(entity) {
  const cols = attributesOf(entity);
  const groupBy = (cols.find(c=>["Option set","Lookup"].includes(c.t)) || cols.find(c=>c.t==="Text") || cols[0] || {}).a || "";
  const measure = (cols.find(c=>c.t==="Currency") || cols.find(c=>["Decimal","Whole number"].includes(c.t)) || {}).a || "";
  return { groupBy, measure };
}
function dashAgg(rows, key, agg) {
  if (agg==="Count" || !key) return rows.length;
  const vals = rows.map(r=>+r[key]||0);
  if (!vals.length) return 0;
  if (agg==="Average") return vals.reduce((a,b)=>a+b,0)/vals.length;
  if (agg==="Max") return Math.max(...vals);
  if (agg==="Min") return Math.min(...vals);
  return vals.reduce((a,b)=>a+b,0);
}
function dashGroup(rows, gkey, mkey, agg) {
  const gs = [...new Set(rows.map(r=>r[gkey]))];
  return gs.map((g,i)=>({ label:g, v: dashAgg(rows.filter(r=>r[gkey]===g), mkey, agg), color: CHART_PALETTE[i%CHART_PALETTE.length] }));

function isCurrencyCol(entity, attr) { return (attributesOf(entity).find(c=>c.a===attr)||{}).t === "Currency"; }
function fmtMeasure(entity, attr, agg, v) {

function compactNum(v, currency) {

  if (abs >= 1e9) s = (v/1e9).toFixed(2) + "bn";
  else if (abs >= 1e6) s = (v/1e6).toFixed(2) + "M";
  else if (abs >= 1e3) s = (v/1e3).toFixed(1) + "K";

function compactMeasure(entity, attr, agg, v) {

function gaugeSvg(pct) {

function renderWidget(tile) {

  Object.keys(flt).forEach(k => { const parts = k.split("|"); if (parts[0]===entity && flt[k]!=="") rows = rows.filter(r=>String(r[parts[1]])===String(flt[k])); });
  const cols = dashEntityCols(entity);
  const isCur = isCurrencyCol(entity, tile.measure);
  const grouped = () => dashGroup(rows, tile.groupBy, tile.measure, tile.agg);
  const numCell = c => ["Currency","Decimal","Whole number"].includes(c.type);
  switch (tile.widget) {
    case "metric": {
      const v = dashAgg(rows, tile.measure, tile.agg);
      const label = tile.measure ? (cols.find(c=>c.key===tile.measure)||{}).name : "Records";
      return `<div class="w-metric"><div class="w-metric-val">${compactMeasure(entity, tile.measure, tile.agg, v)}</div><div class="w-metric-lbl">${esc(tile.agg)} · ${esc(label||"")}</div></div>`;
    }
    case "chart": return `<div class="chart-wrap">${renderChart(tile.chartType||"Column", grouped(), isCur)}</div>`;
    case "infocards": {
      return `<div class="info-cards">${grouped().map(d=>`<div class="info-card" style="cursor:default"><span class="ic-badge" style="background:${d.color}">${ic(tile.cardIcon||"money")}</span><span class="ic-body"><span class="ic-label">${esc(d.label)}</span><span class="ic-total">${isCur?money(d.v):Math.round(d.v).toLocaleString()}</span></span></div>`).join("")}</div>`;
    }
    case "table": {
      const cc = cols.slice(0,5);
      return `<table class="rp-table"><thead><tr>${cc.map(c=>`<th class="${numCell(c)?"num":""}">${esc(c.name)}</th>`).join("")}</tr></thead><tbody>${rows.slice(0,6).map(r=>`<tr>${cc.map(c=>`<td class="${numCell(c)?"num":""}">${esc(fmtDashCell(c, r[c.key]))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }
    case "gauge": {
      const data = grouped(), total = data.reduce((s,d)=>s+d.v,0)||1, top = Math.max(...data.map(d=>d.v), 0);
      return gaugeSvg(top/total*100);
    }
    case "progress": {
      const val = dashAgg(rows, tile.measure, "Sum"), limit = val*1.35 || 1, pct = Math.round(val/limit*100);
      return `<div class="w-progress"><div class="w-prog-top"><span>${compactNum(val, isCur)}</span><span class="w-prog-pct">${pct}%</span></div><div class="w-prog-track"><div class="w-prog-fill" style="width:${pct}%"></div></div><div class="w-prog-sub">of ${compactNum(limit, isCur)} limit</div></div>`;
    }
    case "profile": {
      const r0 = rows[0] || {};
      return `<div class="w-profile">${cols.slice(0,6).map(c=>`<div class="w-prow"><span class="w-pk">${esc(c.name)}</span><span class="w-pv">${esc(fmtDashCell(c, r0[c.key]))}</span></div>`).join("")}</div>`;
    }
    case "checklist": {
      return `<div class="w-checklist">${grouped().map(d=>`<div class="w-check"><span class="w-chk ${d.v>0?"on":"off"}">${d.v>0?"✓":"✕"}</span><span class="w-cl-lbl">${esc(d.label)}</span><span class="w-cl-val">${isCur?money(d.v):Math.round(d.v).toLocaleString()}</span></div>`).join("")}</div>`;
    }
    case "matrix": {
      const rowKey = tile.groupBy;
      const colKey = (cols.find(c=>["Option set","Lookup","Text"].includes(c.type) && c.key!==rowKey)||{}).key;
      if (!colKey) return `<div class="page-sub">Add a second category column to this entity for a matrix.</div>`;
      const rvals = [...new Set(rows.map(r=>r[rowKey]))], cvals = [...new Set(rows.map(r=>r[colKey]))];
      return `<table class="rp-table"><thead><tr><th></th>${cvals.map(cv=>`<th class="num">${esc(cv)}</th>`).join("")}</tr></thead><tbody>${rvals.map(rv=>`<tr><td><b>${esc(rv)}</b></td>${cvals.map(cv=>{const n=rows.filter(r=>r[rowKey]===rv && r[colKey]===cv).length; return `<td class="num">${n||"—"}</td>`;}).join("")}</tr>`).join("")}</tbody></table>`;
    }
    case "badge": {
      let level = tile.badgeLevel;
      if (!level) { const data=grouped(), total=data.reduce((s,d)=>s+d.v,0)||1, top=Math.max(...data.map(d=>d.v),0), pct=top/total*100; level = pct>60?"high":pct>35?"med":"low"; }
      const text = tile.badgeText || ({ high:"High", med:"Medium", low:"Low" }[level]);
      return `<div class="w-badge w-badge-${level}"><div class="w-badge-text">${esc(text)}</div></div>`;
    }
  }
  return "";
}
function openDashboardComposer(d) { state.dashboard = d; state.view = "dashboardcomposer"; render(); }
/* A new dashboard exists only in the composer until it is saved. It used to be pushed onto an
   in-memory list as well, which is why a dashboard could look created and then not be there. */
function createDashboard() {

    owner: state.userName || "", sections: []
  });

}

/* Undo history and the selected widget belong to the dashboard being edited, so carrying either into
   the next one would let an undo reach back into a dashboard that is no longer open. */
function resetDashboardEditingState() {
  state.dashPreview = false;
  state.dashSelection = null;
  dashHistory.past.length = 0;
  dashHistory.future.length = 0;
}
function openNewDashboardChooser() {

    </div></div>

/* ---------- Dashboard canvas ----------
   Composing a dashboard happens ON the dashboard, not in a form describing one. The sections and
   their empty slots are the working surface: drag a field from the rail onto a slot and the widget
   appears where it will live, already bound and already rendering live data.

   The stylesheet for this screen was written long before this code — .dash-shell, .dash-palette,
   .ds-section, .ds-ph, .ds-ph.drop-field — and had no JavaScript producing any of it. The markup
   below is built to the DOM that stylesheet already describes rather than to a new one. */

const WIDGET_CATALOGUE = [
  { kind: "metric", label: "Metric", icon: "chart" },
  { kind: "gauge", label: "Gauge", icon: "pie" },
  { kind: "badge", label: "Status badge", icon: "info" },
  { kind: "progress", label: "Progress", icon: "chart" },
  { kind: "chart", label: "Chart", icon: "pie" },
  { kind: "infocards", label: "Info cards", icon: "copy" },
  { kind: "profile", label: "Profile", icon: "key" },
  { kind: "checklist", label: "Checklist", icon: "check" },
  { kind: "matrix", label: "Matrix", icon: "tree" },
  { kind: "table", label: "Table", icon: "doc" }
];

/** Kinds that summarise a number, and so need a measure and an aggregation to mean anything. */
const MEASURED_WIDGET_KINDS = ["metric", "gauge", "progress", "chart", "matrix"];
const AGGREGATIONS = ["Sum", "Average", "Count", "Max", "Min"];
const widgetIsMeasured = widget => MEASURED_WIDGET_KINDS.includes(String(widget.widget || "").toLowerCase());

const totalWidgets = dashboard =>
  (dashboard.sections || []).reduce((count, section) => count + (section.widgets || []).length, 0);

/* The rail lists one table's fields, because a slicer that filters "all widgets" only means anything
   if the widgets share a table. A widget may still be pointed at another one from its properties. */
function primaryEntity(dashboard) {
  if (dashboard.entity) return dashboard.entity;
  const first = (dashboard.sections || []).flatMap(s => s.widgets || []).find(w => w.entity);
  return first ? first.entity : "account";
}

/* ---------- undo ----------
   Direct manipulation without undo is a trap: dropping a field is one gesture and losing a widget is
   one gesture, and they look the same to the hand. Snapshots are small — a dashboard is sections of
   widgets, not documents — so the whole thing is captured rather than diffed. */
const dashHistory = { past: [], future: [] };
const DASH_HISTORY_LIMIT = 50;

const dashSnapshot = dashboard => JSON.stringify({
  title: dashboard.title, entity: dashboard.entity, sections: dashboard.sections
});

function recordDashboardChange() {
  if (!state.dashboard) return;
  dashHistory.past.push(dashSnapshot(state.dashboard));
  if (dashHistory.past.length > DASH_HISTORY_LIMIT) dashHistory.past.shift();
  dashHistory.future.length = 0;
}

function applySnapshot(snapshot) {
  const restored = JSON.parse(snapshot);
  Object.assign(state.dashboard, restored);
  state.dashSelection = null;
  render();
}

function undoDashboardChange() {
  if (!dashHistory.past.length) return;
  dashHistory.future.push(dashSnapshot(state.dashboard));
  applySnapshot(dashHistory.past.pop());
}

function redoDashboardChange() {
  if (!dashHistory.future.length) return;
  dashHistory.past.push(dashSnapshot(state.dashboard));
  applySnapshot(dashHistory.future.pop());
}

/* ---------- the composer ---------- */
function renderDashboardComposer(c) {
  const d = state.dashboard;
  if (!d) { openNewDashboardChooser(); return; }
  d.sections = d.sections || [];
  d.entity = primaryEntity(d);

  c.appendChild(composerCommandBar(d));

  if (state.dashPreview) { c.appendChild(dashboardPreview(d)); return; }

  const shell = el(`<div class="dash-shell">
    <div class="dash-palette"></div>
    <div class="dash-main"><div class="ds-sections"></div></div>
  </div>`);
  shell.querySelector(".dash-palette").appendChild(fieldPalette(d));
  const canvas = shell.querySelector(".ds-sections");
  if (!d.sections.length) canvas.appendChild(emptyCanvasHint());
  d.sections.forEach((section, index) => canvas.appendChild(sectionElement(section, index, d)));

  const selected = selectedWidget(d);
  if (selected) shell.appendChild(widgetProperties(selected, d));
  c.appendChild(shell);
}

function composerCommandBar(d) {
  const bar = el(`<div class="cmdbar">
    <button class="cmd" id="dc_back">${ic("back")}Back</button>
    <div class="cmd-sep"></div>
    <button class="cmd" id="dc_undo" ${dashHistory.past.length ? "" : "disabled"}>${ic("back")}Undo</button>
    <button class="cmd" id="dc_redo" ${dashHistory.future.length ? "" : "disabled"}>${ic("refresh")}Redo</button>
    <input class="fluent-input" id="dc_title" value="${esc(d.title || "")}" placeholder="Dashboard title"
      style="max-width:320px;margin:0 12px;font-weight:600">

    <div class="cmd-spacer"></div>

    <button class="cmd primary" id="dc_save">${ic("save")}Save</button>
  </div>`);

  bar.querySelector("#dc_back").onclick = () => { state.view = "dashboards"; render(); };

  bar.querySelector("#dc_save").onclick = () => withBusyButton("#dc_save", "Saving…", () => saveDashboardToServer(d));
