function emptyCanvasHint() {
  return el(`<div class="np-empty" style="padding:38px">
    Nothing here yet — pick a section width under <b>Add section</b> on the left, then drag a field
    onto a placeholder or use <b>Add widget</b>.</div>`);
}

/* ---------- left rail ----------
   A table on this organisation carries several hundred attributes, and offering all of them puts
   "(Deprecated) Process Stage" and "Unique identifier" at the top of the list while the fields
   someone actually reports on sit below the fold. What is dropped here is plumbing — shadow currency
   columns, platform-solution fields, identifiers — not anything a dashboard would be built from. */
const PALETTE_PLUMBING = new Set([
  "importsequencenumber", "timezoneruleversionnumber", "utcconversiontimezonecode", "versionnumber",
  "overriddencreatedon", "processid", "stageid", "traversedpath", "onholdtime", "lastonholdtime",
  "createdonbehalfby", "modifiedonbehalfby", "owninguser", "owningteam", "owningbusinessunit",
  "exchangerate", "entityimage", "entityimageid", "entityimage_timestamp", "entityimage_url"
]);

const isPlumbingField = field =>
  PALETTE_PLUMBING.has(field.a)
  || field.a.endsWith("_base")
  || field.t === "Unique identifier"
  || isPlatformTable(field.a)
  || /\(deprecated\)/i.test(field.n);

const usefulAttributes = entity => attributesOf(entity).filter(field => !isPlumbingField(field));

function fieldPalette(d) {
  const fields = usefulAttributes(d.entity)
    .filter(field => !state.fieldFilter || field.n.toLowerCase().includes(state.fieldFilter.toLowerCase()));
  const total = usefulAttributes(d.entity).length;
  const sources = dashboardSources(d);
  const rail = el(`<div>
    <h4>Data source</h4>
    <div style="margin-bottom:6px">${sources.length
      ? `<select class="fluent-select" data-dashsource>${sources.map(source =>
          `<option value="${esc(source.id)}" ${d.activeSourceId === source.id ? "selected" : ""}>${
            esc(source.name)}</option>`).join("")}
         <option value="" ${d.activeSourceId ? "" : "selected"}>Table directly…</option></select>`
      : entityPickerHtml(d.entity, 'data-dashentity')}</div>
    <button class="btn sm" data-managesources style="width:100%;margin-bottom:12px">${
      ic("tree")}${sources.length ? `Manage sources (${sources.length})` : "Add a data source"}</button>
    <h4>Data fields</h4>
    ${sources.length && d.activeSourceId
      ? `<div class="hint" style="margin-bottom:8px">Fields of ${esc(d.entity)}, read through this source.</div>`
      : `<div style="margin-bottom:10px">${entityPickerHtml(d.entity, 'data-dashentity2')}</div>`}
    <div class="palette" style="max-height:340px">
      <div class="palette-search"><input class="fluent-input" id="dp_search" placeholder="Search fields…"
        value="${esc(state.fieldFilter || "")}"></div>
      <div class="palette-scroll" id="dp_fields"></div>
      <div class="palette-count">${total
        ? `${fields.length} of ${total} fields`
        : "Loading fields…"}</div>
    </div>
    <div class="hint" style="margin:10px 0 14px">Drag a field onto a placeholder — it becomes a widget
      automatically (numbers → metric, categories → chart).</div>
    <h4>Add section</h4>
    <div class="ds-addsec">${[1, 2, 3, 4].map(n =>
      `<button data-addsec="${n}"><span class="ds-secicon">${"■ ".repeat(n).trim()}</span>${
        n} column${n === 1 ? "" : "s"}</button>`).join("")}</div>
  </div>`);

  const host = rail.querySelector("#dp_fields");
  fields.forEach(field => host.appendChild(paletteField(field, d.entity)));

  rail.querySelectorAll("[data-dashentity], [data-dashentity2]").forEach(picker =>
    picker.addEventListener("change", event => {
      recordDashboardChange();
      d.entity = event.target.value;
      state.fieldFilter = "";
      render();
    }));
  const sourcePicker = rail.querySelector("[data-dashsource]");
  if (sourcePicker) sourcePicker.addEventListener("change", () => {
    recordDashboardChange();
    d.activeSourceId = sourcePicker.value || null;
    // The rail lists the fields of whatever the chosen source reads, so the table follows the source.
    const chosen = findSource(d, d.activeSourceId);
    if (chosen) d.entity = chosen.entity;
    state.fieldFilter = "";
    render();
  });
  rail.querySelector("[data-managesources]").onclick = () => openDataSourceDialog(d);
  /* Re-rendered in place rather than through render(), which would rebuild the rail and take the
     focus out of the box being typed into after the first keystroke. */
  const search = rail.querySelector("#dp_search");
  search.addEventListener("input", () => {
    state.fieldFilter = search.value;
    const matches = usefulAttributes(d.entity)
      .filter(field => field.n.toLowerCase().includes(state.fieldFilter.toLowerCase()));
    host.innerHTML = "";
    matches.forEach(field => host.appendChild(paletteField(field, d.entity)));
    rail.querySelector(".palette-count").textContent = `${matches.length} of ${total} fields`;
  });
  rail.querySelectorAll("[data-addsec]").forEach(button => button.onclick = () => {
    recordDashboardChange();
    d.sections.push({ id: newGuid(), title: "", cols: +button.dataset.addsec, widgets: [] });
    render();
  });
  return rail;
}

function paletteField(field, entity) {
  const item = el(`<div class="palette-item" draggable="true" title="${esc(field.n)}">
    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(field.n)}</span>
    <span class="pt">${esc(field.t || "")}</span></div>`);
  item.addEventListener("dragstart", event => {
    event.dataTransfer.setData(FIELD_DRAG_TYPE, JSON.stringify({ attribute: field.a, name: field.n, type: field.t, entity }));
    event.dataTransfer.effectAllowed = "copy";
  });
  return item;
}

/* A private MIME type, so a placeholder accepts a field from this rail and ignores text dragged in
   from anywhere else on the machine. */
const FIELD_DRAG_TYPE = "application/x-qdb-field";

/* Numbers are worth totalling, categories are worth counting per value, and anything else is best
   shown as itself. Getting this right most of the time is what makes the drag feel like it knows
   what you meant; the widget's kind stays editable either way. */
const NUMERIC_FIELD_TYPES = ["Currency", "Decimal", "Whole number", "Float"];
const CATEGORY_FIELD_TYPES = ["Option set", "Lookup", "Two options", "Owner"];

function widgetFromField(field) {
  const base = { id: newGuid(), entity: field.entity, chartType: "Donut", cardIcon: "money", badgeText: "", badgeLevel: "" };
  if (NUMERIC_FIELD_TYPES.includes(field.type)) {
    return { ...base, title: field.name, widget: "metric", groupBy: "", measure: field.attribute, agg: "Sum" };
  }
  if (CATEGORY_FIELD_TYPES.includes(field.type)) {
    return { ...base, title: `By ${field.name}`, widget: "chart", groupBy: field.attribute, measure: "", agg: "Count" };
  }
  return { ...base, title: field.name, widget: "table", groupBy: field.attribute, measure: "", agg: "Count" };
}

/* ---------- canvas ---------- */
function sectionElement(section, index, d) {
  section.widgets = section.widgets || [];
  const columns = section.cols || 2;
  const wrap = el(`<div class="ds-section">
    <div class="ds-sec-head">
      <input class="ds-sec-name" value="${esc(section.title || "")}" placeholder="Section title (optional)">
      <div class="ds-sec-tools">
        <div class="ds-cols">${[1, 2, 3, 4].map(n =>
          `<button class="${columns === n ? "on" : ""}" data-cols="${n}">${n}</button>`).join("")}</div>
        <button data-up ${index === 0 ? "disabled" : ""} title="Move up">▲</button>
        <button data-down ${index === d.sections.length - 1 ? "disabled" : ""} title="Move down">▼</button>
        <button data-duplicate title="Duplicate section">${ic("copy")}</button>
        <button data-remove title="Remove section">✕</button>
      </div>
    </div>
    <div class="ds-cols-grid" style="grid-template-columns:repeat(${columns},1fr)"></div>
  </div>`);

  const grid = wrap.querySelector(".ds-cols-grid");
  section.widgets.forEach((widget, at) => grid.appendChild(widgetTile(widget, index, at)));
  /* Every free column keeps a placeholder, so the layout you are building is visible as shape even
     before it has content — an empty 3-column section reads as three columns, not as nothing. */
  for (let slot = section.widgets.length; slot < columns; slot++) grid.appendChild(placeholder(index));

  wrap.querySelector(".ds-sec-name").addEventListener("input", event => { section.title = event.target.value; });
  wrap.querySelectorAll("[data-cols]").forEach(button => button.onclick = () => {
    recordDashboardChange(); section.cols = +button.dataset.cols; render();
  });
  wrap.querySelector("[data-up]").onclick = () => moveSection(d, index, -1);
  wrap.querySelector("[data-down]").onclick = () => moveSection(d, index, 1);
  wrap.querySelector("[data-duplicate]").onclick = () => {
    recordDashboardChange();
    const copy = JSON.parse(JSON.stringify(section));
    copy.id = newGuid();
    copy.widgets.forEach(widget => { widget.id = newGuid(); });
    d.sections.splice(index + 1, 0, copy);
    render();
  };
  wrap.querySelector("[data-remove]").onclick = () => {
    recordDashboardChange();
    d.sections.splice(index, 1);
    state.dashSelection = null;
    toast(section.widgets.length ? `Section removed with ${section.widgets.length} widget(s) — undo is available` : "Section removed");
    render();
  };
  return wrap;
}

/* Sequence is written from array order on save, so reordering here is what the stored dashboard
   ends up with — there is no separate sequence for the user to keep in step. */
function moveSection(dashboard, index, offset) {
  const target = index + offset;
  if (target < 0 || target >= dashboard.sections.length) return;
  recordDashboardChange();
  const [section] = dashboard.sections.splice(index, 1);
  dashboard.sections.splice(target, 0, section);
  render();
}

function placeholder(sectionIndex) {
  const slot = el(`<button class="ds-ph" data-ph="${sectionIndex}">${ic("add")}<span>Add widget</span></button>`);
  slot.onclick = () => openWidgetChooser(sectionIndex);

  slot.addEventListener("dragover", event => {
    if (!event.dataTransfer.types.includes(FIELD_DRAG_TYPE)) return;
    event.preventDefault();
    slot.classList.add("drop-field");
  });
  slot.addEventListener("dragleave", () => slot.classList.remove("drop-field"));
  slot.addEventListener("drop", event => {
    event.preventDefault();
    slot.classList.remove("drop-field");
    const payload = event.dataTransfer.getData(FIELD_DRAG_TYPE);
    if (!payload) return;
    recordDashboardChange();
    const widget = widgetFromField(JSON.parse(payload));
    state.dashboard.sections[sectionIndex].widgets.push(widget);
    toast(`${widget.title} added as a ${widget.widget}`);
    render();
  });
  return slot;
}

/** A tile on the canvas renders its real data, so the canvas and the preview are the same picture. */
function widgetTile(widget, sectionIndex, at) {
  const chosen = state.dashSelection
    && state.dashSelection.section === sectionIndex && state.dashSelection.widget === at;
  const tile = el(`<div class="dash-tile ${chosen ? "sel" : ""}">
    <div class="dt-head">
      <span class="dt-title">${esc(widget.title || "Untitled widget")}</span>
      <span class="dt-tools">
        <button data-remove title="Remove widget">✕</button>
      </span>
    </div>
    <div class="dt-body">${bindingProblem(widget)
      ? `<div class="np-empty">${esc(bindingProblem(widget))}</div>`
      : renderWidget(widget) || `<div class="np-empty">Not bound to a table yet — open its properties.</div>`}</div>
  </div>`);

  tile.onclick = event => {
    if (event.target.closest("[data-remove]")) return;
    state.dashSelection = { section: sectionIndex, widget: at };
    render();
  };
  tile.querySelector("[data-remove]").onclick = () => {
    recordDashboardChange();
    state.dashboard.sections[sectionIndex].widgets.splice(at, 1);
    state.dashSelection = null;
    render();
  };
  return tile;
}

/* ---------- add a widget ---------- */
function openWidgetChooser(sectionIndex) {
  const scrim = el(`<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" style="width:640px">
    <div class="dialog-head"><h3>Add a widget</h3><button class="close-x">✕</button></div>
    <div class="dialog-body"><div class="choice-cards" style="grid-template-columns:1fr 1fr 1fr">${
      WIDGET_CATALOGUE.map(entry =>
        `<div class="choice-card" data-kind="${entry.kind}" style="padding:16px">
          <div class="cc-t">${ic(entry.icon)} ${esc(entry.label)}</div></div>`).join("")}</div></div>
    <div class="dialog-foot"><button class="btn" data-close>Cancel</button></div>
  </div></div>`);
  document.body.appendChild(scrim);

  const close = () => scrim.remove();
  scrim.querySelector(".close-x").onclick = close;
  scrim.querySelector("[data-close]").onclick = close;
  scrim.addEventListener("click", event => { if (event.target === scrim) close(); });
  scrim.querySelectorAll("[data-kind]").forEach(card => card.onclick = () => {
    close();
    addWidgetOfKind(sectionIndex, card.dataset.kind);
  });
}

/* A new widget is bound to the dashboard's table and to a sensible field straight away, so it draws
   something immediately. An empty widget that must be configured before it shows anything makes the
   canvas lie about what you just did. */
function addWidgetOfKind(sectionIndex, kind) {
  const dashboard = state.dashboard;
  const entity = primaryEntity(dashboard);
  const suggested = defaultBind(entity);
  recordDashboardChange();
  const section = dashboard.sections[sectionIndex];
  section.widgets.push({
    id: newGuid(),
    title: (WIDGET_CATALOGUE.find(w => w.kind === kind) || {}).label || "Widget",
    widget: kind, entity,
    groupBy: suggested.groupBy, measure: suggested.measure,
    agg: MEASURED_WIDGET_KINDS.includes(kind) && suggested.measure ? "Sum" : "Count",
    chartType: "Donut", cardIcon: "money", badgeText: "", badgeLevel: ""
  });
  state.dashSelection = { section: sectionIndex, widget: section.widgets.length - 1 };
  render();
}

/* ---------- properties ---------- */
function selectedWidget(dashboard) {
  const selection = state.dashSelection;
  if (!selection) return null;
  const section = dashboard.sections[selection.section];
  const widget = section && (section.widgets || [])[selection.widget];
  return widget ? { widget, selection } : null;
}

/**
 * The selected widget's settings, in a panel beside the canvas.
 *
 * The form still exists — a measure and an aggregation have to come from somewhere — but it is
 * behind a click on the thing being changed rather than being the way the dashboard is built.
 */
function widgetProperties({ widget, selection }, dashboard) {
  const measured = widgetIsMeasured(widget);
  const isChart = String(widget.widget || "").toLowerCase() === "chart";
  const panel = el(`<div class="dash-props">
    <h4>${esc(widget.title || "Widget")}</h4>
    <div class="field"><label class="lbl">Title</label>
      <input class="fluent-input" data-w="title" value="${esc(widget.title || "")}"></div>
    <div class="field"><label class="lbl">Type</label>
      <select class="fluent-select" data-w="widget">${WIDGET_CATALOGUE.map(entry =>
        `<option value="${entry.kind}" ${String(widget.widget).toLowerCase() === entry.kind ? "selected" : ""}>${
          esc(entry.label)}</option>`).join("")}</select></div>
    <div class="field"><label class="lbl">Data source</label>
      <select class="fluent-select" data-w="sourceId">
        <option value="" ${widget.sourceId ? "" : "selected"}>Read the table directly</option>
        ${dashboardSources(dashboard).map(source =>
          `<option value="${esc(source.id)}" ${widget.sourceId === source.id ? "selected" : ""}>${
            esc(source.name)}</option>`).join("")}</select></div>
    <div class="field"><label class="lbl">Table</label>${
      entityPickerHtml(widget.entity, 'data-w="entity"')}</div>
    <div class="field"><label class="lbl">Group by</label>${
      attributePickerHtml(widget.entity, widget.groupBy, 'data-w="groupBy"', "Search fields…")}</div>
    ${measured ? `<div class="field"><label class="lbl">Measure</label>${
      attributePickerHtml(widget.entity, widget.measure, 'data-w="measure"', "Search fields…")}</div>
      <div class="field"><label class="lbl">Aggregation</label>
        <select class="fluent-select" data-w="agg">${AGGREGATIONS.map(a =>
          `<option ${widget.agg === a ? "selected" : ""}>${a}</option>`).join("")}</select></div>` : ""}
    ${isChart ? `<div class="field"><label class="lbl">Chart type</label>
      <select class="fluent-select" data-w="chartType">${CHART_TYPES.map(t =>
        `<option ${widget.chartType === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>` : ""}
    ${measured && !widget.measure && widget.agg !== "Count"
      ? `<div class="np-empty">A ${esc(widget.agg)} needs a measure — without one this widget has nothing to total.</div>` : ""}
    <button class="btn sm" data-done style="margin-top:8px">Done</button>
  </div>`);

  panel.querySelectorAll("[data-w]").forEach(input => input.addEventListener(comboSafeEvent(input), () => {
    recordDashboardChange();
    const target = dashboard.sections[selection.section].widgets[selection.widget];
    target[input.dataset.w] = input.value;
    // Changing the table invalidates fields chosen from the old one, and changing the type changes
    // which fields exist at all — both need the panel rebuilt rather than patched.
    if (input.dataset.w === "entity") { target.groupBy = ""; target.measure = ""; }
    // A source reads one table, so binding to it moves the widget onto that table.
    if (input.dataset.w === "sourceId") {
      const chosen = findSource(dashboard, input.value);
      target.sourceId = input.value || null;
      if (chosen && chosen.entity !== target.entity) {
        target.entity = chosen.entity; target.groupBy = ""; target.measure = "";
      }
    }
    render();
  }));
  panel.querySelector("[data-done]").onclick = () => { state.dashSelection = null; render(); };
  return panel;
}

/**
 * The dashboard's data sources: named queries its widgets can read through.
 *
 * The payload means something different to each type — a view name, FetchXML, a JSON array — so
 * changing the type clears it. A payload carried across a change becomes a view name read as
 * FetchXML: stored, wrong, and silent, which is how the report designer had to learn the same rule.
 */
function openDataSourceDialog(d) {
  d.dataSources = d.dataSources || [];
  const scrim = el(`<div class="scrim" id="dsrcOverlay"><div class="dialog" role="dialog" aria-modal="true" style="width:820px">
    <div class="dialog-head"><h3>Data sources</h3><button class="close-x">✕</button></div>
    <div class="dialog-body"><div id="dsrc_body"></div>
      <div class="hint" style="margin-top:12px">${esc(DEFERRED_SOURCE_TYPES.join(", "))} need a
        server-side dashboard runtime and are not offered here yet — a widget bound to one would
        save and then draw nothing.</div></div>
    <div class="dialog-foot"><button class="btn primary" data-close>Done</button></div>
  </div></div>`);
  document.body.appendChild(scrim);

  const close = () => { scrim.remove(); render(); };
  scrim.querySelector(".close-x").onclick = close;
  scrim.querySelector("[data-close]").onclick = close;

  const body = scrim.querySelector("#dsrc_body");
  const draw = () => {
    body.innerHTML = "";
    if (!d.dataSources.length) {
      body.appendChild(el(`<div class="np-empty">No data sources yet. Widgets read their table
        directly until one is added.</div>`));
    }
    d.dataSources.forEach((source, index) => body.appendChild(dataSourceRow(source, index, d, draw)));
    const add = el(`<button class="btn sm btn-add">${ic("add")}Add data source</button>`);
    add.onclick = () => {
      recordDashboardChange();
      d.dataSources.push({ id: newGuid(), name: `Source ${d.dataSources.length + 1}`,
        type: "CRM View", entity: d.entity || "account", query: "", primary: !d.dataSources.length });
      draw();
    };
    body.appendChild(add);
  };
  /* Views and fields arrive after the dialog is on screen, and the loaders finish by calling
     render() — which rebuilds the page behind this dialog and leaves it reading "Loading views…"
     for ever. The wizard needed the same hook for the same reason. */
  redrawDataSourceDialog = draw;
  draw();
}

let redrawDataSourceDialog = null;

function refreshOpenDataSourceDialog() {
  if (document.getElementById("dsrcOverlay") && redrawDataSourceDialog) redrawDataSourceDialog();
}

function dataSourceRow(source, index, d, redraw) {
  const row = el(`<div class="section-card" style="margin:0 0 10px;padding:12px">
    <div class="field-grid">
      <div class="field"><label class="lbl">Name</label>
        <input class="fluent-input" data-s="name" value="${esc(source.name || "")}"></div>
      <div class="field"><label class="lbl">Source type</label>
        <select class="fluent-select" data-s="type">${DASHBOARD_SOURCE_TYPES.map(type =>
          `<option ${source.type === type ? "selected" : ""}>${esc(type)}</option>`).join("")}</select></div>
      <div class="field"><label class="lbl">Table</label>${
        entityPickerHtml(source.entity, 'data-s="entity"')}</div>
      <div class="field col-2"><label class="lbl">${esc(sourcePayloadLabel(source.type))}</label>${
        sourcePayloadControl(source)}</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:6px">
      <span class="rel-tag">${esc(sourceStatus(source))}</span>
      <div class="cmd-spacer" style="flex:1"></div>
      <button class="del" data-sdel>${ic("trash")}</button>
    </div></div>`);

  row.querySelectorAll("[data-s]").forEach(input => input.addEventListener(comboSafeEvent(input), () => {
    recordDashboardChange();
    source[input.dataset.s] = input.value;
    if (input.dataset.s === "type" || input.dataset.s === "entity") source.query = "";
    redraw();
  }));
  row.querySelector("[data-sdel]").onclick = () => {
    recordDashboardChange();
    // Widgets pointing at a removed source fall back to reading their table directly rather than
    // holding an id that resolves to nothing.
    (d.sections || []).forEach(section => (section.widgets || []).forEach(widget => {
      if (widget.sourceId === source.id) widget.sourceId = null;
    }));
    if (d.activeSourceId === source.id) d.activeSourceId = null;
    d.dataSources.splice(index, 1);
    redraw();
  };
  return row;
}

const sourcePayloadLabel = type =>
  ({ "CRM View": "View", "FetchXML": "FetchXML", "Static Dataset": "Rows (JSON array)" })[type] || "Query";

function sourcePayloadControl(source) {
  if (source.type === "CRM View") return viewPickerHtml(source.entity, source.query, 'data-s="query"');
  const placeholder = source.type === "FetchXML"
    ? "<fetch><entity name=\"account\">…</entity></fetch>"
    : '[{ "name": "Retail", "total": 120 }]';
  return `<textarea class="fluent-input" data-s="query" rows="3" placeholder="${esc(placeholder)}">${
    esc(source.query || "")}</textarea>`;
}

/** Says whether this source can currently produce rows, rather than waiting for a blank widget to say it. */
function sourceStatus(source) {
  if (!source.query) return "No query yet — this source returns nothing";
  if (source.type === "Static Dataset") {
    const rows = staticDatasetRows(source);
    return rows.length ? `${rows.length} row(s)` : "Not a JSON array — returns nothing";
  }
  if (source.type === "CRM View" && !executableFetchXml(source)) return "View not found on this table";
  return `Reads ${source.entity}`;
}

/** The four stored properties of the dashboard itself — too few to deserve a screen of their own. */
function openDashboardProperties(d) {

/* ---------- preview ----------
   The same tiles without the editing chrome, so switching modes shows the dashboard as its readers
   will meet it rather than a second rendering of it. */
function dashboardPreview(d) {
  const scroll = el(`<div class="scroll"><div class="ds-sections" id="dv_sections"></div></div>`);
  const host = scroll.querySelector("#dv_sections");
  if (!totalWidgets(d)) {
    host.appendChild(el(`<div class="np-empty" style="padding:38px">
      Nothing to preview yet — switch back to <b>Edit</b> and add a widget.</div>`));
    return scroll;
  }
  d.sections.forEach(section => host.appendChild(previewSection(section)));
  return scroll;
}

function previewSection(section) {
  const widgets = section.widgets || [];
  const wrap = el(`<div class="ds-section">
    ${section.title ? `<div class="ds-sec-title">${esc(section.title)}</div>` : ""}
    <div class="ds-cols-grid" style="grid-template-columns:repeat(${section.cols || 2},1fr)"></div></div>`);
  const grid = wrap.querySelector(".ds-cols-grid");
  if (!widgets.length) {
    grid.appendChild(el(`<div class="np-empty" style="grid-column:1/-1">This section has no widgets.</div>`));
  }
  widgets.forEach(widget => grid.appendChild(previewTile(widget)));
  return wrap;
}

function previewTile(widget) {
  return el(`<div class="dash-tile">
    <div class="dt-head"><span class="dt-title">${esc(widget.title || "Untitled widget")}</span></div>
    <div class="dt-body">${bindingProblem(widget)
      ? `<div class="np-empty">${esc(bindingProblem(widget))}</div>`
      : renderWidget(widget) || `<div class="np-empty">This widget is not bound to a table yet.</div>`}</div></div>`);
}
function renderDashboards(c) {
  const cmd = el(`<div class="cmdbar">
    <button class="cmd primary" id="dbNew">${ic("add")}New dashboard</button>
    <button class="cmd" id="dbOpen" disabled>${ic("edit")}Open</button>
    <button class="cmd" id="dbClone" disabled>${ic("copy")}Clone</button>
    <button class="cmd" id="dbDelete" disabled>${ic("trash")}Delete</button>
    <div class="cmd-spacer"></div>
    <button class="cmd" id="dbNewReport">${ic("doc")}New report instead</button>
  </div>`);
  const rows = dashboardCatalog.get();
  const rowHtml = d => `<tr data-id="${esc(d.id)}"><td class="row-check"><input type="checkbox"></td><td><span class="link-cell">${esc(d.title)}</span></td><td>${cell(d.owner)}</td><td>${d.isGoverned?ic("check"):"—"}</td><td>${cell(d.modified)}</td></tr>`;
  const body = rows.length
    ? `<div class="grid-wrap"><table class="grid" role="grid"><thead><tr><th class="row-check"><input type="checkbox" disabled></th><th>Dashboard name</th><th>Owner</th><th>Governed</th><th>Modified</th></tr></thead><tbody>${rows.map(rowHtml).join("")}</tbody></table></div>`
    : `<div class="section-card" style="max-width:940px">${catalogEmptyState(dashboardCatalog, "No dashboards in this environment yet. Use New dashboard to compose one.")}${dashboardCatalog.isLoading() ? `<div style="margin-top:12px">${skeletonRows(4)}</div>` : ""}</div>`;
  const scroll = el(`<div class="scroll"><div class="page">
    <div class="page-head"><div><h1>Dashboards</h1><div class="page-sub">${rows.length} dashboard${rows.length===1?"":"s"} in Dataverse · a grid of independently data-bound widgets (metrics, charts, gauges, info cards, tables…)</div></div></div>
    ${body}
  </div></div>`);
  c.appendChild(cmd); c.appendChild(scroll); labelizeGrid(scroll);
  let selId = null;
  const btns = () => { $("#dbOpen").disabled = !selId; $("#dbClone").disabled = !selId; $("#dbDelete").disabled = !selId; };
  scroll.querySelectorAll("tbody tr").forEach(tr => {
    tr.addEventListener("click", e => {
      if (e.target.closest(".link-cell")) return;
      scroll.querySelectorAll("tbody tr").forEach(x => x.classList.remove("selected"));
      tr.classList.add("selected"); tr.querySelector("input").checked = true;
      selId = tr.dataset.id; btns();
    });
    tr.querySelector(".link-cell").addEventListener("click", () => openSavedDashboard(tr.dataset.id));
  });
  $("#dbNew").onclick = () => openNewDashboardChooser();
  $("#dbNewReport").onclick = () => { state.view = "reports"; render(); setTimeout(openNewChooser, 30); };
  $("#dbOpen").onclick = () => selId && withBusyButton("#dbOpen", "Opening…", () => openSavedDashboard(selId));
  $("#dbClone").onclick = () => selId && withBusyButton("#dbClone", "Cloning…", () => cloneSavedDashboard(selId));
  $("#dbDelete").onclick = () => { if (selId) { const id = selId; selId = null; withBusyButton("#dbDelete", "Deleting…", () => deleteSavedDashboard(id)); } };
}

/* Loads the stored dashboard, strips its identity and saves it as a new one, so the copy carries its
   sections and widgets rather than only its title. */
async function cloneSavedDashboard(id) {
  beginBusy("Cloning dashboard…");
  try {
    const source = definitionToDashboard(await loadDashboardDefinition(id));
    source.savedId = null;
    source.title = `${source.title} (copy)`;
    await saveDashboardToServer(source);
    dashboardCatalog.refresh();
  } catch (error) {
    toast("Clone failed — " + error.message, "err");
  } finally {
    endBusy("Cloning dashboard…");
  }
}

/* ============================ CHROME EVENTS ============================ */
document.addEventListener("keydown", e => {
  if (state.view !== "dashboardcomposer" || !state.dashboard) return;
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const meta = e.ctrlKey || e.metaKey; if (!meta) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey) { e.preventDefault(); dashUndo(state.dashboard); render(); }
  else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); dashRedo(state.dashboard); render(); }
});
document.querySelectorAll(".nav-item").forEach(n => n.onclick = () => { state.view = n.dataset.view; state.selectedReportId=null; render(); });
$("#navToggle").onclick = () => { state.navCollapsed = !state.navCollapsed; $("#nav").classList.toggle("collapsed", state.navCollapsed); };
/* ---- Theme picker (Light / Dark / Glass / Vibrant), persisted ---- */
const THEME_STORAGE_KEY = "re-designer-theme";
const THEME_LABELS = { light: "Light", dark: "Dark", glass: "Glass", vibrant: "Vibrant" };

function applyTheme(themeId) {
  const theme = THEME_LABELS[themeId] ? themeId : "light";
  document.documentElement.setAttribute("data-theme", theme);
  $("#themeMenu").querySelectorAll("[data-set-theme]").forEach(o =>
    o.classList.toggle("sel", o.dataset.setTheme === theme));
  try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch (e) { /* private mode — session only */ }
}

function toggleThemeMenu(open) {
  const menu = $("#themeMenu"), trigger = $("#themeToggle");
  const next = open ?? !menu.classList.contains("open");
  menu.classList.toggle("open", next);
  trigger.setAttribute("aria-expanded", String(next));
}

function readStoredTheme() {
  try { return localStorage.getItem(THEME_STORAGE_KEY); } catch (e) { return null; }
}

$("#themeToggle").onclick = (event) => { event.stopPropagation(); toggleThemeMenu(); };
$("#themeMenu").querySelectorAll("[data-set-theme]").forEach(option => {
  option.onclick = () => {
    applyTheme(option.dataset.setTheme);
    toggleThemeMenu(false);
    toast(`${THEME_LABELS[option.dataset.setTheme]} theme applied`, "info");
  };
});
document.addEventListener("click", (event) => {
  if (!event.target.closest("#themeMenu, #themeToggle")) toggleThemeMenu(false);
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape") toggleThemeMenu(false); });

// When hosted as a CRM web resource, take the identity + middle-tier URL from Xrm / the URL,
// so dashboard persistence runs as the signed-in user against the deployer-configured API.
// Definitions are read and written as the signed-in user, so there is no connection to configure
// and no identity to choose (ADR-RPT-011). Outside CRM the designer still runs as a prototype:
// everything in-memory works, and only the save/load paths report that they need a CRM session.
function initCrmContext() {
  try {
    const xrm = window.Xrm || (window.parent && window.parent.Xrm) || (window.top && window.top.Xrm);
    state.inCrm = !!(xrm && xrm.WebApi);
    // Needed to tell "My Reports" from "All Reports" by real ownership rather than a hardcoded name.
    const user = signedInUser(xrm);
    state.userId = user.id;
    state.userName = user.name;
  } catch (e) {
    state.inCrm = false;
    state.userId = null;
    state.userName = null;
  }
}

function signedInUser(xrm) {
  const settings = xrm && xrm.Utility && xrm.Utility.getGlobalContext
    ? xrm.Utility.getGlobalContext().userSettings
    : null;
  return settings ? { id: settings.userId, name: settings.userName } : { id: null, name: null };
}
initCrmContext();

/* Opened from the raw /WebResources/ URL there is no app shell, so no Xrm, and now that every list,
   picker and preview reads from Dataverse there is nothing at all to show. The designer used to look
   populated here because it carried sample reports and invented preview rows; without those the
   honest state is empty, so say why rather than leaving the user staring at blank grids. */
if (!state.inCrm) {
  const hosted = `${location.origin}/main.aspx?pagetype=webresource&webresourceName=qdb_reportengine_designer.html`;
  const banner = el(`<div style="padding:10px 16px;background:var(--warning-bg);border-bottom:1px solid var(--border-strong);font-size:13px">
    <b>No CRM session — the designer has no data to show.</b>
    Reports, dashboards, entity metadata and previews are all read from Dataverse, which needs the app
    shell. Open the designer from inside the app instead:
    <div style="margin-top:6px"><code style="font-size:12px;word-break:break-all">${esc(hosted)}</code></div>
  </div>`);
  document.body.insertBefore(banner, document.body.firstChild);
}

applyTheme(readStoredTheme() ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

render();
watchForEntityCombos();
</script>
