   Custom API: what a designer saves is metadata about a report, not anybody's data. Execution is the
   part that has to be logged, and that still goes through qdb_RunReport.

   The attribute names, @odata.bind navigation properties and create ordering mirror the retired
   ReportDefinitionWriter/DashboardWriter exactly, so definitions written here load identically. */

function xrmApi() {
  const found = window.Xrm || (window.parent && window.parent.Xrm) || (window.top && window.top.Xrm);
  if (!found || !found.WebApi) {
    throw new Error("Saving needs a CRM session — open the designer as a web resource.");
  }
  return found.WebApi;
}

const dvCreate = async (entity, data) => (await xrmApi().createRecord(entity, data)).id;
const dvUpdate = (entity, id, data) => xrmApi().updateRecord(entity, id, data);
const dvDelete = (entity, id) => xrmApi().deleteRecord(entity, id);
const dvRetrieve = (entity, id, query) => xrmApi().retrieveRecord(entity, id, query);
const dvList = async (entity, query) => (await xrmApi().retrieveMultipleRecords(entity, query)).entities || [];

/* Metadata does not go through Xrm.WebApi: it rejects EntityDefinitions with "the entity cannot be
   found", because retrieveMultipleRecords resolves a logical name to a record collection and the
   metadata endpoints are neither. They are read straight off the Web API on the signed-in session
   instead. Note $top is rejected on these endpoints, so paging options must not be added here. */
async function dvMetadata(path) {
  const xrm = window.Xrm || (window.parent && window.parent.Xrm) || (window.top && window.top.Xrm);
  if (!xrm || !xrm.Utility) throw new Error("Reading metadata needs a CRM session.");
  const url = `${xrm.Utility.getGlobalContext().getClientUrl()}/api/data/v9.2/${path}`;
  const response = await fetch(url, {
    headers: { Accept: "application/json", "OData-Version": "4.0", "OData-MaxVersion": "4.0" }
  });
  const payload = await response.json();
  if (!response.ok) {
    throw new Error((payload.error && payload.error.message) || `Metadata request failed (${response.status})`);
  }
  return payload.value || [];
}

/** Children hang off the report by this lookup; the Web API exposes it with the _value spelling. */
const byReport = id => `?$filter=_qdb_reportdefinitionid_value eq ${id}`;

/* Xrm.WebApi returns a display string alongside every choice, lookup and date, under this suffix.
   Reading it rather than mapping option-set codes here keeps the labels in step with the org. */
const FORMATTED_SUFFIX = "@OData.Community.Display.V1.FormattedValue";
const formattedValue = (row, attribute) => row[attribute + FORMATTED_SUFFIX] || null;

/**
 * One Dataverse-backed list, fetched once per session.
 *
 * Every catalogue in the designer used to be a literal array, so the UI looked populated in an
 * environment that had nothing in it. These load on demand instead, and a load that fails is kept
 * rather than swallowed: an empty grid and a broken query are indistinguishable on screen, and
 * showing "no reports" when the query actually failed is the same class of lie as the seed data.
 */
function dataverseCatalog(entity, query, mapRow) {
  const catalog = {
    rows: null,
    error: null,
    loading: false,
    /** Rows if loaded, otherwise an empty list — and starts the fetch the first time it is asked. */
    get() {
      if (catalog.rows === null && !catalog.loading) catalog.load();
      return catalog.rows || [];
    },
    isLoading: () => catalog.rows === null,
    async load() {
      catalog.loading = true;
      try {
        catalog.rows = (await dvList(entity, typeof query === "function" ? query() : query)).map(mapRow);
        catalog.error = null;
      } catch (error) {
        catalog.rows = [];
        catalog.error = error.message || String(error);
      }
      catalog.loading = false;
      render();
    },
    /** Re-reads from Dataverse, for the Refresh command and after a save. */
    refresh() {
      catalog.rows = null;
      return catalog.load();
    }
  };
  return catalog;
}

/** The message a list shows in place of rows: still loading, failed, or genuinely empty. */
function catalogEmptyState(catalog, emptyMessage) {
  if (catalog.error) {
    return `<div class="page-sub" style="color:var(--danger)">Couldn't read from Dataverse — ${esc(catalog.error)}</div>`;
  }
  if (catalog.isLoading()) return `<div class="page-sub">Loading from Dataverse…</div>`;
  return `<div class="page-sub">${esc(emptyMessage)}</div>`;
}

/** Drops null/undefined so an unset optional never overwrites a value with null. */
function defined(attributes) {
  const kept = {};
  for (const key of Object.keys(attributes)) {
    if (attributes[key] !== null && attributes[key] !== undefined) kept[key] = attributes[key];
  }
  return kept;
}

const codeOf = value => (value && value.code != null) ? value.code : null;
function newGuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random()*16|0; return (c==="x" ? r : (r&0x3|0x8)).toString(16);
  });
}
// Composer widget kinds/aggregations are lowercase; the API contract is PascalCase enums.
const WIDGET_KIND_MAP = { metric:"Metric", gauge:"Gauge", badge:"Badge", progress:"Progress", chart:"Chart", infocards:"InfoCards", profile:"Profile", checklist:"Checklist", matrix:"Matrix", table:"Table" };
const AGGREGATION_MAP = { sum:"Sum", average:"Average", avg:"Average", count:"Count", max:"Max", min:"Min" };
function toWidgetKind(kind) { return WIDGET_KIND_MAP[String(kind||"").toLowerCase()] || "Metric"; }
function toAggregation(agg) { return AGGREGATION_MAP[String(agg||"sum").toLowerCase()] || "Sum"; }

// Maps the composer's in-memory dashboard onto the DashboardDefinition the API persists. The id
// fields are placeholders — the server always creates a new record and assigns real ids.
function dashboardToDefinition(dashboard) {
  return {
    id: "00000000-0000-0000-0000-000000000000",
    title: dashboard.title || "Untitled dashboard",
    isGoverned: !!dashboard.isGoverned,
    sections: (dashboard.sections || []).map(section => ({
      id: newGuid(),
      title: section.title || null,
      columns: Math.min(Math.max(section.cols || 4, 1), 4),
      widgets: (section.widgets || []).map(widget => ({
        id: newGuid(),
        kind: toWidgetKind(widget.widget),
        entity: widget.entity || "account",
        groupByAttribute: widget.groupBy || null,
        measureAttribute: widget.measure || null,
        aggregation: toAggregation(widget.agg),
        title: widget.title || null,
        chartType: widget.chartType || null
      }))
    }))
  };
}
// A dashboard that was loaded from Dataverse (has savedId) updates in place (PUT); a new one is
// created (POST). This keeps edit→save a true round-trip instead of duplicating the record.
/* ---------- dashboard writer ----------
   These tables were provisioned via EntityDefinitions, which names the primary attribute
   qdb_<entity>name — so it is qdb_dashboardname, not qdb_name. Widget kind and aggregation are
   stored as strings deliberately, to avoid option-set churn as the widget catalogue grows. */

async function writeDashboardSections(dashboardId, def) {
  let sectionSequence = 1;
  for (const section of def.sections || []) {
    const sectionId = await dvCreate("qdb_dashboardsection", defined({
      qdb_dashboardsectionname: section.title || "Section",
      qdb_columns: Math.min(Math.max(section.columns || 4, 1), 4),
      qdb_sequence: sectionSequence++,
      "qdb_DashboardId@odata.bind": `/qdb_dashboards(${dashboardId})`
    }));

    let widgetSequence = 1;
    for (const widget of section.widgets || []) {
      await dvCreate("qdb_dashboardwidget", defined({
        qdb_dashboardwidgetname: widget.title || widget.kind,
        qdb_kind: widget.kind,
        qdb_entity: widget.entity,
        qdb_groupby: widget.groupByAttribute,
        qdb_measure: widget.measureAttribute,
        qdb_aggregation: widget.aggregation,
        qdb_charttype: widget.chartType,
        qdb_sequence: widgetSequence++,
        "qdb_DashboardSectionId@odata.bind": `/qdb_dashboardsections(${sectionId})`
      }));
    }
  }
}

/** Widgets before their section, so a widget never outlives the section it points at. */
async function deleteDashboardSections(dashboardId) {
  const sections = await dvList("qdb_dashboardsection",
    `?$filter=_qdb_dashboardid_value eq ${dashboardId}&$select=qdb_dashboardsectionid`);
  for (const section of sections) {
    const widgets = await dvList("qdb_dashboardwidget",
      `?$filter=_qdb_dashboardsectionid_value eq ${section.qdb_dashboardsectionid}&$select=qdb_dashboardwidgetid`);
    for (const widget of widgets) await dvDelete("qdb_dashboardwidget", widget.qdb_dashboardwidgetid);
    await dvDelete("qdb_dashboardsection", section.qdb_dashboardsectionid);
  }
}

async function saveDashboardToServer(dashboard) {
  const button = $("#dash_save");
  if (button) button.disabled = true;
  const def = dashboardToDefinition(dashboard);
  const isUpdate = !!dashboard.savedId;
  const attributes = defined({ qdb_dashboardname: def.title, qdb_isgoverned: !!def.isGoverned });

  try {
    if (isUpdate) {
      await deleteDashboardSections(dashboard.savedId);
      await dvUpdate("qdb_dashboard", dashboard.savedId, attributes);
    } else {
      dashboard.savedId = await dvCreate("qdb_dashboard", attributes);
    }
    await writeDashboardSections(dashboard.savedId, def);
    toast(isUpdate ? "Dashboard updated in Dataverse" : "Dashboard saved to Dataverse", "ok");
    refreshSavedDashboards();
  } catch (error) {
    toast("Save failed — " + error.message, "err");
  } finally {
    if (button) button.disabled = false;
  }
}

// Option-set codes are 100000000-based (verified against the org); aggregate "None" is omitted.
const RPT_OPERATOR_CODES = { "Equals":100000000,"Not equals":100000001,"Contains":100000002,"Begins with":100000003,"Ends with":100000004,"Greater than":100000005,"Less than":100000006,"Between":100000007,"In":100000008,"Not in":100000009,"Is null":100000010,"Is not null":100000011,"Last X days":100000012,"This month":100000013,"This year":100000014 };
const RPT_AGG_CODES = { "Sum":100000001,"Count":100000002,"Average":100000003,"Avg":100000003,"Min":100000004,"Max":100000005 };
const RPT_JOIN_CODES = { "Inner join":100000000, "Left join":100000001, "Right join":100000002, "Full join":100000003 };
const RPT_PRINCIPAL_CODES = { "User":100000000, "Team":100000001, "Security role":100000002, "Business unit":100000003 };
const RPT_PRINCIPAL_LABELS = { 100000000:"User", 100000001:"Team", 100000002:"Security role", 100000003:"Business unit" };
const RPT_JOIN_LABELS = { 100000000:"Inner join", 100000001:"Left join", 100000002:"Right join", 100000003:"Full join" };
const RPT_STATUS_CODES = { "Draft":100000000, "Published":100000001 };
function coded(code, label) { return code == null ? null : { code, label }; }

// Maps the designer's report onto the ReportDefinition the API persists. First slice: definition +
// one data source/entity mapping + visible columns + filters + parameters + layout + formulas.
// Transformations and relationships (drilldown) are not mapped yet — a documented follow-up.
function reportToDefinition(report) {
  const alias = "t";
  const rootEntity = report.mainEntity || "account";

  // Columns say which entity they came from, so each mapping takes its own. A column with no entity
  // is assumed to be on the main one, which is how single-entity reports have always behaved.
  const columnsForEntity = (entity, isRoot) => (report.columns || [])
    .filter(c => c.visible !== false && ((c.entity || rootEntity) === entity || (isRoot && !c.entity)))
    .map((c, i) => ({
      id: newGuid(),
      columnLogicalName: c.attribute || c.name,
      outputAlias: c.attribute || c.name,
      aggregateFunction: (c.agg && c.agg !== "None") ? coded(RPT_AGG_CODES[c.agg] ?? null, c.agg) : null,
      sortOrder: i + 1,
      groupOrder: 0,
      isVisible: c.visible !== false
    }));

  const columns = columnsForEntity(rootEntity, true);

  /* Each join becomes its own entity mapping. FetchXML's link-entity reads `from` as the attribute on
     the joined entity and `to` as the one on the parent, which is the reverse of how the designer
     labels them — the right key is on the entity being joined. A join missing either key is dropped
     rather than persisted half-formed. */
  const joinMappings = (report.joins || [])
    .filter(j => j.entity && j.leftKey && j.rightKey)
    .map((j, i) => ({
      id: newGuid(),
      entityLogicalName: j.entity,
      entityAlias: "j" + (i + 1),
      depth: i + 1,
      joinType: coded(RPT_JOIN_CODES[j.joinType] ?? null, j.joinType),
      joinExpressionJson: JSON.stringify({ from: j.rightKey, to: j.leftKey }),
      columns: columnsForEntity(j.entity, false)
    }));
  return {
    id: "00000000-0000-0000-0000-000000000000",
    name: report.name || "Untitled report",
    description: report.description || null,
    mainEntityLogicalName: report.mainEntity || null,
    isGoverned: !!report.governed,
    rowLimit: report.rowLimit || null,
    timeoutMs: report.timeout ? report.timeout * 1000 : null,
    category: report.category || null,
    module: report.module || null,
    status: report.status || "Draft",
    version: report.version || 1,
    dataSources: [{
      id: newGuid(),
      name: (report.dataSources && report.dataSources[0] && report.dataSources[0].name) || "Primary source",
      isPrimary: true,
      // The type and its payload decide where rows come from: a view name, a FetchXML document, or
      // inline rows. Left empty, the engine builds the query from the columns and filters as before.
      sourceType: (() => {
        const chosen = sourceByLabel((report.dataSources && report.dataSources[0] || {}).type);
        return chosen ? coded(chosen.code, chosen.label) : null;
      })(),
      queryPayload: (report.dataSources && report.dataSources[0] && report.dataSources[0].query) || null,
      sourceAlias: alias,
      entityMappings: [
        { id: newGuid(), entityLogicalName: rootEntity, entityAlias: alias, depth: 0, columns }
      ].concat(joinMappings)
    }],
    filters: (report.filters || []).map((f, i) => ({
      id: newGuid(),
      fieldAlias: f.attribute,
      operator: coded(RPT_OPERATOR_CODES[f.operator] ?? null, f.operator),
      value: f.value || null,
      sequence: i + 1,
      groupId: f.group != null ? String(f.group) : null,
      isRuntimePrompt: !!(f.param && f.param !== "")
    })),
    parameters: (report.parameters || []).map((p, i) => ({
      id: newGuid(),
      parameterName: p.name,
      label: p.prompt || p.name,
      isRequired: !!p.required,
      defaultValue: p.def || null,
      displayOrder: i + 1,
      lookupTargetEntity: p.lookup || null
    })),
    formulas: (report.formulas || []).map((f, i) => ({
      id: newGuid(), formulaAlias: f.target || f.name, expression: f.expression, evaluationOrder: i + 1, isConditional: false
    })),
    /* The pipeline the runtime applies after formulas. A step whose type is not in the option set
       cannot be stored at all, so an unrecognised label is dropped here rather than failing the
       whole save — the catalogue and the option set are kept in step precisely to prevent that. */
    transformations: (report.transformations || [])
      .map((step, i) => ({ step, known: transformByLabel(step.type), typed: Number(step.seq) || i + 1 }))
      .filter(entry => entry.known)
      // Sorted by the sequence the user typed, then renumbered 1..n. The table carries a unique key
      // on (report, step order), so two steps sharing a number fail the whole save with a 412 — and
      // typing the same number twice is an easy thing to do. Their intended order is preserved.
      .sort((a, b) => a.typed - b.typed)
      .map((entry, index) => ({
        id: newGuid(),
        transformType: coded(entry.known.code, entry.known.name),
        configJson: entry.step.config || "{}",
        stepOrder: index + 1,
        enabled: true
      })),
    /* Access rules. The table has no "can view" column — only execute, export, edit and approve — so
       the designer's View checkbox is not persisted; catalog visibility follows the right to run.
       Only `canExecute` is enforced by the plugin; the rest are advisory in this architecture and
       that is stated on the tab rather than implied. */
    security: (report.security || [])
      .filter(rule => rule.ref)
      .map(rule => ({
        id: newGuid(),
        principalType: coded(RPT_PRINCIPAL_CODES[rule.ptype] ?? null, rule.ptype),
        principalIdText: rule.ref,
        canExecute: !!rule.run,
        canExport: !!rule.export,
        canEdit: !!rule.edit,
        canApprove: !!rule.approve
      })),
    // Conditional formatting rides in the layout JSON: it has no table of its own, and the as-built
    // schema already consolidates presentation concerns there rather than adding a row per rule.
    layout: report.layout ? {
      id: newGuid(),
      themeColor: report.layout.themeColor || "#0078d4",
      layoutJson: JSON.stringify(Object.assign({}, report.layout, {
        conditionalFormatting: (report.formatting || [])
          .filter(rule => rule.column && rule.condition)
          .map(rule => ({ column: rule.column, condition: rule.condition, style: rule.style }))
      }))
    } : null
  };
}
/* ---------- report definition writer ---------- */

/** Definition first, then data source → entity mapping → columns, then the flat child sets. */
async function writeReportChildren(reportId, def) {
  for (const source of def.dataSources || []) {
    const sourceId = await dvCreate("qdb_reportdatasource", defined({
      qdb_name: source.name || "Data source",
      qdb_isprimary: !!source.isPrimary,
      qdb_sourcetype: codeOf(source.sourceType),
      qdb_querypayload: source.queryPayload,
      qdb_sourcealias: source.sourceAlias,
      qdb_executionorder: 1,
      "Qdb_reportdefinitionid@odata.bind": `/qdb_reportdefinitions(${reportId})`
    }));

    for (const mapping of source.entityMappings || []) {
      const mappingId = await dvCreate("qdb_reportentitymapping", defined({
        qdb_name: mapping.entityLogicalName || "Entity",
        qdb_entitylogicalname: mapping.entityLogicalName,
        qdb_entityalias: mapping.entityAlias,
        qdb_depth: mapping.depth || 0,
        // Join fields are absent on the root mapping, which has no parent to link to.
        qdb_jointype: codeOf(mapping.joinType),
        qdb_joinexpressionjson: mapping.joinExpressionJson,
        "Qdb_reportdatasourceid@odata.bind": `/qdb_reportdatasources(${sourceId})`
      }));

      for (const column of mapping.columns || []) {
        await dvCreate("qdb_reportcolumn", defined({
          qdb_name: column.outputAlias || column.columnLogicalName || "Column",
          qdb_columnlogicalname: column.columnLogicalName,
          qdb_outputalias: column.outputAlias,
          qdb_aggregatefunction: codeOf(column.aggregateFunction),
          qdb_sortorder: column.sortOrder,
          qdb_grouporder: column.groupOrder,
          qdb_isvisible: column.isVisible !== false,
          "Qdb_reportentitymappingid@odata.bind": `/qdb_reportentitymappings(${mappingId})`
        }));
      }
    }
  }

  const parent = { "Qdb_reportdefinitionid@odata.bind": `/qdb_reportdefinitions(${reportId})` };

  for (const filter of def.filters || []) {
    await dvCreate("qdb_reportfilter", defined(Object.assign({
      qdb_name: filter.fieldAlias || "Filter",
      qdb_fieldalias: filter.fieldAlias,
      qdb_operator: codeOf(filter.operator),
      qdb_value: filter.value,
      qdb_sequence: filter.sequence,
      qdb_groupid: filter.groupId,
      qdb_isruntimeprompt: !!filter.isRuntimePrompt
    }, parent)));
  }

  for (const parameter of def.parameters || []) {
    await dvCreate("qdb_reportparameter", defined(Object.assign({
      qdb_name: parameter.parameterName || parameter.label || "Parameter",
      qdb_parametername: parameter.parameterName,
      qdb_label: parameter.label,
      qdb_isrequired: !!parameter.isRequired,
      qdb_defaultvalue: parameter.defaultValue,
      qdb_displayorder: parameter.displayOrder,
      qdb_lookuptargetentity: parameter.lookupTargetEntity
    }, parent)));
  }

  for (const formula of def.formulas || []) {
    await dvCreate("qdb_reportformula", defined(Object.assign({
      qdb_name: formula.formulaAlias || "Formula",
      qdb_formulaalias: formula.formulaAlias,
      qdb_expression: formula.expression,
      qdb_evaluationorder: formula.evaluationOrder,
      qdb_isconditional: !!formula.isConditional
    }, parent)));
  }

  for (const step of def.transformations || []) {
    await dvCreate("qdb_reporttransformation", defined(Object.assign({
      qdb_name: (step.transformType && step.transformType.label) || "Transformation",
      qdb_transformtype: codeOf(step.transformType),
      qdb_configjson: step.configJson,
      qdb_steporder: step.stepOrder,
      qdb_enabled: step.enabled !== false
    }, parent)));
  }

  for (const rule of def.security || []) {
    await dvCreate("qdb_reportsecurity", defined(Object.assign({
      qdb_name: rule.principalIdText || "Principal",
      qdb_principaltype: codeOf(rule.principalType),
      qdb_principalidtext: rule.principalIdText,
      qdb_canexecute: !!rule.canExecute,
      qdb_canexport: !!rule.canExport,
      qdb_canedit: !!rule.canEdit,
      qdb_canapprove: !!rule.canApprove
    }, parent)));
  }

  if (def.layout) {
    await dvCreate("qdb_reportlayout", defined(Object.assign({
      qdb_name: "Layout",
      qdb_themecolor: def.layout.themeColor,
      qdb_layoutjson: def.layout.layoutJson
    }, parent)));
  }
}

/** Leaf-first, so a child never outlives the parent it points at. */
async function deleteReportChildren(reportId) {
  const sources = await dvList("qdb_reportdatasource", byReport(reportId) + "&$select=qdb_reportdatasourceid");
  for (const source of sources) {
    const mappings = await dvList("qdb_reportentitymapping",
      `?$filter=_qdb_reportdatasourceid_value eq ${source.qdb_reportdatasourceid}&$select=qdb_reportentitymappingid`);
    for (const mapping of mappings) {
      const columns = await dvList("qdb_reportcolumn",
        `?$filter=_qdb_reportentitymappingid_value eq ${mapping.qdb_reportentitymappingid}&$select=qdb_reportcolumnid`);
      for (const column of columns) await dvDelete("qdb_reportcolumn", column.qdb_reportcolumnid);
      await dvDelete("qdb_reportentitymapping", mapping.qdb_reportentitymappingid);
    }
    await dvDelete("qdb_reportdatasource", source.qdb_reportdatasourceid);
  }

  const flat = [
    ["qdb_reportfilter", "qdb_reportfilterid"], ["qdb_reportparameter", "qdb_reportparameterid"],
    ["qdb_reportformula", "qdb_reportformulaid"], ["qdb_reporttransformation", "qdb_reporttransformationid"],
    ["qdb_reportrelationship", "qdb_reportrelationshipid"], ["qdb_reportsecurity", "qdb_reportsecurityid"],
    ["qdb_reportlayout", "qdb_reportlayoutid"]
  ];
  for (const [entity, idField] of flat) {
    for (const row of await dvList(entity, byReport(reportId) + `&$select=${idField}`)) {
      await dvDelete(entity, row[idField]);
    }
  }
}

/* Category, module and status are written, not just collected. They were captured by the General tab
   and then dropped on save, so the list could only ever show them blank. */
function reportDefinitionAttributes(def) {
  return defined({
    qdb_name: def.name,
    qdb_description: def.description,
    qdb_mainentitylogicalname: def.mainEntityLogicalName,
    qdb_isgoverned: !!def.isGoverned,
    qdb_rowlimit: def.rowLimit,
    qdb_timeoutms: def.timeoutMs,
    qdb_category: reportChoiceCode("qdb_category", def.category),
    qdb_module: reportChoiceCode("qdb_module", def.module),
    qdb_status: reportChoiceCode("qdb_status", def.status),
    qdb_ispublished: def.status === "Published",
    qdb_currentversionnumber: def.version
  });
}

// A report loaded from Dataverse (has savedId) updates in place; a new one is created.
async function saveReportToServer(report) {
  const def = reportToDefinition(report);
  const isUpdate = !!report.savedId;
  try {
    if (isUpdate) {
      // Replace the children wholesale, matching how the definition is loaded as one graph.
      await deleteReportChildren(report.savedId);
      await dvUpdate("qdb_reportdefinition", report.savedId, reportDefinitionAttributes(def));
      await writeReportChildren(report.savedId, def);
    } else {
      report.savedId = await dvCreate("qdb_reportdefinition", reportDefinitionAttributes(def));
      await writeReportChildren(report.savedId, def);
    }
    toast(isUpdate ? "Report updated in Dataverse" : "Report saved to Dataverse", "ok");
    reportCatalog.refresh();
  } catch (error) {
    toast("Save failed — " + error.message, "err");
  }
}

// Reverse of reportToDefinition. Starts from a full default report (so every array the designer
// touches exists) and overwrites what was persisted, so a saved report reopens ready to edit.
const RPT_AGG_LABELS = { 100000001:"Sum", 100000002:"Count", 100000003:"Average", 100000004:"Min", 100000005:"Max" };
function aggLabel(aggregate) { return aggregate && aggregate.code != null ? (RPT_AGG_LABELS[aggregate.code] || "None") : "None"; }
function definitionToReport(def) {
  const report = newDefinition(null);
  report.id = def.id;
  report.savedId = def.id;
  report.name = def.name || "Untitled report";
  report.description = def.description || "";
  report.mainEntity = def.mainEntityLogicalName || report.mainEntity;
  report.governed = !!def.isGoverned;
  report.rowLimit = def.rowLimit || report.rowLimit;
  report.timeout = def.timeoutMs ? Math.round(def.timeoutMs / 1000) : report.timeout;
  report.category = def.category || "";
  report.module = def.module || "";
  report.status = def.status || "Draft";
  report.version = def.version || 1;

  const columns = [];
  (def.dataSources || []).forEach(ds => (ds.entityMappings || []).forEach(m => (m.columns || []).forEach(c => {
    columns.push({ name: c.outputAlias || c.columnLogicalName, entity: m.entityLogicalName || def.mainEntityLogicalName,
      attribute: c.columnLogicalName, type: "Text", format: "", width: 120, align: "Left", agg: aggLabel(c.aggregateFunction), masked: false, visible: c.isVisible !== false });
  })));
  if (columns.length) report.columns = columns;

  // Rebuild the join list from the non-root mappings — without this, reopening a multi-entity report
  // and saving it again would quietly flatten it back to a single entity.
  const joins = [];
  (def.dataSources || []).forEach(ds => (ds.entityMappings || []).forEach(m => {
    if (!m.joinExpressionJson || m.entityLogicalName === def.mainEntityLogicalName) return;
    let link = {};
    try { link = JSON.parse(m.joinExpressionJson); } catch (e) { return; }
    if (!link.from || !link.to) return;
    joins.push({
      entity: m.entityLogicalName,
      joinType: RPT_JOIN_LABELS[m.joinType && m.joinType.code] || "Inner join",
      leftKey: link.to,     // on the parent entity
      rightKey: link.from   // on the joined entity
    });
  }));
  report.joins = joins;

  if ((def.transformations || []).length) {
    report.transformations = def.transformations.map((step, i) => {
      const known = transformByCode(step.transformType && step.transformType.code);
      return {
        type: known ? (known.live ? known.label : `${known.label} — stored, not applied yet`) : TRANSFORM_TYPES[0],
        target: "",
        config: step.configJson || "{}",
        seq: step.stepOrder || i + 1
      };
    });
  }

  // View is not stored — the table has no column for it — so a loaded rule shows View ticked
  // wherever the principal may run the report, which is what catalog visibility follows.
  if ((def.security || []).length) {
    report.security = def.security.map(rule => ({
      ptype: RPT_PRINCIPAL_LABELS[rule.principalType && rule.principalType.code] || "Security role",
      ref: rule.principalIdText || "",
      view: !!rule.canExecute,
      run: !!rule.canExecute,
      export: !!rule.canExport,
      edit: !!rule.canEdit,
      approve: !!rule.canApprove
    }));
  }
  report.filters = (def.filters || []).map(f => ({ attribute: f.fieldAlias, operator: (f.operator && f.operator.label) || "Equals",
    value: f.value || "", param: f.isRuntimePrompt ? "param" : "", token: "(none)", group: f.groupId ? (Number(f.groupId) || 0) : 0, andor: "And" }));
  report.parameters = (def.parameters || []).map(p => ({ name: p.parameterName, prompt: p.label || p.parameterName, type: "Text",
    required: !!p.isRequired, def: p.defaultValue || "", token: "(none)", lookup: p.lookupTargetEntity || "" }));
  report.formulas = (def.formulas || []).map(f => ({ name: f.formulaAlias, expression: f.expression || "", type: "Number", target: f.formulaAlias }));
  report.dataSources = (def.dataSources || []).map(ds => {
    const known = sourceByCode(ds.sourceType && ds.sourceType.code);
    return {
      name: ds.name || "Primary source",
      type: known ? (known.live ? known.label : `${known.label} — stored, not applied yet`) : "FetchXML",
      connector: "",
      query: ds.queryPayload || "",
      primary: !!ds.isPrimary, joinL: "", joinR: ""
    };
  });
  if (def.dataSources && def.dataSources.length === 0) report.dataSources = newDefinition(null).dataSources;
  if (def.layout && def.layout.layoutJson) {
    try {
      const stored = JSON.parse(def.layout.layoutJson);
      // Formatting rules travel inside the layout JSON but belong on the report, so lift them back
      // out — otherwise reopening a report would quietly drop every rule on the next save.
      if (Array.isArray(stored.conditionalFormatting)) report.formatting = stored.conditionalFormatting;
      delete stored.conditionalFormatting;
      report.layout = stored;
    } catch (e) { /* keep default layout */ }
  }
  return report;
}

/** Reassembles the stored graph into the ReportDefinition shape definitionToReport expects. */
async function loadReportDefinition(id) {
  const record = await dvRetrieve("qdb_reportdefinition", id,
    "?$select=qdb_reportdefinitionid,qdb_name,qdb_description,qdb_mainentitylogicalname,qdb_isgoverned,"
    + "qdb_rowlimit,qdb_timeoutms,qdb_category,qdb_module,qdb_status,qdb_ispublished,qdb_currentversionnumber");

  const [sources, filters, parameters, formulas, layouts, transformations, security] = await Promise.all([
    dvList("qdb_reportdatasource", byReport(id) + "&$select=qdb_reportdatasourceid,qdb_name,qdb_isprimary,qdb_sourcealias,qdb_sourcetype,qdb_querypayload&$orderby=qdb_executionorder"),
    dvList("qdb_reportfilter", byReport(id) + "&$select=qdb_fieldalias,qdb_operator,qdb_value,qdb_sequence,qdb_groupid,qdb_isruntimeprompt&$orderby=qdb_sequence"),
    dvList("qdb_reportparameter", byReport(id) + "&$select=qdb_parametername,qdb_label,qdb_isrequired,qdb_defaultvalue,qdb_displayorder,qdb_lookuptargetentity&$orderby=qdb_displayorder"),
    dvList("qdb_reportformula", byReport(id) + "&$select=qdb_formulaalias,qdb_expression,qdb_evaluationorder&$orderby=qdb_evaluationorder"),
    dvList("qdb_reportlayout", byReport(id) + "&$select=qdb_themecolor,qdb_layoutjson"),
    dvList("qdb_reporttransformation", byReport(id)
      + "&$select=qdb_transformtype,qdb_configjson,qdb_steporder,qdb_enabled&$orderby=qdb_steporder"),
    dvList("qdb_reportsecurity", byReport(id)
      + "&$select=qdb_principaltype,qdb_principalidtext,qdb_canexecute,qdb_canexport,qdb_canedit,qdb_canapprove")
  ]);

  const dataSources = [];
  for (const source of sources) {
    const mappings = await dvList("qdb_reportentitymapping",
      `?$filter=_qdb_reportdatasourceid_value eq ${source.qdb_reportdatasourceid}`
      + "&$select=qdb_reportentitymappingid,qdb_entitylogicalname,qdb_entityalias,qdb_depth,"
      + "qdb_jointype,qdb_joinexpressionjson&$orderby=qdb_depth");

    const entityMappings = [];
    for (const mapping of mappings) {
      const columns = await dvList("qdb_reportcolumn",
        `?$filter=_qdb_reportentitymappingid_value eq ${mapping.qdb_reportentitymappingid}`
        + "&$select=qdb_columnlogicalname,qdb_outputalias,qdb_aggregatefunction,qdb_sortorder,qdb_grouporder,qdb_isvisible&$orderby=qdb_sortorder");
      entityMappings.push({
        id: mapping.qdb_reportentitymappingid,
        entityLogicalName: mapping.qdb_entitylogicalname,
        entityAlias: mapping.qdb_entityalias,
        depth: mapping.qdb_depth,
        joinType: mapping.qdb_jointype == null ? null : { code: mapping.qdb_jointype },
        joinExpressionJson: mapping.qdb_joinexpressionjson,
        columns: columns.map(c => ({
          columnLogicalName: c.qdb_columnlogicalname, outputAlias: c.qdb_outputalias,
          aggregateFunction: c.qdb_aggregatefunction == null ? null : { code: c.qdb_aggregatefunction },
          sortOrder: c.qdb_sortorder, groupOrder: c.qdb_grouporder, isVisible: c.qdb_isvisible !== false
        }))
      });
    }
    dataSources.push({
      id: source.qdb_reportdatasourceid, name: source.qdb_name,
      isPrimary: !!source.qdb_isprimary, sourceAlias: source.qdb_sourcealias,
      sourceType: source.qdb_sourcetype == null ? null : { code: source.qdb_sourcetype },
      queryPayload: source.qdb_querypayload, entityMappings
    });
  }

  return {
    id: record.qdb_reportdefinitionid,
    name: record.qdb_name,
    description: record.qdb_description,
    mainEntityLogicalName: record.qdb_mainentitylogicalname,
    isGoverned: !!record.qdb_isgoverned,
    rowLimit: record.qdb_rowlimit,
    timeoutMs: record.qdb_timeoutms,
    category: formattedValue(record, "qdb_category"),
    module: formattedValue(record, "qdb_module"),
    status: record.qdb_ispublished ? "Published" : (formattedValue(record, "qdb_status") || "Draft"),
    version: record.qdb_currentversionnumber,
    dataSources,
    filters: filters.map(f => ({
      fieldAlias: f.qdb_fieldalias,
      operator: { code: f.qdb_operator, label: f["qdb_operator@OData.Community.Display.V1.FormattedValue"] },
      value: f.qdb_value, sequence: f.qdb_sequence, groupId: f.qdb_groupid, isRuntimePrompt: !!f.qdb_isruntimeprompt
    })),
    parameters: parameters.map(p => ({
      parameterName: p.qdb_parametername, label: p.qdb_label, isRequired: !!p.qdb_isrequired,
      defaultValue: p.qdb_defaultvalue, displayOrder: p.qdb_displayorder, lookupTargetEntity: p.qdb_lookuptargetentity
    })),
    formulas: formulas.map(f => ({
      formulaAlias: f.qdb_formulaalias, expression: f.qdb_expression, evaluationOrder: f.qdb_evaluationorder
    })),
    layout: layouts.length ? { themeColor: layouts[0].qdb_themecolor, layoutJson: layouts[0].qdb_layoutjson } : null,
    transformations: transformations.map(t => ({
      transformType: t.qdb_transformtype == null ? null : { code: t.qdb_transformtype },
      configJson: t.qdb_configjson, stepOrder: t.qdb_steporder, enabled: t.qdb_enabled !== false
    })),
    security: security.map(s => ({
      principalType: s.qdb_principaltype == null ? null : { code: s.qdb_principaltype },
      principalIdText: s.qdb_principalidtext,
      canExecute: !!s.qdb_canexecute, canExport: !!s.qdb_canexport,
      canEdit: !!s.qdb_canedit, canApprove: !!s.qdb_canapprove
    }))
  };
}

/* Only the column's logical name is stored, so its data type comes back from metadata rather than
   being assumed. Without this every reopened column is "Text", and a currency column loses its
   formatting and its right alignment the moment the report is reopened. */
async function resolveColumnTypes(report) {
  const entities = [...new Set((report.columns || []).map(c => c.entity || report.mainEntity).filter(Boolean))];
  await Promise.all(entities.map(entity =>
    metadata.attributesByEntity[entity] ? Promise.resolve() : loadAttributeMetadata(entity)));
  for (const column of report.columns || []) {
    const known = attributesOf(column.entity || report.mainEntity).find(a => a.a === column.attribute);
    if (known) { column.type = known.t; column.name = column.name || known.n; }
  }
}

/* The report catalogue. Every column the grid shows is a real attribute, so a report reads the same
   in the designer as it does in an advanced find. */
const REPORT_LIST_SELECT = [
  "qdb_reportdefinitionid", "qdb_name", "qdb_reportcode", "qdb_description", "qdb_mainentitylogicalname",
  "qdb_category", "qdb_module", "qdb_status", "qdb_ispublished", "qdb_isgoverned",
  "qdb_currentversionnumber", "modifiedon", "_ownerid_value"
].join(",");

const reportCatalog = dataverseCatalog(
  "qdb_reportdefinition",
  `?$select=${REPORT_LIST_SELECT}&$orderby=qdb_name&$top=200`,
  row => ({
    id: row.qdb_reportdefinitionid,
    name: row.qdb_name || "(unnamed)",
    reportCode: row.qdb_reportcode,
    description: row.qdb_description,
    mainEntityLogicalName: row.qdb_mainentitylogicalname,
    category: formattedValue(row, "qdb_category"),
    module: formattedValue(row, "qdb_module"),

    status: row.qdb_ispublished ? "Published" : (formattedValue(row, "qdb_status") || "Draft"),
    isPublished: !!row.qdb_ispublished,
    governed: !!row.qdb_isgoverned,

);

/** Reports the signed-in user owns — what "My Reports" means once the list is real. */
const isOwnedByCurrentUser = report =>
  !!report.ownerId && !!state.userId &&
  report.ownerId.replace(/[{}]/g, "").toLowerCase() === state.userId.replace(/[{}]/g, "").toLowerCase();
async function openSavedReport(id) {
  try {

  } catch (error) {
    toast("Delete failed — " + error.message, "err");
  }
}

// The reverse of dashboardToDefinition: turn a persisted DashboardDefinition back into the
// composer's in-memory model so a saved dashboard can be reopened and edited. Composer widget
// kinds are the lowercased enum names; aggregations match the enum verbatim. cardIcon/badge
// hints aren't persisted server-side, so they fall back to defaults on reload.
function definitionToDashboard(def) {
  return {
    id: def.id,
    savedId: def.id,
    title: def.title || "Untitled dashboard",
    owner: "Saved",
    modified: new Date().toISOString().slice(0, 10),
    isGoverned: !!def.isGoverned,
    _seq: 0, _sel: null, _preview: false,
    sections: (def.sections || []).map(section => ({
      id: section.id || newGuid(),
      title: section.title || "",
      cols: Math.min(Math.max(section.columns || 4, 1), 4),
      widgets: (section.widgets || []).map(widget => ({
        id: widget.id || newGuid(),
        title: widget.title || "",
        widget: String(widget.kind || "Metric").toLowerCase(),
        entity: widget.entity || "account",
        groupBy: widget.groupByAttribute || "",
        measure: widget.measureAttribute || "",
        agg: widget.aggregation || "Sum",
        chartType: widget.chartType || "Column",
        cardIcon: "money", badgeText: "", badgeLevel: ""
      }))
    }))
  };
}

async function loadDashboardDefinition(id) {
  const record = await dvRetrieve("qdb_dashboard", id, "?$select=qdb_dashboardid,qdb_dashboardname,qdb_isgoverned");
  const sections = await dvList("qdb_dashboardsection",
    `?$filter=_qdb_dashboardid_value eq ${id}&$select=qdb_dashboardsectionid,qdb_dashboardsectionname,qdb_columns&$orderby=qdb_sequence`);

  const mapped = [];
  for (const section of sections) {
    const widgets = await dvList("qdb_dashboardwidget",
      `?$filter=_qdb_dashboardsectionid_value eq ${section.qdb_dashboardsectionid}`
      + "&$select=qdb_dashboardwidgetid,qdb_dashboardwidgetname,qdb_kind,qdb_entity,qdb_groupby,qdb_measure,qdb_aggregation,qdb_charttype&$orderby=qdb_sequence");
    mapped.push({
      id: section.qdb_dashboardsectionid,
      title: section.qdb_dashboardsectionname,
      columns: section.qdb_columns,
      widgets: widgets.map(w => ({
        id: w.qdb_dashboardwidgetid, title: w.qdb_dashboardwidgetname, kind: w.qdb_kind, entity: w.qdb_entity,
        groupByAttribute: w.qdb_groupby, measureAttribute: w.qdb_measure,
        aggregation: w.qdb_aggregation, chartType: w.qdb_charttype
      }))
    });
  }

  return { id: record.qdb_dashboardid, title: record.qdb_dashboardname, isGoverned: !!record.qdb_isgoverned, sections: mapped };
}

/* ============================ CANVAS ENGINE (shared) ============================ */
function makeNodeDraggable(node, onMove) {
  let sx, sy, ox, oy, dragging = false;
  const move = (e) => { if (!dragging) return; node.style.left = Math.max(0, ox + (e.clientX - sx)) + "px"; node.style.top = Math.max(0, oy + (e.clientY - sy)) + "px"; onMove && onMove(); };
  const up = () => { dragging = false; node.classList.remove("dragging"); window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  node.addEventListener("mousedown", (e) => { if (e.target.closest(".ndel")) return; dragging = true; node.classList.add("dragging"); sx = e.clientX; sy = e.clientY; ox = parseFloat(node.style.left)||0; oy = parseFloat(node.style.top)||0; e.preventDefault(); window.addEventListener("mousemove", move); window.addEventListener("mouseup", up); });
}
function drawWires(svg, conns) {
  svg.innerHTML = conns.map(c => {
    const a = c.from, b = c.to; if (!a || !b) return "";
    const x1 = a.offsetLeft + a.offsetWidth, y1 = a.offsetTop + 23, x2 = b.offsetLeft, y2 = b.offsetTop + 23, mx = (x1 + x2) / 2;
    const col = c.color || "var(--primary)";
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" style="fill:none;stroke:${col};stroke-width:2;${c.dashed?"stroke-dasharray:5 4;":""}"/>${c.label?`<text x="${mx}" y="${(y1+y2)/2-5}" text-anchor="middle" style="font-size:10px;fill:${col};font-weight:600;paint-order:stroke;stroke:var(--surface-alt);stroke-width:3px">${esc(c.label)}</text>`:""}`;
  }).join("");
}
function canvasNode(id, headClass, title, bodyHtml, x, y, delAttr) {
  return `<div class="node" data-node="${id}" style="left:${x}px;top:${y}px"><div class="node-head ${headClass}"><span>${esc(title)}</span>${delAttr?`<button class="ndel" ${delAttr}>✕</button>`:""}</div><div class="node-body">${bodyHtml}</div><span class="port l"></span><span class="port r"></span></div>`;
}
function viewToggle(current, options) {
  return `<div class="view-toggle">${options.map(o=>`<button class="${current===o.k?"active":""}" data-view="${o.k}">${o.icon||""}${esc(o.label)}</button>`).join("")}</div>`;
}

/* ============================ VIEW ROUTER ============================ */
function render() {
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.view === state.view));
  const c = $("#content");
  c.innerHTML = "";
  if (state.view === "designer") return renderDesigner(c);
  if (state.view === "manualdesigner") return renderManualDesigner(c);
  if (state.view === "dashboards") return renderDashboards(c);
  if (state.view === "dashboardcomposer") return renderDashboardComposer(c);
  if (state.view === "datasources") return renderSimpleList(c, "Data Sources", "Reusable data-source definitions across reports.", dataSourcesView(), "datasource", "New data source");
  if (state.view === "connectors") return renderSimpleList(c, "External Connectors", "Secure connections to SQL, Core Banking, MIS and REST systems. Secrets are stored as Key Vault references — never in Dataverse.", connectorsView(), "connector", "New connector");
  if (state.view === "logs") return renderSimpleList(c, "Execution Logs", "Every production report run is logged (who, when, parameters, source, rows, duration, outcome).", logsView(), "executionlog", "New entry");
  if (state.view === "audit") return renderSimpleList(c, "Audit Log", "Append-only change history of report configuration. No update or delete is permitted on audit records.", auditView(), "auditlog", "New entry");
  if (state.view === "categories") return renderSimpleList(c, "Report Categories", "Reports grouped by category.", categoriesView());
  return renderReports(c);
}

/* ============================ REPORTS LIST ============================ */
function renderReports(c) {
  const mine = state.view === "myreports";
  const all = reportCatalog.get();
  const list = mine ? all.filter(isOwnedByCurrentUser) : all;
  const cmd = el(`<div class="cmdbar">
    <button class="cmd primary" id="btnNew">${ic("add")}New report</button>
    <button class="cmd" id="btnNewDash">${ic("chart")}New dashboard</button>
    <button class="cmd" id="btnEdit" disabled>${ic("edit")}Edit</button>
    <button class="cmd" id="btnClone" disabled>${ic("copy")}Clone</button>
    <button class="cmd" id="btnRun" disabled>${ic("play")}Run</button>
    <div class="cmd-sep"></div>
    <button class="cmd" id="btnPublish" disabled>${ic("publish")}Publish</button>
    <button class="cmd" id="btnDelete" disabled>${ic("trash")}Delete</button>
    <button class="cmd" id="btnRefresh">${ic("refresh")}Refresh</button>
    <div class="cmd-spacer"></div>
    <button class="cmd" id="btnExportView">${ic("excel")}Export to Excel</button>
  </div>`);
  const emptyMessage = mine
    ? "You don't own any report definitions in this environment yet."
    : "No report definitions in this environment yet. Use New report to create one.";
  const body = list.length
    ? `<div class="grid-wrap"><table class="grid" role="grid">
      <thead><tr>
        <th class="row-check"><input type="checkbox" disabled></th>
        <th>Report name ↓</th><th>Category</th><th>Module</th><th>Owner</th><th>Status</th><th>Ver.</th><th>Modified</th><th>Governed</th>
      </tr></thead>
      <tbody>${list.map(rowHtml).join("")}</tbody>
    </table></div>
    <div class="legend"><span><b>${list.filter(r=>r.status==="Published").length}</b> published</span><span><b>${list.filter(r=>r.status!=="Published").length}</b> draft</span><span><b>${list.filter(r=>r.governed).length}</b> governed</span></div>`
    : `<div class="section-card" style="max-width:940px">${catalogEmptyState(reportCatalog, emptyMessage)}</div>`;
  const scroll = el(`<div class="scroll"><div class="page">
    <div class="page-head"><div><h1>${mine?"My Reports":"All Reports"}</h1><div class="page-sub">${list.length} report definition${list.length===1?"":"s"} in Dataverse · metadata-driven · run on Dynamics 365 on-prem 9.x and Dataverse cloud</div></div></div>
    ${body}
  </div></div>`);
  c.appendChild(cmd); c.appendChild(scroll); labelizeGrid(scroll);

  const selected = () => list.find(r => r.id === state.selectedReportId) || null;
  const refreshButtons = () => {
    const has = !!selected();
    ["btnEdit","btnDelete","btnClone","btnRun","btnPublish"].forEach(id => $("#"+id).disabled = !has);
  };
  scroll.querySelectorAll("tbody tr").forEach(tr => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest(".link-cell")) return;
      scroll.querySelectorAll("tbody tr").forEach(x => x.classList.remove("selected"));
      tr.classList.add("selected");
      const cb = tr.querySelector("input"); cb.checked = true;
      state.selectedReportId = tr.dataset.id; refreshButtons();
    });
    tr.querySelector(".link-cell").addEventListener("click", () => openSavedReport(tr.dataset.id));
  });
  $("#btnNew").onclick = () => openNewChooser();
  $("#btnNewDash").onclick = () => { state.view = "dashboards"; render(); setTimeout(openNewDashboardChooser, 30); };
  $("#btnEdit").onclick = () => selected() && openSavedReport(state.selectedReportId);
  $("#btnRun").onclick = () => selected() && runSavedReportFromList(state.selectedReportId);
  $("#btnClone").onclick = () => { const r = selected(); if (r) cloneSavedReport(r); };
  $("#btnPublish").onclick = () => { const r = selected(); if (r) publishSavedReport(r); };
  $("#btnDelete").onclick = () => {
    if (!selected()) return;

/* Copies the whole definition, not just the header row: a clone whose columns, filters and security
   were left behind would open looking finished and return nothing. */
async function cloneSavedReport(report) {
  try {
    const copy = definitionToReport(await loadReportDefinition(report.id));
    copy.savedId = null;
    copy.name = `${report.name} (copy)`;
    copy.reportCode = "";
    copy.isPublished = false;
    await saveReportToServer(copy);
  } catch (error) {
    toast("Clone failed — " + error.message, "err");
  }
}

async function publishSavedReport(report) {
  try {
    await dvUpdate("qdb_reportdefinition", report.id, {
      qdb_ispublished: true,
      qdb_status: RPT_STATUS_CODES.Published,
      qdb_currentversionnumber: (report.version || 0) + 1
    });
    toast(`“${report.name}” published as v${(report.version || 0) + 1}`, "ok");
    reportCatalog.refresh();
  } catch (error) {
    toast("Publish failed — " + error.message, "err");
  }
}
/* Publishing writes to Dataverse rather than flipping a field in memory, so what the list shows and
   what the runtime honours are the same fact. */
async function togglePublishState(report) {
  if (!report.savedId) { toast("Save the report before publishing it", "warn"); return; }
  if (report.governed && report.approver === report.owner) {
    toast("Governed reports need an approver different from the author (BR-3)", "warn");
    return;
  }
  const publishing = report.status !== "Published";
  const version = publishing ? (report.version || 0) + 1 : report.version;
  try {
    await dvUpdate("qdb_reportdefinition", report.savedId, {
      qdb_ispublished: publishing,
      qdb_status: publishing ? RPT_STATUS_CODES.Published : RPT_STATUS_CODES.Draft,
      qdb_currentversionnumber: version
    });
    report.status = publishing ? "Published" : "Draft";
    report.version = version;
    toast(publishing ? `Published as v${version}` : "Report unpublished", "ok");
    reportCatalog.refresh();
    render();
  } catch (error) {
    toast("Publish failed — " + error.message, "err");
  }
}

/* helper: editable list table */
function listTable(cols, rows, renderRow, onAdd, addLabel) {
  const head = `<thead><tr><th style="width:28px"></th>${cols.map(c=>`<th ${c.num?'class="num"':""} ${c.w?`style="width:${c.w}"`:""}>${c.t}</th>`).join("")}<th style="width:36px"></th></tr></thead>`;
  const body = rows.length ? rows.map(renderRow).join("") : `<tr class="empty-row"><td colspan="${cols.length+2}">No rows yet — use “${esc(addLabel)}” to add one.</td></tr>`;
  const wrap = el(`<div style="overflow-x:auto"><table class="subgrid">${head}<tbody>${body}</tbody></table></div>`);
  const add = el(`<button class="btn sm btn-add">${ic("add")}${esc(addLabel)}</button>`);
  add.onclick = onAdd;
  const frag = document.createDocumentFragment(); frag.appendChild(wrap); frag.appendChild(add);
  return frag;
}
function bindInputs(scope, arr) {
  scope.querySelectorAll("[data-i]").forEach(inp => {
    const handler = () => {
      const i = +inp.dataset.i, key = inp.dataset.k;
      let v = inp.type==="checkbox" ? inp.checked : inp.value;
      if (inp.dataset.num) v = +v;
      arr[i][key] = v;
      if (inp.dataset.rerender) renderTab();
    };
    inp.addEventListener(inp.tagName==="SELECT"||inp.type==="checkbox" ? "change" : "input", handler);
  });
  scope.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { arr.splice(+b.dataset.del,1); renderTab(); });
}

/* ============================ MANUAL BANDED DESIGNER ============================ */
const FIELD_TRANSFORMS = {
  "Text": ["None","UPPERCASE","lowercase","Capitalize","Trim","Mask"],
  "Whole number": ["None","Thousands","Percentage"],
  "Decimal": ["None","2 decimals","0 decimals","Thousands","Percentage"],
  "Currency": ["None","0 decimals"],
  "Date/Time": ["None","dd/MM/yyyy","MMM dd, yyyy","yyyy-MM-dd","Relative"],
  "Option set": ["None","UPPERCASE","lowercase","Capitalize"],
  "Lookup": ["None","UPPERCASE"],
  "Boolean": ["None","Yes / No","✓ / ✕"]
};
function transformsFor(type) { return FIELD_TRANSFORMS[type] || ["None"]; }
function applyFieldTransform(type, tf, v) {
  tf = tf || "None"; if (v == null || v === "") return "";
  if (type === "Currency") { const n = +v||0; return tf==="0 decimals" ? "QAR "+Math.round(n).toLocaleString("en-US") : money(n); }
  if (type === "Decimal" || type === "Whole number") { const n = +v||0;
    if (tf==="Percentage") return n.toLocaleString()+"%";
    if (tf==="0 decimals") return Math.round(n).toLocaleString();
    if (tf==="2 decimals") return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

async function applyStart(d) {

/* Duplicating reads the stored definition rather than a row from the list. The list carries a name
   and a category; the columns, filters and parameters the user expects to be copied only exist in
   Dataverse. */
async function copyStoredReportIntoDraft(d) {
  const chosen = reportCatalog.get().find(r => r.name === d.dupPick);
  if (!chosen) { toast("Pick a report to duplicate", "warn"); return; }
  try {
    const src = definitionToReport(await loadReportDefinition(chosen.id));
    d.name = `${chosen.name} (copy)`;
    d.category = chosen.category || d.category;
    d.module = chosen.module || d.module;
    d.mainEntity = src.mainEntity;
    d.sourceType = src.dataSources[0].type;
    d.columns = src.columns.map(c => c.attribute);
    d.layoutType = src.layout.type;
    d.exports = src.exports.filter(e => e.enabled).map(e => e.format);
    d.filters = src.filters.map(f => ({ attribute:f.attribute, operator:f.operator, value:f.value, param:f.param }));
    d.parameters = src.parameters.map(p => ({ name:p.name, prompt:p.prompt, type:p.type, required:p.required }));
  } catch (error) {
    toast("Couldn't read the report to duplicate — " + error.message, "err");
  }
}

/* Synthesize type-appropriate sample rows for any entity + column set */
function synthRows(cols, entity) {
  const branches = ["Doha Main","Al Sadd","West Bay"], statuses = ["Active","Pending","Approved"], words = ["Alpha","Bravo","Charlie","Delta","Echo","Foxtrot"];
  const names = ["Ahmed Al-Thani","Fatima Hassan","QNB Corp","Doha Trading","Gulf Holding","Sara Malik","Al Rayyan LLC","Khalid Nasser","Mariam Ali"];
  const amounts = [1500000,850000,2200000,640000,1750000,980000,3100000,520000,1280000];
  const stages = ["Submitted","Under Review","Credit Check","Approval","Disbursed","Closed"];
  const actions = ["Created","Reassigned","Approved","Escalated","Returned","Completed"];
  const wfStatus = ["Draft","Pending","Approved","Rejected","On Hold"];
  const slaStatus = ["Met","Breached","At Risk"];
  const policies = ["Standard 48h","Priority 24h","Critical 8h","Regulatory 72h"];
  const isWorkflow = entity === "qdb_processhistory", isSla = entity === "qdb_slatracking";
  const prefix = (entity||"RE").replace("qdb_","").slice(0,2).toUpperCase();
  const domainValue = (label, i) => {
    if (isSla) {
      if (label.includes("status")) return slaStatus[i%slaStatus.length];
      if (label.includes("policy")||label.includes("sla")) return policies[i%policies.length];
      if (label.includes("owner")||label.includes("assigned")||label.includes("team")) return names[i%names.length];
    }
    if (isWorkflow) {
      if (label.includes("stage")||label.includes("step")) return stages[i%stages.length];
      if (label.includes("action")||label.includes("activity")) return actions[i%actions.length];
      if (label.includes("to status")||label.startsWith("to ")) return wfStatus[(i+1)%wfStatus.length];
      if (label.includes("from")||label.includes("status")) return wfStatus[i%wfStatus.length];
      if (label.includes("by")||label.includes("actor")||label.includes("performed")||label.includes("user")) return names[i%names.length];
    }
    return null;
  };
  const rows = [];
  for (let i=0;i<9;i++) {
    const row = {};
    cols.forEach(c => {
      const label = c.name.toLowerCase();
      const domain = domainValue(label, i);
      if (domain != null) row[c.key] = domain;
      else if (c.type==="Currency") row[c.key] = amounts[i%9];
      else if (c.type==="Decimal") row[c.key] = [1.25,3.50,2.10,4.80,0.95][i%5];
      else if (c.type==="Whole number") row[c.key] = (isSla ? [24,48,8,72,36][i%5] : [12,24,36,18,60][i%5]);
      else if (c.type==="Date/Time") row[c.key] = "2026-06-"+String((i%27)+1).padStart(2,"0");
      else if (c.type==="Option set") row[c.key] = statuses[i%3];
      else if (c.type==="Lookup") row[c.key] = branches[i%3];
      else if (label.includes("branch")) row[c.key] = branches[i%3];
      else if (label.includes("no")||label.includes("number")) row[c.key] = prefix+"-"+(24001+i);
      else if (label.includes("name")) row[c.key] = names[i%names.length];
      else row[c.key] = words[i%words.length]+" "+(i+1);
    });
    rows.push(row);
  }
  return rows;
}

  // pick a real grouping column: a category that actually repeats (distinct < rows), preferring option set / lookup
  let catCol = null, bestDistinct = Infinity;
  cols.filter(c=>["Text","Option set","Lookup"].includes(c.type)).forEach(c => { const dcount = new Set(rows.map(r=>r[c.key])).size; const boost = (c.type==="Option set"||c.type==="Lookup")?0.5:1; if (dcount>1 && dcount<rows.length && dcount*boost<bestDistinct) { bestDistinct = dcount*boost; catCol = c; } });
  const sum = valCol ? rows.reduce((s,r)=>s+(+r[valCol.key]||0),0) : 0;
  const tiles = [["Records", rows.length]];
  if (valCol) { tiles.push(["Total " + valCol.name, money(sum)]); tiles.push(["Average", money(sum/rows.length)]); }
  if (catCol) tiles.push([catCol.name + " groups", new Set(rows.map(r=>r[catCol.key])).size]);
  return `<div class="kpi-row">${tiles.map(t=>`<div class="kpi-tile"><div class="kpi-label">${esc(String(t[0]))}</div><div class="kpi-value">${esc(String(t[1]))}</div></div>`).join("")}</div>`;

    </div>
    <div class="dialog-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="runGo">${ic("play")}Run</button></div>
  </div></div>`);
  document.body.appendChild(scrim);
  const close = () => scrim.remove();

  const btns = () => { $("#dbOpen").disabled = !selId; $("#dbClone").disabled = !selId || selSaved; $("#dbDelete").disabled = !selId; };
  const openRow = (id, isSaved) => isSaved ? openSavedDashboard(id) : openDashboardComposer(DASHBOARDS.find(d => d.id === id));
  scroll.querySelectorAll("tbody tr").forEach(tr => {
    tr.addEventListener("click", e => {
      if (e.target.closest(".link-cell")) return;
      scroll.querySelectorAll("tbody tr").forEach(x => x.classList.remove("selected"));
      tr.classList.add("selected"); tr.querySelector("input").checked = true;
      selId = tr.dataset.id; selSaved = tr.dataset.saved === "1"; btns();
    });
    tr.querySelector(".link-cell").addEventListener("click", () => openRow(tr.dataset.id, tr.dataset.saved === "1"));
  });
  $("#dbNew").onclick = () => openNewDashboardChooser();
  $("#dbNewReport").onclick = () => { state.view = "reports"; render(); setTimeout(openNewChooser, 30); };
  $("#dbOpen").onclick = () => selId && openRow(selId, selSaved);
  $("#dbClone").onclick = () => { const d = DASHBOARDS.find(x=>x.id===selId); if(!d) return; const copy = JSON.parse(JSON.stringify(d)); copy.id = "d"+(DASHBOARDS.length+1); copy.title = d.title+" (copy)"; copy.modified = "2026-07-19"; DASHBOARDS.unshift(copy); render(); toast("Dashboard cloned to a new draft"); };
  $("#dbDelete").onclick = () => {
    if (!selId) return;
    if (selSaved) { deleteSavedDashboard(selId); return; }
    const i = DASHBOARDS.findIndex(x=>x.id===selId); if (i>=0) { DASHBOARDS.splice(i,1); selId=null; render(); toast("Dashboard deleted"); }
  };
}

/* ============================ CHROME EVENTS ============================ */
document.addEventListener("keydown", e => {
  if (state.view !== "dashboardcomposer" || !state.dashboard) return;
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const meta = e.ctrlKey || e.metaKey; if (!meta) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey) { e.preventDefault(); dashUndo(state.dashboard); render(); }
  else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); dashRedo(state.dashboard); render(); }
});
document.querySelectorAll(".nav-item").forEach(n => n.onclick = () => { state.view = n.dataset.view; state.selectedReportId=null; render(); });
$("#navToggle").onclick = () => { state.navCollapsed = !state.navCollapsed; $("#nav").classList.toggle("collapsed", state.navCollapsed); };
/* ---- Theme picker (Light / Dark / Glass / Vibrant), persisted ---- */
const THEME_STORAGE_KEY = "re-designer-theme";
const THEME_LABELS = { light: "Light", dark: "Dark", glass: "Glass", vibrant: "Vibrant" };

function applyTheme(themeId) {
  const theme = THEME_LABELS[themeId] ? themeId : "light";
  document.documentElement.setAttribute("data-theme", theme);
  $("#themeMenu").querySelectorAll("[data-set-theme]").forEach(o =>
    o.classList.toggle("sel", o.dataset.setTheme === theme));
  try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch (e) { /* private mode — session only */ }
}

function toggleThemeMenu(open) {
  const menu = $("#themeMenu"), trigger = $("#themeToggle");
  const next = open ?? !menu.classList.contains("open");
  menu.classList.toggle("open", next);
  trigger.setAttribute("aria-expanded", String(next));
}

function readStoredTheme() {
  try { return localStorage.getItem(THEME_STORAGE_KEY); } catch (e) { return null; }
}

$("#themeToggle").onclick = (event) => { event.stopPropagation(); toggleThemeMenu(); };
$("#themeMenu").querySelectorAll("[data-set-theme]").forEach(option => {
  option.onclick = () => {
    applyTheme(option.dataset.setTheme);
    toggleThemeMenu(false);
    toast(`${THEME_LABELS[option.dataset.setTheme]} theme applied`, "info");
  };
});
document.addEventListener("click", (event) => {
  if (!event.target.closest("#themeMenu, #themeToggle")) toggleThemeMenu(false);
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape") toggleThemeMenu(false); });

// When hosted as a CRM web resource, take the identity + middle-tier URL from Xrm / the URL,
// so dashboard persistence runs as the signed-in user against the deployer-configured API.
// Definitions are read and written as the signed-in user, so there is no connection to configure
// and no identity to choose (ADR-RPT-011). Outside CRM the designer still runs as a prototype:
// everything in-memory works, and only the save/load paths report that they need a CRM session.
function initCrmContext() {
  try {
    const xrm = window.Xrm || (window.parent && window.parent.Xrm) || (window.top && window.top.Xrm);
    state.inCrm = !!(xrm && xrm.WebApi);
    // Needed to tell "My Reports" from "All Reports" by real ownership rather than a hardcoded name.
    const user = signedInUser(xrm);
    state.userId = user.id;
    state.userName = user.name;
  } catch (e) {
    state.inCrm = false;
    state.userId = null;
    state.userName = null;
  }
}

function signedInUser(xrm) {
  const settings = xrm && xrm.Utility && xrm.Utility.getGlobalContext
    ? xrm.Utility.getGlobalContext().userSettings
    : null;
  return settings ? { id: settings.userId, name: settings.userName } : { id: null, name: null };
}
initCrmContext();

/* Opened from the raw /WebResources/ URL there is no app shell, so no Xrm, and now that every list,
   picker and preview reads from Dataverse there is nothing at all to show. The designer used to look
   populated here because it carried sample reports and invented preview rows; without those the
   honest state is empty, so say why rather than leaving the user staring at blank grids. */
if (!state.inCrm) {
  const hosted = `${location.origin}/main.aspx?pagetype=webresource&webresourceName=qdb_reportengine_designer.html`;
  const banner = el(`<div style="padding:10px 16px;background:var(--warning-bg);border-bottom:1px solid var(--border-strong);font-size:13px">
    <b>No CRM session — the designer has no data to show.</b>
    Reports, dashboards, entity metadata and previews are all read from Dataverse, which needs the app
    shell. Open the designer from inside the app instead:
    <div style="margin-top:6px"><code style="font-size:12px;word-break:break-all">${esc(hosted)}</code></div>
  </div>`);
  document.body.insertBefore(banner, document.body.firstChild);
}

applyTheme(readStoredTheme() ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

render();
</script>
