<!DOCTYPE html>
<!--
  SC-02 Gating Spike — PostCSS Browser Sandbox Compatibility Test
  Engagement: DFE-STYLE-001
  Purpose: Verify that the PostCSS IIFE bundle (postcss-bundle.iife.js) can be loaded
           and executed inside a browser IFrame context equivalent to a CRM web resource.
           The CRM sandbox blocks XMLHttpRequest/fetch to external origins but allows
           synchronous DOM operations and standard JS APIs.

  HOW TO RUN:
    1. Open this file in any browser (Chrome/Edge recommended — same engine as CRM).
       You can use: npx serve designer/public OR open locally as file:///
    2. The page title will read "SC-02: PASS" or "SC-02: FAIL — <reason>".
    3. Check the on-page results panel for detail.

  PASS CRITERIA:
    - PostCSS loads without throwing
    - postcss.parse("a { color: red; }") returns an object with nodes.length === 1
    - postcss.process(".qdb-form { color: red; }", { from: undefined }) returns
      a LazyResult whose .css property equals ".qdb-form { color: red; }"

  FAIL CRITERIA:
    - Any ReferenceError for require, process, Buffer, __dirname, or module
    - Any exception thrown during load or parse
    - Parsed result is null or nodes.length === 0
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC-02: Running...</title>
    <style>
      body { font-family: Segoe UI, system-ui, sans-serif; margin: 2rem; background: #faf9f8; }
      h1 { font-size: 1.25rem; margin-bottom: 1rem; }
      #result {
        padding: 1rem;
        border-radius: 6px;
        font-size: 0.9rem;
        white-space: pre-wrap;
        font-family: Consolas, monospace;
        border: 1px solid #ccc;
        background: #f5f5f5;
      }
      .pass { background: #dff6dd; border-color: #107c10; color: #0b5c0b; }
      .fail { background: #fde7e9; border-color: #d13438; color: #8c0c13; }
    </style>
  </head>
  <body>
    <h1>SC-02: PostCSS CRM Sandbox Compatibility Spike</h1>
    <div id="result">Loading PostCSS bundle...</div>

    <!--
      The bundle is referenced as a relative sibling — both files are web resources
      on the same CRM server origin, so no external network call is needed.
      This satisfies the "no CDN, self-contained" constraint.
    -->
    <script src="postcss-bundle.iife.js"></script>
    <script>
      (function runSpike() {
        var resultEl = document.getElementById('result');

        function pass(detail) {
          document.title = 'SC-02: PASS';
          resultEl.className = 'pass';
          resultEl.textContent = 'PASS\n\n' + detail;
        }

        function fail(reason) {
          document.title = 'SC-02: FAIL — ' + reason;
          resultEl.className = 'fail';
          resultEl.textContent = 'FAIL\n\nReason: ' + reason;
        }

        // ── Check 1: PostCSS global must exist ───────────────────────────────
        if (typeof PostCSS === 'undefined') {
          fail('PostCSS global is undefined after loading bundle. Bundle may not have exported to window.PostCSS.');
          return;
        }

        // ── Check 2: parse() must exist ──────────────────────────────────────
        if (typeof PostCSS.parse !== 'function') {
          fail('PostCSS.parse is not a function. Version mismatch or incorrect bundle entry point.');
          return;
        }

        // ── Check 3: Basic parse ─────────────────────────────────────────────
        var parsedResult;
        try {
          parsedResult = PostCSS.parse('a { color: red; }');
        } catch (parseErr) {
          fail('PostCSS.parse("a { color: red; }") threw: ' + String(parseErr));
          return;
        }

        if (!parsedResult || !Array.isArray(parsedResult.nodes) || parsedResult.nodes.length === 0) {
          fail('PostCSS.parse returned empty or malformed result. nodes.length = ' +
            (parsedResult ? (parsedResult.nodes ? parsedResult.nodes.length : 'undefined') : 'null'));
          return;
        }

        // ── Check 4: process() must work (plugin pipeline) ───────────────────
        var processedResult;
        try {
          processedResult = PostCSS.default([]).process('.qdb-form { color: red; }', { from: undefined });
        } catch (procErr) {
          fail('PostCSS.default([]).process() threw: ' + String(procErr));
          return;
        }

        var css;
        try {
          css = processedResult.css;
        } catch (cssErr) {
          fail('processedResult.css accessor threw: ' + String(cssErr));
          return;
        }

        if (typeof css !== 'string' || css.trim() === '') {
          fail('processedResult.css is not a non-empty string. Got: ' + JSON.stringify(css));
          return;
        }

        // ── Check 5: No leftover Node.js globals ─────────────────────────────
        // esbuild replaces process.env references — verify no stray process ref
        var nodeGlobalsPresent = [];
        if (typeof require !== 'undefined' && typeof require === 'function') {
          // Node-style require surviving into browser is unexpected
          nodeGlobalsPresent.push('require');
        }
        if (typeof module !== 'undefined') {
          nodeGlobalsPresent.push('module');
        }
        // Note: window.Buffer may be defined by polyfill libraries — not a bundle concern
        // process may exist in some browser test environments — check only strict absence
        // We explicitly do NOT check for process since it's polyfilled in some environments.

        var detail = [
          'PostCSS version: ' + (PostCSS.version || 'unknown'),
          'Parse nodes returned: ' + parsedResult.nodes.length,
          'Process output: ' + css.substring(0, 80),
          nodeGlobalsPresent.length > 0
            ? 'WARNING: Node globals present in browser scope: ' + nodeGlobalsPresent.join(', ') +
              ' (these may be from other scripts, not from PostCSS bundle itself)'
            : 'No stray Node-only globals detected from bundle.',
          '',
          'CONCLUSION: PostCSS IIFE bundle is compatible with CRM web resource sandbox.',
          'Proceed with AllowlistService and CssSanitiserPlugin integration.',
        ].join('\n');

        pass(detail);
      })();
    </script>
  </body>
</html>
