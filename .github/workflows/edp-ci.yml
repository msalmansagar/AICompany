name: EDP-BRE CI

on:
  push:
    branches: [feat/edp-bre-001, main]
    paths: ['projects/enterprise-decision-platform/**', '.github/workflows/edp-ci.yml']
  pull_request:
    branches: [main]
    paths: ['projects/enterprise-decision-platform/**', '.github/workflows/edp-ci.yml']

jobs:
  runtime-net9:
    name: Runtime tests (net9, Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-decision-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Test EDP.RuleRuntime.Tests (net9.0)
        run: dotnet test runtime/tests/EDP.RuleRuntime.Tests -c Release --nologo --collect:"XPlat Code Coverage" --collect:"XPlat Code Coverage"

  runtime-net462:
    name: Runtime tests (net9 + net462, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/enterprise-decision-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      # windows-latest ships the .NET Framework runtime, so the net462 CRM-adapter tests
      # (governance, aggregation, navigation, lifecycle gate) actually execute here.
      - name: Test full runtime solution (net9.0 + net462)
        run: dotnet test runtime/EDP.RuleRuntime.slnx -c Release --nologo --collect:"XPlat Code Coverage" --collect:"XPlat Code Coverage"

  designer:
    name: Designer (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-decision-platform/designer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Unit tests (vitest)
        run: npm test

  gateway:
    name: Gateway (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-decision-platform/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build container image
        run: docker build -t edp-gateway:ci .
      - name: Container serves /health
        run: |
          docker run -d --name edp-gateway-ci -p 8787:8787 \
            -e DATAVERSE_URL=https://example.crm.dynamics.com \
            -e AZURE_TENANT_ID=t -e AZURE_CLIENT_ID=c -e AZURE_CLIENT_SECRET=s \
            edp-gateway:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/health; then echo " — up"; exit 0; fi
            sleep 1
          done
          echo "gateway did not become healthy"; docker logs edp-gateway-ci; exit 1
      - name: Stop container
        if: always()
        run: docker rm -f edp-gateway-ci || true

  sdk-js:
    name: SDK/JS (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-decision-platform/sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test

  sdk-dotnet:
    name: SDK/.NET (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-decision-platform/sdk/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Test
        run: dotnet test EDP.DecisionClient.Tests/EDP.DecisionClient.Tests.csproj -c Release --nologo
